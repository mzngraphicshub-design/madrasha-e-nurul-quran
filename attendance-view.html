<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance View</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#222}
.top{background:#075c43;color:#fff;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0;color:#fff;font-size:20px}
.top a{color:#fff;text-decoration:none}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.box{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:20px}
.filters{display:grid;grid-template-columns:1fr 1fr 150px;gap:14px}
label{font-weight:bold;font-size:14px}
input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #ddd;border-radius:7px}
button{border:0;padding:11px 17px;border-radius:7px;background:#087f5b;color:#fff;font-weight:bold;cursor:pointer}
.print{background:#333}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:11px 8px;border-bottom:1px solid #ddd;text-align:left}
th{background:#075c43;color:#fff}
.present{color:#087f5b;font-weight:bold}
.absent{color:#c62828;font-weight:bold}
.summary{display:flex;gap:15px;margin-top:18px;flex-wrap:wrap}
.card{padding:12px 18px;border-radius:8px;background:#eee;font-weight:bold}
.table-wrap{overflow:auto}
#msg{margin-top:12px}
@media(max-width:700px){
.filters{grid-template-columns:1fr}
table{min-width:600px}
}
@media print{
.top,.filters,.no-print{display:none!important}
body{background:#fff}
.box{box-shadow:none}
}
</style>
</head>

<body>

<header class="top">
<h2>📋 Attendance Report</h2>
<a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="box">

<div class="filters">

<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Class</label>
<select id="classId">
<option value="">সব Class</option>
</select>
</div>

<div style="align-self:end">
<button onclick="loadAttendance()">View</button>
</div>

</div>

<div id="msg"></div>

</div>

<div class="box">

<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
<h3>📊 Attendance Report</h3>
<button class="print no-print" onclick="window.print()">🖨️ Print</button>
</div>

<div class="summary">
<div class="card">Total: <span id="total">0</span></div>
<div class="card">Present: <span id="present">0</span></div>
<div class="card">Absent: <span id="absent">0</span></div>
</div>

<div class="table-wrap">

<table>
<thead>
<tr>
<th>ক্রমিক</th>
<th>Student ID</th>
<th>Student Name</th>
<th>Class</th>
<th>Attendance</th>
</tr>
</thead>

<tbody id="list">
<tr>
<td colspan="5" style="text-align:center">
Date নির্বাচন করে View চাপুন
</td>
</tr>
</tbody>
</table>

</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";
const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

document.getElementById("date").value=
new Date().toISOString().split("T")[0];

async function start(){

const {data:{session}}=await db.auth.getSession();

if(!session){
location.href="admin.html";
return;
}

const {data,error}=await db
.from("classes")
.select("*")
.order("id");

if(error){
document.getElementById("msg").textContent="❌ "+error.message;
return;
}

const select=document.getElementById("classId");

(data||[]).forEach(c=>{
select.innerHTML+=
`<option value="${c.id}">${escapeHtml(c.name)}</option>`;
});

await loadAttendance();
}

async function loadAttendance(){

const date=document.getElementById("date").value;
const classId=document.getElementById("classId").value;

if(!date){
alert("Date নির্বাচন করুন");
return;
}

let query=db
.from("student_attendance")
.select(`
id,
attendance_date,
status,
students(
student_id,
name,
class_id,
classes(name)
)
`)
.eq("attendance_date",date)
.order("id");

if(classId){

query=query.eq("students.class_id",classId);

}

const {data,error}=await query;

if(error){
document.getElementById("msg").textContent=
"❌ "+error.message;
return;
}

let rows=data||[];

if(classId){
rows=rows.filter(x=>String(x.students?.class_id)===String(classId));
}

const total=rows.length;

const present=rows.filter(
x=>x.status==="present"
).length;

const absent=rows.filter(
x=>x.status==="absent"
).length;

document.getElementById("total").textContent=total;
document.getElementById("present").textContent=present;
document.getElementById("absent").textContent=absent;

const tbody=document.getElementById("list");

if(!rows.length){

tbody.innerHTML=`
<tr>
<td colspan="5" style="text-align:center">
এই তারিখে Attendance পাওয়া যায়নি
</td>
</tr>`;

return;
}

tbody.innerHTML=rows.map((r,i)=>`

<tr>

<td>${i+1}</td>

<td>${escapeHtml(r.students?.student_id||"-")}</td>

<td>${escapeHtml(r.students?.name||"-")}</td>

<td>${escapeHtml(r.students?.classes?.name||"-")}</td>

<td class="${r.status==="present"?"present":"absent"}">

${r.status==="present"?"✅ উপস্থিত":"❌ অনুপস্থিত"}

</td>

</tr>

`).join("");

document.getElementById("msg").textContent=
"✅ Attendance loaded";
}

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

start();

</script>

</body>
</html>

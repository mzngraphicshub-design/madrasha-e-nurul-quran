<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Classes | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

.top{
    width:100%;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:16px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 3px 15px #0002;
}

.top h2{
    margin:0;
    font-size:20px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.top a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

.lang{
    display:flex;
    background:#ffffff22;
    padding:3px;
    border-radius:8px;
}

.lang button{
    border:0;
    background:transparent;
    color:#fff;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.lang button.active{
    background:#fff;
    color:#0d47a1;
}

.container{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:25px;
}

.box{
    width:100%;
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 3px 15px #0d47a115;
    margin-bottom:20px;
    border:1px solid #e5eaf2;
}

h3{
    margin:0 0 18px;
    color:#0d47a1;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border:1px solid #e5eaf2;
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 12px #0d47a110;
}

.stat-icon{
    font-size:25px;
}

.stat-label{
    font-size:13px;
    color:#64748b;
    margin:5px 0;
}

.stat-number{
    font-size:26px;
    font-weight:bold;
    color:#0d47a1;
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px;
}

select,input{
    width:100%;
    padding:12px;
    border:1px solid #d8dee9;
    border-radius:8px;
    font-size:14px;
    outline:none;
    background:#fff;
}

select:focus,input:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d215;
}

.action-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.selected-info{
    padding:12px 14px;
    border-radius:9px;
    background:#eaf4ff;
    border:1px solid #d7eaff;
    color:#0d47a1;
    font-size:14px;
    font-weight:bold;
}

.refresh-btn{
    border:0;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.class-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.class-card{
    background:#fff;
    border:1px solid #dce5f2;
    border-radius:13px;
    padding:20px 15px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 2px 8px #0000000a;
}

.class-card:hover{
    transform:translateY(-3px);
    border-color:#1976d2;
    box-shadow:0 6px 18px #1976d225;
}

.class-card.active{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    border-color:#0d47a1;
}

.class-icon{
    font-size:28px;
    margin-bottom:8px;
}

.class-bn{
    font-size:16px;
    font-weight:bold;
}

.class-en{
    font-size:13px;
    margin-top:5px;
    opacity:.75;
}

.class-count{
    margin-top:10px;
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.class-card.active .class-count{
    background:#ffffff25;
    color:#fff;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th,td{
    padding:12px 10px;
    border-bottom:1px solid #edf0f5;
    text-align:left;
    font-size:14px;
}

th{
    background:#0d47a1;
    color:#fff;
}

tbody tr:hover td{
    background:#f7faff;
}

.badge{
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.loading,.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.error{
    color:#dc2626;
    background:#fef2f2;
    padding:12px;
    border-radius:8px;
}

.count{
    color:#1976d2;
    font-weight:bold;
}

@media(max-width:900px){
    .class-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){

    .top{
        padding:14px;
        flex-direction:column;
        align-items:flex-start;
    }

    .top-right{
        width:100%;
        justify-content:space-between;
    }

    .container{
        padding:12px;
    }

    .box{
        padding:15px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .class-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .class-card{
        padding:15px 7px;
    }

    .stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="top">

<h2 id="pageTitle">📚 শ্রেণি ব্যবস্থাপনা</h2>

<div class="top-right">

<div class="lang">

<button id="bnBtn"
class="active"
onclick="setLanguage('bn')">
বাংলা
</button>

<button id="enBtn"
onclick="setLanguage('en')">
English
</button>

</div>

<a href="dashboard.html"
id="dashboardLink">
← Dashboard
</a>

</div>
</header>


<div class="container">


<!-- STATS -->

<div class="stats">

<div class="stat">
<div class="stat-icon">🎓</div>
<div class="stat-label" id="totalClassLabel">মোট শ্রেণি</div>
<div class="stat-number" id="totalClasses">8</div>
</div>

<div class="stat">
<div class="stat-icon">👨‍🎓</div>
<div class="stat-label" id="totalStudentLabel">মোট শিক্ষার্থী</div>
<div class="stat-number" id="totalStudents">0</div>
</div>

<div class="stat">
<div class="stat-icon">📅</div>
<div class="stat-label" id="selectedSessionLabel">
Selected Session Students
</div>
<div class="stat-number" id="selectedSessionCount">0</div>
</div>

</div>


<!-- SESSION + SEARCH -->

<div class="box">

<h3 id="sessionTitle">
📅 Session নির্বাচন করুন
</h3>

<div class="filters">

<div>

<label id="sessionLabel">
Session
</label>

<select id="sessionSelect">

<option value="">
Session নির্বাচন করুন
</option>

</select>

</div>

<div>

<label id="searchLabel">
Student Search
</label>

<input
id="search"
type="text"
placeholder="🔍 নাম / রোল / ID দিয়ে খুঁজুন..."
>

</div>

</div>

<div class="action-row">

<div id="selectedInfo"
class="selected-info">

📌 প্রথমে Session ও Class নির্বাচন করুন

</div>

<button
class="refresh-btn"
id="refreshBtn"
onclick="refreshData()">

🔄 Refresh

</button>

</div>

</div>


<!-- CLASSES -->

<div class="box">

<h3 id="classTitle">
🎓 শ্রেণি নির্বাচন করুন
</h3>

<div
class="class-grid"
id="classGrid">
</div>

</div>


<!-- STUDENTS -->

<div class="box">

<h3>

<span id="studentTitle">
👨‍🎓 শিক্ষার্থী তালিকা
</span>

<span class="count">
(
<span id="studentCount">0</span>
)
</span>

</h3>

<div class="table-wrap">

<table>

<thead>

<tr>

<th id="thName">নাম</th>
<th id="thRoll">রোল</th>
<th id="thId">Student ID</th>
<th id="thClass">Class</th>
<th id="thSession">Session</th>

</tr>

</thead>

<tbody id="studentList">

<tr>

<td colspan="5"
class="empty">

Session এবং Class নির্বাচন করুন

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   VARIABLES
========================================= */

let allStudents = [];

let students = [];

let selectedClass = "";

let selectedSession = "";

let currentLanguage = "bn";


/* =========================================
   CLASSES
========================================= */

const classes = [

{
    bn:"নূরানী",
    en:"Nurani"
},

{
    bn:"১ম শ্রেণি",
    en:"Class 1"
},

{
    bn:"২য় শ্রেণি",
    en:"Class 2"
},

{
    bn:"৩য় শ্রেণি",
    en:"Class 3"
},

{
    bn:"৪র্থ শ্রেণি",
    en:"Class 4"
},

{
    bn:"৫ম শ্রেণি",
    en:"Class 5"
},

{
    bn:"নাজেরা",
    en:"Najera"
},

{
    bn:"হিফজ",
    en:"Hifaz"
}

];


/* =========================================
   TEXT
========================================= */

const text = {

bn:{

pageTitle:"📚 শ্রেণি ব্যবস্থাপনা",

totalClass:"মোট শ্রেণি",

totalStudent:"মোট শিক্ষার্থী",

selectedSession:"Selected Session Students",

sessionTitle:"📅 Session নির্বাচন করুন",

sessionLabel:"Session",

searchLabel:"Student Search",

searchPlaceholder:
"🔍 নাম / রোল / ID দিয়ে খুঁজুন...",

classTitle:"🎓 শ্রেণি নির্বাচন করুন",

studentTitle:"👨‍🎓 শিক্ষার্থী তালিকা",

name:"নাম",

roll:"রোল",

id:"Student ID",

class:"Class",

session:"Session",

selectSession:"Session নির্বাচন করুন",

selectBoth:
"📌 প্রথমে Session ও Class নির্বাচন করুন",

loading:"Loading...",

noStudent:
"এই Session ও Class-এ কোনো শিক্ষার্থী নেই",

dashboard:"← Dashboard",

refresh:"🔄 Refresh",

students:"শিক্ষার্থী"

},

en:{

pageTitle:"📚 Class Management",

totalClass:"Total Classes",

totalStudent:"Total Students",

selectedSession:"Selected Session Students",

sessionTitle:"📅 Select Session",

sessionLabel:"Session",

searchLabel:"Student Search",

searchPlaceholder:
"🔍 Search by name / roll / ID...",

classTitle:"🎓 Select Class",

studentTitle:"👨‍🎓 Student List",

name:"Name",

roll:"Roll",

id:"Student ID",

class:"Class",

session:"Session",

selectSession:"Select Session",

selectBoth:
"📌 Select Session and Class first",

loading:"Loading...",

noStudent:
"No students found for this Session and Class",

dashboard:"← Dashboard",

refresh:"🔄 Refresh",

students:"Students"

}

};


/* =========================================
   LANGUAGE
========================================= */

function setLanguage(lang){

currentLanguage = lang;

const t = text[lang];

document.getElementById("pageTitle")
.textContent=t.pageTitle;

document.getElementById("totalClassLabel")
.textContent=t.totalClass;

document.getElementById("totalStudentLabel")
.textContent=t.totalStudent;

document.getElementById("selectedSessionLabel")
.textContent=t.selectedSession;

document.getElementById("sessionTitle")
.textContent=t.sessionTitle;

document.getElementById("sessionLabel")
.textContent=t.sessionLabel;

document.getElementById("searchLabel")
.textContent=t.searchLabel;

document.getElementById("search")
.placeholder=t.searchPlaceholder;

document.getElementById("classTitle")
.textContent=t.classTitle;

document.getElementById("studentTitle")
.textContent=t.studentTitle;

document.getElementById("thName")
.textContent=t.name;

document.getElementById("thRoll")
.textContent=t.roll;

document.getElementById("thId")
.textContent=t.id;

document.getElementById("thClass")
.textContent=t.class;

document.getElementById("thSession")
.textContent=t.session;

document.getElementById("dashboardLink")
.textContent=t.dashboard;

document.getElementById("refreshBtn")
.textContent=t.refresh;

document.getElementById("bnBtn")
.classList.toggle("active",lang==="bn");

document.getElementById("enBtn")
.classList.toggle("active",lang==="en");

loadSessions();

renderClasses();

renderStudents();

updateSelectedInfo();

}


/* =========================================
   AUTH + START
========================================= */

async function start(){

try{

const {
data:{session}
} = await db.auth.getSession();

if(!session){

location.href="admin.html";

return;

}

await loadAllStudents();

loadSessions();

renderClasses();

updateStats();

}catch(error){

console.error(error);

}

}


/* =========================================
   LOAD ALL STUDENTS
========================================= */

async function loadAllStudents(){

const {data,error} =

await db
.from("students")
.select(`
id,
name,
roll,
student_id,
class,
session
`)
.order("id",{ascending:true});


if(error){

console.error("Student Load Error:",error);

document.getElementById("studentList").innerHTML=

`
<tr>
<td colspan="5"
class="empty error">
❌ ${escapeHtml(error.message)}
</td>
</tr>
`;

return;

}

allStudents = data || [];

updateStats();

renderClasses();

}


/* =========================================
   SESSION LIST
========================================= */

function loadSessions(){

const select =
document.getElementById("sessionSelect");

const t =
text[currentLanguage];

const oldValue =
selectedSession;

select.innerHTML=

`
<option value="">
${t.selectSession}
</option>
`;

const sessions = [

...new Set(

allStudents

.map(student =>
String(student.session || "").trim()
)

.filter(Boolean)

)

];

sessions.sort((a,b)=>

b.localeCompare(a,undefined,{
numeric:true
})

);

sessions.forEach(session=>{

const option =
document.createElement("option");

option.value=session;

option.textContent=session;

select.appendChild(option);

});

if(oldValue &&
sessions.includes(oldValue)){

select.value=oldValue;

}

}


/* =========================================
   SESSION CHANGE
========================================= */

document
.getElementById("sessionSelect")
.addEventListener(
"change",
function(){

selectedSession =
this.value;

updateSelectedInfo();

updateStats();

renderClasses();

loadStudents();

});


/* =========================================
   CLASS CARD COUNT
========================================= */

function getClassCount(classObject){

/*
 IMPORTANT:
 এখানে Roll বা Student ID ব্যবহার করা হয়নি।

শুধু Class মিলছে।
তাই একই Class-এ 4, 10, 50, 100
জন থাকলেও সবাই count হবে।
*/

let list =
allStudents.filter(student =>

student.class === classObject.bn ||

student.class === classObject.en

);


/*
 Session নির্বাচন করা থাকলে
সেই Session-এর Class count দেখাবে।
*/

if(selectedSession){

list =
list.filter(student =>

String(student.session || "").trim()
=== String(selectedSession).trim()

);

}

return list.length;

}


/* =========================================
   RENDER CLASS
========================================= */

function renderClasses(){

const grid =
document.getElementById("classGrid");

grid.innerHTML = classes.map(
(c,index)=>{

const count =
getClassCount(c);

const active =
selectedClass===c.bn ||
selectedClass===c.en;

return `

<div
class="class-card ${active?"active":""}"
onclick="selectClass(${index})">

<div class="class-icon">
🎓
</div>

<div class="class-bn">
${c.bn}
</div>

<div class="class-en">
${c.en}
</div>

<div class="class-count">

👨‍🎓 ${count}
${text[currentLanguage].students}

</div>

</div>

`;

}).join("");

}


/* =========================================
   SELECT CLASS
========================================= */

function selectClass(index){

const c =
classes[index];

/*
 Class selected হলে
শুধু Class change হবে।

Roll বা Student ID দিয়ে
কোনো Session change হবে না।
*/

selectedClass=c.bn;

renderClasses();

updateSelectedInfo();

loadStudents();

}


/* =========================================
   LOAD STUDENTS
========================================= */

async function loadStudents(){

const tbody =
document.getElementById("studentList");

const t =
text[currentLanguage];


/* Session + Class দুটো না থাকলে */

if(!selectedSession || !selectedClass){

students=[];

tbody.innerHTML=

`
<tr>

<td colspan="5"
class="empty">

${t.selectBoth}

</td>

</tr>
`;

document.getElementById(
"studentCount"
).textContent="0";

return;

}


tbody.innerHTML=

`
<tr>

<td colspan="5"
class="loading">

${t.loading}

</td>

</tr>
`;


/*
 Selected class-এর BN + EN দুটোই গ্রহণ করবে।
*/

const selected =
classes.find(c=>

c.bn===selectedClass ||
c.en===selectedClass

);

if(!selected){

return;

}


const classNames=[
selected.bn,
selected.en
];


/*
 IMPORTANT:

কোনো .limit(4)
নেই।

কোনো .single()
নেই।

কোনো Roll filter নেই।

কোনো Student ID filter নেই।

তাই Class + Session-এর
সব student আসবে।
*/

const {data,error}=

await db

.from("students")

.select(`
id,
name,
roll,
student_id,
class,
session
`)

.eq(
"session",
selectedSession
)

.in(
"class",
classNames
)

.order(
"id",
{
ascending:true
}
);


if(error){

console.error(
"Class Student Error:",
error
);

tbody.innerHTML=

`
<tr>

<td colspan="5"
class="empty error">

❌ ${escapeHtml(error.message)}

</td>

</tr>
`;

return;

}


students=data || [];

renderStudents();

}


/* =========================================
   RENDER STUDENTS
========================================= */

function renderStudents(){

const tbody =
document.getElementById("studentList");

const t =
text[currentLanguage];

const search =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


/*
 Search শুধু বর্তমানে selected
Class + Session-এর students-এর
মধ্যে কাজ করবে।
*/

let list = students.filter(student=>{

if(!search){

return true;

}

return (

String(student.name || "")
.toLowerCase()
.includes(search)

||

String(student.roll || "")
.toLowerCase()
.includes(search)

||

String(student.student_id || "")
.toLowerCase()
.includes(search)

);

});


document.getElementById(
"studentCount"
).textContent=list.length;


/* No student */

if(!list.length){

tbody.innerHTML=

`
<tr>

<td colspan="5"
class="empty">

${t.noStudent}

</td>

</tr>
`;

return;

}


/*
 সব student map হবে।
কোনো limit নেই।
*/

tbody.innerHTML=

list.map(student=>`

<tr>

<td>

<strong>

${escapeHtml(
student.name || "-"
)}

</strong>

</td>

<td>

<span class="badge">

${escapeHtml(
student.roll || "-"
)}

</span>

</td>

<td>

${escapeHtml(
student.student_id || "-"
)}

</td>

<td>

${escapeHtml(
getClassName(student.class)
)}

</td>

<td>

${escapeHtml(
student.session || "-"
)}

</td>

</tr>

`).join("");

}


/* =========================================
   CLASS NAME
========================================= */

function getClassName(value){

const found =
classes.find(c=>

c.bn===value ||
c.en===value

);

if(!found){

return value || "-";

}

return currentLanguage==="bn"
?found.bn
:found.en;

}


/* =========================================
   SEARCH
========================================= */

document
.getElementById("search")
.addEventListener(
"input",
renderStudents
);


/* =========================================
   SELECTED INFO
========================================= */

function updateSelectedInfo(){

const info =
document.getElementById(
"selectedInfo"
);

const t =
text[currentLanguage];


if(!selectedSession &&
!selectedClass){

info.textContent=
t.selectBoth;

return;

}


let className =
selectedClass;

const found =
classes.find(c=>

c.bn===selectedClass ||
c.en===selectedClass

);

if(found){

className =
currentLanguage==="bn"
?found.bn
:found.en;

}


if(selectedSession &&
selectedClass){

info.textContent=
`📌 ${className} • ${selectedSession}`;

}

else if(selectedSession){

info.textContent=
`📅 ${selectedSession}`;

}

else{

info.textContent=
`🎓 ${className}`;

}

}


/* =========================================
   STATS
========================================= */

function updateStats(){

document.getElementById(
"totalClasses"
).textContent=
classes.length;


/* সব students */

document.getElementById(
"totalStudents"
).textContent=
allStudents.length;


/* Selected Session-এর মোট students */

let sessionCount=0;

if(selectedSession){

sessionCount =
allStudents.filter(student =>

String(student.session || "").trim()
===
String(selectedSession).trim()

).length;

}


/*
 এখানে Class count নয়।
এইটা পুরো Session-এর
মোট student সংখ্যা।
*/

document.getElementById(
"selectedSessionCount"
).textContent=
sessionCount;

}


/* =========================================
   REFRESH
========================================= */

async function refreshData(){

const btn =
document.getElementById(
"refreshBtn"
);

btn.disabled=true;

try{

await loadAllStudents();

loadSessions();

renderClasses();

if(selectedSession &&
selectedClass){

await loadStudents();

}else{

renderStudents();

}

updateStats();

updateSelectedInfo();

}catch(error){

console.error(error);

}finally{

btn.disabled=false;

}

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   START
========================================= */

start();

</script>

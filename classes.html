<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Classes | মাদরাসায়ে নূরুল কুরআন</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

/* HEADER */
.top{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 3px 15px #0002;
}

.top h2{
    margin:0;
    font-size:19px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.top a{
    color:#fff;
    text-decoration:none;
    font-size:13px;
}

.lang{
    display:flex;
    background:#ffffff22;
    padding:3px;
    border-radius:8px;
}

.lang button{
    border:0;
    background:transparent;
    color:#fff;
    padding:6px 9px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.lang button.active{
    background:#fff;
    color:#0d47a1;
}

/* CONTAINER */
.container{
    max-width:1150px;
    margin:20px auto;
    padding:0 15px;
}

/* BOX */
.box{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 15px #0d47a115;
    margin-bottom:18px;
    border:1px solid #e5eaf2;
}

h3{
    margin:0 0 16px;
    color:#0d47a1;
    font-size:16px;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:18px;
}

.stat{
    background:#fff;
    border:1px solid #e5eaf2;
    border-radius:14px;
    padding:16px;
    box-shadow:0 3px 12px #0d47a110;
    position:relative;
    overflow:hidden;
}

.stat::after{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    right:-20px;
    top:-20px;
    border-radius:50%;
    background:#1976d212;
}

.stat-icon{
    font-size:23px;
}

.stat-label{
    font-size:12px;
    color:#64748b;
    margin:4px 0;
}

.stat-number{
    font-size:24px;
    font-weight:bold;
    color:#0d47a1;
}

/* FILTER */
.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

label{
    display:block;
    font-weight:bold;
    font-size:12px;
    margin-bottom:6px;
}

select,
input{
    width:100%;
    padding:11px;
    border:1px solid #d8dee9;
    border-radius:8px;
    font-size:13px;
    outline:none;
    background:#fff;
}

select:focus,
input:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d215;
}

.action-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
}

.selected-info{
    padding:9px 12px;
    border-radius:8px;
    background:#eaf4ff;
    border:1px solid #d7eaff;
    color:#0d47a1;
    font-size:12px;
    font-weight:bold;
}

.refresh-btn{
    border:0;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:disabled{
    opacity:.6;
}

/* CLASS GRID */
.class-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.class-card{
    background:#fff;
    border:1px solid #dce5f2;
    border-radius:12px;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 2px 8px #0000000a;
}

.class-card:hover{
    transform:translateY(-2px);
    border-color:#1976d2;
}

.class-card.active{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    border-color:#0d47a1;
}

.class-icon{
    font-size:26px;
    margin-bottom:6px;
}

.class-bn{
    font-size:14px;
    font-weight:bold;
}

.class-en{
    font-size:11px;
    margin-top:4px;
    opacity:.7;
}

.class-count{
    margin-top:8px;
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:4px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

.class-card.active .class-count{
    background:#ffffff25;
    color:#fff;
}

/* TABLE */
.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px;
}

th,
td{
    padding:10px 8px;
    border-bottom:1px solid #edf0f5;
    text-align:left;
    font-size:12px;
}

th{
    background:#0d47a1;
    color:#fff;
}

tr:hover td{
    background:#f7faff;
}

.badge{
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:4px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

.loading,
.empty{
    text-align:center;
    padding:22px;
    color:#64748b;
}

.error{
    color:#dc2626;
    background:#fef2f2;
    padding:12px;
    border-radius:8px;
}

/* MOBILE */
@media(max-width:800px){

    .class-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:600px){

    .top{
        padding:12px 15px;
    }

    .top h2{
        font-size:15px;
    }

    .top-right{
        gap:5px;
    }

    .top a{
        font-size:10px;
    }

    .lang button{
        padding:5px 7px;
        font-size:10px;
    }

    .container{
        margin:12px auto;
        padding:0 10px;
    }

    .box{
        padding:14px;
        border-radius:11px;
        margin-bottom:12px;
    }

    .stats{
        gap:8px;
    }

    .stat{
        padding:12px 9px;
    }

    .stat-icon{
        font-size:18px;
    }

    .stat-label{
        font-size:9px;
    }

    .stat-number{
        font-size:18px;
    }

    .filters{
        grid-template-columns:1fr;
        gap:10px;
    }

    .class-grid{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .class-card{
        padding:14px 5px;
    }

    .class-icon{
        font-size:22px;
    }

    .class-bn{
        font-size:12px;
    }

    .class-en{
        font-size:9px;
    }

    .class-count{
        font-size:9px;
        padding:4px 6px;
    }

}

</style>

</head>

<body>

<header class="top">

<h2 id="pageTitle">
📚 শ্রেণি ব্যবস্থাপনা
</h2>

<div class="top-right">

<div class="lang">

<button
id="bnBtn"
class="active"
onclick="setLanguage('bn')">
বাংলা
</button>

<button
id="enBtn"
onclick="setLanguage('en')">
English
</button>

</div>

<a href="dashboard.html" id="dashboardLink">
← Dashboard
</a>

</div>

</header>


<div class="container">

<!-- =========================
     STATS
========================= -->

<div class="stats">

<div class="stat">

<div class="stat-icon">🎓</div>

<div class="stat-label" id="totalClassLabel">
মোট শ্রেণি
</div>

<div class="stat-number" id="totalClasses">
0
</div>

</div>


<div class="stat">

<div class="stat-icon">👨‍🎓</div>

<div class="stat-label" id="totalStudentLabel">
মোট শিক্ষার্থী
</div>

<div class="stat-number" id="totalStudents">
0
</div>

</div>


<div class="stat">

<div class="stat-icon">📅</div>

<div class="stat-label" id="selectedSessionLabel">
Selected Session
</div>

<div class="stat-number" id="selectedSessionCount">
0
</div>

</div>

</div>


<!-- =========================
     SESSION
========================= -->

<div class="box">

<h3 id="sessionTitle">
📅 Session নির্বাচন করুন
</h3>

<div class="filters">

<div>

<label id="sessionLabel">
Session
</label>

<select id="sessionSelect">

<option value="">
Session নির্বাচন করুন
</option>

</select>

</div>


<div>

<label id="searchLabel">
Student Search
</label>

<input
id="search"
placeholder="🔍 নাম / Student ID দিয়ে খুঁজুন..."
>

</div>

</div>


<div class="action-row">

<div
id="selectedInfo"
class="selected-info">

📌 প্রথমে Session ও Class নির্বাচন করুন

</div>

<button
class="refresh-btn"
id="refreshBtn"
onclick="refreshData()">

🔄 Refresh

</button>

</div>

</div>


<!-- =========================
     CLASSES
========================= -->

<div class="box">

<h3 id="classTitle">
🎓 শ্রেণি নির্বাচন করুন
</h3>

<div
class="class-grid"
id="classGrid">
</div>

</div>


<!-- =========================
     STUDENTS
========================= -->

<div class="box">

<h3>

<span id="studentTitle">
👨‍🎓 শিক্ষার্থী তালিকা
</span>

<span>
(
<span id="studentCount">0</span>
)
</span>

</h3>


<div class="table-wrap">

<table>

<thead>

<tr>

<th id="thName">
নাম
</th>

<th id="thId">
Student ID
</th>

<th id="thClass">
Class
</th>

<th id="thSession">
Session
</th>

</tr>

</thead>

<tbody id="studentList">

<tr>

<td
colspan="4"
class="loading">

Session এবং Class নির্বাচন করুন

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==========================================
   VARIABLES
========================================== */

let allStudents = [];

let students = [];

let dbClasses = [];

let currentLanguage = "bn";

let selectedClassId = "";

let selectedSession = "";

let selectedClassName = "";


/* ==========================================
   CLASS DISPLAY
========================================== */

const classList = [

{
    bn:"নূরানী",
    en:"Nurani"
},

{
    bn:"১ম শ্রেণি",
    en:"Class 1"
},

{
    bn:"২য় শ্রেণি",
    en:"Class 2"
},

{
    bn:"৩য় শ্রেণি",
    en:"Class 3"
},

{
    bn:"৪র্থ শ্রেণি",
    en:"Class 4"
},

{
    bn:"৫ম শ্রেণি",
    en:"Class 5"
},

{
    bn:"নাজেরা",
    en:"Najera"
},

{
    bn:"হিফজ",
    en:"Hifaz"
}

];


/* ==========================================
   LANGUAGE TEXT
========================================== */

const text = {

bn:{

pageTitle:"📚 শ্রেণি ব্যবস্থাপনা",

totalClass:"মোট শ্রেণি",

totalStudent:"মোট শিক্ষার্থী",

selectedSession:"Selected Session",

sessionTitle:"📅 Session নির্বাচন করুন",

sessionLabel:"Session",

searchLabel:"Student Search",

searchPlaceholder:"🔍 নাম / Student ID দিয়ে খুঁজুন...",

classTitle:"🎓 শ্রেণি নির্বাচন করুন",

studentTitle:"👨‍🎓 শিক্ষার্থী তালিকা",

name:"নাম",

id:"Student ID",

class:"Class",

session:"Session",

selectSession:"Session নির্বাচন করুন",

selectBoth:"📌 প্রথমে Session ও Class নির্বাচন করুন",

loading:"Loading...",

noStudent:"এই Session ও Class-এ কোনো শিক্ষার্থী নেই",

dashboard:"← Dashboard",

refresh:"🔄 Refresh",

students:"শিক্ষার্থী",

error:"তথ্য লোড করতে সমস্যা হয়েছে।"

},

en:{

pageTitle:"📚 Class Management",

totalClass:"Total Classes",

totalStudent:"Total Students",

selectedSession:"Selected Session",

sessionTitle:"📅 Select Session",

sessionLabel:"Session",

searchLabel:"Student Search",

searchPlaceholder:"🔍 Search by name / Student ID...",

classTitle:"🎓 Select Class",

studentTitle:"👨‍🎓 Student List",

name:"Name",

id:"Student ID",

class:"Class",

session:"Session",

selectSession:"Select Session",

selectBoth:"📌 Select Session and Class first",

loading:"Loading...",

noStudent:"No students found",

dashboard:"← Dashboard",

refresh:"🔄 Refresh",

students:"Students",

error:"Unable to load data."

}

};


/* ==========================================
   SET LANGUAGE
========================================== */

function setLanguage(lang){

currentLanguage = lang;

const t = text[lang];

document.documentElement.lang =
lang === "bn" ? "bn" : "en";

document.getElementById("pageTitle").textContent =
t.pageTitle;

document.getElementById("totalClassLabel").textContent =
t.totalClass;

document.getElementById("totalStudentLabel").textContent =
t.totalStudent;

document.getElementById("selectedSessionLabel").textContent =
t.selectedSession;

document.getElementById("sessionTitle").textContent =
t.sessionTitle;

document.getElementById("sessionLabel").textContent =
t.sessionLabel;

document.getElementById("searchLabel").textContent =
t.searchLabel;

document.getElementById("search").placeholder =
t.searchPlaceholder;

document.getElementById("classTitle").textContent =
t.classTitle;

document.getElementById("studentTitle").textContent =
t.studentTitle;

document.getElementById("thName").textContent =
t.name;

document.getElementById("thId").textContent =
t.id;

document.getElementById("thClass").textContent =
t.class;

document.getElementById("thSession").textContent =
t.session;

document.getElementById("dashboardLink").textContent =
t.dashboard;

document.getElementById("refreshBtn").textContent =
t.refresh;

document.getElementById("bnBtn")
.classList.toggle("active",lang==="bn");

document.getElementById("enBtn")
.classList.toggle("active",lang==="en");

renderClasses();

renderStudents();

updateSelectedInfo();

}


/* ==========================================
   START
========================================== */

async function start(){

try{

const {
data:{session}
}=await db.auth.getSession();

if(!session){

location.href="admin.html";

return;

}


/*
IMPORTANT:

students table:

student_id
name
class_id
session

classes table:

id
name
*/

await loadClasses();

await loadAllStudents();

await loadSessions();

renderClasses();

updateStats();

}catch(error){

console.error(error);

showError(error.message);

}

}


/* ==========================================
   LOAD CLASSES TABLE
========================================== */

async function loadClasses(){

const {data,error}=

await db

.from("classes")

.select("id,name")

.order("id");


if(error){

console.error("CLASSES ERROR:",error);

throw error;

}

dbClasses =
data || [];

console.log("DATABASE CLASSES:",dbClasses);

}


/* ==========================================
   FIND DATABASE CLASS
========================================== */

function findDbClass(displayClass){

if(!dbClasses.length){

return null;

}

const found =
classList.find(c=>

c.bn===displayClass ||
c.en===displayClass

);

if(!found){

return null;

}


/*
Database class name-এর সাথে
Bangla/English দুটোই match করবে
*/

return dbClasses.find(dbClass=>{

const name =
String(dbClass.name||"")
.trim()
.toLowerCase();

return(

name === found.bn.toLowerCase() ||

name === found.en.toLowerCase()

);

}) || null;

}


/* ==========================================
   LOAD STUDENTS
========================================== */

async function loadAllStudents(){

/*
এখানে class নয়,
class_id ব্যবহার করা হয়েছে।
*/

const {data,error}=

await db

.from("students")

.select(`
id,
student_id,
name,
class_id,
session
`);


if(error){

console.error("STUDENTS ERROR:",error);

throw error;

}

allStudents =
data || [];

console.log("STUDENTS:",allStudents);

updateStats();

}


/* ==========================================
   LOAD SESSION
========================================== */

async function loadSessions(){

const select =
document.getElementById("sessionSelect");

const t =
text[currentLanguage];

const current =
selectedSession;

select.innerHTML = "";

const first =
document.createElement("option");

first.value = "";

first.textContent =
t.selectSession;

select.appendChild(first);


const sessions = [

...new Set(

allStudents

.map(student=>
student.session
)

.filter(Boolean)

)

];


sessions.sort((a,b)=>

String(b).localeCompare(
String(a),
undefined,
{
numeric:true
}
)

);


sessions.forEach(session=>{

const option =
document.createElement("option");

option.value =
session;

option.textContent =
session;

select.appendChild(option);

});


if(current){

select.value =
current;

}

}


/* ==========================================
   SESSION CHANGE
========================================== */

document
.getElementById("sessionSelect")
.addEventListener(
"change",
function(){

selectedSession =
this.value;

updateSelectedInfo();

loadStudents();

updateStats();

}
);


/* ==========================================
   CLASS CARDS
========================================== */

function renderClasses(){

const grid =
document.getElementById("classGrid");

grid.innerHTML =
classList.map((c,index)=>{

/*
Database class বের করি
*/

const dbClass =
findDbClass(c.bn);

const classId =
dbClass ? String(dbClass.id) : "";


/*
এই class-এর student count
*/

let count =
allStudents.filter(student=>{

if(!classId){

return false;

}

return String(student.class_id) ===
classId;

}).length;


/*
Session select করলে
শুধু সেই session-এর count দেখাবে
*/

if(selectedSession){

count =
allStudents.filter(student=>{

return(

String(student.class_id) === classId &&

String(student.session) ===
String(selectedSession)

);

}).length;

}


/*
Selected class
*/

const active =
String(selectedClassId) ===
String(classId);


return `

<div
class="class-card ${active?"active":""}"
onclick="selectClass(${index})">

<div class="class-icon">
🎓
</div>

<div class="class-bn">
${c.bn}
</div>

<div class="class-en">
${c.en}
</div>

<div class="class-count">

👨‍🎓 ${count}
${text[currentLanguage].students}

</div>

</div>

`;

}).join("");

}


/* ==========================================
   SELECT CLASS
========================================== */

function selectClass(index){

const display =
classList[index];

const dbClass =
findDbClass(display.bn);

if(!dbClass){

alert(
currentLanguage==="bn"
?
`"${display.bn}" classটি classes table-এ পাওয়া যায়নি।`
:
`"${display.en}" was not found in classes table.`
);

console.error(
"Class not found in database:",
display
);

return;

}


selectedClassId =
String(dbClass.id);

selectedClassName =
dbClass.name;

console.log(
"SELECTED CLASS:",
dbClass
);

renderClasses();

updateSelectedInfo();

loadStudents();

}


/* ==========================================
   SELECTED INFO
========================================== */

function updateSelectedInfo(){

const info =
document.getElementById("selectedInfo");

const t =
text[currentLanguage];

if(
!selectedSession &&
!selectedClassId
){

info.textContent =
t.selectBoth;

return;

}


let className =
selectedClassName;


if(selectedClassId){

const dbClass =
dbClasses.find(c=>

String(c.id) ===
String(selectedClassId)

);

if(dbClass){

const uiClass =
classList.find(c=>

c.bn===dbClass.name ||
c.en===dbClass.name

);

if(uiClass){

className =
currentLanguage==="bn"
?uiClass.bn
:uiClass.en;

}else{

className =
dbClass.name;

}

}

}


if(selectedSession &&
selectedClassId){

info.textContent =
`📌 ${className} • ${selectedSession}`;

}

else if(selectedSession){

info.textContent =
`📅 ${selectedSession}`;

}

else{

info.textContent =
`🎓 ${className}`;

}

}


/* ==========================================
   LOAD FILTERED STUDENTS
========================================== */

async function loadStudents(){

const tbody =
document.getElementById("studentList");

const t =
text[currentLanguage];


if(
!selectedSession ||
!selectedClassId
){

students=[];

tbody.innerHTML = `

<tr>

<td
colspan="4"
class="empty">

${t.selectBoth}

</td>

</tr>

`;

document.getElementById(
"studentCount"
).textContent = "0";

return;

}


tbody.innerHTML = `

<tr>

<td
colspan="4"
class="loading">

${t.loading}

</td>

</tr>

`;


/*
এখানে class_id + session দিয়ে
filter হচ্ছে।

class column আর ব্যবহার করা হচ্ছে না।
*/

students =
allStudents.filter(student=>{

return(

String(student.class_id) ===
String(selectedClassId)

&&

String(student.session) ===
String(selectedSession)

);

});


renderStudents();

updateStats();

}


/* ==========================================
   RENDER STUDENTS
========================================== */

function renderStudents(){

const tbody =
document.getElementById("studentList");

const t =
text[currentLanguage];

const search =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


let list =
students.filter(student=>{

if(!search){

return true;

}


return(

String(student.name||"")
.toLowerCase()
.includes(search)

||

String(student.student_id||"")
.toLowerCase()
.includes(search)

);

});


document.getElementById(
"studentCount"
).textContent =
list.length;


if(!list.length){

tbody.innerHTML = `

<tr>

<td
colspan="4"
class="empty">

${t.noStudent}

</td>

</tr>

`;

return;

}


tbody.innerHTML =

list.map(student=>{

const dbClass =
dbClasses.find(c=>

String(c.id) ===
String(student.class_id)

);


let className =
dbClass
?dbClass.name
:"-";


const uiClass =
classList.find(c=>

c.bn===className ||
c.en===className

);


if(uiClass){

className =
currentLanguage==="bn"
?uiClass.bn
:uiClass.en;

}


return `

<tr>

<td>

<strong>

${escapeHtml(
student.name || "-"
)}

</strong>

</td>


<td>

<span class="badge">

${escapeHtml(
student.student_id || "-"
)}

</span>

</td>


<td>

${escapeHtml(
className
)}

</td>


<td>

${escapeHtml(
student.session || "-"
)}

</td>

</tr>

`;

}).join("");

}


/* ==========================================
   SEARCH
========================================== */

document
.getElementById("search")
.addEventListener(
"input",
renderStudents
);


/* ==========================================
   STATS
========================================== */

function updateStats(){

document.getElementById(
"totalClasses"
).textContent =
classList.length;


document.getElementById(
"totalStudents"
).textContent =
allStudents.length;


let count = 0;


if(selectedSession){

count =
allStudents.filter(student=>

String(student.session) ===
String(selectedSession)

).length;

}


document.getElementById(
"selectedSessionCount"
).textContent =
count;

}


/* ==========================================
   REFRESH
========================================== */

async function refreshData(){

const button =
document.getElementById("refreshBtn");

button.disabled = true;

button.textContent =
"Loading...";


try{

await loadClasses();

await loadAllStudents();

await loadSessions();

renderClasses();

updateStats();

updateSelectedInfo();

if(
selectedSession &&
selectedClassId
){

await loadStudents();

}else{

renderStudents();

}

}catch(error){

console.error(error);

showError(error.message);

}finally{

button.disabled = false;

button.textContent =
text[currentLanguage].refresh;

}

}


/* ==========================================
   ERROR
========================================== */

function showError(message){

const tbody =
document.getElementById("studentList");

tbody.innerHTML = `

<tr>

<td
colspan="4"
class="empty error">

❌ ${escapeHtml(message)}

</td>

</tr>

`;

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* ==========================================
   START
========================================== */

start();

</script>

</body>
</html>

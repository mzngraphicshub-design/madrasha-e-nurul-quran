<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Classes | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

.top{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:15px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 3px 15px #0002;
}

.top h2{
    margin:0;
    font-size:19px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.top a{
    color:#fff;
    text-decoration:none;
    font-size:13px;
}

.lang{
    display:flex;
    background:#ffffff22;
    padding:3px;
    border-radius:8px;
}

.lang button{
    border:0;
    background:transparent;
    color:#fff;
    padding:6px 9px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:11px;
}

.lang button.active{
    background:#fff;
    color:#0d47a1;
}

.container{
    max-width:1150px;
    margin:20px auto;
    padding:0 15px;
}

.box{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 15px #0d47a115;
    margin-bottom:18px;
    border:1px solid #e5eaf2;
}

h3{
    margin:0 0 16px;
    color:#0d47a1;
    font-size:17px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:18px;
}

.stat{
    background:#fff;
    border:1px solid #e5eaf2;
    border-radius:14px;
    padding:17px;
    box-shadow:0 3px 12px #0d47a110;
}

.stat-icon{
    font-size:23px;
}

.stat-label{
    font-size:12px;
    color:#64748b;
    margin:5px 0;
}

.stat-number{
    font-size:24px;
    font-weight:bold;
    color:#0d47a1;
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

label{
    display:block;
    font-weight:bold;
    font-size:12px;
    margin-bottom:6px;
}

select,input{
    width:100%;
    padding:11px;
    border:1px solid #d8dee9;
    border-radius:8px;
    font-size:13px;
    outline:none;
    background:#fff;
}

select:focus,input:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d215;
}

.action-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:13px;
    flex-wrap:wrap;
}

.selected-info{
    padding:9px 12px;
    border-radius:8px;
    background:#eaf4ff;
    border:1px solid #d7eaff;
    color:#0d47a1;
    font-size:12px;
    font-weight:bold;
}

.refresh-btn{
    border:0;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

.refresh-btn:disabled{
    opacity:.6;
}

.class-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
}

.class-card{
    background:#fff;
    border:1px solid #dce5f2;
    border-radius:12px;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 2px 8px #0000000a;
}

.class-card:hover{
    transform:translateY(-2px);
    border-color:#1976d2;
    box-shadow:0 5px 15px #1976d225;
}

.class-card.active{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    border-color:#0d47a1;
}

.class-icon{
    font-size:27px;
    margin-bottom:7px;
}

.class-bn{
    font-size:15px;
    font-weight:bold;
}

.class-en{
    font-size:11px;
    margin-top:4px;
    opacity:.7;
}

.class-count{
    margin-top:9px;
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:4px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

.class-card.active .class-count{
    background:#ffffff25;
    color:#fff;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    padding:10px 8px;
    border-bottom:1px solid #edf0f5;
    text-align:left;
    font-size:12px;
}

th{
    background:#0d47a1;
    color:#fff;
}

tr:hover td{
    background:#f7faff;
}

.badge{
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:4px 8px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.loading,
.empty{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.error{
    color:#dc2626;
    background:#fef2f2;
}

.debug{
    margin-top:10px;
    font-size:11px;
    color:#64748b;
}

@media(max-width:800px){

    .class-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .top{
        padding:12px 15px;
    }

    .top h2{
        font-size:16px;
    }

    .top-right{
        gap:5px;
    }

    .container{
        margin:15px auto;
        padding:0 10px;
    }

    .box{
        padding:15px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr 1fr;
        gap:7px;
    }

    .stat{
        padding:11px 7px;
    }

    .stat-icon{
        font-size:18px;
    }

    .stat-label{
        font-size:9px;
    }

    .stat-number{
        font-size:19px;
    }

    .class-grid{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
    }

    .class-card{
        padding:15px 5px;
    }

    .class-icon{
        font-size:23px;
    }

    .class-bn{
        font-size:13px;
    }

    .class-en{
        font-size:10px;
    }

    .selected-info{
        font-size:10px;
    }
}
</style>
</head>

<body>

    <div class="top-right">

        <div class="lang">

<div class="container">


<!-- =========================

        <div class="stat-icon">🎓</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let allStudents = [];

let students = [];

let selectedClass = "";

let selectedSession = "";

let currentLanguage = "bn";


/* =====================================================
   CLASS LIST
===================================================== */

const classes = [

    {
        bn:"নূরানী",
        en:"Nurani"
    },

    {
        bn:"১ম শ্রেণি",
        en:"Class 1"
    },

    {
        bn:"২য় শ্রেণি",
        en:"Class 2"
    },

    {
        bn:"৩য় শ্রেণি",
        en:"Class 3"
    },

    {
        bn:"৪র্থ শ্রেণি",
        en:"Class 4"
    },

    {
        bn:"৫ম শ্রেণি",
        en:"Class 5"
    },

    {
        bn:"নাজেরা",
        en:"Najera"
    },

    {
        bn:"হিফজ",
        en:"Hifaz"
    }

];


/* =====================================================
   TEXT
===================================================== */

const text = {

bn:{

pageTitle:"📚 শ্রেণি ব্যবস্থাপনা",

totalClass:"মোট শ্রেণি",

totalStudent:"মোট শিক্ষার্থী",

selectedSession:"Selected Session",

sessionTitle:"📅 Session নির্বাচন করুন",

sessionLabel:"Session",

searchLabel:"Student Search",

searchPlaceholder:
"🔍 নাম / রোল / ID দিয়ে খুঁজুন...",

classTitle:"🎓 শ্রেণি নির্বাচন করুন",

studentTitle:"👨‍🎓 শিক্ষার্থী তালিকা",

name:"নাম",

roll:"রোল",

id:"Student ID",

class:"Class",

session:"Session",

selectSession:"Session নির্বাচন করুন",

selectBoth:
"📌 প্রথমে Session ও Class নির্বাচন করুন",

loading:"Loading...",

noStudent:
"এই Session ও Class-এ কোনো শিক্ষার্থী নেই",

dashboard:"← Dashboard",

refresh:"🔄 Refresh",

students:"শিক্ষার্থী"

},

en:{

pageTitle:"📚 Class Management",

totalClass:"Total Classes",

totalStudent:"Total Students",

selectedSession:"Selected Session",

sessionTitle:"📅 Select Session",

sessionLabel:"Session",

searchLabel:"Student Search",

searchPlaceholder:
"🔍 Search by name / roll / ID...",

classTitle:"🎓 Select Class",

studentTitle:"👨‍🎓 Student List",

name:"Name",

roll:"Roll",

id:"Student ID",

class:"Class",

session:"Session",

selectSession:"Select Session",

selectBoth:
"📌 Select Session and Class first",

loading:"Loading...",

noStudent:
"No students found for this Session and Class",

dashboard:"← Dashboard",

refresh:"🔄 Refresh",

students:"Students"

}

};


/* =====================================================
   NORMALIZE
   সবচেয়ে গুরুত্বপূর্ণ অংশ
===================================================== */

function normalize(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)

        .trim()

        .toLowerCase()

        // বাংলা/ইংরেজি spelling difference সামলানো
        .replace(/\s+/g," ")

        .replace(/[-_]/g," ")

        .trim();
}


/* =====================================================
   CLASS MATCH
===================================================== */

function isSameClass(studentClass, classObject){

    const s = normalize(studentClass);

    const bn = normalize(classObject.bn);

    const en = normalize(classObject.en);

    return (
        s === bn ||
        s === en
    );

}


/* =====================================================
   SESSION MATCH
===================================================== */

function isSameSession(studentSession, session){

    return normalize(studentSession) ===
           normalize(session);

}


/* =====================================================
   LANGUAGE
===================================================== */

function setLanguage(lang){

    currentLanguage = lang;

    const t = text[lang];

    document.documentElement.lang =
        lang === "bn" ? "bn" : "en";


    document.getElementById("pageTitle")
        .textContent = t.pageTitle;

    document.getElementById("totalClassLabel")
        .textContent = t.totalClass;

    document.getElementById("totalStudentLabel")
        .textContent = t.totalStudent;

    document.getElementById("selectedSessionLabel")
        .textContent = t.selectedSession;

    document.getElementById("sessionTitle")
        .textContent = t.sessionTitle;

    document.getElementById("sessionLabel")
        .textContent = t.sessionLabel;

    document.getElementById("searchLabel")
        .textContent = t.searchLabel;

    document.getElementById("search")
        .placeholder = t.searchPlaceholder;

    document.getElementById("classTitle")
        .textContent = t.classTitle;

    document.getElementById("studentTitle")
        .textContent = t.studentTitle;

    document.getElementById("thName")
        .textContent = t.name;

    document.getElementById("thRoll")
        .textContent = t.roll;

    document.getElementById("thId")
        .textContent = t.id;

    document.getElementById("thClass")
        .textContent = t.class;

    document.getElementById("thSession")
        .textContent = t.session;

    document.getElementById("dashboardLink")
        .textContent = t.dashboard;

    document.getElementById("refreshBtn")
        .textContent = t.refresh;


    document.getElementById("bnBtn")
        .classList.toggle(
            "active",
            lang === "bn"
        );

    document.getElementById("enBtn")
        .classList.toggle(
            "active",
            lang === "en"
        );


    loadSessions();

    renderClasses();

    filterStudents();

    updateSelectedInfo();

}


/* =====================================================
   LOAD ALL STUDENTS
===================================================== */

async function loadAllStudents(){

    const tbody =
        document.getElementById("studentList");


    tbody.innerHTML = `
        <tr>
            <td colspan="5" class="loading">
                Loading students...
            </td>
        </tr>
    `;


    const { data, error } =

        await db
            .from("students")
            .select(`
                id,
                name,
                roll,
                student_id,
                class,
                session
            `)
            .order("id",{ascending:true});


    if(error){

        console.error(
            "STUDENTS LOAD ERROR:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td colspan="5"
                    class="empty error">
                    ❌ ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        return;

    }


    allStudents = data || [];

    console.log(
        "ALL STUDENTS:",
        allStudents
    );


    updateStats();

    loadSessions();

    renderClasses();

    filterStudents();

}


/* =====================================================
   LOAD SESSIONS
===================================================== */

function loadSessions(){

    const select =
        document.getElementById(
            "sessionSelect"
        );


    const t =
        text[currentLanguage];


    select.innerHTML = `

        <option value="">
            ${t.selectSession}
        </option>

    `;


    const sessionMap = new Map();


    allStudents.forEach(student=>{

        if(
            student.session !== null &&
            student.session !== undefined &&
            String(student.session).trim() !== ""
        ){

            const original =
                String(student.session).trim();

            const key =
                normalize(original);


            if(!sessionMap.has(key)){

                sessionMap.set(
                    key,
                    original
                );

            }

        }

    });


    const sessions =
        Array.from(
            sessionMap.values()
        );


    sessions.sort((a,b)=>
        String(b).localeCompare(
            String(a),
            undefined,
            {numeric:true}
        )
    );


    sessions.forEach(session=>{

        const option =
            document.createElement("option");

        option.value = session;

        option.textContent = session;

        select.appendChild(option);

    });


    if(selectedSession){

        const found =
            sessions.find(s=>
                isSameSession(
                    s,
                    selectedSession
                )
            );


        if(found){

            select.value = found;

        }

    }

}


/* =====================================================
   RENDER CLASSES
===================================================== */

function renderClasses(){

    const grid =
        document.getElementById(
            "classGrid"
        );


    grid.innerHTML =
        classes.map(
            (c,index)=>{

                const count =
                    getClassCount(c);


                const active =
                    selectedClass !== "" &&
                    isSameClass(
                        selectedClass,
                        c
                    );


                return `

                    <div
                        class="class-card
                        ${active ? "active" : ""}"
                        onclick="selectClass(${index})">

                        <div class="class-icon">
                            🎓
                        </div>

                        <div class="class-bn">
                            ${c.bn}
                        </div>

                        <div class="class-en">
                            ${c.en}
                        </div>

                        <div class="class-count">

                            👨‍🎓 ${count}
                            ${text[currentLanguage].students}

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =====================================================
   CLASS COUNT
   সব Session-এর total class count
===================================================== */

function getClassCount(classObject){

    return allStudents.filter(student=>

        isSameClass(
            student.class,
            classObject
        )

    ).length;

}


/* =====================================================
   SELECT CLASS
===================================================== */

function selectClass(index){

    const c =
        classes[index];


    /*
       এখানে বাংলা/English অনুযায়ী
       আলাদা value রাখা হচ্ছে না।

       সবসময় canonical বাংলা class রাখা হচ্ছে।
       এতে filter mismatch হবে না।
    */

    selectedClass = c.bn;


    renderClasses();

    updateSelectedInfo();

    filterStudents();

}


/* =====================================================
   SESSION CHANGE
===================================================== */

document
    .getElementById("sessionSelect")
    .addEventListener(
        "change",
        function(){

            selectedSession =
                this.value;

            updateSelectedInfo();

            filterStudents();

            updateStats();

        }
    );


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function(){

            filterStudents();

        }
    );


/* =====================================================
   FILTER STUDENTS
===================================================== */

function filterStudents(){

    const tbody =
        document.getElementById(
            "studentList"
        );


    const t =
        text[currentLanguage];


    /*
       Session + Class নির্বাচন না করলে
       list দেখাবে না।
    */

    if(
        !selectedSession ||
        !selectedClass
    ){

        students = [];


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    ${t.selectBoth}

                </td>

            </tr>

        `;


        document.getElementById(
            "studentCount"
        ).textContent = "0";


        return;

    }


    const selectedClassObject =
        classes.find(c=>

            isSameClass(
                selectedClass,
                c
            )

        );


    if(!selectedClassObject){

        students = [];

        renderStudents();

        return;

    }


    /*
       এখানে Supabase-এ আবার
       .eq(class) বা .in(class) করা হচ্ছে না।

       allStudents থেকে সরাসরি filter হচ্ছে।
       এই কারণেই class name mismatch আর সমস্যা করবে না।
    */

    let result =
        allStudents.filter(student=>{

            const sessionOK =
                isSameSession(
                    student.session,
                    selectedSession
                );


            const classOK =
                isSameClass(
                    student.class,
                    selectedClassObject
                );


            return sessionOK && classOK;

        });


    /*
       SEARCH
    */

    const q =
        normalize(
            document
                .getElementById("search")
                .value
        );


    if(q){

        result =
            result.filter(student=>{

                return (

                    normalize(student.name)
                        .includes(q)

                    ||

                    normalize(student.roll)
                        .includes(q)

                    ||

                    normalize(student.student_id)
                        .includes(q)

                );

            });

    }


    students = result;


    console.log(
        "FILTER RESULT:",
        {
            session:selectedSession,
            class:selectedClassObject,
            students:students
        }
    );


    renderStudents();

}


/* =====================================================
   RENDER STUDENTS
===================================================== */

function renderStudents(){

    const tbody =
        document.getElementById(
            "studentList"
        );


    const t =
        text[currentLanguage];


    document.getElementById(
        "studentCount"
    ).textContent =
        students.length;


    if(!students.length){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    ${t.noStudent}

                    <div class="debug">

                        Session:
                        ${escapeHtml(selectedSession)}

                        &nbsp; | &nbsp;

                        Class:
                        ${escapeHtml(selectedClass)}

                    </div>

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML =

        students.map(student=>`

            <tr>

                <td>

                    <strong>

                        ${escapeHtml(
                            student.name || "-"
                        )}

                    </strong>

                </td>


                <td>

                    <span class="badge">

                        ${escapeHtml(
                            student.roll || "-"
                        )}

                    </span>

                </td>


                <td>

                    ${escapeHtml(
                        student.student_id || "-"
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        getClassName(
                            student.class
                        )
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        student.session || "-"
                    )}

                </td>

            </tr>

        `).join("");

}


/* =====================================================
   CLASS NAME
===================================================== */

function getClassName(value){

    const c =
        classes.find(x=>

            isSameClass(
                value,
                x
            )

        );


    if(!c){

        return value || "-";

    }


    return currentLanguage === "bn"
        ? c.bn
        : c.en;

}


/* =====================================================
   SELECTED INFO
===================================================== */

function updateSelectedInfo(){

    const info =
        document.getElementById(
            "selectedInfo"
        );


    const t =
        text[currentLanguage];


    if(
        !selectedSession &&
        !selectedClass
    ){

        info.textContent =
            t.selectBoth;

        return;

    }


    let className = "";


    const c =
        classes.find(x=>

            isSameClass(
                selectedClass,
                x
            )

        );


    if(c){

        className =
            currentLanguage === "bn"
                ? c.bn
                : c.en;

    }


    if(
        selectedSession &&
        className
    ){

        info.textContent =
            `📌 ${className} • ${selectedSession}`;

    }

    else if(selectedSession){

        info.textContent =
            `📅 ${selectedSession}`;

    }

    else if(className){

        info.textContent =
            `🎓 ${className}`;

    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "totalClasses"
    ).textContent =
        classes.length;


    document.getElementById(
        "totalStudents"
    ).textContent =
        allStudents.length;


    let count = 0;


    if(selectedSession){

        count =
            allStudents.filter(student=>

                isSameSession(
                    student.session,
                    selectedSession
                )

            ).length;

    }


    document.getElementById(
        "selectedSessionCount"
    ).textContent =
        count;

}


/* =====================================================
   REFRESH
===================================================== */

async function refreshData(){

    const btn =
        document.getElementById(
            "refreshBtn"
        );


    btn.disabled = true;


    try{

        await loadAllStudents();

        updateStats();

        updateSelectedInfo();

        filterStudents();

    }

    catch(error){

        console.error(error);

    }

    finally{

        btn.disabled = false;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =====================================================
   AUTH + START
===================================================== */

async function start(){

    try{

        const {

            data:{
                session

            }

        } =
            await db.auth.getSession();


        if(!session){

            location.href =
                "admin.html";

            return;

        }


        await loadAllStudents();


        renderClasses();

        updateStats();

        updateSelectedInfo();

    }

    catch(error){

        console.error(
            "START ERROR:",
            error
        );

    }

}


/* =====================================================
   RUN
===================================================== */

start();

</script>

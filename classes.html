<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f3f7fc;
    color:#1e293b;
}

.top{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    box-shadow:0 3px 15px #0002;
}

.top h2{
    margin:0;
    font-size:18px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.top a{
    color:white;
    text-decoration:none;
    font-size:12px;
}

.lang{
    display:flex;
    background:#ffffff22;
    padding:3px;
    border-radius:7px;
}

.lang button{
    border:0;
    background:transparent;
    color:white;
    padding:6px 9px;
    border-radius:5px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
}

.lang button.active{
    background:white;
    color:#0d47a1;
}

.container{
    max-width:1150px;
    margin:20px auto;
    padding:0 12px;
}

.box{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    border:1px solid #e1e8f0;
    box-shadow:0 3px 15px #0d47a112;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:18px;
}

.stat{
    background:white;
    border:1px solid #e1e8f0;
    border-radius:14px;
    padding:17px;
    box-shadow:0 3px 12px #0000000b;
}

.stat-icon{
    font-size:23px;
}

.stat-label{
    font-size:12px;
    color:#64748b;
    margin-top:4px;
}

.stat-number{
    font-size:24px;
    color:#0d47a1;
    font-weight:bold;
    margin-top:3px;
}

h3{
    margin:0 0 15px;
    color:#0d47a1;
    font-size:16px;
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

select,
input{
    width:100%;
    height:42px;
    padding:0 12px;
    border:1px solid #d8e0ea;
    border-radius:8px;
    background:white;
    outline:none;
    font-size:13px;
}

select:focus,
input:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d218;
}

.action-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:13px;
}

.selected-info{
    background:#eaf4ff;
    border:1px solid #d5eaff;
    color:#0d47a1;
    padding:9px 12px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

.refresh-btn{
    border:0;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

.refresh-btn:disabled{
    opacity:.5;
}

.class-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
}

.class-card{
    background:white;
    border:1px solid #dce5ef;
    border-radius:12px;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.class-card:hover{
    transform:translateY(-2px);
    border-color:#1976d2;
    box-shadow:0 5px 15px #1976d220;
}

.class-card.active{
    color:white;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    border-color:#0d47a1;
}

.class-icon{
    font-size:27px;
    margin-bottom:7px;
}

.class-bn{
    font-weight:bold;
    font-size:14px;
}

.class-en{
    font-size:11px;
    opacity:.65;
    margin-top:4px;
}

.class-card.active .class-en{
    opacity:1;
}

.class-count{
    display:inline-block;
    margin-top:9px;
    padding:5px 8px;
    background:#e5f2ff;
    color:#0d47a1;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

.class-card.active .class-count{
    background:#ffffff25;
    color:white;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

th{
    background:#0d47a1;
    color:white;
    padding:11px 9px;
    text-align:left;
    font-size:11px;
}

td{
    padding:10px 9px;
    border-bottom:1px solid #edf1f5;
    font-size:12px;
}

tr:hover td{
    background:#f7fbff;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    background:#e6f3ff;
    color:#0d47a1;
    border-radius:15px;
    font-size:10px;
    font-weight:bold;
}

.empty,
.loading{
    text-align:center;
    padding:25px!important;
    color:#64748b;
}

.error{
    color:#dc2626!important;
    background:#fff1f2!important;
}

.message{
    display:none;
    margin-bottom:15px;
    padding:11px;
    border-radius:8px;
    font-size:12px;
}

.message.error{
    display:block;
}

@media(max-width:800px){

    .class-grid{

    }

/* =====================================================

===================================================== */

    try{

            data:{

            }
        } =
        await db.auth.getSession();


        if(!session){

/* =====================================================

===================================================== */

/*
   IMPORTANT:

   এখানে select("*") ব্যবহার করা হয়েছে।

   তাই আগের মতো ভুল column name

   query fail করবে না।

   আপনার screenshot অনুযায়ী:
   student_id = Student ID
   roll_no    = Roll

*/

async function loadAllStudents(){

    hideError();


    const {
        data,
        error
    } = await db
        .from("students")
        .select("*");


    if(error){

        console.error(
            "Students error:",
            error
        );

        showError(error.message);

        allStudents = [];

        renderClasses();

        updateStats();

        return;

    }


    allStudents =
        Array.isArray(data)
        ? data
        : [];


    console.log(
        "Students loaded:",
        allStudents
    );


    updateStats();

    renderClasses();

}

===================================================== */

/* =====================================================
   LOAD SESSIONS
===================================================== */

function loadSessions(){

    const select =
        document.getElementById(
            "sessionSelect"
        );


    const t =
        text[currentLanguage];


    select.innerHTML = `

        <option value="">
            ${t.selectSession}
        </option>

    `;


    const sessions = [

        ...new Set(

            allStudents

                .map(
                    student =>
                    String(
                        getStudentSession(student)
                    ).trim()
                )

                .filter(Boolean)

        )

    ];


    /*
       students table-এ student না থাকলেও
       sessions table থেকে session দেখাবে।
    */

    loadSessionsFromTable(sessions);

}


/* =====================================================
   SESSION TABLE
===================================================== */

async function loadSessionsFromTable(
    currentStudentSessions
){

    try{

        const {
            data,
            error
        } = await db
            .from("sessions")
            .select("*");


        if(!error && Array.isArray(data)){

            data.forEach(row=>{

                const value =
                    row.session ??
                    row.year ??
                    row.name ??
                    row.title ??
                    row.session_name;


                if(value){

                    currentStudentSessions.push(
                        String(value).trim()
                    );

                }

            });

        }

    }

    catch(error){

        console.log(
            "sessions table optional:",
            error
        );

    }


    const uniqueSessions = [

        ...new Set(
            currentStudentSessions
                .filter(Boolean)
        )

    ];


    uniqueSessions.sort(
        (a,b)=>
        String(b)
        .localeCompare(
            String(a),
            undefined,
            {
                numeric:true
            }
        )
    );


    const select =
        document.getElementById(
            "sessionSelect"
        );


    uniqueSessions.forEach(value=>{

        const option =
            document.createElement(
                "option"
            );

        option.value = value;

        option.textContent = value;

        select.appendChild(option);

    });


    if(selectedSession){

        select.value =
            selectedSession;

    }

}

       আলাদা value save করা হচ্ছে না।

       সবসময় Bangla নামকে internal value
       হিসেবে ব্যবহার করছি।

       এতে বাংলা/English change করলেও
       selected class হারাবে না।
    */

    selectedClass =
        selected.bn;


    renderClasses();

    updateSelectedInfo();

    applyFilters();

}


/* =====================================================
   CLASS MATCH
===================================================== */

function classMatches(
    studentClass,
    classObject
){

    const value =
        String(
            studentClass || ""
        )
        .trim()
        .toLowerCase();


    return (

        value ===
        String(classObject.bn)
            .trim()
            .toLowerCase()

        ||

        value ===
        String(classObject.en)
            .trim()
            .toLowerCase()

    );

}


/* =====================================================
   SESSION MATCH
===================================================== */

function sessionMatches(
    studentSession,
    selected
){

    return (

        String(
            studentSession ?? ""
        )
        .trim()

        ===

        String(
            selected ?? ""
        )
        .trim()

    );

}


/* =====================================================
   CLASS COUNT
===================================================== */

function getClassCount(
    classObject
){

    /*
       Session select করা থাকলে
       শুধু ওই Session-এর students count হবে।

       Session না থাকলে
       সব Session-এর count হবে।
    */

    return allStudents.filter(
        student=>{

            const classOK =
                classMatches(
                    getStudentClass(student),
                    classObject
                );


            if(!classOK){

                return false;

            }


            if(!selectedSession){

                return true;

            }


            return sessionMatches(
                getStudentSession(student),
                selectedSession
            );

        }
    ).length;

}


/* =====================================================
   RENDER CLASSES
===================================================== */

function renderClasses(){

    const grid =
        document.getElementById(
            "classGrid"
        );


    grid.innerHTML =

        classes.map(
            (c,index)=>{

                const count =
                    getClassCount(c);


                const active =
                    selectedClass === c.bn;


                const displayName =
                    currentLanguage === "bn"
                    ? c.bn
                    : c.en;


                return `

                    <div
                        class="class-card
                        ${active ? "active" : ""}"
                        onclick="selectClass(${index})">

                        <div class="class-icon">
                            🎓
                        </div>

                        <div class="class-bn">
                            ${escapeHtml(
                                displayName
                            )}
                        </div>

                        <div class="class-en">
                            ${
                                currentLanguage === "bn"
                                ? c.en
                                : c.bn
                            }
                        </div>

                        <div class="class-count">
                            👨‍🎓 ${count}
                            ${text[currentLanguage].students}
                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =====================================================
   APPLY FILTERS
===================================================== */

function applyFilters(){

    const tbody =
        document.getElementById(
            "studentList"
        );


    const t =
        text[currentLanguage];


    const searchInput =
        document.getElementById(
            "search"
        );


    const q =
        String(
            searchInput.value || ""
        )
        .trim()
        .toLowerCase();


    /*
       Session + Class ছাড়া list দেখাবে না।
    */

    if(
        !selectedSession ||
        !selectedClass
    ){

        filteredStudents = [];

        document.getElementById(
            "studentCount"
        ).textContent = "0";


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    ${t.firstSelect}

                </td>

            </tr>

        `;

        return;

    }


    /*
       প্রথমে Session + Class
       অনুযায়ী সব student filter।
    */

    let list =
        allStudents.filter(
            student=>{

                const sessionOK =
                    sessionMatches(
                        getStudentSession(student),
                        selectedSession
                    );


                const classOK =
                    String(
                        getStudentClass(student)
                    )
                    .trim()
                    .toLowerCase()

                    ===

                    String(
                        selectedClass
                    )
                    .trim()
                    .toLowerCase();


                /*
                   Database-এ Class 1 থাকলে
                   Bangla ১ম শ্রেণি দিয়ে match করবে।
                */

                const selectedObj =
                    classes.find(
                        c =>
                        c.bn === selectedClass
                    );


                const classOK2 =
                    selectedObj
                    ? classMatches(
                        getStudentClass(student),
                        selectedObj
                    )
                    : classOK;


                return (
                    sessionOK &&
                    classOK2
                );

            }
        );


    /*
       তারপর Search
    */

    if(q){

        list =
            list.filter(
                student=>{

                    const name =
                        String(
                            getStudentName(student)
                        )
                        .toLowerCase();


                    const roll =
                        String(
                            getStudentRoll(student)
                        )
                        .toLowerCase();


                    const id =
                        String(
                            getStudentId(student)
                        )
                        .toLowerCase();


                    return (

                        name.includes(q)

                        ||

                        roll.includes(q)

                        ||

                        id.includes(q)

                    );

                }
            );

    }


    filteredStudents = list;


    document.getElementById(
        "studentCount"
    ).textContent =
        list.length;


    if(!list.length){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    ${t.noStudent}

                </td>

            </tr>

        `;

        return;

    }


    /*
       প্রতিটি Student আলাদা row।
    */

    tbody.innerHTML =

        list.map(
            student=>{

                const name =
                    getStudentName(student);


                const roll =
                    getStudentRoll(student);


                const studentId =
                    getStudentId(student);


                const studentClass =
                    getStudentClass(student);


                const studentSession =
                    getStudentSession(student);


                return `

                    <tr>

                        <td>

                            <strong>
                                ${escapeHtml(
                                    name || "-"
                                )}
                            </strong>

                        </td>


                        <td>

                            <span class="badge">

                                ${escapeHtml(
                                    roll || "-"
                                )}

                            </span>

                        </td>


                        <td>

                            ${escapeHtml(
                                studentId || "-"
                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                getClassName(
                                    studentClass
                                )
                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                studentSession || "-"
                            )}

                        </td>

                    </tr>

                `;

            }
        ).join("");

}


/* =====================================================
   CLASS NAME
===================================================== */

function getClassName(value){

    const found =
        classes.find(
            c =>
            String(c.bn)
                .toLowerCase()
                ===
            String(value)
                .toLowerCase()

            ||

            String(c.en)
                .toLowerCase()
                ===
            String(value)
                .toLowerCase()
        );


    if(!found){

        return value || "-";

    }


    return currentLanguage === "bn"
        ? found.bn
        : found.en;

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function(){

            applyFilters();

        }
    );


/* =====================================================
   UPDATE INFO
===================================================== */

function updateSelectedInfo(){

    const info =
        document.getElementById(
            "selectedInfo"
        );


    const t =
        text[currentLanguage];


    if(
        !selectedSession &&
        !selectedClass
    ){

        info.textContent =
            t.firstSelect;

        return;

    }


    let parts = [];


    if(selectedClass){

        const found =
            classes.find(
                c =>
                c.bn === selectedClass
            );


        if(found){

            parts.push(
                currentLanguage === "bn"
                ? found.bn
                : found.en
            );

        }

    }


    if(selectedSession){

        parts.push(
            selectedSession
        );

    }


    info.textContent =
        "📌 " + parts.join(" • ");

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "totalClasses"
    ).textContent =
        classes.length;


    document.getElementById(
        "totalStudents"
    ).textContent =
        allStudents.length;


    let count = 0;


    if(selectedSession){

        count =
            allStudents.filter(
                student =>
                sessionMatches(
                    getStudentSession(student),
                    selectedSession
                )
            ).length;

    }


    document.getElementById(
        "selectedSessionCount"
    ).textContent =
        count;

}


/* =====================================================
   REFRESH
===================================================== */

async function refreshData(){

    const button =
        document.getElementById(
            "refreshBtn"
        );


    button.disabled = true;

    hideError();


    try{

        await loadAllStudents();

        loadSessions();

        renderClasses();

        applyFilters();

        updateStats();

        updateSelectedInfo();

    }

    catch(error){

        console.error(error);

        showError(
            error.message ||
            "Refresh failed."
        );

    }

    finally{

        button.disabled = false;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

start();

</script>

<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Classes | মাদরাসায়ে নূরুল কুরআন</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

/* =========================
   HEADER
========================= */

.top{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:15px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 3px 15px #0002;
}

.top h2{
    margin:0;
    font-size:19px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.top a{
    color:#fff;
    text-decoration:none;
    font-size:13px;
}

/* =========================
   LANGUAGE
========================= */

.lang{
    display:flex;
    background:#ffffff22;
    padding:3px;
    border-radius:8px;
}

.lang button{
    border:0;
    background:transparent;
    color:#fff;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.lang button.active{
    background:#fff;
    color:#0d47a1;
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:1150px;
    margin:22px auto;
    padding:0 15px;
}

/* =========================
   BOX
========================= */

.box{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 15px #0d47a115;
    margin-bottom:20px;
    border:1px solid #e5eaf2;
}

h3{
    margin:0 0 18px;
    color:#0d47a1;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border:1px solid #e5eaf2;
    border-radius:14px;
    padding:17px;
    box-shadow:0 3px 12px #0d47a110;
    position:relative;
    overflow:hidden;
}

.stat::after{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    right:-20px;
    top:-20px;
    border-radius:50%;
    background:#1976d212;
}

.stat-icon{
    font-size:25px;
}

.stat-label{
    font-size:13px;
    color:#64748b;
    margin-top:5px;
}

.stat-number{
    font-size:25px;
    font-weight:bold;
    color:#0d47a1;
    margin-top:4px;
}

/* =========================
   FILTER
========================= */

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #d8dee9;
    border-radius:8px;
    font-size:14px;
    outline:none;
    background:#fff;
}

select:focus,
input:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d215;
}

/* =========================
   ACTION
========================= */

.action-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.selected-info{
    padding:10px 13px;
    border-radius:8px;
    background:#eaf4ff;
    border:1px solid #d7eaff;
    color:#0d47a1;
    font-size:13px;
    font-weight:bold;
}

.refresh-btn{
    border:0;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.refresh-btn:disabled{
    opacity:.6;
}

/* =========================
   CLASS GRID
========================= */

.class-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.class-card{
    background:#fff;
    border:1px solid #dce5f2;
    border-radius:13px;
    padding:20px 10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 2px 8px #0000000a;
}

.class-card:hover{
    transform:translateY(-3px);
    border-color:#1976d2;
    box-shadow:0 6px 18px #1976d225;
}

.class-card.active{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    border-color:#0d47a1;
}

.class-icon{
    font-size:28px;
    margin-bottom:8px;
}

.class-bn{
    font-size:16px;
    font-weight:bold;
}

.class-en{
    font-size:12px;
    margin-top:4px;
    opacity:.7;
}

.class-card.active .class-en{
    opacity:1;
}

.class-count{
    margin-top:10px;
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.class-card.active .class-count{
    background:#ffffff25;
    color:#fff;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,
td{
    padding:11px 9px;
    border-bottom:1px solid #edf0f5;
    text-align:left;
    font-size:13px;
}

th{
    background:#0d47a1;
    color:#fff;
}

tr:hover td{
    background:#f7faff;
}

.badge{
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.loading,
.empty{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.error{
    color:#dc2626;
    background:#fef2f2;
    padding:12px;
    border-radius:8px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .class-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:600px){

    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .top-right{
        width:100%;
        justify-content:space-between;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .class-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .class-card{
        padding:16px 7px;
    }

    .class-bn{
        font-size:14px;
    }

}

</style>

/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value){

return String(value ?? "")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =====================================================
   FIND CLASS
===================================================== */

function findClass(value){

const v =
normalize(value);

return classes.find(c=>{

if(normalize(c.bn)===v)
return true;

if(normalize(c.en)===v)
return true;

return c.aliases.some(
x=>normalize(x)===v
);

});

}


/* =====================================================
   LANGUAGE
===================================================== */

function setLanguage(lang){

currentLanguage=lang;

const t=text[lang];

document.documentElement.lang=
lang==="bn"?"bn":"en";


document.getElementById("pageTitle")
.textContent=t.pageTitle;

document.getElementById("totalClassLabel")
.textContent=t.totalClass;

document.getElementById("totalStudentLabel")

document.getElementById("selectedSessionLabel")
.textContent=t.selectedSession;

document.getElementById("sessionTitle")

document.getElementById("sessionLabel")
.textContent=t.sessionLabel;

document.getElementById("searchLabel")
.textContent=t.searchLabel;

document.getElementById("search")
.placeholder=t.searchPlaceholder;

document.getElementById("classTitle")
.textContent=t.classTitle;

document.getElementById("studentTitle")
.textContent=t.studentTitle;

document.getElementById("thName")
.textContent=t.name;

document.getElementById("thRoll")
.textContent=t.roll;

document.getElementById("thId")
.textContent=t.id;

document.getElementById("thClass")
.textContent=t.class;

document.getElementById("thSession")
.textContent=t.session;

document.getElementById("dashboardLink")
.textContent=t.dashboard;

document.getElementById("refreshBtn")
.textContent=t.refresh;


document.getElementById("bnBtn")
.classList.toggle(
"active",
lang==="bn"
);

document.getElementById("enBtn")
.classList.toggle(
"active",
lang==="en"
);


loadSessions();

renderClasses();

renderStudents();

updateSelectedInfo();

}


/* =====================================================
   RENDER CLASSES
===================================================== */

function renderClasses(){

const grid=
document.getElementById("classGrid");


grid.innerHTML=
classes.map((c,index)=>{

const count=
getClassCount(c);


const active=
selectedClass===c.bn ||
selectedClass===c.en ||
findClass(selectedClass)===c;


return `

<div
class="class-card ${active?"active":""}"
onclick="selectClass(${index})">

<div class="class-icon">
🎓
</div>

<div class="class-bn">
${escapeHtml(c.bn)}
</div>

<div class="class-en">
${escapeHtml(c.en)}
</div>

<div class="class-count">

👨‍🎓 ${count}
${text[currentLanguage].students}

</div>

</div>

`;

}).join("");

}


/* =====================================================
   CLASS COUNT
===================================================== */

function getClassCount(c){

return allStudents.filter(s=>{

const found=
findClass(s.class);

return found===c;

}).length;

}


/* =====================================================
   SELECT CLASS
===================================================== */

function selectClass(index){

const c=
classes[index];

selectedClass=c.bn;

renderClasses();

updateSelectedInfo();

loadStudents();

}


/* =====================================================
   SELECTED INFO
===================================================== */

function updateSelectedInfo(){

const info=
document.getElementById("selectedInfo");

const t=
text[currentLanguage];


if(!selectedSession &&
!selectedClass){

info.textContent=t.selectBoth;

return;

}


let className="";


const c=
findClass(selectedClass);

if(c){

className=
currentLanguage==="bn"
?c.bn
:c.en;

}


if(selectedSession &&
className){

info.textContent=
`📌 ${className} • ${selectedSession}`;

}

else if(selectedSession){

info.textContent=
`📅 ${selectedSession}`;

}

else{

info.textContent=
`🎓 ${className}`;

}

}

   AUTH + START

try{

data:{
session
}
}=await db.auth.getSession();

location.href="admin.html";

/* IMPORTANT:

}catch(error){

console.error(
"START ERROR:",
error
);

error.message
);

/* =====================================================
   LOAD ALL STUDENTS
===================================================== */

async function loadAllStudents(){

console.log(
"Loading students..."
);


/*
   select("*") ব্যবহার করা হয়েছে।
   এতে কোনো একটি column-এর নাম সামান্য
   আলাদা হলেও পুরো query fail করবে না।
*/

const {
data,
error
}=await db
.from("students")
.select("*")
.order("id",{ascending:true});


if(error){

console.error(
"STUDENT LOAD ERROR:",
error
);

showError(error.message);

return;

}


console.log(
"Students received:",
data
);


allStudents=
(data||[]).map(row=>{

/*
   বিভিন্ন সম্ভাব্য column name support
*/

return {

...row,

id:
row.id,

name:
row.name ??
row.student_name ??
row.full_name ??
"",

roll:
row.roll ??
row.roll_no ??
row.roll_number ??
"",

student_id:
row.student_id ??
row.studentId ??
row.studentid ??
row.id_number ??
"",

class:
row.class ??
row.class_name ??
row.className ??
"",

session:
row.session ??
row.session_name ??
row.sessionName ??
""

};

});


console.log(
"Normalized students:",
allStudents
);


updateStats();

renderClasses();

}


/* =====================================================
   LOAD SESSION
===================================================== */

async function loadSessions(){

const select=
document.getElementById(
"sessionSelect"
);


const t=
text[currentLanguage];


select.innerHTML=`

<option value="">
${t.selectSession}
</option>

`;


const sessions=
[
...new Set(
allStudents
.map(s=>String(s.session||"").trim())
.filter(Boolean)
)
];


sessions.sort(
(a,b)=>
b.localeCompare(
a,
undefined,
{
numeric:true
}
)
);


sessions.forEach(session=>{

const option=
document.createElement("option");

option.value=session;

option.textContent=session;

select.appendChild(option);

});


if(selectedSession){

select.value=
selectedSession;

}

}

   SESSION CHANGE
===================================================== */

document
.getElementById("sessionSelect")
.addEventListener(
"change",
function(){

selectedSession=
this.value.trim();

updateSelectedInfo();

loadStudents();

updateStats();

}
);


/* =====================================================
   LOAD SELECTED STUDENTS
===================================================== */

async function loadStudents(){

const tbody=
document.getElementById(
"studentList"
);

const t=
text[currentLanguage];


if(!selectedSession ||
!selectedClass){

students=[];

tbody.innerHTML=`

<tr>

<td
colspan="5"
class="empty">

${t.selectBoth}

</td>

</tr>

`;

document.getElementById(
"studentCount"
).textContent="0";

updateStats();

return;

}


tbody.innerHTML=`

<tr>

<td
colspan="5"
class="loading">

${t.loading}

</td>

</tr>

`;


const selected=
findClass(selectedClass);


if(!selected){

students=[];

renderStudents();

return;

}


/*
   এখানে Supabase .eq/.in না করে
   allStudents-এর data filter করা হচ্ছে।

   এর ফলে class value:
   ১ম শ্রেণি
   Class 1
   1
   ইত্যাদি হলেও match করবে।
*/

students=
allStudents.filter(s=>{

const sessionMatch=
normalize(s.session)===
normalize(selectedSession);


const classMatch=
findClass(s.class)===selected;


return sessionMatch &&
classMatch;

});


console.log(
"Selected class:",
selected,

"Selected session:",
selectedSession,

"Students:",
students
);


renderStudents();

updateStats();

}


/* =====================================================
   RENDER STUDENTS
===================================================== */

function renderStudents(){

const tbody=
document.getElementById(
"studentList"
);

const t=
text[currentLanguage];


const q=
normalize(
document.getElementById(
"search"
).value
);


let list=
students.filter(s=>{

if(!q)
return true;


return (

normalize(s.name)
.includes(q)

||

normalize(s.roll)
.includes(q)

||

normalize(s.student_id)
.includes(q)

);

});


document.getElementById(
"studentCount"
).textContent=
list.length;


if(!list.length){

tbody.innerHTML=`

<tr>

<td
colspan="5"
class="empty">

${t.noStudent}

</td>

</tr>

`;

return;

}


tbody.innerHTML=
list.map(s=>{

const c=
findClass(s.class);


const className=
c
?
(
currentLanguage==="bn"
?c.bn
:c.en
)
:
(s.class||"-");


return `

<tr>

<td>

<strong>

${escapeHtml(
s.name||"-"
)}

</strong>

</td>


<td>

<span class="badge">

${escapeHtml(
s.roll||"-"
)}

</span>

</td>


<td>

${escapeHtml(
s.student_id||"-"
)}

</td>


<td>

${escapeHtml(
className
)}

</td>


<td>

${escapeHtml(
s.session||"-"
)}

</td>

</tr>

`;

}).join("");

}


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("search")
.addEventListener(
"input",
renderStudents
);


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

document.getElementById(
"totalClasses"
).textContent=
classes.length;


document.getElementById(
"totalStudents"
).textContent=
allStudents.length;


let count=0;


if(selectedSession){

count=
allStudents.filter(s=>

normalize(s.session)===
normalize(selectedSession)

).length;

}


document.getElementById(
"selectedSessionCount"
).textContent=
count;

}


/* =====================================================
   REFRESH
===================================================== */

async function refreshData(){

const btn=
document.getElementById(
"refreshBtn"
);

btn.disabled=true;


try{

await loadAllStudents();

await loadSessions();

if(
selectedSession &&
selectedClass
){

await loadStudents();

}

renderClasses();

updateStats();

}catch(error){

console.error(
"REFRESH ERROR:",
error
);

showError(
error.message
);

}finally{

btn.disabled=false;

}

}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

const tbody=
document.getElementById(
"studentList"
);

tbody.innerHTML=`

<tr>

<td
colspan="5"
class="empty error">

❌ ${escapeHtml(message)}

</td>

</tr>

`;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* =====================================================
   START
===================================================== */

start();

</script>

</html>

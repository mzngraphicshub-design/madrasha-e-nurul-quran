<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Classes | মাদরাসায়ে নূরুল কুরআন</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

/* ================================
   TOP HEADER
================================ */

.top{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 3px 15px #0002;
}

.top h2{
    margin:0;
    font-size:20px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.top a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

.top a:hover{
    text-decoration:underline;
}

/* ================================
   LANGUAGE
================================ */

.lang{
    display:flex;
    background:#ffffff22;
    padding:3px;
    border-radius:8px;
}

.lang button{
    border:0;
    background:transparent;
    color:#fff;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.lang button.active{
    background:#fff;
    color:#0d47a1;
}

/* ================================
   CONTAINER
================================ */

.container{
    max-width:1150px;
    margin:25px auto;
    padding:0 15px;
}

/* ================================
   BOX
================================ */

.box{
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 3px 15px #0d47a115;
    margin-bottom:20px;
    border:1px solid #e5eaf2;
}

h3{
    margin:0 0 18px;
    color:#0d47a1;
}

/* ================================
   FILTERS
================================ */

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #d8dee9;
    border-radius:8px;
    font-size:14px;
    outline:none;
    background:#fff;
}

select:focus,
input:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d215;
}

/* ================================
   ACTION ROW
================================ */

.action-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.refresh-btn{
    border:0;
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.refresh-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 12px #0d47a125;
}

.refresh-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ================================
   STATISTICS
================================ */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border:1px solid #e5eaf2;
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 12px #0d47a110;
    position:relative;
    overflow:hidden;
}

.stat::after{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    right:-20px;
    top:-20px;
    border-radius:50%;
    background:#1976d212;
}

.stat-icon{
    font-size:25px;
    margin-bottom:5px;
}

.stat-label{
    font-size:13px;
    color:#64748b;
    margin-bottom:5px;
}

.stat-number{
    font-size:25px;
    font-weight:bold;
    color:#0d47a1;
}

/* ================================
   CLASS GRID
================================ */

.class-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.class-card{
    background:#fff;
    border:1px solid #dce5f2;
    border-radius:13px;
    padding:20px 15px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 2px 8px #0000000a;
    position:relative;
    overflow:hidden;
}

.class-card:hover{
    transform:translateY(-3px);
    border-color:#1976d2;
    box-shadow:0 6px 18px #1976d225;
}

.class-card.active{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    border-color:#0d47a1;
}

.class-icon{
    font-size:28px;
    margin-bottom:8px;
}

.class-bn{
    font-size:16px;
    font-weight:bold;
}

.class-en{
    font-size:13px;
    margin-top:5px;
    opacity:.75;
}

.class-card.active .class-en{
    opacity:1;
}

.class-count{
    margin-top:10px;
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.class-card.active .class-count{
    background:#ffffff25;
    color:#fff;
}

/* ================================
   SEARCH
================================ */

.search{
    margin-bottom:15px;
}

/* ================================
   TABLE
================================ */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

th,
td{
    padding:11px 9px;
    border-bottom:1px solid #edf0f5;
    text-align:left;
    font-size:14px;
}

th{
    background:#0d47a1;
    color:#fff;
}

tr:hover td{
    background:#f7faff;
}

/* ================================
   BADGE
================================ */

.badge{
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.count{
    color:#1976d2;
    font-weight:bold;
}

/* ================================
   STATUS
================================ */

.loading,
.empty{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.error{
    color:#dc2626;
    background:#fef2f2;
    padding:12px;
    border-radius:8px;
}

/* ================================
   SELECTED CLASS INFO
================================ */

.selected-info{
    margin-top:15px;
    padding:12px 14px;
    border-radius:9px;
    background:#eaf4ff;
    border:1px solid #d7eaff;
    color:#0d47a1;
    font-size:14px;
    font-weight:bold;
}

/* ================================
   MOBILE
================================ */

@media(max-width:800px){

    .class-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:600px){

    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .top-right{
        width:100%;
        justify-content:space-between;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .class-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .class-card{
        padding:16px 8px;
    }

    .class-icon{
        font-size:24px;
    }

    .class-bn{
        font-size:14px;
    }

    .class-en{
        font-size:11px;
    }

    .stats{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<!-- =================================
     HEADER
================================= -->

<header class="top">

<h2 id="pageTitle">
📚 শ্রেণি ব্যবস্থাপনা
</h2>

<div class="top-right">

<div class="lang">

<button
id="bnBtn"
class="active"
onclick="setLanguage('bn')">

বাংলা

</button>

<button
id="enBtn"
onclick="setLanguage('en')">

English

</button>

</div>

<a
href="dashboard.html"
id="dashboardLink">

← Dashboard

</a>

</div>

</header>


<div class="container">


<!-- =================================
     STATISTICS
================================= -->

<div class="stats">

<div class="stat">

<div class="stat-icon">
🎓
</div>

<div
class="stat-label"
id="totalClassLabel">

মোট শ্রেণি

</div>

<div
class="stat-number"
id="totalClasses">

8

</div>

</div>


<div class="stat">

<div class="stat-icon">
👨‍🎓
</div>

<div
class="stat-label"
id="totalStudentLabel">

মোট শিক্ষার্থী

</div>

<div
class="stat-number"
id="totalStudents">

0

</div>

</div>


<div class="stat">

<div class="stat-icon">
📅
</div>

<div
class="stat-label"
id="selectedSessionLabel">

Selected Session

</div>

<div
class="stat-number"
id="selectedSessionCount">

0

</div>

</div>

</div>


<!-- =================================
     SESSION
================================= -->

<div class="box">

<h3 id="sessionTitle">
📅 Session নির্বাচন করুন
</h3>

<div class="filters">

<div>

<label id="sessionLabel">
Session
</label>

<select id="sessionSelect">

<option value="">
Session নির্বাচন করুন
</option>

</select>

</div>


<div>

<label id="searchLabel">
Student Search
</label>

<input
id="search"
placeholder="🔍 নাম / রোল / ID দিয়ে খুঁজুন..."
>

</div>

</div>


<div class="action-row">

<div
id="selectedInfo"
class="selected-info">

📌 প্রথমে Session ও Class নির্বাচন করুন

</div>

<button
class="refresh-btn"
id="refreshBtn"
onclick="refreshData()">

🔄 Refresh

</button>

</div>

</div>


<!-- =================================
     CLASS
================================= -->

<div class="box">

<h3 id="classTitle">
🎓 শ্রেণি নির্বাচন করুন
</h3>

<div
class="class-grid"
id="classGrid">

</div>

</div>


<!-- =================================
     STUDENTS
================================= -->

<div class="box">

<h3>

<span id="studentTitle">
👨‍🎓 শিক্ষার্থী তালিকা
</span>

<span class="count">

(
<span id="studentCount">
0
</span>
)

</span>

</h3>


<div class="table-wrap">

<table>

<thead>

<tr>

<th id="thName">
নাম
</th>

<th id="thRoll">
রোল
</th>

<th id="thId">
Student ID
</th>

<th id="thClass">
Class
</th>

<th id="thSession">
Session
</th>

</tr>

</thead>


<tbody id="studentList">

<tr>

<td
colspan="5"
class="loading">

Session এবং Class নির্বাচন করুন

</td>

</tr>

</tbody>

</table>

</div>

</div>


</div>


<!-- =================================
     SUPABASE
================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================
   VARIABLES
===================================== */

let students = [];

let allStudents = [];

let currentLanguage = "bn";

let selectedClass = "";

let selectedSession = "";


/* =====================================
   CLASSES
===================================== */

const classes = [

{
    bn:"নূরানী",
    en:"Nurani"
},

{
    bn:"১ম শ্রেণি",
    en:"Class 1"
},

{
    bn:"২য় শ্রেণি",
    en:"Class 2"
},

{
    bn:"৩য় শ্রেণি",
    en:"Class 3"
},

{
    bn:"৪র্থ শ্রেণি",
    en:"Class 4"
},

{
    bn:"৫ম শ্রেণি",
    en:"Class 5"
},

{
    bn:"নাজেরা",
    en:"Najera"
},

{
    bn:"হিফজ",
    en:"Hifaz"
}

];


/* =====================================
   TEXT
===================================== */

const text = {

bn:{

pageTitle:"📚 শ্রেণি ব্যবস্থাপনা",

totalClass:"মোট শ্রেণি",

totalStudent:"মোট শিক্ষার্থী",

selectedSession:"Selected Session",

sessionTitle:"📅 Session নির্বাচন করুন",

sessionLabel:"Session",

searchLabel:"Student Search",

searchPlaceholder:"🔍 নাম / রোল / ID দিয়ে খুঁজুন...",

classTitle:"🎓 শ্রেণি নির্বাচন করুন",

studentTitle:"👨‍🎓 শিক্ষার্থী তালিকা",

name:"নাম",

roll:"রোল",

id:"Student ID",

class:"Class",

session:"Session",

selectSession:"Session নির্বাচন করুন",

selectBoth:"📌 প্রথমে Session ও Class নির্বাচন করুন",

loading:"Loading...",

noStudent:"এই Session ও Class-এ কোনো শিক্ষার্থী নেই",

dashboard:"← Dashboard",

refresh:"🔄 Refresh",

selected:"Selected",

students:"শিক্ষার্থী",

error:"তথ্য লোড করতে সমস্যা হয়েছে।"

},

en:{

pageTitle:"📚 Class Management",

totalClass:"Total Classes",

totalStudent:"Total Students",

selectedSession:"Selected Session",

sessionTitle:"📅 Select Session",

sessionLabel:"Session",

searchLabel:"Student Search",

searchPlaceholder:"🔍 Search by name / roll / ID...",

classTitle:"🎓 Select Class",

studentTitle:"👨‍🎓 Student List",

name:"Name",

roll:"Roll",

id:"Student ID",

class:"Class",

session:"Session",

selectSession:"Select Session",

selectBoth:"📌 Select Session and Class first",

loading:"Loading...",

noStudent:"No students found for this Session and Class",

dashboard:"← Dashboard",

refresh:"🔄 Refresh",

selected:"Selected",

students:"Students",

error:"Unable to load data."

}

};


/* =====================================
   LANGUAGE
===================================== */

function setLanguage(lang){

currentLanguage = lang;

document.documentElement.lang =
lang === "bn" ? "bn" : "en";

const t = text[lang];


document.getElementById("pageTitle")
.textContent=t.pageTitle;

document.getElementById("totalClassLabel")
.textContent=t.totalClass;

document.getElementById("totalStudentLabel")
.textContent=t.totalStudent;

document.getElementById("selectedSessionLabel")
.textContent=t.selectedSession;

document.getElementById("sessionTitle")
.textContent=t.sessionTitle;

document.getElementById("sessionLabel")
.textContent=t.sessionLabel;

document.getElementById("searchLabel")
.textContent=t.searchLabel;

document.getElementById("search")
.placeholder=t.searchPlaceholder;

document.getElementById("classTitle")
.textContent=t.classTitle;

document.getElementById("studentTitle")
.textContent=t.studentTitle;

document.getElementById("thName")
.textContent=t.name;

document.getElementById("thRoll")
.textContent=t.roll;

document.getElementById("thId")
.textContent=t.id;

document.getElementById("thClass")
.textContent=t.class;

document.getElementById("thSession")
.textContent=t.session;

document.getElementById("dashboardLink")
.textContent=t.dashboard;

document.getElementById("refreshBtn")
.textContent=t.refresh;


document.getElementById("bnBtn")
.classList.toggle(
"active",
lang==="bn"
);

document.getElementById("enBtn")
.classList.toggle(
"active",
lang==="en"
);


loadSessions();

renderClasses();

renderStudents();

updateSelectedInfo();

}


/* =====================================
   RENDER CLASS CARDS
===================================== */

function renderClasses(){

const grid =
document.getElementById("classGrid");


grid.innerHTML =
classes.map((c,index)=>{

const count =
getClassCount(c);


const active =
selectedClass===c.bn ||
selectedClass===c.en;


return `

<div
class="class-card ${active?"active":""}"
onclick="selectClass(${index})">

<div class="class-icon">
🎓
</div>

<div class="class-bn">
${c.bn}
</div>

<div class="class-en">
${c.en}
</div>

<div class="class-count">

👨‍🎓 ${count}
${text[currentLanguage].students}

</div>

</div>

`;

}).join("");

}


/* =====================================
   CLASS COUNT
===================================== */

function getClassCount(classObject){

return allStudents.filter(s=>

s.class===classObject.bn ||
s.class===classObject.en

).length;

}


/* =====================================
   SELECT CLASS
===================================== */

function selectClass(index){

const c =
classes[index];


selectedClass =
currentLanguage==="bn"
?c.bn
:c.en;


renderClasses();

updateSelectedInfo();

loadStudents();

}


/* =====================================
   UPDATE SELECTED INFO
===================================== */

function updateSelectedInfo(){

const info =
document.getElementById("selectedInfo");


const t =
text[currentLanguage];


if(!selectedSession &&
!selectedClass){

info.textContent=
t.selectBoth;

return;

}


let className =
selectedClass;


const found =
classes.find(c=>
c.bn===selectedClass ||
c.en===selectedClass
);


if(found){

className =
currentLanguage==="bn"
?found.bn
:found.en;

}


if(selectedSession &&
selectedClass){

info.textContent=
`📌 ${className} • ${selectedSession}`;

}

else if(selectedSession){

info.textContent=
`📅 ${selectedSession}`;

}

else{

info.textContent=
`🎓 ${className}`;

}

}


/* =====================================
   AUTH
===================================== */

async function start(){

try{

const {

data:{session}

}=await db.auth.getSession();


if(!session){

location.href="admin.html";

return;

}


await loadAllStudents();

await loadSessions();

renderClasses();

updateStats();

}catch(error){

console.error(error);

}

}


/* =====================================
   LOAD ALL STUDENTS
===================================== */

async function loadAllStudents(){

const {data,error}=

await db

.from("students")

.select(`
id,
name,
roll,
student_id,
class,
session
`);


if(error){

console.error(error);

return;

}


allStudents =
data || [];


updateStats();

renderClasses();

}


/* =====================================
   LOAD SESSIONS
===================================== */

async function loadSessions(){

const select =
document.getElementById(
"sessionSelect"
);


const t =
text[currentLanguage];


select.innerHTML=

`
<option value="">
${t.selectSession}
</option>
`;


const sessions=[

...new Set(

allStudents

.map(x=>x.session)

.filter(Boolean)

)

];


sessions.sort().reverse();


sessions.forEach(session=>{

const option =
document.createElement("option");


option.value=session;

option.textContent=session;


select.appendChild(option);

});


if(selectedSession){

select.value =
selectedSession;

}

}


/* =====================================
   SESSION CHANGE
===================================== */

document
.getElementById("sessionSelect")
.addEventListener(
"change",
function(){

selectedSession =
this.value;


updateSelectedInfo();

loadStudents();

updateStats();

});


/* =====================================
   LOAD STUDENTS
===================================== */

async function loadStudents(){

const tbody =
document.getElementById(
"studentList"
);


const t =
text[currentLanguage];


if(!selectedSession ||
!selectedClass){

students=[];


tbody.innerHTML=

`
<tr>

<td
colspan="5"
class="empty">

${t.selectBoth}

</td>

</tr>
`;


document.getElementById(
"studentCount"
).textContent="0";


updateStats();

return;

}


tbody.innerHTML=

`
<tr>

<td
colspan="5"
class="loading">

${t.loading}

</td>

</tr>
`;


const selected =
classes.find(c=>

c.bn===selectedClass ||
c.en===selectedClass

);


if(!selected){

students=[];

return;

}


const classNames=[

selected.bn,

selected.en

];


const {data,error}=

await db

.from("students")

.select(`
id,
name,
roll,
student_id,
class,
session
`)

.eq(
"session",
selectedSession
)

.in(
"class",
classNames
);


if(error){

console.error(error);


tbody.innerHTML=

`
<tr>

<td
colspan="5"
class="empty error">

❌ ${escapeHtml(
error.message
)}

</td>

</tr>
`;


return;

}


students =
data || [];


renderStudents();

updateStats();

}


/* =====================================
   RENDER STUDENTS
===================================== */

function renderStudents(){

const tbody =
document.getElementById(
"studentList"
);


const t =
text[currentLanguage];


const q =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


let list =
students.filter(s=>{

if(!q)return true;


return(

String(s.name||"")
.toLowerCase()
.includes(q)

||

String(s.roll||"")
.toLowerCase()
.includes(q)

||

String(s.student_id||"")
.toLowerCase()
.includes(q)

);

});


document.getElementById(
"studentCount"
).textContent=list.length;


if(!list.length){

tbody.innerHTML=

`
<tr>

<td
colspan="5"
class="empty">

${t.noStudent}

</td>

</tr>
`;

return;

}


tbody.innerHTML=

list.map(s=>`

<tr>

<td>

<strong>

${escapeHtml(
s.name||"-"
)}

</strong>

</td>


<td>

<span class="badge">

${escapeHtml(
s.roll||"-"
)}

</span>

</td>


<td>

${escapeHtml(
s.student_id||"-"
)}

</td>


<td>

${escapeHtml(
getClassName(s.class)
)}

</td>


<td>

${escapeHtml(
s.session||"-"
)}

</td>

</tr>

`).join("");

}


/* =====================================
   CLASS NAME
===================================== */

function getClassName(value){

const c =
classes.find(x=>

x.bn===value ||
x.en===value

);


if(!c){

return value||"-";

}


return currentLanguage==="bn"
?c.bn
:c.en;

}


/* =====================================
   SEARCH
===================================== */

document
.getElementById("search")
.addEventListener(
"input",
renderStudents
);


/* =====================================
   UPDATE STATS
===================================== */

function updateStats(){

document.getElementById(
"totalClasses"
).textContent =
classes.length;


document.getElementById(
"totalStudents"
).textContent =
allStudents.length;


let sessionCount=0;


if(selectedSession){

sessionCount =
allStudents.filter(s=>

s.session===selectedSession

).length;

}


document.getElementById(
"selectedSessionCount"
).textContent =
sessionCount;

}


/* =====================================
   REFRESH
===================================== */

async function refreshData(){

const btn =
document.getElementById(
"refreshBtn"
);


btn.disabled=true;


try{

await loadAllStudents();

await loadSessions();

if(selectedSession &&
selectedClass){

await loadStudents();

}

renderClasses();

updateStats();

}catch(error){

console.error(error);

}finally{

btn.disabled=false;

}

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* =====================================
   START
===================================== */

start();

</script>

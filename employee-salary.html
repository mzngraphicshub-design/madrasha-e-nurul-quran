<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Salary | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#222}
.top{background:#075c43;color:#fff;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0;color:#fff;font-size:20px}
.top a{color:#fff;text-decoration:none}
.container{max-width:1150px;margin:25px auto;padding:0 15px}
.box{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:20px}
h3{color:#075c43;margin-bottom:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{font-weight:bold;font-size:14px}
input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #ddd;border-radius:7px;font-size:14px}
button{border:0;padding:10px 16px;border-radius:7px;background:#087f5b;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.cancel{background:#777;margin-left:7px}
.edit{background:#1565c0}
.delete{background:#c62828}
.search{margin-bottom:15px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
th{background:#075c43;color:#fff}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:#eee;padding:12px 18px;border-radius:8px;font-weight:bold}
#msg{margin-top:12px;min-height:20px}
.loading{text-align:center;padding:20px}

@media(max-width:650px){
.form{grid-template-columns:1fr}
.full{grid-column:auto}
table{min-width:900px}
}
</style>
</head>

<body>

<header class="top">
<h2>👨‍💼 Employee Salary</h2>
<a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="box">

<h3 id="formTitle">➕ Add Employee Salary</h3>

<form id="salaryForm">

<input type="hidden" id="editId">

<div>
<label>Employee *</label>
<select id="employeeId" required>
<option value="">Employee নির্বাচন করুন</option>
</select>
</div>

<div>
<label>Salary Month *</label>
<input type="month" id="salaryMonth" required>
</div>

<div>
<label>Salary Amount *</label>
<input type="number" id="amount" min="0" step="0.01" required placeholder="যেমন: 12000">
</div>

<div>
<label>Paid Amount *</label>
<input type="number" id="paidAmount" min="0" step="0.01" required placeholder="যেমন: 12000">
</div>

<div>
<label>Payment Date</label>
<input type="date" id="paymentDate">
</div>

<div>
<label>Payment Method</label>
<select id="method">
<option value="Cash">Cash</option>
<option value="bKash">bKash</option>
<option value="Nagad">Nagad</option>
<option value="Bank">Bank</option>
</select>
</div>

<div class="full">

<button type="submit" id="saveBtn">
💾 Save Salary
</button>

<button type="button" class="cancel" id="cancelBtn" style="display:none">
Cancel
</button>

<div id="msg"></div>

</div>

</form>

</div>


<div class="box">

<h3>💰 Employee Salary Collection</h3>

<div class="summary">

<div class="card">
Total Salary:
<span id="totalSalary">0.00</span>
</div>

<div class="card">
Paid:
<span id="totalPaid">0.00</span>
</div>

<div class="card">
Due:
<span id="totalDue">0.00</span>
</div>

</div>

<input
class="search"
id="search"
placeholder="🔍 Employee name / ID / mobile দিয়ে খুঁজুন..."
>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Employee</th>
<th>Employee ID</th>
<th>Month</th>
<th>Salary</th>
<th>Paid</th>
<th>Due</th>
<th>Date</th>
<th>Method</th>
<th>Action</th>
</tr>
</thead>

<tbody id="salaryList">

<tr>
<td colspan="9" class="loading">
Loading...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let employees=[];
let salaries=[];


function today(){
return new Date().toISOString().split("T")[0];
}

document.getElementById("paymentDate").value=today();


async function start(){

try{

const {
data:{session}
}=await db.auth.getSession();

if(!session){
location.href="admin.html";
return;
}

await Promise.all([
loadEmployees(),
loadSalaries()
]);

}catch(error){

document.getElementById("salaryList").innerHTML=
`<tr>
<td colspan="9">
❌ ${escapeHtml(error.message)}
</td>
</tr>`;

}

}


/* LOAD EMPLOYEES */

async function loadEmployees(){

const select=
document.getElementById("employeeId");

select.innerHTML=
`<option value="">
Employee নির্বাচন করুন
</option>`;

const {data,error}=await db
.from("employees")
.select("id,employee_id,name,phone")
.order("name");

if(error){

document.getElementById("msg").textContent=
"❌ Employee load error: "+error.message;

return;
}

employees=data||[];

const fragment=
document.createDocumentFragment();

employees.forEach(e=>{

const option=
document.createElement("option");

option.value=e.id;

option.textContent=
`${e.employee_id ? e.employee_id+" - " : ""}${e.name || ""}${e.phone ? " - "+e.phone : ""}`;

fragment.appendChild(option);

});

select.appendChild(fragment);

}


/* LOAD SALARIES */

async function loadSalaries(){

const tbody=
document.getElementById("salaryList");

tbody.innerHTML=
`<tr>
<td colspan="9" class="loading">
Loading...
</td>
</tr>`;

const {data,error}=await db
.from("employee_salaries")
.select(`
id,
employee_id,
salary_month,
amount,
paid_amount,
payment_date,
payment_method,
employees(
employee_id,
name,
phone
)
`)
.order("payment_date",{ascending:false});

if(error){

tbody.innerHTML=
`<tr>
<td colspan="9">
❌ ${escapeHtml(error.message)}
</td>
</tr>`;

return;
}

salaries=data||[];

render(salaries);

}


/* RENDER */

function render(list){

let totalSalary=0;
let totalPaid=0;

list.forEach(s=>{

totalSalary+=Number(s.amount)||0;
totalPaid+=Number(s.paid_amount)||0;

});

document.getElementById("totalSalary").textContent=
totalSalary.toFixed(2);

document.getElementById("totalPaid").textContent=
totalPaid.toFixed(2);

document.getElementById("totalDue").textContent=
(totalSalary-totalPaid).toFixed(2);


const tbody=
document.getElementById("salaryList");

if(!list.length){

tbody.innerHTML=
`<tr>
<td colspan="9" style="text-align:center">
কোনো Employee Salary record নেই
</td>
</tr>`;

return;
}


tbody.innerHTML=list.map(s=>{

const amount=Number(s.amount)||0;
const paid=Number(s.paid_amount)||0;
const due=amount-paid;

return `

<tr>

<td>
${escapeHtml(s.employees?.name||"-")}
${s.employees?.phone ?
"<br><small>"+escapeHtml(s.employees.phone)+"</small>"
:""}
</td>

<td>
${escapeHtml(s.employees?.employee_id||"-")}
</td>

<td>
${escapeHtml(s.salary_month||"-")}
</td>

<td>
${amount.toFixed(2)}
</td>

<td>
${paid.toFixed(2)}
</td>

<td>
${due.toFixed(2)}
</td>

<td>
${escapeHtml(s.payment_date||"-")}
</td>

<td>
${escapeHtml(s.payment_method||"-")}
</td>

<td>

<button
class="edit"
onclick="editSalary('${s.id}')">
Edit
</button>

<button
class="delete"
onclick="deleteSalary('${s.id}')">
Delete
</button>

</td>

</tr>

`;

}).join("");

}


/* SAVE / UPDATE */

document.getElementById("salaryForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const editId=
document.getElementById("editId").value;

const amount=
Number(document.getElementById("amount").value);

const paid=
Number(document.getElementById("paidAmount").value);

if(paid>amount){

alert(
"Paid Amount Salary Amount-এর চেয়ে বেশি হতে পারবে না।"
);

return;
}


const record={

employee_id:
document.getElementById("employeeId").value,

salary_month:
document.getElementById("salaryMonth").value,

amount:amount,

paid_amount:paid,

payment_date:
document.getElementById("paymentDate").value||null,

payment_method:
document.getElementById("method").value

};


const msg=
document.getElementById("msg");

const saveBtn=
document.getElementById("saveBtn");

msg.textContent="Saving...";

saveBtn.disabled=true;


try{

let result;


if(editId){

result=await db
.from("employee_salaries")
.update(record)
.eq("id",editId)
.select(`
id,
employee_id,
salary_month,
amount,
paid_amount,
payment_date,
payment_method,
employees(
employee_id,
name,
phone
)
`)
.single();

}else{

result=await db
.from("employee_salaries")
.insert(record)
.select(`
id,
employee_id,
salary_month,
amount,
paid_amount,
payment_date,
payment_method,
employees(
employee_id,
name,
phone
)
`)
.single();

}


if(result.error){

msg.textContent=
"❌ "+result.error.message;

return;
}


if(editId){

const index=
salaries.findIndex(
x=>String(x.id)===String(editId)
);

if(index!==-1){
salaries[index]=result.data;
}

}else{

salaries.unshift(result.data);

}

render(salaries);

msg.textContent=
"✅ Saved successfully";

resetForm();


}catch(error){

msg.textContent=
"❌ "+error.message;

}finally{

saveBtn.disabled=false;

}

});


/* EDIT */

function editSalary(id){

const s=
salaries.find(
x=>String(x.id)===String(id)
);

if(!s)return;


document.getElementById("editId").value=s.id;

document.getElementById("employeeId").value=
s.employee_id||"";

document.getElementById("salaryMonth").value=
s.salary_month||"";

document.getElementById("amount").value=
s.amount||0;

document.getElementById("paidAmount").value=
s.paid_amount||0;

document.getElementById("paymentDate").value=
s.payment_date||"";

document.getElementById("method").value=
s.payment_method||"Cash";


document.getElementById("formTitle").textContent=
"✏️ Edit Employee Salary";

document.getElementById("saveBtn").textContent=
"💾 Update Salary";

document.getElementById("cancelBtn").style.display=
"inline-block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* DELETE */

async function deleteSalary(id){

if(!confirm(
"এই Employee Salary record Delete করতে চান?"
))return;


try{

const {error}=await db
.from("employee_salaries")
.delete()
.eq("id",id);

if(error){

alert(error.message);
return;

}

salaries=
salaries.filter(
s=>String(s.id)!==String(id)
);

render(salaries);


}catch(error){

alert(error.message);

}

}


/* RESET */

function resetForm(){

document.getElementById("salaryForm").reset();

document.getElementById("editId").value="";

document.getElementById("paymentDate").value=today();

document.getElementById("formTitle").textContent=
"➕ Add Employee Salary";

document.getElementById("saveBtn").textContent=
"💾 Save Salary";

document.getElementById("cancelBtn").style.display=
"none";

}

document.getElementById("cancelBtn").onclick=
resetForm;


/* SEARCH */

document.getElementById("search")
.addEventListener("input",function(){

const q=
this.value.toLowerCase().trim();

const filtered=
salaries.filter(s=>

(s.employees?.name||"")
.toLowerCase()
.includes(q)

||

(s.employees?.employee_id||"")
.toLowerCase()
.includes(q)

||

(s.employees?.phone||"")
.toLowerCase()
.includes(q)

);

render(filtered);

});


/* ESCAPE HTML */

function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


start();

</script>

</body>
</html>

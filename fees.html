<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>
Student Fees | মাদরাসায়ে নূরুল কুরআন
</title>


<style>

/* =========================================
   HOME WEBSITE THEME
========================================= */

:root{

    --primary:#006a4e;
    --primary-dark:#00523d;
    --primary-light:#e8f5f1;

    --secondary:#f4c430;

    --bg:#f5f8f7;

    --white:#ffffff;

    --text:#202124;

    --muted:#6b7280;

    --border:#dfe7e4;

    --danger:#d32f2f;

    --danger-light:#ffebee;

    --blue:#1565c0;

}


/* =========================================
   BASIC
========================================= */

*{
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{

    margin:0;

    background:var(--bg);

    color:var(--text);

    font-family:

        "Noto Sans Bengali",

        "Noto Sans",

        Arial,

        sans-serif;

    font-size:16px;

}


/* =========================================
   HEADER
========================================= */

.top{

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary)
        );

    color:white;

    min-height:58px;

    padding:13px 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:
        0 2px 8px rgba(0,0,0,.12);

}


.top h2{

    margin:0;

    color:#fff;

    font-size:20px;

    font-weight:700;

}


.top a{

    color:#fff;

    text-decoration:none;

    font-size:15px;

    font-weight:600;

}


.top a:hover{
    text-decoration:underline;
}



/* =========================================
   CONTAINER
========================================= */

.container{

    width:100%;

    max-width:1150px;

    margin:22px auto;

    padding:0 15px;

}


/* =========================================
   BOX
========================================= */

.box{

    background:var(--white);

    border-radius:13px;

    padding:21px;

    margin-bottom:20px;

    box-shadow:
        0 2px 12px rgba(0,0,0,.07);

    border:1px solid #edf1ef;

}


h3{

    margin:0 0 17px;

    color:var(--primary-dark);

    font-size:20px;

    font-weight:700;

}



/* =========================================
   FILTER AREA
========================================= */

.filter{

    background:var(--primary-light);

    border:1px solid #d5ebe4;

    border-radius:10px;

    padding:15px;

}


.filter-title{

    margin-bottom:13px;

    font-weight:700;

    color:var(--primary-dark);

}



/* =========================================
   FORM
========================================= */

.form{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;

}


.full{

    grid-column:
        1 / -1;

}


label{

    display:block;

    font-size:15px;

    font-weight:700;

    color:#303633;

}


input,
select{

    width:100%;

    min-height:48px;

    padding:11px 12px;

    margin-top:6px;

    border:

        1px solid
        var(--border);

    border-radius:8px;

    background:#fff;

    color:#222;

    font-size:16px;

    font-family:inherit;

}


input:focus,
select:focus{

    outline:none;

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(0,106,78,.10);

}


select:disabled{

    background:#f0f2f2;

    color:#888;

}


input::placeholder{

    color:#8b9190;

    font-size:15px;

}


.note{

    margin-top:6px;

    color:var(--muted);

    font-size:13px;

    line-height:1.5;

}



/* =========================================
   BUTTON
========================================= */

button{

    border:0;

    border-radius:8px;

    padding:11px 17px;

    background:var(--primary);

    color:#fff;

    font-family:inherit;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;

}


button:hover{

    background:
        var(--primary-dark);

}


button:disabled{

    opacity:.55;

    cursor:not-allowed;

}


.cancel{

    background:#777;

    margin-left:6px;

}


.cancel:hover{
    background:#555;
}


.edit{

    background:var(--blue);

    margin-right:4px;

}


.edit:hover{
    background:#0d47a1;
}


.delete{

    background:var(--danger);

}


.delete:hover{
    background:#b71c1c;
}



/* =========================================
   MESSAGE
========================================= */

#msg{

    min-height:22px;

    margin-top:10px;

    font-size:14px;

    font-weight:600;

}


.msg-ok{
    color:var(--primary);
}


.msg-error{
    color:var(--danger);
}



/* =========================================
   SUMMARY
========================================= */

.summary{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:16px;

}


.card{

    background:var(--primary-light);

    color:var(--primary-dark);

    border:1px solid #d5ebe4;

    padding:11px 15px;

    border-radius:9px;

    font-size:15px;

    font-weight:700;

}


.card span{

    margin-left:4px;

}



/* =========================================
   SEARCH
========================================= */

.search{

    margin-bottom:14px;

}



/* =========================================
   TABLE
========================================= */

.table-wrap{

    width:100%;

    overflow-x:auto;

    -webkit-overflow-scrolling:touch;

}


table{

    width:100%;

    border-collapse:collapse;

    min-width:950px;

}


th,
td{

    padding:11px 9px;

    border-bottom:
        1px solid
        var(--border);

    text-align:left;

    font-size:14px;

    white-space:nowrap;

}


th{

    background:var(--primary);

    color:#fff;

    font-weight:700;

}


tbody tr:hover{

    background:#f7faf9;

}


.loading{

    text-align:center;

    padding:25px;

    color:var(--muted);

}



/* =========================================
   EMPTY / ERROR
========================================= */

.empty{

    text-align:center;

    padding:22px;

    color:var(--muted);

}


.error-row{

    color:var(--danger);

    padding:20px;

}



/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    body{

        font-size:16px;

    }


    .top{

        padding:
            13px 14px;

    }


    .top h2{

        font-size:18px;

    }


    .top a{

        font-size:14px;

    }


    .container{

        padding:
            0 9px;

        margin-top:15px;

    }


    .box{

        padding:
            17px 13px;

        border-radius:11px;

    }


    h3{

        font-size:19px;

        line-height:1.4;

    }


    .form{

        grid-template-columns:1fr;

        gap:14px;

    }


    .full{

        grid-column:auto;

    }


    label{

        font-size:16px;

    }


    input,
    select{

        min-height:50px;

        font-size:16px;

        padding:
            12px;

    }


    button{

        min-height:46px;

        font-size:16px;

        padding:
            11px 15px;

    }


    .summary{

        gap:7px;

    }


    .card{

        font-size:14px;

        padding:
            10px 11px;

    }


    th,
    td{

        font-size:14px;

        padding:
            11px 9px;

    }

}


</style>

</head>



<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="top">

    <h2>
        💰 Student Fees
    </h2>


    <a href="dashboard.html">

    </a>

</header>



<div class="container">



<!-- =========================================
     SESSION + CLASS
========================================= -->

<div class="box">

    <h3>
        🔎 Class & Session অনুযায়ী শিক্ষার্থী নির্বাচন
    </h3>


    <div class="filter">


        <div class="form">


            <!-- SESSION -->

            <div>

                <label>
                    Session *
                </label>


                <select
                    id="sessionFilter"
                >

                    <option value="">
                        Session নির্বাচন করুন

                </select>


                <div class="note">

                    Session নির্বাচন করলে
                    সেই Session-এর Class দেখাবে।

                </div>

            </div>



            <!-- CLASS -->

            <div>

                <label>
                    Class *
                </label>


                <select
                    id="classFilter"
                    disabled
                >

                    <option value="">
                        আগে Session নির্বাচন করুন
                    </option>

</div>



<!-- =========================================
     ADD FEE
========================================= -->

<div class="box">


    <h3 id="formTitle">

        ➕ Add Fee Payment

    </h3>



    <form id="feeForm">


        <input
            type="hidden"
            id="editId"
        >



        <!-- STUDENT -->

        <div class="full">

            <label>
                Student *
            </label>


            <select
                id="studentId"
                required
                disabled
            >

                <option value="">

<!-- =========================================
     FEE COLLECTION
========================================= -->

<div class="box">


    <h3>
        💰 Fee Collection

    <!-- SUMMARY -->

    <div class="summary">

    <div class="table-wrap">


        <table>


            <thead>

                <tr>

                    <th>
                        Student

                    <th>
                        Session
                    </th>

                    <th>
                        Month
                    </th>

                    <th>
                        Fee
                    </th>

                    <th>
                        Paid
                    </th>

                    <th>
                        Due
                    </th>

                        Date
                    </th>

<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";


const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =========================================
   GLOBAL DATA
========================================= */

let students = [];

let classes = [];

let fees = [];

let selectedSession = "";

let selectedClass = "";



/* =========================================
   SHORT SELECTOR
========================================= */

function $(id){

    return document.getElementById(id);

}



/* =========================================
   TODAY
========================================= */

function today(){

    return new Date()
        .toISOString()
        .split("T")[0];

}


$("paymentDate").value =
today();



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value ?? "")

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}



/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    error=false
){

    const el =
        $("msg");

    el.textContent =
        text;

    el.className =
        error
            ? "msg-error"
            : "msg-ok";

}



/* =========================================
   START
========================================= */

async function start(){

    try{


        const {
            data:{
                session
            }
        } =
        await db.auth.getSession();



        if(!session){

            location.href =
                "admin.html";

            return;

        }



        await loadStudents();

        await loadClasses();

        buildSessionList();

        updateClassList();

        updateStudentList();

        await loadFees();



    }catch(error){

        showMessage(
            "❌ " +
            error.message,
            true
        );

    }

}



/* =========================================
   LOAD STUDENTS
========================================= */

async function loadStudents(){


    const {
        data,
        error
    } =

    await db

        .from("students")

        .select("*")

        .order(
            "name",
            {
                ascending:true
            }
        );



    if(error){

        throw error;

    }


    students =
        data || [];

}



/* =========================================
   LOAD CLASSES
========================================= */

async function loadClasses(){


    const {
        data,
        error
    } =

    await db

        .from("classes")

        .select("*")

        .order(
            "name",
            {
                ascending:true
            }
        );



    if(error){

        /*
         classes table না থাকলেও
         students থেকে class name
         নেওয়ার চেষ্টা করবে।
        */

        classes = [];

        return;

    }


    classes =
        data || [];

}



/* =========================================
   GET SESSION
========================================= */

function getStudentSession(student){

    return String(

        student.session ??

        student.academic_session ??

        student.session_name ??

        ""

    ).trim();

}



/* =========================================
   GET CLASS ID
========================================= */

function getStudentClassId(student){

    return (

        student.class_id ??

        student.classId ??

        null

    );

}



/* =========================================
   GET CLASS NAME
========================================= */

function getStudentClassName(student){

    const classId =
        getStudentClassId(
            student
        );


    if(classId !== null){

        const c =
            classes.find(
                item =>
                    String(item.id) ===
                    String(classId)
            );


        if(c){

            return String(

                c.name ??

                c.class_name ??

                c.title ??

                ""

            );

        }

    }


    return String(

        student.class_name ??

        student.class ??

        student.className ??

        ""

    ).trim();

}



/* =========================================
   BUILD SESSION
========================================= */

function buildSessionList(){


    const select =
        $("sessionFilter");


    const sessions = [

        ...new Set(

            students

                .map(
                    getStudentSession
                )

                .filter(Boolean)

        )

    ];


    sessions.sort(
        (a,b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true
                }
            )
    );


    select.innerHTML = `

        <option value="">
            Session নির্বাচন করুন
        </option>

    `;


    sessions.forEach(
        session => {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                session;


            option.textContent =
                session;


            select.appendChild(
                option
            );


        }
    );



    if(
        selectedSession &&
        sessions.includes(
            selectedSession
        )
    ){

        select.value =
            selectedSession;

    }

}



/* =========================================
   BUILD CLASS
========================================= */

function updateClassList(){


    const select =
        $("classFilter");


    const studentRows =

        students.filter(
            student =>

                getStudentSession(
                    student
                ) ===
                selectedSession
        );


    const classMap =
        new Map();


    studentRows.forEach(
        student => {


            const id =
                getStudentClassId(
                    student
                );


            const name =
                getStudentClassName(
                    student
                );


            if(
                id !== null &&
                name
            ){

                classMap.set(
                    String(id),
                    name
                );

            }

            else if(name){

                classMap.set(
                    name,
                    name
                );

            }

        }
    );



    select.innerHTML = `

        <option value="">
            Class নির্বাচন করুন
        </option>

    `;



    [...classMap.entries()]

        .sort(
            (a,b) =>
                String(a[1]).localeCompare(
                    String(b[1]),
                    undefined,
                    {
                        numeric:true
                    }
                )
        )

        .forEach(
            ([id,name]) => {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    id;


                option.textContent =
                    name;


                select.appendChild(
                    option
                );


            }
        );



    select.disabled =
        !selectedSession;


    if(
        selectedClass &&
        classMap.has(
            String(selectedClass)
        )
    ){

        select.value =
            selectedClass;

    }

}



/* =========================================
   BUILD STUDENT
========================================= */

function updateStudentList(){


    const select =
        $("studentId");


    if(
        !selectedSession ||
        !selectedClass
    ){

        select.disabled =
            true;


        select.innerHTML = `

            <option value="">
                আগে Session ও Class নির্বাচন করুন
            </option>

        `;

        return;

    }



    const selectedClassText =

        $("classFilter")
            .selectedOptions[0]
            ?.textContent
            ?.trim() || "";



    const list =

        students.filter(
            student => {


                const sameSession =

                    getStudentSession(
                        student
                    ) ===
                    selectedSession;


                const id =
                    getStudentClassId(
                        student
                    );


                const className =
                    getStudentClassName(
                        student
                    );


                const sameClass =

                    id !== null

                        ?

                    String(id) ===
                    String(selectedClass)

                        :

                    className ===
                    selectedClassText;



                return (
                    sameSession &&
                    sameClass
                );

            }
        );



    select.disabled =
        false;


    select.innerHTML = `

        <option value="">
            Student নির্বাচন করুন
        </option>

    `;



    list.sort(
        (a,b) =>
            String(
                a.name || ""
            ).localeCompare(
                String(
                    b.name || ""
                )
            )
    );



    list.forEach(
        student => {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                student.id;


            const studentId =
                student.student_id ??
                student.studentId ??
                "";


            const roll =
                student.roll ??
                student.roll_no ??
                student.roll_number ??
                "";


            option.textContent =

                String(studentId)
                +

                (
                    studentId
                        ? " - "
                        : ""
                )

                +

                String(
                    student.name || ""
                )

                +

                (
                    roll
                        ? " | Roll: " +
                          roll
                        : ""
                );


            select.appendChild(
                option
            );


        }
    );



    if(!list.length){

        select.innerHTML = `

            <option value="">
                এই Class/Session-এ কোনো Student নেই
            </option>

        `;

    }

}



/* =========================================
   SESSION CHANGE
========================================= */

$("sessionFilter").onchange =
function(){


    selectedSession =
        this.value;


    selectedClass =
        "";


    $("classFilter").value =
        "";


    $("studentId").value =
        "";


    updateClassList();

    updateStudentList();

};



/* =========================================
   CLASS CHANGE
========================================= */

$("classFilter").onchange =
function(){


    selectedClass =
        this.value;


    $("studentId").value =
        "";


    updateStudentList();

};



/* =========================================
   LOAD FEES
========================================= */

async function loadFees(){


    const tbody =
        $("feeList");


    tbody.innerHTML = `

        <tr>

            <td
                colspan="10"
                class="loading"
            >

                Loading...

            </td>

        </tr>

    `;



    const {
        data,
        error
    } =

    await db

        .from("fees")

        .select("*")

        .order(
            "payment_date",
            {
                ascending:false
            }
        );



    if(error){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="error-row"
                >

                    ❌ ${
                        escapeHtml(
                            error.message
                        )
                    }

                </td>

            </tr>

        `;

        return;

    }


    fees =
        data || [];


    renderFees(
        fees
    );

}



/* =========================================
   FIND STUDENT
========================================= */

function findStudent(
    studentId
){

    return students.find(
        student =>
            String(student.id) ===
            String(studentId)
    ) || {};

}



/* =========================================
   RENDER FEES
========================================= */

function renderFees(
    list
){


    let totalFee = 0;

    let totalPaid = 0;



    list.forEach(
        fee => {


            totalFee +=
                Number(
                    fee.amount
                ) || 0;


            totalPaid +=
                Number(
                    fee.paid_amount
                ) || 0;


        }
    );



    $("totalFee")
        .textContent =
        totalFee.toFixed(2);


    $("totalPaid")
        .textContent =
        totalPaid.toFixed(2);


    $("totalDue")
        .textContent =

        (
            totalFee -
            totalPaid
        ).toFixed(2);



    const tbody =
        $("feeList");



    if(!list.length){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty"
                >

                    কোনো Fee record নেই

                </td>

            </tr>

        `;

        return;

    }



    tbody.innerHTML =

        list.map(
            fee => {


                const student =
                    findStudent(
                        fee.student_id
                    );


                const amount =
                    Number(
                        fee.amount
                    ) || 0;


                const paid =
                    Number(
                        fee.paid_amount
                    ) || 0;


                const due =
                    amount -
                    paid;



                return `

                    <tr>


                        <td>

                            ${
                                escapeHtml(
                                    student.student_id ??
                                    student.studentId ??
                                    ""
                                )
                            }

                            ${
                                (
                                    student.student_id ??
                                    student.studentId ??
                                    ""
                                )
                                ? " - "
                                : ""
                            }

                            ${
                                escapeHtml(
                                    student.name ||
                                    "-"
                                )
                            }

                        </td>



                        <td>

                            ${
                                escapeHtml(
                                    getStudentClassName(
                                        student
                                    ) ||
                                    "-"
                                )
                            }

                        </td>



                        <td>

                            ${
                                escapeHtml(
                                    getStudentSession(
                                        student
                                    ) ||
                                    "-"
                                )
                            }

                        </td>



                        <td>

                            ${
                                escapeHtml(
                                    fee.fee_month ||
                                    "-"
                                )
                            }

                        </td>



                        <td>

                            ${
                                amount.toFixed(2)
                            }

                        </td>



                        <td>

                            ${
                                paid.toFixed(2)
                            }

                        </td>



                        <td>

                            ${
                                due.toFixed(2)
                            }

                        </td>



                        <td>

                            ${
                                escapeHtml(
                                    fee.payment_date ||
                                    "-"
                                )
                            }

                        </td>



                        <td>

                            ${
                                escapeHtml(
                                    fee.payment_method ||
                                    "-"
                                )
                            }

                        </td>



                        <td>


                            <button
                                class="edit"
                                onclick="editFee('${escapeHtml(fee.id)}')"
                            >

                                Edit

                            </button>



                            <button
                                class="delete"
                                onclick="deleteFee('${escapeHtml(fee.id)}')"
                            >

                                Delete

                            </button>


                        </td>


                    </tr>

                `;


            }

        ).join("");

}



/* =========================================
   ADD / UPDATE
========================================= */

$("feeForm").addEventListener(
    "submit",
    async function(e){

        e.preventDefault();



        const editId =
            $("editId").value;



        const studentId =
            $("studentId").value;



        if(!studentId){

            showMessage(
                "❌ Student নির্বাচন করুন।",
                true
            );

            return;

        }



        const amount =
            Number(
                $("amount").value
            );


        const paid =
            Number(
                $("paidAmount").value
            );



        if(
            Number.isNaN(amount) ||
            amount < 0
        ){

            showMessage(
                "❌ Fee Amount সঠিকভাবে দিন।",
                true
            );

            return;

        }



        if(
            Number.isNaN(paid) ||
            paid < 0
        ){

            showMessage(
                "❌ Paid Amount সঠিকভাবে দিন।",
                true
            );

            return;

        }



        if(
            paid > amount
        ){

            showMessage(
                "❌ Paid Amount Fee Amount-এর চেয়ে বেশি হতে পারবে না।",
                true
            );

            return;

        }



        const record = {

            student_id:
                studentId,

            fee_month:
                $("feeMonth").value,

            amount:
                amount,

            paid_amount:
                paid,

            payment_date:
                $("paymentDate").value ||
                null,

            payment_method:
                $("method").value

        };



        $("saveBtn").disabled =
            true;



        showMessage(
            "Saving..."
        );



        try{


            let result;



            if(editId){


                result =

                    await db

                        .from("fees")

                        .update(
                            record
                        )

                        .eq(
                            "id",
                            editId
                        )

                        .select("*")

                        .single();


            }

            else{


                result =

                    await db

                        .from("fees")

                        .insert(
                            record
                        )

                        .select("*")

                        .single();

            }



            if(result.error){

                showMessage(
                    "❌ " +
                    result.error.message,
                    true
                );

                return;

            }



            if(editId){


                const index =
                    fees.findIndex(
                        fee =>
                            String(fee.id) ===
                            String(editId)
                    );


                if(index !== -1){

                    fees[index] =
                        result.data;

                }


            }

            else{


                fees.unshift(
                    result.data
                );

            }



            renderFees(
                fees
            );


            resetForm();



            showMessage(
                "✅ Payment saved successfully."
            );


        }

        catch(error){

            showMessage(
                "❌ " +
                error.message,
                true
            );

        }

        finally{

            $("saveBtn").disabled =
                false;

        }

    }

);



/* =========================================
   EDIT FEE
========================================= */

function editFee(
    id
){


    const fee =
        fees.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!fee)
        return;



    const student =
        findStudent(
            fee.student_id
        );



    selectedSession =
        getStudentSession(
            student
        );



    $("sessionFilter").value =
        selectedSession;



    updateClassList();



    const studentClassId =
        getStudentClassId(
            student
        );



    if(studentClassId !== null){

        selectedClass =
            String(
                studentClassId
            );

        $("classFilter").value =
            selectedClass;

    }

    else{

        const className =
            getStudentClassName(
                student
            );


        const option =
            [...$("classFilter").options]

                .find(
                    item =>
                        item.textContent.trim() ===
                        className
                );


        if(option){

            selectedClass =
                option.value;

            $("classFilter").value =
                option.value;

        }

    }



    updateStudentList();



    $("studentId").value =
        fee.student_id || "";


    $("editId").value =
        fee.id;


    $("feeMonth").value =
        fee.fee_month || "";


    $("amount").value =
        fee.amount ?? "";


    $("paidAmount").value =
        fee.paid_amount ?? "";


    $("paymentDate").value =
        fee.payment_date || "";


    $("method").value =
        fee.payment_method ||
        "Cash";



    $("formTitle").textContent =
        "✏️ Edit Fee";


    $("saveBtn").textContent =
        "💾 Update Payment";


    $("cancelBtn").style.display =
        "inline-block";



    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =========================================
   DELETE
========================================= */

async function deleteFee(
    id
){


    if(
        !confirm(
            "এই Fee record Delete করতে চান?"
        )
    ){

        return;

    }



    try{


        const {
            error
        } =

        await db

            .from("fees")

            .delete()

            .eq(
                "id",
                id
            );



        if(error){

            alert(
                error.message
            );

            return;

        }



        fees =
            fees.filter(
                fee =>
                    String(fee.id) !==
                    String(id)
            );



        renderFees(
            fees
        );


    }

    catch(error){

        alert(
            error.message
        );

    }

}



/* =========================================
   RESET
========================================= */

function resetForm(){


    $("feeForm").reset();


    $("editId").value =
        "";


    $("paymentDate").value =
        today();


    $("formTitle").textContent =
        "➕ Add Fee Payment";


    $("saveBtn").textContent =
        "💾 Save Payment";


    $("cancelBtn").style.display =
        "none";



    $("sessionFilter").value =
        selectedSession;


    updateClassList();


    $("classFilter").value =
        selectedClass;


    updateStudentList();

}



/* =========================================
   CANCEL
========================================= */

$("cancelBtn").onclick =
    function(){

        resetForm();

    };



/* =========================================
   SEARCH
========================================= */

$("search").addEventListener(
    "input",
    function(){

        const q =
            this.value
                .toLowerCase()
                .trim();



        if(!q){

            renderFees(
                fees
            );

            return;

        }



        const filtered =
            fees.filter(
                fee => {


                    const student =
                        findStudent(
                            fee.student_id
                        );


                    const values = [

                        student.name,

                        student.student_id,

                        student.studentId,

                        student.roll,

                        student.roll_no,

                        getStudentSession(
                            student
                        ),

                        getStudentClassName(
                            student
                        ),

                        fee.fee_month,

                        fee.payment_method

                    ];



                    return values.some(
                        value =>

                            String(
                                value || ""
                            )

                            .toLowerCase()

                            .includes(
                                q
                            )
                    );

                }
            );



        renderFees(
            filtered
        );

    }

);

   RUN

start();

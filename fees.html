<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Fees | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f6;
color:#222
}

.top{
background:#075c43;
color:#fff;
padding:17px 22px;
display:flex;
justify-content:space-between;
align-items:center
}

.top h2{
margin:0;
color:#fff;
font-size:20px
}

.top a{
color:#fff;
text-decoration:none
}

.container{
max-width:1100px;
margin:25px auto;
padding:0 15px
}

.box{
background:#fff;
padding:22px;
border-radius:12px;
box-shadow:0 2px 10px #0001;
margin-bottom:20px
}

h3{
color:#075c43;
margin-bottom:18px
}

.form{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px
}

.full{
grid-column:1/-1
}

label{
font-weight:bold;
font-size:14px
}

input,select{
width:100%;
padding:11px;
margin-top:6px;
border:1px solid #ddd;
border-radius:7px;
font-size:14px
}

button{
border:0;
padding:10px 16px;
border-radius:7px;
background:#087f5b;
color:#fff;
font-weight:bold;
cursor:pointer
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.cancel{
background:#777;
margin-left:7px
}

.delete{
background:#c62828
}

.edit{
background:#1565c0
}

.search{
margin-bottom:15px
}

table{
width:100%;
border-collapse:collapse
}

th,td{
padding:10px 8px;
border-bottom:1px solid #ddd;
text-align:left;
font-size:14px
}

th{
background:#075c43;
color:#fff
}

.table-wrap{
overflow:auto
}

#msg{
margin-top:12px;
min-height:20px
}

.summary{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-bottom:18px
}

.card{
background:#eee;
padding:12px 18px;
border-radius:8px;
font-weight:bold
}

.loading{
text-align:center;
padding:20px
}

@media(max-width:650px){

.form{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

table{
min-width:800px
}

}
</style>
</head>

<body>

<header class="top">

<h2>💰 Student Fees</h2>

<a href="dashboard.html">
← Dashboard
</a>

</header>


<div class="container">


<!-- =========================
     ADD FEE
========================= -->

<div class="box">

<h3 id="formTitle">
➕ Add Fee Payment
</h3>


<form id="feeForm">

<input type="hidden" id="editId">


<div>

<label>
Student *
</label>

<select id="studentId" required>

<option value="">
Student নির্বাচন করুন
</option>

</select>

</div>


<div>

<label>
Month *
</label>

<input
type="month"
id="feeMonth"
required
>

</div>


<div>

<label>
Fee Amount *
</label>

<input
type="number"
id="amount"
min="0"
step="0.01"
required
placeholder="যেমন: 1000"
>

</div>


<div>

<label>
Paid Amount *
</label>

<input
type="number"
id="paidAmount"
min="0"
step="0.01"
required
placeholder="যেমন: 1000"
>

</div>


<div>

<label>
Payment Date
</label>

<input
type="date"
id="paymentDate"
>

</div>


<div>

<label>
Payment Method
</label>

<select id="method">

<option value="Cash">
Cash
</option>

<option value="bKash">
bKash
</option>

<option value="Nagad">
Nagad
</option>

<option value="Bank">
Bank
</option>

</select>

</div>


<div class="full">

<button
type="submit"
id="saveBtn"
>
💾 Save Payment
</button>


<button
type="button"
class="cancel"
id="cancelBtn"
style="display:none"
>
Cancel
</button>


<div id="msg"></div>

</div>

</form>

</div>



<!-- =========================
     FEE LIST
========================= -->

<div class="box">

<h3>
💰 Fee Collection
</h3>


<div class="summary">

<div class="card">
Total Fee:
<span id="totalFee">0.00</span>
</div>

<div class="card">
Paid:
<span id="totalPaid">0.00</span>
</div>

<div class="card">
Due:
<span id="totalDue">0.00</span>
</div>

</div>


<input
class="search"
id="search"
placeholder="🔍 Student name / ID দিয়ে খুঁজুন..."
>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
Student
</th>

<th>
Month
</th>

<th>
Fee
</th>

<th>
Paid
</th>

<th>
Due
</th>

<th>
Date
</th>

<th>
Method
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody id="feeList">

<tr>

<td
colspan="8"
class="loading"
>
Loading...
</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let students = [];
let fees = [];


// ===============================
// TODAY
// ===============================

function today(){

return new Date()
.toISOString()
.split("T")[0];

}


document.getElementById(
"paymentDate"
).value = today();



// ===============================
// START
// ===============================

async function start(){

try{

const {
data:{session}
} = await db.auth.getSession();


if(!session){

location.href="admin.html";
return;

}


// দুইটি request একই সময়ে
await Promise.all([

loadStudents(),

loadFees()

]);


}catch(error){

document.getElementById(
"feeList"
).innerHTML =
`<tr>
<td colspan="8">
❌ ${escapeHtml(error.message)}
</td>
</tr>`;

}

}



// ===============================
// LOAD STUDENTS
// ===============================

async function loadStudents(){

const select =
document.getElementById("studentId");


select.innerHTML =
`<option value="">
Student নির্বাচন করুন
</option>`;


const {
data,
error
} = await db

.from("students")

.select(
"id,student_id,name"
)

.order("name");


if(error){

document.getElementById("msg")
.textContent =
"❌ Student load error: "
+ error.message;

return;

}


students = data || [];


const fragment =
document.createDocumentFragment();


students.forEach(s=>{

const option =
document.createElement("option");


option.value = s.id;


option.textContent =
`${s.student_id || ""} - ${s.name || ""}`;


fragment.appendChild(option);

});


select.appendChild(fragment);

}



// ===============================
// LOAD FEES
// ===============================

async function loadFees(){

const tbody =
document.getElementById("feeList");


tbody.innerHTML =
`<tr>
<td colspan="8" class="loading">
Loading...
</td>
</tr>`;


const {
data,
error
} = await db

.from("fees")

.select(`
id,
student_id,
fee_month,
amount,
paid_amount,
payment_date,
payment_method,
students(
student_id,
name
)
`)

.order(
"payment_date",
{ascending:false}
);


if(error){

tbody.innerHTML =
`<tr>
<td colspan="8">
❌ ${escapeHtml(error.message)}
</td>
</tr>`;

return;

}


fees = data || [];

render(fees);

}



// ===============================
// RENDER
// ===============================

function render(list){

let totalFee = 0;

let totalPaid = 0;


list.forEach(f=>{

totalFee +=
Number(f.amount) || 0;

totalPaid +=
Number(f.paid_amount) || 0;

});


document.getElementById(
"totalFee"
).textContent =
totalFee.toFixed(2);


document.getElementById(
"totalPaid"
).textContent =
totalPaid.toFixed(2);


document.getElementById(
"totalDue"
).textContent =
(totalFee-totalPaid).toFixed(2);


const tbody =
document.getElementById("feeList");


if(!list.length){

tbody.innerHTML =
`<tr>

<td
colspan="8"
style="text-align:center"
>
কোনো Fee record নেই
</td>

</tr>`;

return;

}


tbody.innerHTML =
list.map(f=>{

const amount =
Number(f.amount) || 0;


const paid =
Number(f.paid_amount) || 0;


const due =
amount-paid;


return `

<tr>

<td>

${escapeHtml(
f.students?.student_id || "-"
)}

-

${escapeHtml(
f.students?.name || "-"
)}

</td>


<td>
${escapeHtml(
f.fee_month || "-"
)}
</td>


<td>
${amount.toFixed(2)}
</td>


<td>
${paid.toFixed(2)}
</td>


<td>
${due.toFixed(2)}
</td>


<td>
${escapeHtml(
f.payment_date || "-"
)}
</td>


<td>
${escapeHtml(
f.payment_method || "-"
)}
</td>


<td>

<button
class="edit"
onclick="editFee('${f.id}')"
>
Edit
</button>


<button
class="delete"
onclick="deleteFee('${f.id}')"
>
Delete
</button>

</td>

</tr>

`;

}).join("");

}



// ===============================
// ADD / UPDATE
// ===============================

document
.getElementById("feeForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();


const editId =
document.getElementById(
"editId"
).value;


const amount =
Number(
document.getElementById(
"amount"
).value
);


const paid =
Number(
document.getElementById(
"paidAmount"
).value
);


if(paid > amount){

alert(
"Paid Amount Fee Amount-এর চেয়ে বেশি হতে পারবে না।"
);

return;

}


const record = {

student_id:
document.getElementById(
"studentId"
).value,

fee_month:
document.getElementById(
"feeMonth"
).value,

amount: amount,

paid_amount: paid,

payment_date:
document.getElementById(
"paymentDate"
).value || null,

payment_method:
document.getElementById(
"method"
).value

};


const msg =
document.getElementById("msg");


const saveBtn =
document.getElementById("saveBtn");


msg.textContent =
"Saving...";


saveBtn.disabled = true;


try{

let result;


if(editId){

// UPDATE

result =
await db

.from("fees")

.update(record)

.eq("id",editId)

.select(`
id,
student_id,
fee_month,
amount,
paid_amount,
payment_date,
payment_method,
students(
student_id,
name
)
`)

.single();


}else{

// INSERT

result =
await db

.from("fees")

.insert(record)

.select(`
id,
student_id,
fee_month,
amount,
paid_amount,
payment_date,
payment_method,
students(
student_id,
name
)
`)

.single();

}


if(result.error){

msg.textContent =
"❌ " +
result.error.message;

return;

}


// ===============================
// LOCAL UPDATE
// এখানে আবার loadFees() হবে না
// ===============================

if(editId){

const index =
fees.findIndex(
x =>
String(x.id) ===
String(editId)
);


if(index !== -1){

fees[index] =
result.data;

}

}else{

fees.unshift(
result.data
);

}


render(fees);


msg.textContent =
"✅ Saved successfully";


resetForm();


}catch(error){

msg.textContent =
"❌ " + error.message;

}finally{

saveBtn.disabled = false;

}

});



// ===============================
// EDIT FEE
// ===============================

function editFee(id){

const fee =
fees.find(
x =>
String(x.id) ===
String(id)
);


if(!fee)return;


document.getElementById(
"editId"
).value =
fee.id;


document.getElementById(
"studentId"
).value =
fee.student_id || "";


document.getElementById(
"feeMonth"
).value =
fee.fee_month || "";


document.getElementById(
"amount"
).value =
fee.amount || 0;


document.getElementById(
"paidAmount"
).value =
fee.paid_amount || 0;


document.getElementById(
"paymentDate"
).value =
fee.payment_date || "";


document.getElementById(
"method"
).value =
fee.payment_method || "Cash";


document.getElementById(
"formTitle"
).textContent =
"✏️ Edit Fee";


document.getElementById(
"saveBtn"
).textContent =
"💾 Update Payment";


document.getElementById(
"cancelBtn"
).style.display =
"inline-block";


window.scrollTo({

top:0,

behavior:"smooth"

});

}



// ===============================
// DELETE
// ===============================

async function deleteFee(id){

if(!confirm(
"এই Fee record Delete করতে চান?"
))return;


try{

const {
error
} = await db

.from("fees")

.delete()

.eq("id",id);


if(error){

alert(error.message);

return;

}


// Local list থেকে remove

fees =
fees.filter(
f =>
String(f.id) !==
String(id)
);


render(fees);


}catch(error){

alert(error.message);

}

}



// ===============================
// RESET
// ===============================

function resetForm(){

document
.getElementById("feeForm")
.reset();


document.getElementById(
"editId"
).value = "";


document.getElementById(
"paymentDate"
).value = today();


document.getElementById(
"formTitle"
).textContent =
"➕ Add Fee Payment";


document.getElementById(
"saveBtn"
).textContent =
"💾 Save Payment";


document.getElementById(
"cancelBtn"
).style.display =
"none";

}


document.getElementById(
"cancelBtn"
).onclick =
resetForm;



// ===============================
// SEARCH
// ===============================

document
.getElementById("search")
.addEventListener(
"input",
function(){

const q =
this.value
.toLowerCase()
.trim();


const filtered =
fees.filter(f=>

(f.students?.name || "")
.toLowerCase()
.includes(q)

||

(f.students?.student_id || "")
.toLowerCase()
.includes(q)

);


render(filtered);

});



// ===============================
// ESCAPE HTML
// ===============================

function escapeHtml(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}



// ===============================
// START
// ===============================

start();

</script>

</body>
</html>

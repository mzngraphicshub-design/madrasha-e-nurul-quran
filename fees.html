<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>
Student Fees | মাদরাসায়ে নূরুল কুরআন
</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --primary:#0d47a1;
    --primary2:#1976d2;
    --light:#eaf2fb;
    --bg:#f4f7fb;
    --white:#fff;
    --text:#202124;
    --muted:#6b7280;
    --border:#d9e1eb;
    --danger:#d32f2f;
    --success:#16805b;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        "Noto Sans Bengali",
        "Noto Sans",
        Arial,
        sans-serif;
}

/* ==============================
   HEADER
============================== */

.top{
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    color:#fff;
    padding:14px 20px;

    min-height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:
        0 2px 10px rgba(0,0,0,.15);
}

.top h2{
    margin:0;
    color:#fff;
    font-size:20px;
}

.top a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

/* ==============================
   CONTAINER
============================== */

.container{
    max-width:1150px;
    margin:22px auto;
    padding:0 15px;
}

/* ==============================
   BOX
============================== */

.box{
    background:#fff;
    padding:20px;
    border-radius:12px;

    box-shadow:
        0 2px 12px rgba(0,0,0,.07);

    border:1px solid #e7edf4;

    margin-bottom:20px;
}

h3{
    margin:0 0 17px;
    color:var(--primary);
    font-size:19px;
}

/* ==============================
   FILTER
============================== */

.filter{
    background:var(--light);
    border:1px solid #d8e6f5;
    padding:15px;
    border-radius:9px;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
}

input,
select{
    width:100%;
    margin-top:6px;

    min-height:46px;

    padding:10px 12px;

    border:1px solid var(--border);
    border-radius:7px;

    background:#fff;

    font-family:inherit;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;

    border-color:
        var(--primary2);

    box-shadow:
        0 0 0 3px
        rgba(25,118,210,.10);
}

select:disabled{
    background:#f0f2f5;
    color:#888;
}

.note{
    font-size:12px;
    color:#6b7280;
    margin-top:5px;
}

/* ==============================
   BUTTON
============================== */

button{
    border:0;

    padding:10px 16px;

    border-radius:7px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    font-family:inherit;
    font-size:14px;
    font-weight:bold;

    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.cancel{
    background:#777;
    margin-left:5px;
}

.edit{
    background:#1565c0;
    margin-right:4px;
}

.delete{
    background:#d32f2f;
}

button:hover{
    opacity:.9;
}

/* ==============================
   MESSAGE
============================== */

#msg{
    min-height:20px;
    margin-top:10px;
    font-size:13px;
    font-weight:bold;
}

.ok{
    color:var(--success);
}

.error{
    color:var(--danger);
}

/* ==============================
   SUMMARY
============================== */

.summary{
    display:flex;
    flex-wrap:wrap;
    gap:10px;

    margin-bottom:15px;
}

.card{
    background:#eef5fc;

    border:1px solid #dce9f7;

    padding:10px 15px;

    border-radius:8px;

    color:#164d84;

    font-weight:bold;

    font-size:14px;
}

/* ==============================
   SEARCH
============================== */

.search{
    margin-bottom:14px;
}

/* ==============================
   TABLE
============================== */

.table-wrap{
    width:100%;
    overflow:auto;
}

table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
}

th,
td{
    padding:10px 8px;
    border-bottom:1px solid #e1e5ea;

    font-size:13px;

    text-align:left;

    white-space:nowrap;
}

th{
    background:var(--primary);
    color:#fff;
}

tbody tr:hover{
    background:#f7faff;
}

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:700px){

    .top{
        padding:13px 14px;
    }

    .top h2{
        font-size:17px;
    }

    .top a{
        font-size:13px;
    }

    .container{
        padding:0 9px;
        margin-top:14px;
    }

    .box{
        padding:16px 12px;
        border-radius:10px;
    }

    h3{
        font-size:18px;
    }

    .form{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    label{
        font-size:15px;
    }

    input,
    select{
        min-height:48px;
        font-size:16px;
    }

    button{
        min-height:44px;
        font-size:15px;
    }

}

</style>

</head>

<body>


<!-- =================================
     HEADER
================================= -->

<header class="top">

    <h2>
        💰 Student Fees
    </h2>

    <a href="dashboard.html">
        ← Dashboard
    </a>

</header>



<div class="container">


<!-- =================================
     SESSION + CLASS
================================= -->

<div class="box">

    <h3>
        🔎 Class & Session অনুযায়ী শিক্ষার্থী নির্বাচন
    </h3>


    <div class="filter">

        <div class="form">


            <!-- SESSION -->

            <div>

                <label>
                    Session *
                </label>

                <select id="sessionFilter">

                    <option value="">
                        Session নির্বাচন করুন
                    </option>

                </select>

                <div class="note">
                    Session নির্বাচন করলে
                    ওই Session-এর Class দেখাবে।
                </div>

            </div>


            <!-- CLASS -->

            <div>

                <label>
                    Class *
                </label>

                <select
                    id="classFilter"
                    disabled
                >

                    <option value="">
                        আগে Session নির্বাচন করুন
                    </option>

                </select>

            </div>


        </div>

    </div>

</div>



<!-- =================================
     ADD FEE
================================= -->

<div class="box">

    <h3 id="formTitle">
        ➕ Add Fee Payment
    </h3>


    <form id="feeForm">


        <input
            type="hidden"
            id="editId"
        >


        <!-- STUDENT -->

        <div class="full">

            <label>
                Student *
            </label>

            <select
                id="studentId"
                required
                disabled
            >

                <option value="">
                    আগে Session ও Class নির্বাচন করুন
                </option>

            </select>

        </div>



        <div class="form full">


            <!-- FEE MONTH -->

            <div>

                <label>
                    Fee Month *
                </label>

                <input
                    type="month"
                    id="feeMonth"
                    required
                >

            </div>


            <!-- FEE AMOUNT -->

            <div>

                <label>
                    Fee Amount *
                </label>

                <input
                    type="number"
                    id="amount"
                    min="0"
                    step="0.01"
                    placeholder="যেমন: 1000"
                    required
                >

            </div>


            <!-- PAID -->

            <div>

                <label>
                    Paid Amount *
                </label>

                <input
                    type="number"
                    id="paidAmount"
                    min="0"
                    step="0.01"
                    placeholder="যেমন: 1000"
                    required
                >

            </div>


            <!-- DATE -->

            <div>

                <label>
                    Payment Date
                </label>

                <input
                    type="date"
                    id="paymentDate"
                >

            </div>


            <!-- METHOD -->

            <div>

                <label>
                    Payment Method
                </label>

                <select id="method">

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="bKash">
                        bKash
                    </option>

                    <option value="Nagad">
                        Nagad
                    </option>

                    <option value="Bank">
                        Bank
                    </option>

                </select>

            </div>


        </div>


        <div
            class="full"
            style="margin-top:15px"
        >

            <button
                type="submit"
                id="saveBtn"
            >
                💾 Save Payment
            </button>


            <button
                type="button"
                class="cancel"
                id="cancelBtn"
                style="display:none"
            >
                Cancel
            </button>


            <div id="msg"></div>

        </div>


    </form>

</div>



<!-- =================================
     FEE COLLECTION
================================= -->

<div class="box">

    <h3>
        💰 Fee Collection
    </h3>


    <div class="summary">

        <div class="card">
            Total Fee:
            <span id="totalFee">
                0.00
            </span>
        </div>

        <div class="card">
            Paid:
            <span id="totalPaid">
                0.00
            </span>
        </div>

        <div class="card">
            Due:
            <span id="totalDue">
                0.00
            </span>
        </div>

    </div>


    <input
        class="search"
        id="search"
        placeholder="🔍 Student name / ID / Roll দিয়ে খুঁজুন..."
    >


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>Student</th>
                    <th>Class</th>
                    <th>Session</th>
                    <th>Month</th>
                    <th>Fee</th>
                    <th>Paid</th>
                    <th>Due</th>
                    <th>Date</th>
                    <th>Method</th>
                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="feeList">

                <tr>

                    <td
                        colspan="10"
                        class="loading"
                    >
                        Loading...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


</div>



<!-- =================================
     SUPABASE
================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =================================
   DATA
================================= */

let students = [];

let classes = [];

let sessions = [];

let fees = [];

let selectedSession = "";

let selectedClass = "";



/* =================================
   $
================================= */

function $(id){

    return document.getElementById(id);

}



/* =================================
   ESCAPE
================================= */

function escapeHtml(value){

    return String(value ?? "")

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}



/* =================================
   TODAY
================================= */

function today(){

    return new Date()
        .toISOString()
        .split("T")[0];

}

$("paymentDate").value =
today();



/* =================================
   MESSAGE
================================= */

function message(
    text,
    isError=false
){

    $("msg").textContent =
        text;

    $("msg").className =
        isError
            ? "error"
            : "ok";

}



/* =================================
   GET SESSION
================================= */

function getSession(student){

    return String(

        student.session ??

        student.academic_session ??

        student.session_name ??

        student.sessionName ??

        ""

    ).trim();

}



/* =================================
   GET CLASS ID
================================= */

function getClassId(student){

    return (

        student.class_id ??

        student.classId ??

        null

    );

}



/* =================================
   GET CLASS NAME
================================= */

function getClassName(student){

    const classId =
        getClassId(student);


    /* classes table */

    if(classId !== null){

        const c =
            classes.find(
                x =>
                    String(x.id) ===
                    String(classId)
            );


        if(c){

            return String(

                c.name ??

                c.class_name ??

                c.title ??

                c.className ??

                classId

            ).trim();

        }

    }


    /* student table fallback */

    return String(

        student.class_name ??

        student.class ??

        student.className ??

        student.class_title ??

        ""

    ).trim();

}



/* =================================
   GET ROLL
================================= */

function getRoll(student){

    return (

        student.roll ??

        student.roll_no ??

        student.roll_number ??

        ""

    );

}



/* =================================
   GET STUDENT CODE
================================= */

function getStudentCode(student){

    return (

        student.student_id ??

        student.studentId ??

        student.id ??

        ""

    );

}



/* =================================
   START
================================= */

async function start(){

    try{


        const {
            data:{
                session
            }
        } =
        await db.auth.getSession();



        if(!session){

            location.href =
                "admin.html";

            return;

        }



        await loadStudents();

        await loadClasses();

        await loadSessions();

        buildSessions();

        updateClasses();

        updateStudents();

        await loadFees();


    }
    catch(error){

        message(
            "❌ " +
            error.message,
            true
        );

    }

}



/* =================================
   LOAD STUDENTS
================================= */

async function loadStudents(){

    const {
        data,
        error
    } =

    await db
        .from("students")
        .select("*");


    if(error){

        throw error;

    }


    students =
        data || [];

}



/* =================================
   LOAD CLASSES
================================= */

async function loadClasses(){

    const result =

        await db
            .from("classes")
            .select("*");


    /*
       classes table না থাকলে
       error ignore করবে।
    */

    if(result.error){

        classes = [];

        return;

    }


    classes =
        result.data || [];

}



/* =================================
   LOAD SESSIONS
================================= */

async function loadSessions(){

    const result =

        await db
            .from("sessions")
            .select("*");


    /*
       sessions table না থাকলেও সমস্যা নেই।
       students table থেকে Session নেবে।
    */

    if(result.error){

        sessions = [];

        return;

    }


    sessions =
        result.data || [];

}



/* =================================
   BUILD SESSION
================================= */

function buildSessions(){

    const set =
        new Set();


    /* sessions table */

    sessions.forEach(
        s => {

            const name = String(

                s.name ??

                s.session_name ??

                s.title ??

                s.session ??

                ""

            ).trim();


            if(name){

                set.add(name);

            }

        }
    );


    /* students table */

    students.forEach(
        s => {

            const name =
                getSession(s);


            if(name){

                set.add(name);

            }

        }
    );


    const list =
        [...set];


    list.sort(
        (a,b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true
                }
            )
    );


    $("sessionFilter").innerHTML = `

        <option value="">
            Session নির্বাচন করুন
        </option>

    `;


    list.forEach(
        name => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                name;

            option.textContent =
                name;

            $("sessionFilter")
                .appendChild(option);

        }
    );

}



/* =================================
   BUILD CLASS
================================= */

function updateClasses(){

    const select =
        $("classFilter");


    select.innerHTML = `

        <option value="">
            Class নির্বাচন করুন
        </option>

    `;


    if(!selectedSession){

        select.disabled =
            true;

        select.innerHTML = `

            <option value="">
                আগে Session নির্বাচন করুন
            </option>

        `;

        return;

    }


    const map =
        new Map();


    /* =================================
       STUDENTS থেকে CLASS
    ================================= */

    students

        .filter(
            s =>
                getSession(s) ===
                selectedSession
        )

        .forEach(
            s => {

                const id =
                    getClassId(s);

                const name =
                    getClassName(s);


                if(name){

                    map.set(

                        id !== null
                            ? String(id)
                            : name,

                        name

                    );

                }

            }
        );


    /* =================================
       CLASSES TABLE থেকেও CLASS
    ================================= */

    classes.forEach(
        c => {

            const id =
                c.id;

            const name =
                String(

                    c.name ??

                    c.class_name ??

                    c.title ??

                    c.className ??

                    ""

                ).trim();


            if(name){

                map.set(
                    String(id),
                    name
                );

            }

        }
    );


    [...map.entries()]

        .sort(
            (a,b) =>
                a[1].localeCompare(
                    b[1],
                    undefined,
                    {
                        numeric:true
                    }
                )
        )

        .forEach(
            ([id,name]) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    id;

                option.textContent =
                    name;

                select.appendChild(
                    option
                );

            }
        );


    select.disabled =
        false;

}



/* =================================
   BUILD STUDENT
================================= */

function updateStudents(){

    const select =
        $("studentId");


    select.innerHTML = `

        <option value="">
            Student নির্বাচন করুন
        </option>

    `;


    if(
        !selectedSession ||
        !selectedClass
    ){

        select.disabled =
            true;

        select.innerHTML = `

            <option value="">
                আগে Session ও Class নির্বাচন করুন
            </option>

        `;

        return;

    }


    const classOption =
        $("classFilter")
            .selectedOptions[0];


    const classText =
        classOption
            ?.textContent
            ?.trim() || "";


    const list =

        students.filter(
            student => {


                if(
                    getSession(student) !==
                    selectedSession
                ){

                    return false;

                }


                const classId =
                    getClassId(student);


                if(classId !== null){

                    return (
                        String(classId) ===
                        String(selectedClass)
                    );

                }


                return (
                    getClassName(student) ===
                    classText
                );

            }
        );


    list.sort(
        (a,b) =>
            String(
                a.name || ""
            ).localeCompare(
                String(
                    b.name || ""
                )
            )
    );


    list.forEach(
        student => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                student.id;


            const code =
                getStudentCode(
                    student
                );


            const roll =
                getRoll(
                    student
                );


            option.textContent =

                String(
                    code
                )

                +

                (
                    code
                        ? " - "
                        : ""
                )

                +

                String(
                    student.name || ""
                )

                +

                (
                    roll
                        ? " | Roll: " +
                          roll
                        : ""
                );


            select.appendChild(
                option
            );

        }
    );


    if(!list.length){

        select.innerHTML = `

            <option value="">
                এই Class-এ কোনো Student পাওয়া যায়নি
            </option>

        `;

    }


    select.disabled =
        false;

}



/* =================================
   SESSION CHANGE
================================= */

$("sessionFilter").onchange =
function(){

    selectedSession =
        this.value;

    selectedClass =
        "";

    $("classFilter").value =
        "";

    $("studentId").value =
        "";

    updateClasses();

    updateStudents();

};



/* =================================
   CLASS CHANGE
================================= */

$("classFilter").onchange =
function(){

    selectedClass =
        this.value;

    $("studentId").value =
        "";

    updateStudents();

};



/* =================================
   LOAD FEES
================================= */

async function loadFees(){

    $("feeList").innerHTML = `

        <tr>

            <td
                colspan="10"
                class="loading"
            >
                Loading...
            </td>

        </tr>

    `;


    const {
        data,
        error
    } =

    await db
        .from("fees")
        .select("*")
        .order(
            "payment_date",
            {
                ascending:false
            }
        );


    if(error){

        $("feeList").innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty"
                >

                    ❌ ${
                        escapeHtml(
                            error.message
                        )
                    }

                </td>

            </tr>

        `;

        return;

    }


    fees =
        data || [];


    renderFees(fees);

}



/* =================================
   FIND STUDENT
================================= */

function findStudent(id){

    return students.find(
        s =>
            String(s.id) ===
            String(id)
    ) || {};

}



/* =================================
   RENDER FEES
================================= */

function renderFees(list){

    let totalFee = 0;

    let totalPaid = 0;


    list.forEach(
        f => {

            totalFee +=
                Number(
                    f.amount
                ) || 0;

            totalPaid +=
                Number(
                    f.paid_amount
                ) || 0;

        }
    );


    $("totalFee")
        .textContent =
        totalFee.toFixed(2);


    $("totalPaid")
        .textContent =
        totalPaid.toFixed(2);


    $("totalDue")
        .textContent =
        (
            totalFee -
            totalPaid
        ).toFixed(2);


    if(!list.length){

        $("feeList").innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty"
                >
                    কোনো Fee record নেই
                </td>

            </tr>

        `;

        return;

    }


    $("feeList").innerHTML =

        list.map(
            fee => {

                const student =
                    findStudent(
                        fee.student_id
                    );


                const amount =
                    Number(
                        fee.amount
                    ) || 0;


                const paid =
                    Number(
                        fee.paid_amount
                    ) || 0;


                const due =
                    amount - paid;


                return `

                <tr>

                    <td>

                        ${
                            escapeHtml(
                                getStudentCode(
                                    student
                                )
                            )
                        }

                        ${
                            getStudentCode(student)
                                ? " - "
                                : ""
                        }

                        ${
                            escapeHtml(
                                student.name ||
                                "-"
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                getClassName(
                                    student
                                ) || "-"
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                getSession(
                                    student
                                ) || "-"
                            )
                        }

                    </td>


                    <td>
                        ${
                            escapeHtml(
                                fee.fee_month ||
                                "-"
                            )
                        }
                    </td>


                    <td>
                        ${amount.toFixed(2)}
                    </td>


                    <td>
                        ${paid.toFixed(2)}
                    </td>


                    <td>
                        ${due.toFixed(2)}
                    </td>


                    <td>
                        ${
                            escapeHtml(
                                fee.payment_date ||
                                "-"
                            )
                        }
                    </td>


                    <td>
                        ${
                            escapeHtml(
                                fee.payment_method ||
                                "-"
                            )
                        }
                    </td>


                    <td>

                        <button
                            class="edit"
                            onclick="editFee('${escapeHtml(fee.id)}')"
                        >
                            Edit
                        </button>

                        <button
                            class="delete"
                            onclick="deleteFee('${escapeHtml(fee.id)}')"
                        >
                            Delete
                        </button>

                    </td>

                </tr>

                `;

            }
        ).join("");

}



/* =================================
   SAVE / UPDATE
================================= */

$("feeForm").addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const editId =
            $("editId").value;


        const studentId =
            $("studentId").value;


        if(!studentId){

            message(
                "❌ Student নির্বাচন করুন।",
                true
            );

            return;

        }


        const amount =
            Number(
                $("amount").value
            );


        const paid =
            Number(
                $("paidAmount").value
            );


        if(paid > amount){

            message(
                "❌ Paid Amount Fee Amount-এর চেয়ে বেশি হতে পারবে না।",
                true
            );

            return;

        }


        const record = {

            student_id:
                studentId,

            fee_month:
                $("feeMonth").value,

            amount:
                amount,

            paid_amount:
                paid,

            payment_date:
                $("paymentDate").value ||
                null,

            payment_method:
                $("method").value

        };


        $("saveBtn").disabled =
            true;


        message(
            "Saving..."
        );


        try{

            let result;


            if(editId){

                result =

                    await db
                        .from("fees")
                        .update(record)
                        .eq("id",editId)
                        .select("*")
                        .single();

            }
            else{

                result =

                    await db
                        .from("fees")
                        .insert(record)
                        .select("*")
                        .single();

            }


            if(result.error){

                message(
                    "❌ " +
                    result.error.message,
                    true
                );

                return;

            }


            if(editId){

                const index =
                    fees.findIndex(
                        f =>
                            String(f.id) ===
                            String(editId)
                    );


                if(index !== -1){

                    fees[index] =
                        result.data;

                }

            }
            else{

                fees.unshift(
                    result.data
                );

            }


            renderFees(
                fees
            );


            resetForm();


            message(
                "✅ Payment saved successfully."
            );


        }
        catch(error){

            message(
                "❌ " +
                error.message,
                true
            );

        }
        finally{

            $("saveBtn").disabled =
                false;

        }

    }
);



/* =================================
   EDIT
================================= */

function editFee(id){

    const fee =
        fees.find(
            f =>
                String(f.id) ===
                String(id)
        );


    if(!fee)
        return;


    const student =
        findStudent(
            fee.student_id
        );


    selectedSession =
        getSession(
            student
        );


    $("sessionFilter").value =
        selectedSession;


    updateClasses();


    const classId =
        getClassId(
            student
        );


    if(classId !== null){

        selectedClass =
            String(
                classId
            );

        $("classFilter").value =
            selectedClass;

    }
    else{

        const className =
            getClassName(
                student
            );


        const option =
            [...$("classFilter").options]
                .find(
                    o =>
                        o.textContent.trim() ===
                        className
                );


        if(option){

            selectedClass =
                option.value;

            $("classFilter").value =
                option.value;

        }

    }


    updateStudents();


    $("studentId").value =
        fee.student_id || "";


    $("editId").value =
        fee.id;


    $("feeMonth").value =
        fee.fee_month || "";


    $("amount").value =
        fee.amount ?? "";


    $("paidAmount").value =
        fee.paid_amount ?? "";


    $("paymentDate").value =
        fee.payment_date || "";


    $("method").value =
        fee.payment_method ||
        "Cash";


    $("formTitle").textContent =
        "✏️ Edit Fee";


    $("saveBtn").textContent =
        "💾 Update Payment";


    $("cancelBtn").style.display =
        "inline-block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =================================
   DELETE
================================= */

async function deleteFee(id){

    if(
        !confirm(
            "এই Fee record Delete করতে চান?"
        )
    ){

        return;

    }


    const {
        error
    } =

    await db
        .from("fees")
        .delete()
        .eq("id",id);


    if(error){

        alert(
            error.message
        );

        return;

    }


    fees =
        fees.filter(
            f =>
                String(f.id) !==
                String(id)
        );


    renderFees(
        fees
    );

}



/* =================================
   RESET
================================= */

function resetForm(){

    $("feeForm").reset();


    $("editId").value =
        "";


    $("paymentDate").value =
        today();


    $("formTitle").textContent =
        "➕ Add Fee Payment";


    $("saveBtn").textContent =
        "💾 Save Payment";


    $("cancelBtn").style.display =
        "none";


    $("sessionFilter").value =
        selectedSession;


    updateClasses();


    $("classFilter").value =
        selectedClass;


    updateStudents();

}


$("cancelBtn").onclick =
    resetForm;



/* =================================
   SEARCH
================================= */

$("search").addEventListener(
    "input",
    function(){

        const q =
            this.value
                .toLowerCase()
                .trim();


        if(!q){

            renderFees(
                fees
            );

            return;

        }


        const filtered =
            fees.filter(
                fee => {

                    const student =
                        findStudent(
                            fee.student_id
                        );


                    const text = [

                        student.name,

                        getStudentCode(
                            student
                        ),

                        getRoll(
                            student
                        ),

                        getSession(
                            student
                        ),

                        getClassName(
                            student
                        ),

                        fee.fee_month,

                        fee.payment_method

                    ]

                    .join(" ")

                    .toLowerCase();


                    return text.includes(
                        q
                    );

                }
            );


        renderFees(
            filtered
        );

    }
);



/* =================================
   START
================================= */

start();

</script>

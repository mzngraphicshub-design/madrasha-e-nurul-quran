<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Fees | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}

:root{
 --primary:#087f5b;
 --dark:#056044;
 --light:#e9f7f2;
 --bg:#f5f7f9;
 --muted:#6b7280;
 --border:#e5e7eb;
 --danger:#c62828;
 --blue:#1565c0
}

body{
 margin:0;
 font-family:'Bornomala',Arial,sans-serif;
 background:var(--bg);
 color:#222
}

.top{
 background:var(--primary);
 color:#fff;
 padding:15px 20px;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.top h2{
 margin:0;
 font-size:19px;
 color:#fff
}

.top a{
 color:#fff;
 text-decoration:none;
 font-size:13px
}

.container{
 max-width:1100px;
 margin:22px auto;
 padding:0 14px
}

.box{
 background:#fff;
 padding:20px;
 border-radius:12px;
 box-shadow:0 2px 10px #0001;
 margin-bottom:18px
}

h3{
 color:var(--dark);
 margin:0 0 15px;
 font-size:17px
}

.filter{
 background:var(--light);
 border:1px solid #d8eee6;
 border-radius:9px;
 padding:13px
}

.form{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:13px
}

.full{
 grid-column:1/-1
}

label{
 font-weight:bold;
 font-size:13px;
 display:block
}

input,select{
 width:100%;
 padding:10px;
 margin-top:5px;
 border:1px solid var(--border);
 border-radius:7px;
 background:#fff;
 font-size:13px
}

input:focus,select:focus{
 outline:0;
 border-color:var(--primary);
 box-shadow:0 0 0 2px #087f5b18
}

button{
 border:0;
 padding:9px 14px;
 border-radius:7px;
 background:var(--primary);
 color:#fff;
 font-weight:bold;
 cursor:pointer
}

button:disabled{
 opacity:.55;
 cursor:not-allowed
}

.cancel{
 background:#777;
 margin-left:6px
}

.edit{
 background:var(--blue)
}

.delete{
 background:var(--danger)
}

.note{
 font-size:11px;
 color:var(--muted);
 margin-top:5px
}

.msg{
 min-height:18px;
 margin-top:9px;
 font-size:12px
}

.ok{
 color:var(--primary)
}

.err{
 color:var(--danger)
}

.summary{
 display:flex;
 gap:9px;
 flex-wrap:wrap;
 margin-bottom:14px
}

.card{
 background:var(--light);
 padding:10px 14px;
 border-radius:8px;
 font-weight:bold;
 font-size:12px
}

.search{
 margin-bottom:13px
}

.table-wrap{
 overflow:auto
}

table{
 width:100%;
 border-collapse:collapse
}

th,td{
 padding:9px 7px;
 border-bottom:1px solid var(--border);
 font-size:12px;
 text-align:left;
 white-space:nowrap
}

th{
 background:var(--primary);
 color:#fff
}

.loading{
 text-align:center;
 padding:18px
}

@media(max-width:650px){

.form{
 grid-template-columns:1fr
}

.full{
 grid-column:auto
}

table{
 min-width:900px
}

}
</style>
</head>

<body>

<header class="top">

<h2>💰 Student Fees</h2>

<a href="dashboard.html">
← Dashboard
</a>

</header>


<div class="container">


<!-- =========================
     SESSION & CLASS
========================= -->

<div class="box">

<h3>
🔎 Class & Session অনুযায়ী শিক্ষার্থী নির্বাচন
</h3>

<div class="filter">

<div class="form">


<div>

<label>
Session *
</label>

<select
id="sessionFilter"
required
>

<option value="">
Session নির্বাচন করুন
</option>

</select>

<div class="note">
Session নির্বাচন করলে সেই Session-এর Class দেখাবে।
</div>

</div>


<div>

<label>
Class *
</label>

<select
id="classFilter"
required
disabled
>

<option value="">
Class নির্বাচন করুন
</option>

</select>

</div>


</div>

</div>

</div>



<!-- =========================
     ADD FEE
========================= -->

<div class="box">

<h3 id="formTitle">
➕ Add Fee Payment
</h3>


<form id="feeForm">

<input
type="hidden"
id="editId"
>


<div class="full">

<label>
Student *
</label>

<select
id="studentId"
required
disabled
>

<option value="">
আগে Session ও Class নির্বাচন করুন
</option>

</select>

</div>


<div>

<label>
Fee Month *
</label>

<input
type="month"
id="feeMonth"
required
>

</div>


<div>

<label>
Fee Amount *
</label>

<input
type="number"
id="amount"
min="0"
step="0.01"
required
placeholder="যেমন: 1000"
>

</div>


<div>

<label>
Paid Amount *
</label>

<input
type="number"
id="paidAmount"
min="0"
step="0.01"
required
placeholder="যেমন: 1000"
>

</div>


<div>

<label>
Payment Date
</label>

<input
type="date"
id="paymentDate"
>

</div>


<div>

<label>
Payment Method
</label>

<select id="method">

<option value="Cash">
Cash
</option>

<option value="bKash">
bKash
</option>

<option value="Nagad">
Nagad
</option>

<option value="Bank">
Bank
</option>

</select>

</div>


<div class="full">

<button
type="submit"
id="saveBtn"
>
💾 Save Payment
</button>


<button
type="button"
class="cancel"
id="cancelBtn"
style="display:none"
>
Cancel
</button>


<div
id="msg"
class="msg"
></div>

</div>

</form>

</div>



<!-- =========================
     FEE COLLECTION
========================= -->

<div class="box">

<h3>
💰 Fee Collection
</h3>


<div class="summary">

<div class="card">
Total Fee:
<span id="totalFee">
0.00
</span>
</div>


<div class="card">
Paid:
<span id="totalPaid">
0.00
</span>
</div>


<div class="card">
Due:
<span id="totalDue">
0.00
</span>
</div>

</div>


<input
class="search"
id="search"
placeholder="🔍 Student name / ID / Roll দিয়ে খুঁজুন..."
>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
Student
</th>

<th>
Class
</th>

<th>
Session
</th>

<th>
Month
</th>

<th>
Fee
</th>

<th>
Paid
</th>

<th>
Due
</th>

<th>
Date
</th>

<th>
Method
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody id="feeList">

<tr>

<td
colspan="10"
class="loading"
>
Loading...
</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";


const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let students = [];

let classes = [];

let fees = [];


let selectedSession = "";

let selectedClass = "";



const $ =
id =>
document.getElementById(id);



function today(){

return new Date()
.toISOString()
.split("T")[0];

}



function esc(v){

return String(v ?? "")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}



function msg(text,error=false){

$("msg").textContent = text;

$("msg").className =
"msg " +
(error ? "err" : "ok");

}



$("paymentDate").value =
today();



// ===============================
// START
// ===============================

async function start(){

try{

const {

data:{
session

}

} =
await db.auth.getSession();


if(!session){

location.href =
"admin.html";

return;

}


await loadStudentsAndClasses();


await loadFees();


}catch(e){

msg(
"❌ " + e.message,
true
);

}

}



// ===============================
// LOAD STUDENTS + CLASSES
// ===============================

async function loadStudentsAndClasses(){

const [
studentResult,
classResult

] =

await Promise.all([

db

.from("students")

.select(
"id,student_id,name,class_id,session,roll"
)

.order("name"),


db

.from("classes")

.select(
"id,name"
)

.order("name")

]);


if(studentResult.error)
throw studentResult.error;


if(classResult.error)
throw classResult.error;


students =
studentResult.data || [];


classes =
classResult.data || [];


buildSessions();


updateClasses();


updateStudents();

}



// ===============================
// CLASS NAME
// ===============================

function className(student){

const c =
classes.find(
x =>
String(x.id) ===
String(student.class_id)
);


return c?.name || "";

}



// ===============================
// SESSION LIST
// ===============================

function buildSessions(){

const select =
$("sessionFilter");


const old =
selectedSession;


const arr = [

...new Set(

students

.map(
s =>
String(
s.session ?? ""
)
.trim()
)

.filter(Boolean)

)

];


arr.sort(
(a,b) =>
a.localeCompare(
b,
undefined,
{
numeric:true
}
)
);


select.innerHTML =
`
<option value="">
Session নির্বাচন করুন
</option>
`;


arr.forEach(
value => {

const option =
document.createElement(
"option"
);


option.value =
value;


option.textContent =
value;


select.appendChild(
option
);

});


if(
arr.includes(old)
){

select.value =
old;

}

}



// ===============================
// UPDATE CLASS
// ===============================

function updateClasses(){

const select =
$("classFilter");


const arr = [

...new Set(

students

.filter(
s =>
String(
s.session ?? ""
) ===
selectedSession
)

.map(
s =>
String(
s.class_id ?? ""
)
)

.filter(Boolean)

)

];


select.innerHTML =
`
<option value="">
Class নির্বাচন করুন
</option>
`;


arr

.map(
id =>
classes.find(
c =>
String(c.id) ===
id
)
)

.filter(Boolean)

.sort(
(a,b) =>
a.name.localeCompare(
b.name,
undefined,
{
numeric:true
}
)
)

.forEach(
c => {

const option =
document.createElement(
"option"
);


option.value =
c.id;


option.textContent =
c.name;


select.appendChild(
option
);

});


select.disabled =
!selectedSession;


if(
arr.includes(
String(selectedClass)
)
){

select.value =
selectedClass;

}else{

selectedClass = "";

select.value = "";

}

}



// ===============================
// UPDATE STUDENTS
// ===============================

function updateStudents(){

const select =
$("studentId");


if(
!selectedSession ||
!selectedClass
){

select.disabled = true;


select.innerHTML =
`
<option value="">
আগে Session ও Class নির্বাচন করুন
</option>
`;


return;

}


const arr =
students.filter(
s =>

String(
s.session ?? ""
) ===
selectedSession

&&

String(
s.class_id ?? ""
) ===
String(
selectedClass
)

);


select.disabled =
false;


select.innerHTML =
`
<option value="">
Student নির্বাচন করুন
</option>
`;


arr.forEach(
s => {

const option =
document.createElement(
"option"
);


option.value =
s.id;


option.textContent =

`${s.student_id || ""}` +

`${s.student_id ? " - " : ""}` +

`${s.name || ""}` +

`${s.roll ? " | Roll: " + s.roll : ""}`;


select.appendChild(
option
);

});


if(!arr.length){

select.innerHTML =
`
<option value="">
এই Class/Session-এ কোনো Student নেই
</option>
`;

}

}



// ===============================
// SESSION CHANGE
// ===============================

$("sessionFilter").onchange =
function(){

selectedSession =
this.value;


selectedClass =
"";


$("classFilter").value =
"";


updateClasses();


updateStudents();

};



// ===============================
// CLASS CHANGE
// ===============================

$("classFilter").onchange =
function(){

selectedClass =
this.value;


updateStudents();

};



// ===============================
// LOAD FEES
// ===============================

async function loadFees(){

const {

data,
error

} =

await db

.from("fees")

.select("*")

.order(
"payment_date",
{
ascending:false
}
);


if(error){

$("feeList").innerHTML =

`
<tr>

<td
colspan="10"
class="err"
>

❌ ${esc(error.message)}

</td>

</tr>
`;

return;

}


fees =
data || [];


render(fees);

}



// ===============================
// FIND STUDENT
// ===============================

function studentOf(fee){

return students.find(
s =>
String(s.id) ===
String(fee.student_id)
) || {};

}



// ===============================
// RENDER
// ===============================

function render(list){

let totalFee = 0;

let totalPaid = 0;


list.forEach(
fee => {

totalFee +=
Number(fee.amount) || 0;


totalPaid +=
Number(fee.paid_amount) || 0;

});


$("totalFee").textContent =
totalFee.toFixed(2);


$("totalPaid").textContent =
totalPaid.toFixed(2);


$("totalDue").textContent =
(
totalFee -
totalPaid
).toFixed(2);



if(!list.length){

$("feeList").innerHTML =

`
<tr>

<td
colspan="10"
style="text-align:center"
>

কোনো Fee record নেই

</td>

</tr>
`;

return;

}



$("feeList").innerHTML =

list.map(
fee => {

const student =
studentOf(fee);


const amount =
Number(
fee.amount
) || 0;


const paid =
Number(
fee.paid_amount
) || 0;


return `

<tr>

<td>

${esc(
student.student_id || ""
)}

${student.student_id ? "- " : ""}

${esc(
student.name || "-"
)}

</td>


<td>

${esc(
className(student) || "-"
)}

</td>


<td>

${esc(
student.session || "-"
)}

</td>


<td>

${esc(
fee.fee_month || "-"
)}

</td>


<td>

${amount.toFixed(2)}

</td>


<td>

${paid.toFixed(2)}

</td>


<td>

${(
amount -
paid
).toFixed(2)}

</td>


<td>

${esc(
fee.payment_date || "-"
)}

</td>


<td>

${esc(
fee.payment_method || "-"
)}

</td>


<td>

<button
class="edit"
onclick="editFee('${esc(fee.id)}')"
>
Edit
</button>


<button
class="delete"
onclick="deleteFee('${esc(fee.id)}')"
>
Delete
</button>

</td>

</tr>

`;

}

).join("");

}



// ===============================
// ADD / UPDATE FEE
// ===============================

$("feeForm").onsubmit =
async function(e){

e.preventDefault();


const editId =
$("editId").value;


const amount =
Number(
$("amount").value
);


const paid =
Number(
$("paidAmount").value
);



if(
!$("studentId").value
){

msg(
"❌ Student নির্বাচন করুন",
true
);

return;

}



if(
paid > amount
){

msg(
"❌ Paid Amount, Fee Amount-এর চেয়ে বেশি হতে পারবে না।",
true
);

return;

}



const record = {

student_id:
$("studentId").value,

fee_month:
$("feeMonth").value,

amount:
amount,

paid_amount:
paid,

payment_date:
$("paymentDate").value ||
null,

payment_method:
$("method").value

};



$("saveBtn").disabled =
true;


msg("Saving...");



try{

let result;


if(editId){

result =

await db

.from("fees")

.update(record)

.eq(
"id",
editId
)

.select("*")

.single();

}else{

result =

await db

.from("fees")

.insert(record)

.select("*")

.single();

}



if(result.error){

msg(
"❌ " +
result.error.message,
true
);

return;

}



if(editId){

const index =
fees.findIndex(
x =>
String(x.id) ===
String(editId)
);


if(index >= 0){

fees[index] =
result.data;

}

}else{

fees.unshift(
result.data
);

}



render(fees);


resetForm();


msg(
"✅ Saved successfully"
);


}catch(e){

msg(
"❌ " +
e.message,
true
);

}finally{

$("saveBtn").disabled =
false;

}

};



// ===============================
// EDIT
// ===============================

function editFee(id){

const fee =
fees.find(
x =>
String(x.id) ===
String(id)
);


if(!fee)
return;


const student =
studentOf(fee);


selectedSession =
String(
student.session || ""
);


selectedClass =
String(
student.class_id || ""
);


$("sessionFilter").value =
selectedSession;


updateClasses();


$("classFilter").value =
selectedClass;


updateStudents();


$("studentId").value =
fee.student_id || "";


$("editId").value =
fee.id;


$("feeMonth").value =
fee.fee_month || "";


$("amount").value =
fee.amount || 0;


$("paidAmount").value =
fee.paid_amount || 0;


$("paymentDate").value =
fee.payment_date || "";


$("method").value =
fee.payment_method ||
"Cash";


$("formTitle").textContent =
"✏️ Edit Fee";


$("saveBtn").textContent =
"💾 Update Payment";


$("cancelBtn").style.display =
"inline-block";


window.scrollTo({

top:0,

behavior:"smooth"

});

}



// ===============================
// DELETE
// ===============================

async function deleteFee(id){

if(
!confirm(
"এই Fee record Delete করতে চান?"
)
)
return;


const {
error
} =

await db

.from("fees")

.delete()

.eq(
"id",
id
);


if(error){

alert(
error.message
);

return;

}


fees =
fees.filter(
fee =>
String(fee.id) !==
String(id)
);


render(fees);

}



// ===============================
// RESET
// ===============================

function resetForm(){

$("feeForm").reset();


$("editId").value =
"";


$("paymentDate").value =
today();


$("formTitle").textContent =
"➕ Add Fee Payment";


$("saveBtn").textContent =
"💾 Save Payment";


$("cancelBtn").style.display =
"none";


$("sessionFilter").value =
selectedSession;


updateClasses();


$("classFilter").value =
selectedClass;


updateStudents();

}



$("cancelBtn").onclick =
resetForm;



// ===============================
// SEARCH
// ===============================

$("search").oninput =
function(){

const q =
this.value
.toLowerCase()
.trim();


render(

fees.filter(
fee => {

const student =
studentOf(fee);


return [

student.name,

student.student_id,

student.roll,

student.session,

className(student),

fee.fee_month

]

.some(
value =>
String(
value || ""
)

.toLowerCase()

.includes(q)
);

}

)

);

};



// ===============================
// START
// ===============================

start();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<script>/* MNQ access guard (inline) */
/* =========================================================
   মাদরাসায়ে নূরুল কুরআন — Shared Access Guard
   সব পেজের <head> এর একদম শুরুতে লোড হয়:
   (এই কোড প্রতিটি পেজের <head> এ inline বসানো আছে)
   - Admin   : সব পেজ
   - Teacher : শুধু dashboard + allowed_pages (hub/settings বন্ধ)
   - Student : শুধু student-dashboard, payment-receipt, invoice
   নতুন পেজ বানালে কিছু করতে হবে না; Teacher-কে access দিতে
   teacher-access পেজ থেকে পেজের নাম (যেমন: students) যোগ করুন।
   ========================================================= */
(function () {
  "use strict";
  window.MNQ_GUARD_VERSION = "20261116b";

  /* ---------------------------------------------------------
     Teacher session shim
     Teacher login RPC দিয়ে হয়, Supabase Auth session তৈরি হয় না।
     কিন্তু বেশিরভাগ পেজ getSession() খালি দেখলে login এ ফেরত পাঠায়।
     তাই শুধু Teacher হলে getSession()/getUser() এ "teacher session"
     দেখানো হয়। (Admin/Student এ কিছুই বদলায় না।)
     supabase-js CDN <script> এর ঠিক পরে mnqPatchSupabase() চালাতে হয়।
     --------------------------------------------------------- */
  window.mnqPatchSupabase = function () {
    try {
      if ((sessionStorage.getItem("madrasa_login_role") || "").toLowerCase() !== "teacher") return;
      var sb = window.supabase;
      if (!sb || typeof sb.createClient !== "function" || sb.__mnqPatched) return;
      var t = {};
      try { t = JSON.parse(sessionStorage.getItem("madrasa_teacher_login") || "{}") || {}; } catch (e) {}
      var user = {
        id: String(t.id || t.teacher_id || t.phone || "teacher"),
        email: t.email || "",
        role: "authenticated",
        aud: "authenticated",
        app_metadata: { role: "teacher" },
        user_metadata: { role: "teacher", name: t.name || "" }
      };
      var fake = {
        access_token: "teacher-session", refresh_token: "", token_type: "bearer",
        expires_in: 86400, expires_at: Math.floor(Date.now() / 1000) + 86400, user: user
      };
      var orig = sb.createClient;
      var wrapped = function () {
        var c = orig.apply(this, arguments);
        try {
          var a = c.auth, rs = a.getSession.bind(a), ru = a.getUser.bind(a), ro = a.onAuthStateChange.bind(a);
          a.getSession = async function () {
            var r = await rs();
            return (r && r.data && r.data.session) ? r : { data: { session: fake }, error: null };
          };
          a.getUser = async function () {
            var r = await ru();
            return (r && r.data && r.data.user) ? r : { data: { user: user }, error: null };
          };
          a.onAuthStateChange = function (cb) {
            return ro(function (ev, s) { return cb(ev, s || fake); });
          };
        } catch (e) { console.warn("teacher shim:", e); }
        return c;
      };
      var copy = {};
      Object.keys(sb).forEach(function (k) { copy[k] = sb[k]; });
      copy.createClient = wrapped;
      copy.__mnqPatched = true;
      window.supabase = copy;
    } catch (e) { console.warn("mnqPatchSupabase:", e); }
  };

  var PUBLIC = ["", "index", "login", "login-teacher", "students-login", "online-admission-public"];
  var TEACHER_BLOCKED = ["donations-hub", "accounts-hub", "settings-hub", "settings", "teacher-access", "admin"];
  var STUDENT_ALLOWED = ["student-dashboard", "payment-receipt", "invoice", "students-login"];

  function keyFor(url) {
    return String(url || "").split(/[?#]/)[0].split("/").pop().toLowerCase().replace(/\.html$/, "");
  }
  function read(k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return null; } }

  var current = keyFor(location.pathname) || "index";
  if (PUBLIC.indexOf(current) > -1) return;

  var role = (sessionStorage.getItem("madrasa_login_role") || "").toLowerCase();
  var isStudent = !!sessionStorage.getItem("madrasa_student_login") && role !== "admin" && role !== "teacher";

  if (role === "admin") return;                       // Admin = সব

  if (!role && !isStudent) {                          // লগইন নেই
    location.replace("login.html");
    return;
  }

  var allowed = {};
  if (role === "teacher") {
    var t = read("madrasa_teacher_login") || {};
    (Array.isArray(t.allowed_pages) ? t.allowed_pages : []).forEach(function (p) {
      p = keyFor(p); if (p) allowed[p] = 1;
    });
  }

  function can(url) {
    var k = keyFor(url);
    if (!k) return true;
    if (isStudent) return STUDENT_ALLOWED.indexOf(k) > -1;
    if (TEACHER_BLOCKED.indexOf(k) > -1) return false;
    if (k === "teacher-dashboard") return true;      /* শিক্ষকের নিজস্ব ড্যাশবোর্ড */
    if (k === "dashboard" || k === "student-dashboard") return false;  /* admin dashboard শিক্ষকের জন্য নয় */
    return !!allowed[k] || !!allowed["*"];
  }

  var home = isStudent ? "student-dashboard.html" : "teacher-dashboard.html";

  /* সরাসরি URL দিয়ে ঢোকা আটকানো */
  if (!can(current)) {
    document.documentElement.style.visibility = "hidden";
    location.replace(home);
    return;
  }

  /* লুকানোর CSS (পেজ আঁকার আগেই) */
  var st = document.createElement("style");
  st.textContent = 'html body [data-denied="1"],html body a[data-denied="1"]{display:none!important;visibility:hidden!important;pointer-events:none!important}';
  document.documentElement.appendChild(st);

  var SD_MAP = { sms: "sms", stu: "students", inv: "invoice", pay: "payment-receipt" };

  function deny(el) {
    el.setAttribute("data-denied", "1");
    el.setAttribute("aria-hidden", "true");
    el.setAttribute("tabindex", "-1");
    /* inline !important — পেজের নিজের CSS যেন ওভাররাইড করতে না পারে */
    el.style.setProperty("display", "none", "important");
  }

  function sweep() {
    document.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href") || "";
      if (!/\.html(?:[?#]|$)/i.test(h)) return;
      if (!isStudent && keyFor(h) === "dashboard") { a.setAttribute("href", "teacher-dashboard.html"); return; }
      if (!can(h)) deny(a);
    });
    /* onclick="location.href='x.html'" ধরনের বাটন/কার্ড */
    document.querySelectorAll("[onclick*='.html']").forEach(function (el) {
      var m = /([A-Za-z0-9_\-]+\.html)/.exec(el.getAttribute("onclick") || "");
      if (m && !can(m[1])) deny(el);
    });
    document.querySelectorAll("[data-href],[data-url]").forEach(function (el) {
      var u = el.getAttribute("data-href") || el.getAttribute("data-url") || "";
      if (/\.html/i.test(u) && !can(u)) deny(el);
    });
    document.querySelectorAll(".sd .opt").forEach(function (b) {
      var k = SD_MAP[b.dataset.a];
      if (k && !can(k)) deny(b);
    });
    /* খালি গ্রুপ লুকানো */
    document.querySelectorAll(".nav-group, .bottom-nav-group").forEach(function (g) {
      var l = g.querySelectorAll("a[href]");
      if (l.length && Array.prototype.every.call(l, function (a) { return a.getAttribute("data-denied") === "1"; }))
        g.style.setProperty("display", "none", "important");
    });
  }


  /* ডিবাগ: যেকোনো পেজের URL এর শেষে ?guarddebug দিলে নিচে একটা বার্তা আসবে */
  if (/[?&]guarddebug/.test(location.search)) {
    document.addEventListener("DOMContentLoaded", function () {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;left:6px;right:6px;top:6px;z-index:2147483647;background:#111;color:#0f0;font:12px monospace;padding:8px;border-radius:8px;white-space:pre-wrap";
      d.textContent = "guard v" + window.MNQ_GUARD_VERSION + " | page=" + current + " | role=" + (role || (isStudent ? "student" : "none")) +
        " | allowed=" + Object.keys(allowed).join(",") +
        " | hidden=" + document.querySelectorAll('[data-denied="1"]').length;
      document.body.appendChild(d);
    });
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("[data-denied=\"1\"]");
    if (a) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  document.addEventListener("DOMContentLoaded", function () {
    sweep();
    var pending = false;
    new MutationObserver(function () {
      if (pending) return; pending = true;
      setTimeout(function () { pending = false; sweep(); }, 50);
    }).observe(document.body, { childList: true, subtree: true });
  });
})();

</script>

const BEH=[['','— বাছাই করুন —'],['excellent','চমৎকার'],['good','ভালো'],['average','মোটামুটি'],['improve','উন্নতি দরকার']];
const BEHL={excellent:'চমৎকার',good:'ভালো',average:'মোটামুটি',improve:'উন্নতি দরকার'};
function tab(t){$('paneW').classList.toggle('hide',t!=='W');$('paneH').classList.toggle('hide',t!=='H');$('tabW').classList.toggle('on',t==='W');$('tabH').classList.toggle('on',t==='H')}
async function init(){
  CLASSES=await loadClasses();
  fillClassSel($('cls'),CLASSES,'ক্লাস নির্বাচন করুন');
  fillClassSel($('hcls'),CLASSES,'সব ক্লাস');
  $('date').value=today();$('hto').value=today();
  const d=new Date();d.setDate(d.getDate()-7);$('hfrom').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  $('cls').onchange=loadList;$('date').onchange=loadList;$('q').oninput=render;
}
async function loadList(){
  const cid=$('cls').value,date=$('date').value;
  $('savebar').classList.add('hide');
  if(!cid||!date){$('list').innerHTML='<div class="empty">ক্লাস ও তারিখ নির্বাচন করুন</div>';return}
  $('list').innerHTML=loading();
  const [s,r]=await Promise.all([
    sb.from('students').select('*').eq('class_id',cid).order('roll_number'),
    sb.from('parent_daily_reports').select('*').eq('report_date',date).eq('class_id',cid)]);
  if(s.error){$('list').innerHTML=errBox(s.error);return}
  if(r.error){$('list').innerHTML=errBox(r.error);return}
  STU=s.data||[];ROWS={};
  (r.data||[]).forEach(x=>ROWS[x.student_id]={att:x.attendance||'',lesson:x.lesson_text||'',hw:x.homework||'',beh:x.behavior||'',note:x.note||'',saved:true,dirty:false});
  render();
}
function row(id){return ROWS[id]||(ROWS[id]={att:'',lesson:'',hw:'',beh:'',note:'',saved:false,dirty:false})}
function render(){
  const f=($('q').value||'').trim().toLowerCase();
  const list=STU.filter(s=>!f||String(s.name||'').toLowerCase().includes(f)||String(s.roll_number||'').includes(f));
  if(!STU.length){$('list').innerHTML='<div class="empty">এই ক্লাসে কোনো শিক্ষার্থী নেই</div>';return}
  $('list').innerHTML=list.map(s=>{
    const r=row(s.id),filled=(r.lesson||r.hw||r.beh||r.note)?' ✎':'';
    return '<div class="st" data-id="'+s.id+'"><div class="sth"><b>'+esc(s.roll_number?s.roll_number+'. ':'')+esc(s.name)+'</b>'+(r.saved&&!r.dirty?'<span class="ok">✓ সেভ</span>':'')+'</div>'+
    '<div class="chips">'+ATT.map(a=>'<button class="chip '+a[2]+(r.att===a[0]?' on':'')+'" data-att="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>'+
    '<details'+(filled?' open':'')+'><summary>বিস্তারিত লিখুন'+filled+'</summary>'+
    '<label>আজকের পড়া</label><textarea data-f="lesson">'+esc(r.lesson)+'</textarea>'+
    '<label>হোমওয়ার্ক</label><textarea data-f="hw">'+esc(r.hw)+'</textarea>'+
    '<label>আচরণ</label><select data-f="beh">'+BEH.map(b=>'<option value="'+b[0]+'"'+(r.beh===b[0]?' selected':'')+'>'+b[1]+'</option>').join('')+'</select>'+
    '<label>মন্তব্য</label><input data-f="note" value="'+esc(r.note)+'">'+
    '<div class="sh"><button class="btn sm" data-share="wa">WhatsApp</button><button class="btn ghost sm" data-share="sms">SMS</button><button class="btn ghost sm" data-share="copy">কপি</button></div></details></div>';
  }).join('')||'<div class="empty">কোনো শিক্ষার্থী পাওয়া যায়নি</div>';
  $('savebar').classList.toggle('hide',!STU.length);
}
function msgFor(s){
  const r=row(s.id),c=CLASSES.find(x=>String(x.id)===String($('cls').value));
  return 'আসসালামু আলাইকুম,\nমাদরাসায়ে নূরুল কুরআন — দৈনিক রিপোর্ট ('+bnDate($('date').value)+')\n'+
   'শিক্ষার্থী: '+s.name+(c?' ('+clsName(c)+')':'')+'\n'+
   (r.att?'উপস্থিতি: '+ATTL[r.att]+'\n':'')+(r.lesson?'আজকের পড়া: '+r.lesson+'\n':'')+(r.hw?'হোমওয়ার্ক: '+r.hw+'\n':'')+
   (r.beh?'আচরণ: '+BEHL[r.beh]+'\n':'')+(r.note?'মন্তব্য: '+r.note+'\n':'')+'জাযাকাল্লাহ।';
}
$('list').addEventListener('click',e=>{
  const card=e.target.closest('.st');if(!card)return;const id=Number(card.dataset.id),s=STU.find(x=>x.id===id);
  const a=e.target.closest('[data-att]');
  if(a){const r=row(id);r.att=r.att===a.dataset.att?'':a.dataset.att;r.dirty=true;card.querySelectorAll('[data-att]').forEach(b=>b.classList.toggle('on',b.dataset.att===r.att));const ok=card.querySelector('.ok');if(ok)ok.remove();return}
  const sh=e.target.closest('[data-share]');
  if(sh&&s){const m=msgFor(s),ph=phoneBD(s.mobile||s.guardian_mobile);
    if(sh.dataset.share==='copy'){(navigator.clipboard?navigator.clipboard.writeText(m):Promise.reject()).then(()=>toast('কপি হয়েছে'),()=>toast('কপি করা যায়নি',true));return}
    if(!ph){toast('অভিভাবকের মোবাইল নম্বর নেই',true);return}
    if(sh.dataset.share==='wa')window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(m),'_blank');
    else location.href='sms:+'+ph+'?body='+encodeURIComponent(m)}
});
$('list').addEventListener('input',e=>{
  const card=e.target.closest('.st'),f=e.target.dataset.f;if(!card||!f)return;
  const r=row(Number(card.dataset.id));r[f]=e.target.value;r.dirty=true;
});
function allPresent(){STU.forEach(s=>{const r=row(s.id);if(!r.att){r.att='present';r.dirty=true}});render()}
async function saveAll(){
  const cid=Number($('cls').value),date=$('date').value;
  const rows=STU.filter(s=>ROWS[s.id]&&ROWS[s.id].dirty).map(s=>{const r=ROWS[s.id];return{report_date:date,class_id:cid,student_id:s.id,attendance:r.att||null,lesson_text:r.lesson||null,homework:r.hw||null,behavior:r.beh||null,note:r.note||null,created_by:ME}});
  if(!rows.length){toast('নতুন কোনো পরিবর্তন নেই');return}
  $('saveBtn').disabled=true;
  const r=await sb.from('parent_daily_reports').upsert(rows,{onConflict:'report_date,student_id'});
  $('saveBtn').disabled=false;
  if(r.error){toast('সেভ হয়নি: '+r.error.message,true);return}
  rows.forEach(x=>{const o=ROWS[x.student_id];o.saved=true;o.dirty=false});
  toast(rows.length+' জনের রিপোর্ট সেভ হয়েছে');render();
}
async function loadHist(){
  $('hlist').innerHTML=loading();
  let q=sb.from('parent_daily_reports').select('*').order('report_date',{ascending:false}).limit(300);
  if($('hfrom').value)q=q.gte('report_date',$('hfrom').value);
  if($('hto').value)q=q.lte('report_date',$('hto').value);
  if($('hcls').value)q=q.eq('class_id',$('hcls').value);
  const r=await q;if(r.error){$('hlist').innerHTML=errBox(r.error);return}
  let data=r.data||[];
  const ids=[...new Set(data.map(x=>x.student_id))];
  const names={};
  if(ids.length){const s=await sb.from('students').select('id,name,roll_number').in('id',ids);(s.data||[]).forEach(x=>names[x.id]=x)}
  const f=($('hq').value||'').trim().toLowerCase();
  if(f)data=data.filter(x=>String((names[x.student_id]||{}).name||'').toLowerCase().includes(f));
  $('hlist').innerHTML=data.map(x=>{const n=names[x.student_id]||{};
    return '<div class="hrow"><b>'+esc(n.name||('ID '+x.student_id))+'</b> <span class="badge">'+esc(bnDate(x.report_date))+'</span>'+
    (x.attendance?'<br>উপস্থিতি: '+esc(ATTL[x.attendance]||x.attendance):'')+(x.lesson_text?'<br>পড়া: '+esc(x.lesson_text):'')+(x.homework?'<br>হোমওয়ার্ক: '+esc(x.homework):'')+
    (x.behavior?'<br>আচরণ: '+esc(BEHL[x.behavior]||x.behavior):'')+(x.note?'<br>মন্তব্য: '+esc(x.note):'')+
    '<br><span class="muted">লিখেছেন: '+esc(x.created_by||'-')+'</span>'+(IS_ADMIN?' <button class="btn red sm" onclick="delRep('+x.id+')">মুছুন</button>':'')+'</div>'}).join('')||'<div class="empty">কোনো রিপোর্ট পাওয়া যায়নি</div>';
}
async function delRep(id){if(!confirm('এই রিপোর্ট মুছে ফেলবেন?'))return;const r=await sb.from('parent_daily_reports').delete().eq('id',id);if(r.error){toast(r.error.message,true);return}toast('মুছে ফেলা হয়েছে');loadHist()}
init();

</script>
</body>
</html>

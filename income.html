<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";


const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let incomes = [];


/* =====================================================
   TODAY
===================================================== */

function today(){

    const d = new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type=""
){

    const msg =
        document.getElementById(
            "msg"
        );

    msg.textContent =
        text;

    msg.className =
        type;

}


/* =====================================================
   START
===================================================== */

async function start(){

    try{

        const {
            data,
            error
        } =
        await db.auth.getSession();


        if(error){

            showMessage(
                "❌ Session error: " +
                error.message,
                "error"
            );

            return;

        }


        if(!data.session){

            location.href =
                "admin.html";

            return;

        }


        document.getElementById(
            "incomeDate"
        ).value =
            today();


        await loadIncome();

    }

    catch(error){

        showMessage(
            "❌ Start error: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LOAD INCOME
===================================================== */

async function loadIncome(){

    const tbody =
        document.getElementById(
            "incomeList"
        );


    tbody.innerHTML = `

        <tr>

            <td
                colspan="8"
                class="loading">

                Loading...

            </td>

        </tr>

    `;


    const {
        data,
        error
    } =
    await db

        .from("incomes")

        .select("*")

        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        incomes = [];


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="error">

                    ❌ ${
                        escapeHtml(
                            error.message
                        )
                    }

                </td>

            </tr>

        `;

        return;

    }


    incomes =
        data || [];


    renderIncome();

}


/* =====================================================
   RENDER INCOME
===================================================== */

function renderIncome(
    list = incomes
){

    let total = 0;

    let donation = 0;

    let todayTotal = 0;


    const currentDate =
        today();


    list.forEach(
        function(item){

            const amount =
                Number(
                    item.amount
                ) || 0;


            total +=
                amount;


            const type =
                String(
                    item.income_type || ""
                ).toLowerCase();


            if(

                type.includes(
                    "donation"
                )

                ||

                type.includes(
                    "অনুদান"
                )

            ){

                donation +=
                    amount;

            }


            if(

                String(
                    item.income_date || ""
                ) === currentDate

            ){

                todayTotal +=
                    amount;

            }

        }
    );


    document.getElementById(
        "totalIncome"
    ).textContent =
        "৳ " +
        total.toFixed(2);


    document.getElementById(
        "totalDonation"
    ).textContent =
        "৳ " +
        donation.toFixed(2);


    document.getElementById(
        "todayIncome"
    ).textContent =
        "৳ " +
        todayTotal.toFixed(2);


    const tbody =
        document.getElementById(
            "incomeList"
        );


    if(!list.length){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    কোনো Income record নেই

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML =

        list.map(
            function(item){

                const amount =
                    Number(
                        item.amount
                    ) || 0;


                return `

                <tr>


                    <td>

                        ${
                            escapeHtml(
                                item.title ||
                                "-"
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                item.income_type ||
                                "-"
                            )
                        }

                    </td>


                    <td>

                        <b>
                            ৳ ${amount.toFixed(2)}
                        </b>

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                item.income_date ||
                                "-"
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                item.payment_method ||
                                "-"
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                item.received_from ||
                                "-"
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                item.description ||
                                "-"
                            )
                        }

                    </td>


                    <td class="action">


                        <button

                            type="button"

                            class="edit"

                            data-income-id="${
                                escapeHtml(
                                    String(
                                        item.id
                                    )
                                )
                            }"

                            onclick="
                                editIncomeFromButton(this)
                            ">

                            Edit

                        </button>


                        <button

                            type="button"

                            class="delete"

                            data-income-id="${
                                escapeHtml(
                                    String(
                                        item.id
                                    )
                                )
                            }"

                            onclick="
                                deleteIncomeFromButton(this)
                            ">

                            Delete

                        </button>


                    </td>


                </tr>

                `;

            }
        )

        .join("");

}


/* =====================================================
   BUTTON HANDLERS
===================================================== */

function editIncomeFromButton(
    button
){

    const id =
        button.getAttribute(
            "data-income-id"
        );


    editIncome(id);

}


function deleteIncomeFromButton(
    button
){

    const id =
        button.getAttribute(
            "data-income-id"
        );


    deleteIncome(id);

}


/* =====================================================
   INCOME TYPE CHANGE
===================================================== */

document.getElementById(
    "incomeType"
).addEventListener(
    "change",
    function(){

        const customBox =
            document.getElementById(
                "customBox"
            );


        const customType =
            document.getElementById(
                "customType"
            );


        if(
            this.value ===
            "Custom"
        ){

            customBox.style.display =
                "block";


            customType.required =
                true;

        }

        else{

            customBox.style.display =
                "none";


            customType.required =
                false;


            customType.value =
                "";

        }

    }
);


/* =====================================================
   SAVE / UPDATE
===================================================== */

document.getElementById(
    "incomeForm"
).addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const editId =
            document.getElementById(
                "editId"
            ).value.trim();


        let incomeType =
            document.getElementById(
                "incomeType"
            ).value;


        const customType =
            document.getElementById(
                "customType"
            ).value.trim();


        if(
            incomeType ===
            "Custom"
        ){

            if(!customType){

                showMessage(
                    "❌ Custom Income Type লিখুন",
                    "error"
                );

                return;

            }


            incomeType =
                customType;

        }


        if(!incomeType){

            showMessage(
                "❌ Income Type নির্বাচন করুন",
                "error"
            );

            return;

        }


        const title =
            document.getElementById(
                "title"
            ).value.trim();


        const amount =
            Number(
                document.getElementById(
                    "amount"
                ).value
            );


        const incomeDate =
            document.getElementById(
                "incomeDate"
            ).value;


        if(!title){

            showMessage(
                "❌ Title লিখুন",
                "error"
            );

            return;

        }


        if(

            !Number.isFinite(
                amount
            )

            ||

            amount <= 0

        ){

            showMessage(
                "❌ Amount সঠিকভাবে দিন",
                "error"
            );

            return;

        }


        if(!incomeDate){

            showMessage(
                "❌ Income Date নির্বাচন করুন",
                "error"
            );

            return;

        }


        const record = {

            title:
                title,

            income_type:
                incomeType,

            amount:
                amount,

            income_date:
                incomeDate,

            payment_method:
                document.getElementById(
                    "method"
                ).value,

            received_from:
                document.getElementById(
                    "receivedFrom"
                ).value.trim()
                || null,

            description:
                document.getElementById(
                    "description"
                ).value.trim()
                || null

        };


        const saveBtn =
            document.getElementById(
                "saveBtn"
            );


        saveBtn.disabled =
            true;


        showMessage(
            editId
            ?
            "Updating..."
            :
            "Saving..."
        );


        try{

            let result;


            if(editId){

                result =
                    await db

                    .from("incomes")

                    .update(record)

                    .eq(
                        "id",
                        editId
                    )

                    .select();

            }

            else{

                result =
                    await db

                    .from("incomes")

                    .insert(record)

                    .select();

            }


            if(result.error){

                showMessage(
                    "❌ " +
                    result.error.message,
                    "error"
                );

                return;

            }


            showMessage(

                editId

                ?

                "✅ Income Updated Successfully"

                :

                "✅ Income Saved Successfully",

                "success"

            );


            resetForm();


            await loadIncome();

        }

        catch(error){

            showMessage(
                "❌ " +
                error.message,
                "error"
            );

        }

        finally{

            saveBtn.disabled =
                false;

        }

    }
);


/* =====================================================
   EDIT INCOME
===================================================== */

function editIncome(id){

    const income =
        incomes.find(
            function(item){

                return String(
                    item.id
                ) ===
                String(id);

            }
        );


    if(!income){

        alert(
            "❌ Income record পাওয়া যায়নি।"
        );

        return;

    }


    document.getElementById(
        "editId"
    ).value =
        String(
            income.id
        );


    const type =
        income.income_type ||
        "";


    const select =
        document.getElementById(
            "incomeType"
        );


    const standardTypes = [

        "Student Fees",

        "Donation",

        "Admission Fee",

        "Monthly Fee",

        "Other"

    ];


    if(
        standardTypes.includes(
            type
        )
    ){

        select.value =
            type;


        document.getElementById(
            "customBox"
        ).style.display =
            "none";


        document.getElementById(
            "customType"
        ).required =
            false;


        document.getElementById(
            "customType"
        ).value =
            "";

    }

    else{

        select.value =
            "Custom";


        document.getElementById(
            "customBox"
        ).style.display =
            "block";


        document.getElementById(
            "customType"
        ).required =
            true;


        document.getElementById(
            "customType"
        ).value =
            type;

    }


    document.getElementById(
        "title"
    ).value =
        income.title ||
        "";


    document.getElementById(
        "amount"
    ).value =
        income.amount ??
        "";


    document.getElementById(
        "incomeDate"
    ).value =
        income.income_date ||
        "";


    document.getElementById(
        "method"
    ).value =
        income.payment_method ||
        "Cash";


    document.getElementById(
        "receivedFrom"
    ).value =
        income.received_from ||
        "";


    document.getElementById(
        "description"
    ).value =
        income.description ||
        "";


    document.getElementById(
        "saveBtn"
    ).textContent =
        "💾 Update Income";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "inline-block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
   DELETE
===================================================== */

async function deleteIncome(id){

    if(

        id === null

        ||

        id === undefined

        ||

        String(id).trim() === ""

    ){

        alert(
            "❌ Invalid Income ID"
        );

        return;

    }


    if(

        !confirm(
            "এই Income record Delete করতে চান?"
        )

    ){

        return;

    }


    const {
        data,
        error
    } =
    await db

        .from("incomes")

        .delete()

        .eq(
            "id",
            id
        )

        .select("id");


    if(error){

        alert(
            "❌ Delete failed:\n" +
            error.message
        );

        return;

    }


    if(

        !data

        ||

        !data.length

    ){

        alert(
            "❌ Record পাওয়া যায়নি অথবা Delete permission নেই।"
        );

        return;

    }


    alert(
        "✅ Income deleted successfully"
    );


    await loadIncome();

}


/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function(){

        const q =
            this.value
            .toLowerCase()
            .trim();


        if(!q){

            renderIncome();

            return;

        }


        const filtered =
            incomes.filter(
                function(item){

                    const title =
                        String(
                            item.title ||
                            ""
                        ).toLowerCase();


                    const type =
                        String(
                            item.income_type ||
                            ""
                        ).toLowerCase();


                    const from =
                        String(
                            item.received_from ||
                            ""
                        ).toLowerCase();


                    const method =
                        String(
                            item.payment_method ||
                            ""
                        ).toLowerCase();


                    const description =
                        String(
                            item.description ||
                            ""
                        ).toLowerCase();


                    const date =
                        String(
                            item.income_date ||
                            ""
                        ).toLowerCase();


                    const amount =
                        String(
                            item.amount ||
                            ""
                        ).toLowerCase();


                    return (

                        title.includes(q)

                        ||

                        type.includes(q)

                        ||

                        from.includes(q)

                        ||

                        method.includes(q)

                        ||

                        description.includes(q)

                        ||

                        date.includes(q)

                        ||

                        amount.includes(q)

                    );

                }
            );


        renderIncome(
            filtered
        );

    }
);

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

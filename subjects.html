const text = {

/* ==========================================
   LANGUAGE CHANGE
========================================== */

function setLanguage(lang){

    currentLanguage = lang;

    const t = text[lang];

    document.documentElement.lang =
        lang === "bn" ? "bn" : "en";


    document.getElementById("pageTitle")
        .textContent = t.pageTitle;

    document.getElementById("classStatLabel")
        .textContent = t.classStat;

    document.getElementById("subjectStatLabel")
        .textContent = t.subjectStat;

    document.getElementById("markStatLabel")
        .textContent = t.markStat;

    document.getElementById("formTitle")
        .textContent = editingId
        ? "✏️ " + (lang==="bn" ? "বিষয় পরিবর্তন করুন" : "Edit Subject")
        : t.formTitle;

    document.getElementById("classLabel")
        .textContent = t.class;

    document.getElementById("subjectLabel")
        .textContent = t.subject;

    document.getElementById("fullMarkLabel")
        .textContent = t.full;

    document.getElementById("passMarkLabel")
        .textContent = t.pass;

    document.getElementById("subjectName")
        .placeholder = t.subjectPlaceholder;

    document.getElementById("classSelect")
        .options[0].textContent = t.classSelect;

    document.getElementById("listTitle")
        .textContent = t.listTitle;

    document.getElementById("search")
        .placeholder = t.search;

    document.getElementById("filterClass")
        .options[0].textContent = t.allClass;

    document.getElementById("thClass")
        .textContent = t.class;

    document.getElementById("thSubject")
        .textContent = t.subject;

    document.getElementById("thFull")
        .textContent = t.full;

    document.getElementById("thPass")
        .textContent = t.pass;

    document.getElementById("thAction")
        .textContent = t.action;

    document.getElementById("dashboardLink")
        .textContent = t.dashboard;

    document.getElementById("bnBtn")
        .classList.toggle("active",lang==="bn");

    document.getElementById("enBtn")
        .classList.toggle("active",lang==="en");


    updateFormButtons();

    renderSubjects();

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(message,type="success"){

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.className =
        "message " + type;

    setTimeout(()=>{

        box.className="message";

    },3500);

}


/* ==========================================
   AUTH
========================================== */

async function checkAuth(){

    const {
        data:{session},
        error
    } = await db.auth.getSession();


    if(error){

        console.error(error);

    }


    if(!session){

        location.href="admin.html";

        return false;

    }


    return true;

}


/* ==========================================
   LOAD SUBJECTS
========================================== */

async function loadSubjects(){

    const tbody =
        document.getElementById("subjectList");


    tbody.innerHTML = `

        <tr>
            <td colspan="6" class="loading">
                ${text[currentLanguage].loading}
            </td>
        </tr>

    `;


    const {data,error} =

        await db
        .from("subjects")
        .select("*")
        .order("class_name",{ascending:true})
        .order("subject_name",{ascending:true});


    if(error){

        console.error(error);

        tbody.innerHTML = `

            <tr>
                <td colspan="6" class="empty error">
                    ❌ ${escapeHtml(error.message)}
                </td>
            </tr>

        `;

        return;

    }


    subjects = data || [];


    updateStats();

    renderSubjects();

}


/* ==========================================
   RENDER
========================================== */

function renderSubjects(){

    const tbody =
        document.getElementById("subjectList");


    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filter =
        document.getElementById("filterClass")
        .value;


    let list = subjects.filter(s=>{

        const subjectName =
            String(s.subject_name || "")
            .toLowerCase();


        const className =
            String(s.class_name || "")
            .toLowerCase();


        const matchSearch =
            !search ||
            subjectName.includes(search) ||
            className.includes(search);


        const matchClass =
            !filter ||
            s.class_name === filter;


        return matchSearch && matchClass;

    });


    if(!list.length){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty">

                    ${text[currentLanguage].empty}

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML = list.map((s,index)=>`

        <tr>

            <td>
                ${index+1}
            </td>


            <td>

                <span class="badge">

                    ${escapeHtml(
                        s.class_name || "-"
                    )}

                </span>

            </td>


            <td>

                <strong>

                    ${escapeHtml(
                        s.subject_name || "-"
                    )}

                </strong>

            </td>


            <td>

                <span class="mark">

                    ${escapeHtml(
                        s.full_mark ?? "-"
                    )}

                </span>

            </td>


            <td>

                <span class="mark">

                    ${escapeHtml(
                        s.pass_mark ?? "-"
                    )}

                </span>

            </td>


            <td>

                <div class="action-buttons">

                    <button
                        class="btn-edit"
                        onclick="editSubject('${escapeJs(s.id)}')">

                        ✏️ ${text[currentLanguage].edit}

                    </button>


                    <button
                        class="btn-danger"
                        onclick="deleteSubject('${escapeJs(s.id)}')">

                        🗑️ ${text[currentLanguage].delete}

                    </button>

                </div>

            </td>

        </tr>

    `).join("");

}


/* ==========================================
   SAVE SUBJECT
========================================== */

async function saveSubject(){

    const className =
        document.getElementById("classSelect")
        .value
        .trim();


    const subjectName =
        document.getElementById("subjectName")
        .value
        .trim();


    const fullMark =
        Number(
            document.getElementById("fullMark")
            .value
        );


    const passMark =
        Number(
            document.getElementById("passMark")
            .value
        );


    if(!className){

        showMessage(
            currentLanguage==="bn"
            ? "শ্রেণি নির্বাচন করুন।"
            : "Please select a class.",
            "error"
        );

        return;

    }


    if(!subjectName){

        showMessage(
            currentLanguage==="bn"
            ? "বিষয়ের নাম লিখুন।"
            : "Enter subject name.",
            "error"
        );

        return;

    }


    if(!fullMark || fullMark <= 0){

        showMessage(
            currentLanguage==="bn"
            ? "সঠিক Full Mark দিন।"
            : "Enter a valid Full Mark.",
            "error"
        );

        return;

    }


    if(passMark < 0 || passMark > fullMark){

        showMessage(
            currentLanguage==="bn"
            ? "Pass Mark অবশ্যই Full Mark-এর সমান বা কম হতে হবে।"
            : "Pass Mark must be less than or equal to Full Mark.",
            "error"
        );

        return;

    }


    const payload = {

        class_name:className,

        subject_name:subjectName,

        full_mark:fullMark,

        pass_mark:passMark

    };


    let result;


    if(editingId){

        result =
            await db
            .from("subjects")
            .update(payload)
            .eq("id",editingId);

    }else{

        result =
            await db
            .from("subjects")
            .insert([payload]);

    }


    if(result.error){

        console.error(result.error);

        showMessage(
            result.error.message,
            "error"
        );

        return;

    }


    showMessage(
        editingId
        ? text[currentLanguage].successUpdate
        : text[currentLanguage].successAdd
    );


    cancelEdit();

    await loadSubjects();

}


/* ==========================================
   EDIT
========================================== */

function editSubject(id){

    const subject =
        subjects.find(s=>
            String(s.id) === String(id)
        );


    if(!subject){

        return;

    }


    editingId = subject.id;


    document.getElementById("classSelect")
        .value = subject.class_name || "";


    document.getElementById("subjectName")
        .value = subject.subject_name || "";


    document.getElementById("fullMark")
        .value = subject.full_mark ?? "";


    document.getElementById("passMark")
        .value = subject.pass_mark ?? "";


    document.getElementById("formBox")
        .classList.add("editing");


    document.getElementById("formTitle")
        .textContent =
        currentLanguage==="bn"
        ? "✏️ বিষয় পরিবর্তন করুন"
        : "✏️ Edit Subject";


    updateFormButtons();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ==========================================
   CANCEL EDIT
========================================== */

function cancelEdit(){

    editingId = null;


    document.getElementById("classSelect")
        .value = "";


    document.getElementById("subjectName")
        .value = "";


    document.getElementById("fullMark")
        .value = "";


    document.getElementById("passMark")
        .value = "";


    document.getElementById("formBox")
        .classList.remove("editing");


    document.getElementById("formTitle")
        .textContent =
        text[currentLanguage].formTitle;


    updateFormButtons();

}


/* ==========================================
   BUTTONS
========================================== */

function updateFormButtons(){

    const t =
        text[currentLanguage];


    document.getElementById("saveBtn")
        .textContent =
        editingId ? t.update : t.save;


    document.getElementById("cancelBtn")
        .style.display =
        editingId ? "inline-block" : "none";

}


/* ==========================================
   DELETE
========================================== */

async function deleteSubject(id){

    const t =
        text[currentLanguage];


    if(!confirm(t.confirmDelete)){

        return;

    }


    const {error} =

        await db
        .from("subjects")
        .delete()
        .eq("id",id);


    if(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        t.successDelete
    );


    await loadSubjects();

}


/* ==========================================
   STATISTICS
========================================== */

function updateStats(){

    const uniqueClasses =
        new Set(
            subjects
            .map(s=>s.class_name)
            .filter(Boolean)
        );


    document.getElementById("classCount")
        .textContent =
        uniqueClasses.size;


    document.getElementById("subjectCount")
        .textContent =
        subjects.length;


    const totalMarks =
        subjects.reduce(

            (sum,s)=>
                sum + Number(s.full_mark || 0),

            0

        );


    document.getElementById("markCount")
        .textContent =
        totalMarks;

}


/* ==========================================
   SEARCH
========================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    renderSubjects
);


document
.getElementById("filterClass")
.addEventListener(
    "change",
    renderSubjects
);


/* ==========================================
   ESCAPE
========================================== */

function escapeHtml(value){

    return String(value)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeJs(value){

    return String(value)
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");

}


/* ==========================================
   START
========================================== */

(async function(){

    const ok =
        await checkAuth();


    if(!ok){

        return;

    }


    await loadSubjects();

})();

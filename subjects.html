<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject Management | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}
header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
header h2{margin:0}
header a{
    color:white;
    text-decoration:none;
    background:#ffffff22;
    padding:9px 14px;
    border-radius:8px;
}
.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}
.box{
    background:white;
    padding:22px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 3px 15px #0001;
}
h3{
    color:#0d47a1;
    margin-top:0;
}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}
label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}
input,select{
    width:100%;
    padding:12px;
    border:1px solid #d6dce5;
    border-radius:8px;
    font-size:15px;
}
button{
    border:0;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.save{
    background:#0d47a1;
    color:white;
}
.cancel{
    background:#e5e7eb;
    margin-left:8px;
}
.table-wrap{
    overflow-x:auto;
}
table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}
th,td{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}
th{
    background:#0d47a1;
    color:white;
}
.edit{
    background:#f59e0b;
    color:white;
}
.delete{
    background:#dc2626;
    color:white;
    margin-left:5px;
}
.message{
    margin:12px 0;
    padding:12px;
    border-radius:8px;
    display:none;
}
.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}
.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}
@media(max-width:650px){
    .grid{grid-template-columns:1fr}
    header{
        flex-direction:column;
        gap:12px;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<header>
    <h2>📚 Subject Management</h2>
    <a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="box">
<h3 id="formTitle">➕ Subject Add করুন</h3>

<div id="message" class="message"></div>

<div class="grid">

<div>
<label>Class</label>
<select id="classSelect">
<option value="">Class নির্বাচন করুন</option>
<option value="নূরানী">নূরানী</option>
<option value="১ম শ্রেণি">১ম শ্রেণি</option>
<option value="২য় শ্রেণি">২য় শ্রেণি</option>
<option value="৩য় শ্রেণি">৩য় শ্রেণি</option>
<option value="৪র্থ শ্রেণি">৪র্থ শ্রেণি</option>
<option value="৫ম শ্রেণি">৫ম শ্রেণি</option>
<option value="নাজেরা">নাজেরা</option>
<option value="হিফজ">হিফজ</option>
</select>
</div>

<div>
<label>Subject Name</label>
<input id="subjectName" placeholder="যেমন: বাংলা">
</div>

<div>
<label>Subject Code</label>
<input id="subjectCode" placeholder="যেমন: BAN">
</div>

<div>
<label>Full Mark</label>
<input id="fullMark" type="number" min="1" value="100">
</div>

<div>
<label>Pass Mark</label>
<input id="passMark" type="number" min="0" value="33">
</div>

</div>

<br>

<button class="save" onclick="saveSubject()">💾 Save Subject</button>
<button class="cancel" onclick="resetForm()">Clear</button>

</div>


<div class="box">
<h3>📋 Subject List</h3>

<div class="table-wrap">

<table>
<thead>
<tr>
<th>Class</th>
<th>Subject</th>
<th>Code</th>
<th>Full Mark</th>
<th>Pass Mark</th>
<th>Action</th>
</tr>
</thead>

<tbody id="subjectList">
<tr>
<td colspan="6">Loading...</td>
</tr>
</tbody>

</table>

</div>
</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let editingId = null;


/* MESSAGE */

function message(text,type){

    const box=document.getElementById("message");

    box.textContent=text;

    box.className="message "+type;

    setTimeout(()=>{
        box.className="message";
    },3000);
}


/* LOAD */

async function loadSubjects(){

    const tbody=document.getElementById("subjectList");

    tbody.innerHTML=
    `<tr><td colspan="6">Loading...</td></tr>`;

    const {data,error}=await db
        .from("subjects")
        .select("*")
        .order("class_name",{ascending:true})
        .order("subject_name",{ascending:true});

    if(error){

        console.error(error);

        tbody.innerHTML=
        `<tr><td colspan="6" class="error">
        ${escapeHtml(error.message)}
        </td></tr>`;

        return;
    }

    if(!data || data.length===0){

        tbody.innerHTML=
        `<tr><td colspan="6">
        এখনো কোনো Subject যোগ করা হয়নি।
        </td></tr>`;

        return;
    }

    tbody.innerHTML=data.map(s=>`

        <tr>

        <td>${escapeHtml(s.class_name||"-")}</td>

        <td><strong>${escapeHtml(s.subject_name||"-")}</strong></td>

        <td>${escapeHtml(s.subject_code||"-")}</td>

        <td>${escapeHtml(s.full_mark||"-")}</td>

        <td>${escapeHtml(s.pass_mark||"-")}</td>

        <td>

        <button class="edit"
        onclick='editSubject(${JSON.stringify(s)})'>
        Edit
        </button>

        <button class="delete"
        onclick="deleteSubject('${s.id}')">
        Delete
        </button>

        </td>

        </tr>

    `).join("");
}


/* SAVE */

async function saveSubject(){

    const className=
        document.getElementById("classSelect").value.trim();

    const subjectName=
        document.getElementById("subjectName").value.trim();

    const subjectCode=
        document.getElementById("subjectCode").value.trim();

    const fullMark=
        Number(document.getElementById("fullMark").value);

    const passMark=
        Number(document.getElementById("passMark").value);

    if(!className || !subjectName){

        message("Class এবং Subject Name দিতে হবে।","error");
        return;
    }

    if(!fullMark || fullMark<=0){

        message("Full Mark সঠিকভাবে দিন।","error");
        return;
    }

    if(passMark<0 || passMark>fullMark){

        message("Pass Mark Full Mark-এর মধ্যে হতে হবে।","error");
        return;
    }

    const payload={
        class_name:className,
        subject_name:subjectName,
        subject_code:subjectCode || null,
        full_mark:fullMark,
        pass_mark:passMark
    };

    let error;

    if(editingId){

        const result=await db
            .from("subjects")
            .update(payload)
            .eq("id",editingId);

        error=result.error;

    }else{

        const result=await db
            .from("subjects")
            .insert(payload);

        error=result.error;
    }

    if(error){

        console.error(error);

        message(error.message,"error");
        return;
    }

    message(
        editingId
        ? "Subject সফলভাবে Update হয়েছে।"
        : "Subject সফলভাবে Added হয়েছে।",
        "success"
    );

    resetForm();
    loadSubjects();
}


/* EDIT */

function editSubject(s){

    editingId=s.id;

    document.getElementById("classSelect").value=
        s.class_name || "";

    document.getElementById("subjectName").value=
        s.subject_name || "";

    document.getElementById("subjectCode").value=
        s.subject_code || "";

    document.getElementById("fullMark").value=
        s.full_mark || 100;

    document.getElementById("passMark").value=
        s.pass_mark || 33;

    document.getElementById("formTitle").textContent=
        "✏️ Subject Edit করুন";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* DELETE */

async function deleteSubject(id){

    if(!confirm(
        "এই Subject delete করলে এর সাথে থাকা Result data-তেও সমস্যা হতে পারে। Delete করবেন?"
    )) return;

    const {error}=await db
        .from("subjects")
        .delete()
        .eq("id",id);

    if(error){

        console.error(error);

        message(error.message,"error");
        return;
    }

    message("Subject deleted হয়েছে।","success");

    loadSubjects();
}


/* RESET */

function resetForm(){

    editingId=null;

    document.getElementById("classSelect").value="";
    document.getElementById("subjectName").value="";
    document.getElementById("subjectCode").value="";
    document.getElementById("fullMark").value=100;
    document.getElementById("passMark").value=33;

    document.getElementById("formTitle").textContent=
        "➕ Subject Add করুন";
}


/* ESCAPE */

function escapeHtml(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* START */

loadSubjects();

</script>

</body>
</html>

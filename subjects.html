<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subject Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
    background:#eef5fb;
    color:#18344d;
}

.header{
    background:linear-gradient(90deg,#063b70,#0875d1);
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:18px;
}

.back{
    color:white;
    text-decoration:none;
    background:#ffffff22;
    padding:8px 14px;
    border-radius:7px;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 15px #0000000d;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.info{
    background:#edf7ff;
    border-left:4px solid #0875d1;
    padding:13px;
    border-radius:7px;
    margin-bottom:18px;
    line-height:1.7;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

label{
    font-size:13px;
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

input,select{
    width:100%;
    height:42px;
    border:1px solid #d7e2eb;
    border-radius:7px;
    padding:0 10px;
    background:#fff;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    cursor:pointer;
}

.btn-primary{
    background:#0869bd;
    color:white;
}

.btn-edit{
    background:#e9f5ff;
    color:#0067b5;
}

.btn-delete{
    background:#ffe8e8;
    color:#d33;
}

.btn-cancel{
    background:#eee;
}

.search{
    margin-bottom:15px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th{
    background:#0755a0;
    color:white;
    padding:12px 8px;
    text-align:left;
    font-size:13px;
}

td{
    padding:11px 8px;
    border-bottom:1px solid #e7edf2;
    font-size:13px;
}

.actions{
    display:flex;
    gap:5px;
}

.badge{
    background:#eaf6ff;
    color:#0068b8;
    padding:5px 9px;
    border-radius:15px;
}

.message{
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#e5f8eb;
    color:#147a35;
}

.error{
    background:#ffe8e8;
    color:#c62828;
}

@media(max-width:800px){
    .form-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:500px){
    .header{
        padding:12px;
    }

    .header h2{
        font-size:14px;
    }

    .container{
        margin:15px auto;
    }

    .card{
        padding:14px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .title{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h2>📚 বিষয় ব্যবস্থাপনা</h2>
    <a class="back" href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="card">

<div class="title">➕ Subject Add / Edit</div>

<div id="message" class="message"></div>

<div class="info">
    <b>নিয়ম:</b><br>
    Class অনুযায়ী Subject যোগ করুন। এখানে দেওয়া
    <b>Full Mark</b> এবং <b>Pass Mark</b> পরবর্তীতে
    <b>results.html</b>-এ automatically ব্যবহার হবে।
</div>

<form id="subjectForm">

<input type="hidden" id="editId">

<div class="form-grid">

<div>
<label>Class *</label>

<select id="className" required>
<option value="">Class নির্বাচন করুন</option>
<option value="নূরানী">নূরানী</option>
<option value="১ম শ্রেণি">১ম শ্রেণি</option>
<option value="২য় শ্রেণি">২য় শ্রেণি</option>
<option value="৩য় শ্রেণি">৩য় শ্রেণি</option>
<option value="৪র্থ শ্রেণি">৪র্থ শ্রেণি</option>
<option value="৫ম শ্রেণি">৫ম শ্রেণি</option>
<option value="নাজেরা">নাজেরা</option>
<option value="হিফজ">হিফজ</option>
</select>
</div>

<div>
<label>Subject Name *</label>
<input id="subjectName" required placeholder="যেমন: বাংলা">
</div>

<div>
<label>Subject Code</label>
<input id="subjectCode" placeholder="যেমন: BAN">
</div>

<div>
<label>Full Mark *</label>
<input id="fullMark" type="number" min="1" value="100" required>
</div>

<div>
<label>Pass Mark *</label>
<input id="passMark" type="number" min="0" value="33" required>
</div>

</div>

<br>

<button class="btn-primary" type="submit" id="saveBtn">
💾 Save Subject
</button>

<button type="button"
        class="btn-cancel"
        id="cancelBtn"
        style="display:none;">
Cancel
</button>

</form>
</div>


<div class="card">

<div class="title">📚 Subject List</div>

<input class="search"
       id="search"
       placeholder="🔍 Subject / Class দিয়ে খুঁজুন...">

<div class="table-wrap">

<table>
<thead>
<tr>
<th>Class</th>
<th>Subject</th>
<th>Code</th>
<th>Full Mark</th>
<th>Pass Mark</th>
<th>Action</th>
</tr>
</thead>

<tbody id="subjectTable">
<tr>
<td colspan="6" style="text-align:center">
Loading...
</td>
</tr>
</tbody>
</table>

</div>
</div>

</div>


<script>

/* ============================
   SUPABASE CONFIG
============================ */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* ============================
   VARIABLES
============================ */

let subjects = [];

const form = document.getElementById("subjectForm");
const table = document.getElementById("subjectTable");
const message = document.getElementById("message");


/* ============================
   MESSAGE
============================ */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";

    setTimeout(()=>{
        message.style.display = "none";
    },4000);
}


/* ============================
   LOAD SUBJECTS
============================ */

async function loadSubjects(){

    table.innerHTML = `
        <tr>
        <td colspan="6" style="text-align:center">
        Loading...
        </td>
        </tr>
    `;

    const {data,error} = await db
        .from("subjects")
        .select(`
            id,
            class_name,
            subject_name,
            subject_code,
            full_mark,
            pass_mark,
            created_at
        `)
        .order("class_name")
        .order("subject_name");

    if(error){

        console.error(error);

        table.innerHTML = `
        <tr>
        <td colspan="6" style="text-align:center;color:red">
        ❌ ${error.message}
        </td>
        </tr>
        `;

        return;
    }

    subjects = data || [];

    renderSubjects(subjects);
}


/* ============================
   RENDER
============================ */

function renderSubjects(list){

    if(!list.length){

        table.innerHTML = `
        <tr>
        <td colspan="6" style="text-align:center">
        কোনো Subject পাওয়া যায়নি।
        </td>
        </tr>
        `;

        return;
    }

    table.innerHTML = list.map(s=>`

        <tr>

        <td>
            <span class="badge">
            ${escapeHtml(s.class_name)}
            </span>
        </td>

        <td>
            <b>${escapeHtml(s.subject_name)}</b>
        </td>

        <td>
            ${escapeHtml(s.subject_code || "-")}
        </td>

        <td>
            ${s.full_mark ?? 100}
        </td>

        <td>
            ${s.pass_mark ?? 33}
        </td>

        <td>

            <div class="actions">

            <button
                class="btn-edit"
                onclick="editSubject('${s.id}')">
                ✏️ Edit
            </button>

            <button
                class="btn-delete"
                onclick="deleteSubject('${s.id}')">
                🗑 Delete
            </button>

            </div>

        </td>

        </tr>

    `).join("");
}


/* ============================
   SAVE / UPDATE
============================ */

form.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const id =
        document.getElementById("editId").value;

    const className =
        document.getElementById("className").value.trim();

    const subjectName =
        document.getElementById("subjectName").value.trim();

    const subjectCode =
        document.getElementById("subjectCode").value.trim();

    const fullMark =
        Number(document.getElementById("fullMark").value);

    const passMark =
        Number(document.getElementById("passMark").value);


    if(passMark > fullMark){

        showMessage(
            "Pass Mark Full Mark-এর চেয়ে বেশি হতে পারবে না।",
            "error"
        );

        return;
    }


    const payload = {

        class_name: className,
        subject_name: subjectName,
        subject_code: subjectCode || null,
        full_mark: fullMark,
        pass_mark: passMark

    };


    let result;


    if(id){

        result = await db
            .from("subjects")
            .update(payload)
            .eq("id",id);

    }else{

        result = await db
            .from("subjects")
            .insert(payload);

    }


    if(result.error){

        console.error(result.error);

        showMessage(
            "❌ " + result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        id
        ? "✅ Subject update হয়েছে।"
        : "✅ Subject যোগ হয়েছে।",
        "success"
    );


    resetForm();

    loadSubjects();

});


/* ============================
   EDIT
============================ */

window.editSubject = function(id){

    const s =
        subjects.find(x => String(x.id) === String(id));

    if(!s) return;


    document.getElementById("editId").value =
        s.id;

    document.getElementById("className").value =
        s.class_name;

    document.getElementById("subjectName").value =
        s.subject_name;

    document.getElementById("subjectCode").value =
        s.subject_code || "";

    document.getElementById("fullMark").value =
        s.full_mark ?? 100;

    document.getElementById("passMark").value =
        s.pass_mark ?? 33;


    document.getElementById("saveBtn").textContent =
        "💾 Update Subject";

    document.getElementById("cancelBtn").style.display =
        "inline-block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* ============================
   DELETE
============================ */

window.deleteSubject = async function(id){

    if(!confirm(
        "এই Subject delete করতে চান?"
    )) return;


    const {error} = await db
        .from("subjects")
        .delete()
        .eq("id",id);


    if(error){

        showMessage(
            "❌ Delete failed: " + error.message,
            "error"
        );

        return;
    }


    showMessage(
        "✅ Subject delete হয়েছে।",
        "success"
    );

    loadSubjects();

};


/* ============================
   RESET
============================ */

function resetForm(){

    form.reset();

    document.getElementById("editId").value = "";

    document.getElementById("fullMark").value = 100;

    document.getElementById("passMark").value = 33;

    document.getElementById("saveBtn").textContent =
        "💾 Save Subject";

    document.getElementById("cancelBtn").style.display =
        "none";
}


document.getElementById("cancelBtn")
.addEventListener("click",resetForm);


/* ============================
   SEARCH
============================ */

document.getElementById("search")
.addEventListener("input",function(){

    const q =
        this.value.toLowerCase().trim();

    const filtered =
        subjects.filter(s=>

            String(s.class_name || "")
            .toLowerCase()
            .includes(q)

            ||

            String(s.subject_name || "")
            .toLowerCase()
            .includes(q)

            ||

            String(s.subject_code || "")
            .toLowerCase()
            .includes(q)

        );


    renderSubjects(filtered);

});


/* ============================
   HTML ESCAPE
============================ */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ============================
   START
============================ */

loadSubjects();

</script>

</body>
</html>

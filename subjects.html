<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subjects | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

.top{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    padding:15px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 3px 15px #0002;
}

.top h2{
    margin:0;
    font-size:19px;
}

.top a{
    color:#fff;
    text-decoration:none;
    background:#ffffff20;
    padding:8px 12px;
    border-radius:7px;
    font-size:13px;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.box{
    background:#fff;
    padding:22px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 3px 15px #0d47a115;
    border:1px solid #e5eaf2;
}

h3{
    margin:0 0 18px;
    color:#0d47a1;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #d8dee9;
    border-radius:8px;
    background:#fff;
    outline:none;
}

input:focus,select:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d215;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.save{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:#fff;
    margin-top:15px;
}

.cancel{
    background:#64748b;
    color:#fff;
    margin-top:15px;
    display:none;
    margin-left:7px;
}

.search-row{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search-row input{
    flex:1;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    padding:11px 9px;
    border-bottom:1px solid #edf0f5;
    font-size:13px;
    text-align:left;
}

th{
    background:#0d47a1;
    color:#fff;
}

tr:hover td{
    background:#f7faff;
}

.badge{
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.edit{
    background:#e0f2fe;
    color:#0369a1;
    margin-right:5px;
}

.delete{
    background:#fee2e2;
    color:#dc2626;
}

.loading,.empty{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

.success{
    display:block;
    background:#ecfdf5;
    color:#047857;
}

.error{
    display:block;
    background:#fef2f2;
    color:#dc2626;
}

.info{
    background:#eaf4ff;
    border-left:4px solid #1976d2;
    padding:12px;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.6;
}

@media(max-width:750px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .search-row{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header class="top">
    <h2>📚 Subject Management</h2>
    <a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="box">

<h3 id="formTitle">➕ Subject যোগ করুন</h3>

<div class="info">
<b>নিয়ম:</b> একটি Class-এর জন্য Subject একবার যোগ করলেই হবে।
<br>
একই Class-এর যতজন শিক্ষার্থী থাকুক, <b>results.html</b>-এ সবাই সেই Class-এর Subject automatically পাবে।
</div>

<div id="message" class="message"></div>

<div class="form-grid">

<div>
<label>Class *</label>

<select id="classSelect">
<option value="">Class নির্বাচন করুন</option>

<option value="নূরানী">নূরানী</option>
<option value="১ম শ্রেণি">১ম শ্রেণি</option>
<option value="২য় শ্রেণি">২য় শ্রেণি</option>
<option value="৩য় শ্রেণি">৩য় শ্রেণি</option>
<option value="৪র্থ শ্রেণি">৪র্থ শ্রেণি</option>
<option value="৫ম শ্রেণি">৫ম শ্রেণি</option>
<option value="নাজেরা">নাজেরা</option>
<option value="হিফজ">হিফজ</option>

</select>
</div>

<div>
<label>Subject Name *</label>

<input
id="subjectName"
placeholder="যেমন: বাংলা"
>
</div>

<div>
<label>Subject Code</label>

<input
id="subjectCode"
placeholder="যেমন: BAN"
>
</div>

</div>

<button class="save" id="saveBtn" onclick="saveSubject()">
💾 Save Subject
</button>

<button class="cancel" id="cancelBtn" onclick="cancelEdit()">
✖ Cancel
</button>

</div>


<div class="box">

<h3>📚 Subject List</h3>

<div class="search-row">

<input
id="search"
placeholder="🔍 Class / Subject দিয়ে খুঁজুন..."
>

<select id="filterClass">
<option value="">সব Class</option>

<option value="নূরানী">নূরানী</option>
<option value="১ম শ্রেণি">১ম শ্রেণি</option>
<option value="২য় শ্রেণি">২য় শ্রেণি</option>
<option value="৩য় শ্রেণি">৩য় শ্রেণি</option>
<option value="৪র্থ শ্রেণি">৪র্থ শ্রেণি</option>
<option value="৫ম শ্রেণি">৫ম শ্রেণি</option>
<option value="নাজেরা">নাজেরা</option>
<option value="হিফজ">হিফজ</option>

</select>

<button onclick="loadSubjects()">
🔄 Refresh
</button>

</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>#</th>
<th>Class</th>
<th>Subject</th>
<th>Code</th>
<th>Pass Mark</th>
<th>Action</th>
</tr>
</thead>

<tbody id="subjectList">

<tr>
<td colspan="6" class="loading">
Loading...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let subjects=[];
let editId=null;


/* ===============================
   AUTH
================================ */

async function checkAuth(){

const {
data:{session}
}=await db.auth.getSession();

if(!session){

location.href="admin.html";
return false;

}

return true;

}


/* ===============================
   MESSAGE
================================ */

function showMessage(message,type){

const box=
document.getElementById("message");

box.textContent=message;

box.className=
"message "+type;

setTimeout(()=>{

box.className="message";

},3500);

}


/* ===============================
   SAVE
================================ */

async function saveSubject(){

const className=
document.getElementById("classSelect").value.trim();

const subjectName=
document.getElementById("subjectName").value.trim();

const subjectCode=
document.getElementById("subjectCode").value.trim();

if(!className){

showMessage(
"❌ Class নির্বাচন করুন।",
"error"
);

return;

}

if(!subjectName){

showMessage(
"❌ Subject Name দিন।",
"error"
);

return;

}


const payload={

class_name:className,

subject_name:subjectName,

subject_code:
subjectCode || null,

pass_mark:33

};


let result;


if(editId){

result=
await db
.from("subjects")
.update(payload)
.eq("id",editId);

}else{

result=
await db
.from("subjects")
.insert(payload);

}


if(result.error){

if(
result.error.code==="23505"
){

showMessage(
"❌ এই Class-এ এই Subject আগে থেকেই আছে।",
"error"
);

}else{

showMessage(
"❌ "+result.error.message,
"error"
);

}

return;

}


showMessage(
editId
?"✅ Subject updated successfully."
:"✅ Subject added successfully.",
"success"
);

cancelEdit();

await loadSubjects();

}


/* ===============================
   LOAD
================================ */

async function loadSubjects(){

const tbody=
document.getElementById("subjectList");

tbody.innerHTML=
`
<tr>
<td colspan="6" class="loading">
Loading...
</td>
</tr>
`;


const {data,error}=
await db
.from("subjects")
.select("*")
.order("class_name")
.order("subject_name");


if(error){

tbody.innerHTML=
`
<tr>
<td colspan="6" class="error">
❌ ${escapeHtml(error.message)}
</td>
</tr>
`;

return;

}


subjects=data||[];

renderSubjects();

}


/* ===============================
   RENDER
================================ */

function renderSubjects(){

const tbody=
document.getElementById("subjectList");

const q=
document
.getElementById("search")
.value
.toLowerCase()
.trim();

const filter=
document.getElementById("filterClass")
.value;


const list=
subjects.filter(s=>{

const matchSearch=

!q ||

String(s.class_name||"")
.toLowerCase()
.includes(q) ||

String(s.subject_name||"")
.toLowerCase()
.includes(q) ||

String(s.subject_code||"")
.toLowerCase()
.includes(q);


const matchClass=
!filter ||
s.class_name===filter;


return matchSearch && matchClass;

});


if(!list.length){

tbody.innerHTML=
`
<tr>
<td colspan="6" class="empty">
কোনো Subject পাওয়া যায়নি।
</td>
</tr>
`;

return;

}


tbody.innerHTML=
list.map((s,i)=>`

<tr>

<td>${i+1}</td>

<td>
<span class="badge">
${escapeHtml(s.class_name)}
</span>
</td>

<td>
<strong>
${escapeHtml(s.subject_name)}
</strong>
</td>

<td>
${escapeHtml(s.subject_code||"-")}
</td>

<td>
${escapeHtml(s.pass_mark||33)}
</td>

<td>

<button
class="edit"
onclick="editSubject(${s.id})">
✏ Edit
</button>

<button
class="delete"
onclick="deleteSubject(${s.id})">
🗑 Delete
</button>

</td>

</tr>

`).join("");

}


/* ===============================
   EDIT
================================ */

function editSubject(id){

const s=
subjects.find(x=>x.id===id);

if(!s)return;

editId=id;

document.getElementById(
"classSelect"
).value=s.class_name;

document.getElementById(
"subjectName"
).value=s.subject_name;

document.getElementById(
"subjectCode"
).value=s.subject_code||"";

document.getElementById(
"formTitle"
).textContent=
"✏ Subject Edit করুন";

document.getElementById(
"saveBtn"
).textContent=
"💾 Update Subject";

document.getElementById(
"cancelBtn"
).style.display=
"inline-block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* ===============================
   CANCEL
================================ */

function cancelEdit(){

editId=null;

document.getElementById(
"classSelect"
).value="";

document.getElementById(
"subjectName"
).value="";

document.getElementById(
"subjectCode"
).value="";

document.getElementById(
"formTitle"
).textContent=
"➕ Subject যোগ করুন";

document.getElementById(
"saveBtn"
).textContent=
"💾 Save Subject";

document.getElementById(
"cancelBtn"
).style.display=
"none";

}


/* ===============================
   DELETE
================================ */

async function deleteSubject(id){

const s=
subjects.find(x=>x.id===id);

if(!s)return;


const ok=
confirm(
`"${s.subject_name}" Subject টি Delete করবেন?`
);

if(!ok)return;


const {error}=
await db
.from("subjects")
.delete()
.eq("id",id);


if(error){

showMessage(
"❌ "+error.message,
"error"
);

return;

}


showMessage(
"✅ Subject deleted.",
"success"
);

await loadSubjects();

}


/* ===============================
   SEARCH
================================ */

document
.getElementById("search")
.addEventListener(
"input",
renderSubjects
);

document
.getElementById("filterClass")
.addEventListener(
"change",
renderSubjects
);


/* ===============================
   ESCAPE
================================ */

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ===============================
   START
================================ */

(async function(){

const ok=await checkAuth();

if(!ok)return;

await loadSubjects();

})();

</script>

</body>
</html>

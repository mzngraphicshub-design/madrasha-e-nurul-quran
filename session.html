<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Year / Session Management | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f3f7fc;
    color:#1e293b;
}

.top{

    align-items:center;
    gap:15px;
    box-shadow:0 3px 15px #0002;
}

.top h2{
    margin:0;
    font-size:19px;
}

.dashboard-btn{
    text-decoration:none;
    color:#fff;
    background:#ffffff18;
    border:1px solid #ffffff35;

    border-radius:8px;

}

    margin:25px auto;

}

.box{
    background:#fff;

    padding:22px;

    border:1px solid #e3eaf3;

.info{

    border-left:4px solid #1976d2;

    margin-bottom:18px;
}

    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
}

label{

    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d7e0eb;
    border-radius:9px;
    background:#fff;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d215;
}

.btn-row{
    margin-top:15px;
    display:flex;
    gap:10px;

}

button{

    border-radius:8px;
    padding:10px 16px;
    font-weight:bold;
}

.save-btn{
    background:linear-gradient(135deg,#064b9b,#1976d2);
    color:#fff;
}

.cancel-btn{
    background:#e5e7eb;
    color:#334155;
    display:none;
}

.print-btn{
    background:#1e293b;
    color:#fff;
}

.search-row{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search-row input{
    flex:1;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

th{
    background:#0750a3;
    color:#fff;
    padding:11px 9px;
    text-align:left;
    font-size:13px;
}

td{
    padding:11px 9px;
    border-bottom:1px solid #edf1f5;
    font-size:13px;
}

tr:hover td{
    background:#f8fbff;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.active{
    background:#dcfce7;
    color:#166534;
}

.upcoming{
    background:#dbeafe;
    color:#1d4ed8;
}

.expired{
    background:#fee2e2;
    color:#991b1b;
}

.action-btn{
    padding:7px 10px;
    font-size:12px;
    margin-right:4px;
}

.edit{
    background:#e0f2fe;
    color:#0369a1;
}

.delete{
    background:#fee2e2;
    color:#b91c1c;
}

.empty,
.loading{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.error{
    background:#fff1f2;
    color:#be123c;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    font-size:13px;
}

.success{
    background:#ecfdf5;
    color:#047857;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    font-size:13px;
}

.small{
    color:#64748b;
    font-size:11px;
}

@media(max-width:800px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .top{
        padding:12px 15px;
    }

    .top h2{
        font-size:15px;
    }

    .container{
        margin:15px auto;
        padding:0 10px;
    }

    .box{
        padding:15px;
    }
}
</style>
</head>

<body>

<header class="top">
    <h2>📅 Year / Session Management</h2>

    <a href="dashboard.html" class="dashboard-btn">
        ← Dashboard
    </a>
</header>

<div class="container">

<!-- ADD SESSION -->
<div class="box">

    <h3 id="formTitle">➕ Add Year / Session</h3>

    <div class="title-line"></div>

    <div class="info">
        <b>নিয়ম:</b> Session শুধুমাত্র বছর অনুযায়ী হবে — যেমন
        <b>2026, 2027, 2028</b>।<br>

        Students Page-এ Session নির্বাচন করলে ঐ বছরের শিক্ষার্থীদের আলাদা List দেখা যাবে।
    </div>

    <div class="form-grid">

        <div>
            <label>Year / Session *</label>

            <input
                type="number"
                id="yearInput"
                placeholder="যেমন: 2026"
                min="2000"
                max="2100"
            >
        </div>

        <div>
            <label>Start Date</label>

            <input
                type="date"
                id="startDate"
            >
        </div>

        <div>
            <label>End Date</label>

            <input
                type="date"
                id="endDate"
            >
        </div>

    </div>

    <div id="message"></div>

    <div class="btn-row">

        <button
            class="save-btn"
            id="saveBtn"
            onclick="saveSession()"
        >
            💾 Save Year
        </button>

        <button
            class="cancel-btn"
            id="cancelBtn"
            onclick="cancelEdit()"
        >
            ✖ Cancel
        </button>

    </div>

</div>


<!-- SESSION LIST -->
<div class="box">

    <h3>📅 Year / Session List</h3>

    <div class="title-line"></div>

    <div class="search-row">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Year / Session দিয়ে খুঁজুন..."
            oninput="renderTable()"
        >

        <button
            class="print-btn"
            onclick="printTable()"
        >
            🖨 Print
        </button>

    </div>

    <div class="table-wrap">

        <table>

            <thead>

                <tr>
                    <th>Year / Session</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="sessionTable">

                <tr>
                    <td colspan="5" class="loading">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let sessions = [];

let editingId = null;


/* =====================================================
   AUTH
===================================================== */

async function checkAuth(){

    const {
        data:{session},
        error
    } = await db.auth.getSession();

    if(error){

        console.error(error);

        showMessage(
            "❌ Login check failed: " + error.message,
            "error"
        );

        return false;
    }

    if(!session){

        window.location.href =
        "admin.html";

        return false;
    }

    return true;
}


/* =====================================================
   LOAD SESSION DATA
===================================================== */

async function loadSessions(){

    const tbody =
    document.getElementById("sessionTable");

    tbody.innerHTML = `
        <tr>
            <td colspan="5" class="loading">
                ⏳ Loading...
            </td>
        </tr>
    `;


    /*
       IMPORTANT:

       এখানে sessions.session ব্যবহার করা হয়নি।
       sessions.is_active ব্যবহার করা হয়নি।

       আপনার screenshot-এর error অনুযায়ী
       table-এ এই দুই column নেই।

       আমরা ব্যবহার করছি:
       id
       year
       start_date
       end_date
    */


    const {
        data,
        error
    } = await db

    .from("sessions")

    .select(`
        id,
        year,
        start_date,
        end_date
    `)

    .order(
        "year",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "SESSION LOAD ERROR:",
            error
        );

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="error"
                >
                    ❌ ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        return;
    }


    sessions =
    data || [];


    renderTable();

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(){

    const tbody =
    document.getElementById(
        "sessionTable"
    );

    const query =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


    let list =
    sessions.filter(item=>{

        if(!query){
            return true;
        }

        return String(
            item.year || ""
        )
        .toLowerCase()
        .includes(query);

    });


    if(!list.length){

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="empty"
                >
                    📭 কোনো Year / Session পাওয়া যায়নি
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML =

    list.map(item=>{

        const status =
        getStatus(
            item.start_date,
            item.end_date
        );


        return `

        <tr>

            <td>

                <strong>
                    ${escapeHtml(
                        item.year || "-"
                    )}
                </strong>

            </td>


            <td>
                ${formatDate(
                    item.start_date
                )}
            </td>


            <td>
                ${formatDate(
                    item.end_date
                )}
            </td>


            <td>

                <span class="badge ${status.className}">
                    ${status.text}
                </span>

            </td>


            <td>

                <button
                    class="action-btn edit"
                    onclick="editSession('${item.id}')"
                >
                    ✏ Edit
                </button>


                <button
                    class="action-btn delete"
                    onclick="deleteSession('${item.id}')"
                >
                    🗑 Delete
                </button>

            </td>

        </tr>

        `;

    }).join("");

}


/* =====================================================
   SAVE / UPDATE SESSION
===================================================== */

async function saveSession(){

    const saveBtn =
    document.getElementById(
        "saveBtn"
    );


    const year =
    document
    .getElementById("yearInput")
    .value
    .trim();


    const startDate =
    document
    .getElementById("startDate")
    .value;


    const endDate =
    document
    .getElementById("endDate")
    .value;


    /* VALIDATION */

    if(!year){

        showMessage(
            "❌ Year / Session দিন।",
            "error"
        );

        return;
    }


    if(!/^\d{4}$/.test(year)){

        showMessage(
            "❌ Year অবশ্যই ৪ সংখ্যার হতে হবে। যেমন: 2026",
            "error"
        );

        return;
    }


    if(startDate &&
       endDate &&
       startDate > endDate){

        showMessage(
            "❌ Start Date, End Date-এর পরে হতে পারবে না।",
            "error"
        );

        return;
    }


    saveBtn.disabled = true;

    saveBtn.textContent =
    "⏳ Saving...";


    try{

        /* CHECK DUPLICATE */

        let duplicateQuery =
        db
        .from("sessions")
        .select("id,year")
        .eq("year", Number(year));


        if(editingId){

            duplicateQuery =
            duplicateQuery.neq(
                "id",
                editingId
            );

        }


        const {
            data:duplicate,
            error:duplicateError
        } =
        await duplicateQuery;


        if(duplicateError){

            throw duplicateError;

        }


        if(
            duplicate &&
            duplicate.length > 0
        ){

            showMessage(
                `❌ ${year} Session ইতিমধ্যে আছে।`,
                "error"
            );

            return;
        }


        const payload = {

            year:Number(year),

            start_date:
            startDate || null,

            end_date:
            endDate || null

        };


        /* UPDATE */

        if(editingId){

            const {
                error
            } = await db

            .from("sessions")

            .update(payload)

            .eq(
                "id",
                editingId
            );


            if(error){

                throw error;

            }


            showMessage(
                "✅ Session সফলভাবে Update হয়েছে।",
                "success"
            );

        }


        /* INSERT */

        else{

            const {
                error
            } = await db

            .from("sessions")

            .insert([
                payload
            ]);


            if(error){

                throw error;

            }


            showMessage(
                "✅ নতুন Session সফলভাবে যোগ হয়েছে।",
                "success"
            );

        }


        clearForm();

        await loadSessions();


    }catch(error){

        console.error(
            "SAVE SESSION ERROR:",
            error
        );


        showMessage(
            "❌ " +
            escapeHtml(
                error.message
            ),
            "error"
        );

    }finally{

        saveBtn.disabled =
        false;

        saveBtn.textContent =
        editingId
        ? "💾 Update Year"
        : "💾 Save Year";

    }

}


/* =====================================================
   EDIT SESSION
===================================================== */

function editSession(id){

    const item =
    sessions.find(
        x => String(x.id) === String(id)
    );


    if(!item){

        showMessage(
            "❌ Session পাওয়া যায়নি।",
            "error"
        );

        return;
    }


    editingId =
    item.id;


    document
    .getElementById("yearInput")
    .value =
    item.year || "";


    document
    .getElementById("startDate")
    .value =
    item.start_date || "";


    document
    .getElementById("endDate")
    .value =
    item.end_date || "";


    document
    .getElementById("formTitle")
    .textContent =
    "✏ Edit Year / Session";


    document
    .getElementById("saveBtn")
    .textContent =
    "💾 Update Year";


    document
    .getElementById("cancelBtn")
    .style.display =
    "inline-block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

    editingId = null;

    clearForm();

    document
    .getElementById("formTitle")
    .textContent =
    "➕ Add Year / Session";


    document
    .getElementById("saveBtn")
    .textContent =
    "💾 Save Year";


    document
    .getElementById("cancelBtn")
    .style.display =
    "none";

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

    document
    .getElementById("yearInput")
    .value = "";


    document
    .getElementById("startDate")
    .value = "";


    document
    .getElementById("endDate")
    .value = "";

}


/* =====================================================
   DELETE
===================================================== */

async function deleteSession(id){

    const item =
    sessions.find(
        x => String(x.id) === String(id)
    );


    if(!item){

        return;

    }


    const confirmed =
    confirm(
        `আপনি কি ${item.year} Session delete করতে চান?\n\nএই Session-এর সাথে Students/Results যুক্ত থাকলে delete করা যাবে না।`
    );


    if(!confirmed){

        return;

    }


    try{

        const {
            error
        } = await db

        .from("sessions")

        .delete()

        .eq(
            "id",
            id
        );


        if(error){

            throw error;

        }


        showMessage(
            "✅ Session সফলভাবে Delete হয়েছে।",
            "success"
        );


        await loadSessions();


    }catch(error){

        console.error(
            "DELETE SESSION ERROR:",
            error
        );


        showMessage(
            "❌ Delete করা যায়নি: " +
            escapeHtml(
                error.message
            ),
            "error"
        );

    }

}


/* =====================================================
   STATUS
===================================================== */

function getStatus(
    startDate,
    endDate
){

    const today =
    new Date();


    today.setHours(
        0,0,0,0
    );


    if(startDate){

        const start =
        new Date(
            startDate + "T00:00:00"
        );


        if(
            today < start
        ){

            return {

                text:"Upcoming",

                className:"upcoming"

            };

        }

    }


    if(endDate){

        const end =
        new Date(
            endDate + "T23:59:59"
        );


        if(
            today > end
        ){

            return {

                text:"Expired",

                className:"expired"

            };

        }

    }


    return {

        text:"Active",

        className:"active"

    };

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value){

    if(!value){

        return "-";

    }


    const d =
    new Date(
        value + "T00:00:00"
    );


    if(
        isNaN(
            d.getTime()
        )
    ){

        return value;

    }


    return d.toLocaleDateString(
        "en-GB",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    message,
    type
){

    const box =
    document.getElementById(
        "message"
    );


    box.innerHTML = `

        <div class="${type}">
            ${message}
        </div>

    `;


    setTimeout(()=>{

        box.innerHTML = "";

    },5000);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    return String(value ?? "")

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =====================================================
   PRINT
===================================================== */

function printTable(){

    const table =
    document
    .querySelector("table")
    .outerHTML;


    const win =
    window.open(
        "",
        "_blank"
    );


    win.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

            <title>Year / Session List</title>

            <style>

                body{
                    font-family:Arial,sans-serif;
                    padding:25px;
                }

                h2{
                    text-align:center;
                }

                table{
                    width:100%;
                    border-collapse:collapse;
                }

                th,td{
                    border:1px solid #ccc;
                    padding:10px;
                    text-align:left;
                }

                th{
                    background:#0750a3;
                    color:#fff;
                }

            </style>

        </head>

        <body>

            <h2>
                মাদরাসায়ে নূরুল কুরআন
            </h2>

            <h3>
                Year / Session List
            </h3>

            ${table}

        </body>

        </html>

    `);


    win.document.close();

    win.focus();

    setTimeout(()=>{

        win.print();

        win.close();

    },500);

}


/* =====================================================
   START
===================================================== */

async function start(){

    const loggedIn =
    await checkAuth();


    if(!loggedIn){

        return;

    }


    await loadSessions();

}


/* RUN */

start();

</script>

</body>
</html>

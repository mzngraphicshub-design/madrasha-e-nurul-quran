<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session Management | মাদরাসায়ে নূরুল কুরআন</title>

<style>
@font-face{
  font-family:Bornomala;
  src:url("./fonts/Bornomala-Regular.ttf") format("truetype");
  font-display:swap;
}
:root{
  --navy:#031a35;
  --navy2:#062b55;
  --blue:#0875df;
  --blue2:#18a0ff;
  --gold:#ffd447;
  --green:#087f5b;
  --red:#c62828;
  --white:#fff;
  --text:#173452;
  --muted:#718399;
  --line:#dfeaf5;
  --shadow:0 20px 55px rgba(0,55,120,.12);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Bornomala,Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#f3f8fd,#eaf4ff);
  min-height:100vh;
}
.top{
  background:linear-gradient(135deg,var(--navy),var(--navy2),var(--blue));
  color:#fff;
  padding:18px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 10px 35px rgba(0,35,80,.18);
  position:sticky;
  top:0;
  z-index:20;
}
.top h2{margin:0;color:#fff;font-size:22px}
.top a{
  color:#fff;
  text-decoration:none;
  padding:10px 16px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:10px;
  background:rgba(255,255,255,.08);
}
.top a:hover{background:var(--gold);color:var(--navy)}

.container{max-width:1150px;margin:30px auto;padding:0 18px}
.box{
  background:rgba(255,255,255,.84);
  border:1px solid rgba(255,255,255,.95);
  padding:26px;
  border-radius:22px;
  box-shadow:var(--shadow);
  margin-bottom:24px;
  backdrop-filter:blur(18px);
}
.box h3{
  margin:0 0 22px;
  color:var(--navy);
  font-size:24px;
}
.box h3:after{
  content:"";
  display:block;
  width:55px;
  height:3px;
  background:linear-gradient(90deg,var(--blue),var(--gold));
  border-radius:5px;
  margin-top:8px;
}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
label{display:block;font-weight:bold;font-size:14px;color:#244663}
input{
  width:100%;
  padding:13px 14px;
  margin-top:7px;
  border:1px solid #d5e3f0;
  border-radius:11px;
  font-size:14px;
  outline:none;
  background:#f9fcff;
  transition:.25s;
  font-family:inherit;
}
input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(8,117,223,.10);
  background:#fff;
}
button{
  border:0;
  border-radius:11px;
  padding:12px 18px;
  background:linear-gradient(135deg,var(--navy2),var(--blue));
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  font-family:inherit;
  box-shadow:0 7px 20px rgba(8,117,223,.16);
}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.cancel{background:#718096;margin-left:7px}
.delete{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.activeBtn{background:linear-gradient(135deg,#087f5b,#10b981)}
.print{background:linear-gradient(135deg,#4b5563,#111827)}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.search{flex:1;min-width:220px;margin:0}
.table-wrap{
  overflow-x:auto;
  border-radius:15px;
  border:1px solid var(--line);
}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{
  padding:13px 10px;
  border-bottom:1px solid #e9f0f7;
  text-align:left;
  font-size:14px;
}
th{
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;
  white-space:nowrap;
}
tbody tr:hover{background:#f3f8ff}
.action{padding:7px 11px;font-size:12px;margin:2px}
#msg{margin-top:12px;min-height:20px;color:var(--blue)}
.loading{text-align:center;padding:24px!important;color:var(--muted)}

.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.badge.active{
  background:#dcfce7;
  color:#087f5b;
}
.badge.inactive{
  background:#eef2f7;
  color:#718096;
}
.info{
  background:#eef7ff;
  border-left:4px solid var(--blue);
  padding:12px 15px;
  border-radius:9px;
  margin-bottom:18px;
}
.info strong{color:var(--navy)}

@media(max-width:650px){
  .top{padding:15px}
  .top h2{font-size:18px}
  .top a{font-size:13px;padding:8px 10px}
  .container{margin:18px auto;padding:0 12px}
  .box{padding:19px;border-radius:18px}
  .box h3{font-size:20px}
  .form{grid-template-columns:1fr}
  .full{grid-column:auto}
  table{min-width:800px}
}

@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff!important}
  .top,.box:first-child,.toolbar,.no-print,#msg,.info{display:none!important}
  .container{max-width:none;margin:0;padding:0}
  .box{
    box-shadow:none!important;
    border:0!important;
    padding:0!important;
    margin:0!important;
    background:#fff!important;
  }
  .box h3{text-align:center;color:#000!important;font-size:20px}
  .box h3:after{display:none}
  .table-wrap{overflow:visible;border:1px solid #222}
  th{background:#ddd!important;color:#000!important;border:1px solid #222}
  td{border:1px solid #333;color:#000!important}
  table{min-width:0!important}
}
</style>
</head>

<body>

<header class="top">
  <h2>📅 Session / Year Management</h2>
  <a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

  <div class="box">
    <h3 id="formTitle">➕ Add Year / Session</h3>

    <div class="info">
      <strong>নিয়ম:</strong>
      Session শুধুমাত্র বছর অনুযায়ী হবে — যেমন <b>2026</b>, <b>2027</b>, <b>2028</b>।
      <br>
      Students Page-এ Session নির্বাচন করলে সেই বছরের শিক্ষার্থীদের আলাদা List দেখা যাবে।
    </div>

    <form id="sessionForm">
      <input type="hidden" id="editId">

      <div>
        <label>Year / Session *</label>
        <input
          id="year"
          type="number"
          min="2000"
          max="2100"
          required
          placeholder="যেমন: 2026"
        >
      </div>

      <div>
        <label>Start Date</label>
        <input id="startDate" type="date">
      </div>

      <div>
        <label>End Date</label>
        <input id="endDate" type="date">
      </div>

      <div class="full">
        <button type="submit" id="saveBtn">💾 Save Year</button>
        <button type="button" class="cancel" id="cancelBtn" style="display:none">
          Cancel
        </button>
        <div id="msg"></div>
      </div>
    </form>
  </div>


  <div class="box">

    <h3>📅 Year / Session List</h3>

    <div class="toolbar no-print">
      <input
        class="search"
        id="search"
        placeholder="🔍 Year / Session দিয়ে খুঁজুন..."
      >

      <button class="print" onclick="window.print()">
        🖨️ Print
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Year / Session</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Status</th>
            <th class="no-print">Action</th>
          </tr>
        </thead>

        <tbody id="sessionList">
          <tr>
            <td colspan="5" class="loading">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let sessions = [];


// =====================================
// START
// =====================================

async function start(){

  try{

    const {
      data:{session}
    } = await db.auth.getSession();

    if(!session){

      location.href="admin.html";
      return;

    }

    await loadSessions();

  }catch(error){

    showError(error.message);

  }

}


// =====================================
// LOAD
// =====================================

async function loadSessions(){

  const tbody =
  document.getElementById("sessionList");

  tbody.innerHTML =
  `<tr>
    <td colspan="5" class="loading">
      Loading...
    </td>
  </tr>`;

  const {data,error} =
  await db
  .from("sessions")
  .select(`
    id,
    year,
    start_date,
    end_date,
    is_active
  `)
  .order("year",{ascending:false});

  if(error){

    showError(error.message);
    return;

  }

  sessions = data || [];

  render(sessions);

}


// =====================================
// RENDER
// =====================================

function render(list){

  const tbody =
  document.getElementById("sessionList");

  if(!list.length){

    tbody.innerHTML =
    `<tr>
      <td colspan="5"
          style="text-align:center;padding:25px">
        কোনো Session / Year নেই
      </td>
    </tr>`;

    return;

  }

  tbody.innerHTML =
  list.map(s=>`

    <tr>

      <td>
        <strong>${escapeHtml(s.year)}</strong>
      </td>

      <td>
        ${formatDate(s.start_date)}
      </td>

      <td>
        ${formatDate(s.end_date)}
      </td>

      <td>

        ${
          s.is_active
          ?
          `<span class="badge active">
            ● Active
          </span>`
          :
          `<span class="badge inactive">
            Inactive
          </span>`
        }

      </td>

      <td class="no-print">

        ${
          !s.is_active
          ?
          `<button
             class="action activeBtn"
             onclick="setActive('${s.id}')">
             ✅ Make Active
           </button>`
          :
          `<button
             class="action"
             disabled>
             ✓ Active
           </button>`
        }

        <button
          class="action"
          onclick="editSession('${s.id}')">
          ✏️ Edit
        </button>

        <button
          class="action delete"
          onclick="deleteSession('${s.id}')">
          🗑️ Delete
        </button>

      </td>

    </tr>

  `).join("");

}


// =====================================
// ADD / UPDATE
// =====================================

document
.getElementById("sessionForm")
.addEventListener(
"submit",
async function(e){

  e.preventDefault();

  const editId =
  document.getElementById("editId").value;

  const year =
  Number(
    document.getElementById("year").value
  );

  const startDate =
  document.getElementById("startDate").value ||
  null;

  const endDate =
  document.getElementById("endDate").value ||
  null;

  const msg =
  document.getElementById("msg");

  const saveBtn =
  document.getElementById("saveBtn");

  msg.textContent="Saving...";
  saveBtn.disabled=true;


  try{

    // Duplicate year check
    const duplicate =
    sessions.find(
      s =>
      Number(s.year) === year &&
      String(s.id) !== String(editId)
    );

    if(duplicate){

      msg.textContent =
      "❌ এই Year / Session ইতিমধ্যে আছে";

      return;

    }


    const sessionData = {

      year:year,

      start_date:startDate,

      end_date:endDate

    };


    let result;


    if(editId){

      result =
      await db
      .from("sessions")
      .update(sessionData)
      .eq("id",editId)
      .select(`
        id,
        year,
        start_date,
        end_date,
        is_active
      `)
      .single();

    }else{

      result =
      await db
      .from("sessions")
      .insert(sessionData)
      .select(`
        id,
        year,
        start_date,
        end_date,
        is_active
      `)
      .single();

    }


    if(result.error){

      msg.textContent =
      "❌ "+result.error.message;

      return;

    }


    if(editId){

      const index =
      sessions.findIndex(
        x =>
        String(x.id) ===
        String(editId)
      );

      if(index !== -1){

        sessions[index] =
        result.data;

      }

    }else{

      sessions.unshift(result.data);

    }


    sessions.sort(
      (a,b) =>
      Number(b.year) -
      Number(a.year)
    );


    render(sessions);

    msg.textContent =
    "✅ Saved successfully";

    resetForm();

  }catch(error){

    msg.textContent =
    "❌ "+error.message;

  }finally{

    saveBtn.disabled=false;

  }

});


// =====================================
// EDIT
// =====================================

function editSession(id){

  const s =
  sessions.find(
    x =>
    String(x.id) ===
    String(id)
  );

  if(!s)return;


  document.getElementById("editId").value =
  s.id;

  document.getElementById("year").value =
  s.year || "";

  document.getElementById("startDate").value =
  s.start_date || "";

  document.getElementById("endDate").value =
  s.end_date || "";


  document.getElementById("formTitle").textContent =
  "✏️ Edit Year / Session";

  document.getElementById("saveBtn").textContent =
  "💾 Update Year";

  document.getElementById("cancelBtn").style.display =
  "inline-block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


// =====================================
// SET ACTIVE
// =====================================

async function setActive(id){

  if(!confirm(
    "এই Year-কে Active Session করতে চান?"
  ))return;


  try{

    // First deactivate all
    const {error:offError} =
    await db
    .from("sessions")
    .update({is_active:false})
    .neq("id",id);


    if(offError){

      alert(offError.message);
      return;

    }


    // Then activate selected
    const {data,error} =
    await db
    .from("sessions")
    .update({is_active:true})
    .eq("id",id)
    .select(`
      id,
      year,
      start_date,
      end_date,
      is_active
    `)
    .single();


    if(error){

      alert(error.message);
      return;

    }


    // Local update
    sessions =
    sessions.map(s=>({

      ...s,

      is_active:
      String(s.id) ===
      String(id)

    }));


    render(sessions);


  }catch(error){

    alert(error.message);

  }

}


// =====================================
// DELETE
// =====================================

async function deleteSession(id){

  const s =
  sessions.find(
    x =>
    String(x.id) ===
    String(id)
  );

  if(s && s.is_active){

    alert(
      "Active Session Delete করা যাবে না। আগে অন্য Year-কে Active করুন।"
    );

    return;

  }


  if(!confirm(
    "এই Year / Session Delete করতে চান?"
  ))return;


  try{

    const {error} =
    await db
    .from("sessions")
    .delete()
    .eq("id",id);


    if(error){

      alert(error.message);
      return;

    }


    sessions =
    sessions.filter(
      s =>
      String(s.id) !==
      String(id)
    );


    render(sessions);

  }catch(error){

    alert(error.message);

  }

}


// =====================================
// RESET
// =====================================

function resetForm(){

  document
  .getElementById("sessionForm")
  .reset();

  document.getElementById("editId").value =
  "";

  document.getElementById("formTitle").textContent =
  "➕ Add Year / Session";

  document.getElementById("saveBtn").textContent =
  "💾 Save Year";

  document.getElementById("cancelBtn").style.display =
  "none";

}


document
.getElementById("cancelBtn")
.onclick=resetForm;


// =====================================
// SEARCH
// =====================================

document
.getElementById("search")
.addEventListener(
"input",
function(){

  const q =
  this.value
  .toLowerCase()
  .trim();

  render(
    sessions.filter(
      s =>
      String(s.year)
      .toLowerCase()
      .includes(q)
    )
  );

});


// =====================================
// HELPERS
// =====================================

function formatDate(value){

  if(!value)return "-";

  const d =
  new Date(value+"T00:00:00");

  if(isNaN(d))return value;

  return d.toLocaleDateString(
    "bn-BD",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


function escapeHtml(value){

  return String(value)

  .replaceAll("&","&amp;")

  .replaceAll("<","&lt;")

  .replaceAll(">","&gt;")

  .replaceAll('"',"&quot;")

  .replaceAll("'","&#039;");

}


function showError(message){

  document.getElementById("sessionList").innerHTML =
  `<tr>
    <td colspan="5">
      ❌ ${escapeHtml(message)}
    </td>
  </tr>`;

}


// START
start();

</script>

</body>
</html>

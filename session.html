<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Session / Year Management | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f3f7fc;
    color:#1e293b;
}

.topbar{
    background:linear-gradient(135deg,#082f66,#1976d2);
    color:#fff;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    box-shadow:0 3px 12px #0002;
}

.topbar h2{
    margin:0;
    font-size:18px;
}

.dashboard-btn{
    color:#fff;
    text-decoration:none;
    border:1px solid #ffffff40;
    background:#ffffff15;
    padding:9px 14px;
    border-radius:8px;
    font-size:13px;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.box{
    background:#fff;
    border-radius:15px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 18px #0d47a115;
    border:1px solid #e3eaf3;
}

h3{
    margin:0 0 15px;
    color:#0d47a1;
    font-size:19px;
}

.line{
    width:40px;
    height:3px;
    background:linear-gradient(90deg,#0d47a1,#ffd740);
    margin-bottom:15px;
}

.notice{
    background:#edf7ff;
    border-left:4px solid #1976d2;
    padding:12px;
    border-radius:7px;
    font-size:13px;
    line-height:1.7;
    margin-bottom:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d7e0ea;
    border-radius:8px;
    outline:none;
    background:#fff;
    font-size:14px;
}

input:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d218;
}

.action{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:0;
    cursor:pointer;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
}

.save-btn{
    color:#fff;
    background:linear-gradient(135deg,#064b9b,#1976d2);
}

.cancel-btn{
    background:#e8eef5;
    color:#334155;
    display:none;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.search-row{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:15px;
}

.search-row input{
    flex:1;
}

.print-btn{
    background:#1e293b;
    color:#fff;
    white-space:nowrap;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:#fff;
    padding:11px 9px;
    text-align:left;
    font-size:13px;
}

td{
    padding:11px 9px;
    border-bottom:1px solid #e8edf3;
    font-size:13px;
}

tr:hover td{
    background:#f8fbff;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#e8f5e9;
    color:#16803c;
    font-weight:bold;
    font-size:11px;
}

.edit-btn{
    background:#fff3cd;
    color:#8a6200;
    padding:7px 10px;
    margin-right:4px;
}

.delete-btn{
    background:#fee2e2;
    color:#b91c1c;
    padding:7px 10px;
}

.loading,
.empty{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.error{
    color:#dc2626;
    background:#fef2f2;
    padding:12px;
    border-radius:8px;
}

.success{
    color:#15803d;
    background:#f0fdf4;
    padding:12px;
    border-radius:8px;
}

.message{
    display:none;
    margin-bottom:15px;
}

@media(max-width:750px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .topbar{
        padding:12px 15px;
    }

    .topbar h2{
        font-size:15px;
    }

    .container{
        margin:15px auto;
        padding:0 10px;
    }

    .box{
        padding:15px;
    }

    .search-row{
        flex-direction:column;
        align-items:stretch;
    }

    .print-btn{
        width:100%;
    }
}

@media print{

    .topbar,
    .form-box,
    .search-row,
    .action,
    .message,
    .action-col{
        display:none!important;
    }

    body{
        background:#fff;
    }

    .container{
        max-width:100%;
        margin:0;
    }

    .box{
        box-shadow:none;
        border:0;
    }

    table{
        min-width:100%;
    }
}
</style>
</head>

<body>

<!-- ==============================
     HEADER
============================== -->

<header class="topbar">

    <h2>📅 Year / Session Management</h2>

    <a href="dashboard.html" class="dashboard-btn">
        ← Dashboard
    </a>

</header>


<div class="container">

<!-- ==============================
     ADD SESSION
============================== -->

<div class="box form-box">

    <h3 id="formTitle">
        ➕ Add Year / Session
    </h3>

    <div class="line"></div>

    <div id="message" class="message"></div>

    <div class="notice">

        <b>নিয়ম:</b>
        Session শুরু হবে বছর অনুযায়ী হবে —
        যেমন <b>2026, 2027, 2028</b>।

        <br>

        Students Page-এ Session নির্বাচন করলে
        সেই বছরের শিক্ষার্থীদের আলাদা List দেখা যাবে।

    </div>


    <div class="form-grid">

        <!-- SESSION -->

        <div>

            <label>
                Year / Session *
            </label>

            <input
                type="text"
                id="sessionInput"
                placeholder="যেমন: 2026"
                inputmode="numeric"
            >

        </div>


        <!-- START DATE -->

        <div>

            <label>
                Start Date
            </label>

            <input
                type="date"
                id="startDate"
            >

        </div>


        <!-- END DATE -->

        <div>

            <label>
                End Date
            </label>

            <input
                type="date"
                id="endDate"
            >

        </div>

    </div>


    <div class="action">

        <button
            class="save-btn"
            id="saveBtn"
            onclick="saveSession()">

            💾 Save Year

        </button>


        <button
            class="cancel-btn"
            id="cancelBtn"
            onclick="cancelEdit()">

            Cancel

        </button>

    </div>

</div>


<!-- ==============================
     SESSION LIST
============================== -->

<div class="box">

    <h3>
        📅 Year / Session List
    </h3>

    <div class="line"></div>


    <div class="search-row">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Year / Session দিয়ে খুঁজুন..."
            oninput="renderSessions()"
        >

        <button
            class="print-btn"
            onclick="window.print()">

            🖨 Print

        </button>

    </div>


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Year / Session
                    </th>

                    <th>
                        Start Date
                    </th>

                    <th>
                        End Date
                    </th>

                    <th>
                        Status
                    </th>

                    <th class="action-col">
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="sessionList">

                <tr>

                    <td
                        colspan="5"
                        class="loading">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</div>


<!-- ==============================
     SUPABASE
============================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   VARIABLES
================================= */

let sessions = [];

let editingId = null;


/* =================================
   START
================================= */

async function start(){

    try{

        const {
            data:{
                session
            }
        } = await db.auth.getSession();


        if(!session){

            location.href =
            "admin.html";

            return;

        }


        await loadSessions();

    }
    catch(error){

        console.error(error);

        showMessage(
            "❌ "+error.message,
            "error"
        );

    }

}


/* =================================
   LOAD SESSIONS
================================= */

async function loadSessions(){

    const tbody =
    document.getElementById(
        "sessionList"
    );


    tbody.innerHTML = `

        <tr>

            <td
                colspan="5"
                class="loading">

                ⏳ Loading...

            </td>

        </tr>

    `;


    /*
       IMPORTANT:

       এখানে is_active ব্যবহার করা হয়নি।
       কারণ তোমার sessions table-এ
       is_active column নেই।
    */


    const {
        data,
        error
    } = await db

        .from("sessions")

        .select(`
            id,
            session,
            start_date,
            end_date
        `)

        .order(
            "session",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Session Load Error:",
            error
        );


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty error">

                    ❌ ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>

        `;

        return;

    }


    sessions =
    data || [];


    renderSessions();

}


/* =================================
   RENDER
================================= */

function renderSessions(){

    const tbody =
    document.getElementById(
        "sessionList"
    );


    const search =
    document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    let list =
    sessions.filter(item=>{

        if(!search){
            return true;
        }


        return String(
            item.session || ""
        )
        .toLowerCase()
        .includes(search);

    });


    if(!list.length){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    কোনো Year / Session পাওয়া যায়নি।

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML =

    list.map(item=>`

        <tr>

            <td>

                <strong>

                    ${escapeHtml(
                        item.session || "-"
                    )}

                </strong>

            </td>


            <td>

                ${formatDate(
                    item.start_date
                )}

            </td>


            <td>

                ${formatDate(
                    item.end_date
                )}

            </td>


            <td>

                <span class="status">

                    Active

                </span>

            </td>


            <td class="action-col">

                <button
                    class="edit-btn"
                    onclick="editSession('${item.id}')">

                    ✏️ Edit

                </button>


                <button
                    class="delete-btn"
                    onclick="deleteSession('${item.id}')">

                    🗑 Delete

                </button>

            </td>

        </tr>

    `).join("");

}


/* =================================
   SAVE
================================= */

async function saveSession(){

    const saveBtn =
    document.getElementById(
        "saveBtn"
    );


    const sessionValue =
    document
        .getElementById(
            "sessionInput"
        )
        .value
        .trim();


    const startDate =
    document
        .getElementById(
            "startDate"
        )
        .value;


    const endDate =
    document
        .getElementById(
            "endDate"
        )
        .value;


    /* VALIDATION */

    if(!sessionValue){

        showMessage(
            "❌ Year / Session লিখুন।",
            "error"
        );

        return;

    }


    if(!/^[0-9]{4}$/.test(sessionValue)){

        showMessage(
            "❌ Session অবশ্যই 4 digit year হতে হবে। যেমন: 2026",
            "error"
        );

        return;

    }


    if(startDate &&
       endDate &&
       startDate > endDate){

        showMessage(
            "❌ Start Date, End Date-এর পরে হতে পারবে না।",
            "error"
        );

        return;

    }


    saveBtn.disabled=true;


    try{


        /* ===========================
           EDIT
        =========================== */

        if(editingId){

            const {
                error
            } = await db

                .from("sessions")

                .update({

                    session:
                        sessionValue,

                    start_date:
                        startDate || null,

                    end_date:
                        endDate || null

                })

                .eq(
                    "id",
                    editingId
                );


            if(error){
                throw error;
            }


            showMessage(
                "✅ Session সফলভাবে আপডেট হয়েছে।",
                "success"
            );

        }


        /* ===========================
           INSERT
        =========================== */

        else{

            /*
               আগে একই session আছে কি না
               check করা হচ্ছে।
            */

            const {
                data:existing,
                error:checkError
            } = await db

                .from("sessions")

                .select("id")

                .eq(
                    "session",
                    sessionValue
                )
                
                .maybeSingle();


            if(checkError){
                throw checkError;
            }


            if(existing){

                showMessage(
                    "❌ "+sessionValue+
                    " Session আগে থেকেই আছে।",
                    "error"
                );

                return;

            }


            const {
                error
            } = await db

                .from("sessions")

                .insert({

                    session:
                        sessionValue,

                    start_date:
                        startDate || null,

                    end_date:
                        endDate || null

                });


            if(error){
                throw error;
            }


            showMessage(
                "✅ "+sessionValue+
                " Session সফলভাবে যোগ হয়েছে।",
                "success"
            );

        }


        clearForm();

        await loadSessions();

    }
    catch(error){

        console.error(
            "Save Error:",
            error
        );


        showMessage(
            "❌ "+error.message,
            "error"
        );

    }
    finally{

        saveBtn.disabled=false;

    }

}


/* =================================
   EDIT
================================= */

function editSession(id){

    const item =
    sessions.find(
        x =>
        String(x.id) ===
        String(id)
    );


    if(!item){

        showMessage(
            "❌ Session পাওয়া যায়নি।",
            "error"
        );

        return;

    }


    editingId =
    item.id;


    document
        .getElementById(
            "sessionInput"
        )
        .value =
        item.session || "";


    document
        .getElementById(
            "startDate"
        )
        .value =
        item.start_date || "";


    document
        .getElementById(
            "endDate"
        )
        .value =
        item.end_date || "";


    document
        .getElementById(
            "formTitle"
        )
        .textContent =
        "✏️ Edit Year / Session";


    document
        .getElementById(
            "saveBtn"
        )
        .textContent =
        "💾 Update Session";


    document
        .getElementById(
            "cancelBtn"
        )
        .style.display =
        "inline-block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =================================
   CANCEL EDIT
================================= */

function cancelEdit(){

    clearForm();

}


/* =================================
   CLEAR FORM
================================= */

function clearForm(){

    editingId=null;


    document
        .getElementById(
            "sessionInput"
        )
        .value="";


    document
        .getElementById(
            "startDate"
        )
        .value="";


    document
        .getElementById(
            "endDate"
        )
        .value="";


    document
        .getElementById(
            "formTitle"
        )
        .textContent =
        "➕ Add Year / Session";


    document
        .getElementById(
            "saveBtn"
        )
        .textContent =
        "💾 Save Year";


    document
        .getElementById(
            "cancelBtn"
        )
        .style.display =
        "none";

}


/* =================================
   DELETE
================================= */

async function deleteSession(id){

    const item =
    sessions.find(
        x =>
        String(x.id) ===
        String(id)
    );


    if(!item){
        return;
    }


    const ok =
    confirm(
        "আপনি কি "+item.session+
        " Session মুছে ফেলতে চান?\n\n"+
        "এই Session-এর সাথে Students যুক্ত থাকলে delete করতে সমস্যা হতে পারে।"
    );


    if(!ok){
        return;
    }


    try{

        /*
           আগে check করা হচ্ছে
           এই session-এর students আছে কি না।
        */

        const {
            data:studentData,
            error:studentError
        } = await db

            .from("students")

            .select("id")

            .eq(
                "session",
                item.session
            )
            
            .limit(1);


        if(studentError){
            throw studentError;
        }


        if(
            studentData &&
            studentData.length > 0
        ){

            showMessage(
                "❌ এই Session-এর Students আছে। আগে Students অন্য Session-এ সরান বা মুছে দিন।",
                "error"
            );

            return;

        }


        const {
            error
        } = await db

            .from("sessions")

            .delete()

            .eq(
                "id",
                id
            );


        if(error){
            throw error;
        }


        showMessage(
            "✅ "+item.session+
            " Session মুছে ফেলা হয়েছে।",
            "success"
        );


        await loadSessions();

    }
    catch(error){

        console.error(
            "Delete Error:",
            error
        );


        showMessage(
            "❌ "+error.message,
            "error"
        );

    }

}


/* =================================
   DATE FORMAT
================================= */

function formatDate(value){

    if(!value){
        return "-";
    }


    const d =
    new Date(
        value+"T00:00:00"
    );


    if(isNaN(d.getTime())){
        return escapeHtml(value);
    }


    return d.toLocaleDateString(
        "en-GB"
    );

}


/* =================================
   MESSAGE
================================= */

function showMessage(
    message,
    type
){

    const box =
    document.getElementById(
        "message"
    );


    box.style.display =
    "block";


    box.className =
    "message "+
    type;


    box.textContent =
    message;


    setTimeout(()=>{

        box.style.display =
        "none";

    },5000);

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =================================
   START
================================= */

start();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salary Management | মাদরাসায়ে নূরুল কুরআন</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f8f7;
    color:#173f37;
    font-family:'Noto Serif Bengali',serif;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    min-height:58px;
    background:linear-gradient(135deg,#00695c,#00897b);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.brand{
    font-size:18px;
    font-weight:800;
}

.dashboard{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.dashboard:hover{
    opacity:.85;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:96%;
    max-width:1200px;
    margin:18px auto 45px;
}

/* =========================
   BOX
========================= */

.card{
    background:#fff;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    border:1px solid #e1eeeb;
    box-shadow:0 3px 15px rgba(0,80,70,.08);
}

.title{
    margin:0 0 16px;
    color:#00695c;
    font-size:18px;
    font-weight:800;
}

/* =========================
   TABS
========================= */

.tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.tab{
    border:0;
    border-radius:9px;
    padding:11px 17px;
    background:#edf2f1;
    color:#31544e;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    transition:.2s;
}

.tab:hover{
    background:#dfeae7;
}

.tab.active{
    color:#fff;
    background:#00796b;
    box-shadow:0 3px 9px rgba(0,121,107,.22);
}

/* =========================
   FORM
========================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.form-group{
    margin-bottom:4px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:6px;
    color:#24584f;
    font-size:14px;
    font-weight:700;
}

input,
select{
    width:100%;
    height:44px;
    padding:0 12px;
    border:1px solid #cbded9;
    border-radius:8px;
    background:#fbfefd;
    color:#173f37;
    font-family:inherit;
    font-size:14px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#00897b;
    box-shadow:0 0 0 2px rgba(0,137,123,.10);
}

.hint{
    margin-top:4px;
    color:#78908b;
    font-size:11px;
}

/* =========================
   BUTTON
========================= */

.btn{
    border:0;
    border-radius:8px;
    padding:10px 16px;
    color:#fff;
    background:#00796b;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
}

.btn:hover{
    background:#00695c;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.cancel-btn{
    background:#757575;
    margin-left:6px;
}

.cancel-btn:hover{
    background:#616161;
}

.edit-btn{
    background:#1565c0;
}

.edit-btn:hover{
    background:#0d47a1;
}

.delete-btn{
    background:#c62828;
}

.delete-btn:hover{
    background:#b71c1c;
}

.print-btn{
    background:#6a1b9a;
}

.print-btn:hover{
    background:#4a148c;
}

.small-btn{
    padding:6px 9px;
    font-size:11px;
    margin:2px;
}

/* =========================
   MESSAGE
========================= */

.message{
    margin-top:11px;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
}

.message:empty{
    display:none;
}

.success{
    color:#087f23;
    background:#effaf1;
    border:1px solid #bde8c5;
}

.error{
    color:#c62828;
    background:#fff2f2;
    border:1px solid #ffcaca;
}

/* =========================
   SUMMARY
========================= */

.summary{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.summary-box{
    min-width:150px;
    background:#edf7f5;
    border:1px solid #dcece8;
    border-radius:9px;
    padding:11px 15px;
    color:#12665b;
    font-size:13px;
    font-weight:700;
}

.summary-box strong{
    display:block;
    margin-top:2px;
    font-size:17px;
}

/* =========================
   SEARCH
========================= */

.search{
    margin-bottom:13px;
}

.search::placeholder{
    color:#8aa09c;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
    border-radius:9px;
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
    font-size:13px;
}

th{
    padding:11px 8px;
    background:#00695c;
    color:#fff;
    text-align:left;
    white-space:nowrap;
}

td{
    padding:10px 8px;
    border-bottom:1px solid #e4eeec;
    white-space:nowrap;
    vertical-align:middle;
}

tbody tr:hover td{
    background:#f2f9f7;
}

.person-name{
    font-weight:700;
    color:#174d44;
}

.person-sub{
    margin-top:2px;
    color:#819691;
    font-size:10px;
}

.due-positive{
    color:#c62828;
    font-weight:800;
}

.due-zero{
    color:#087f23;
    font-weight:800;
}

.action{
    white-space:nowrap;
}

.empty,
.loading{
    text-align:center;
    padding:27px !important;
    color:#819691;
}

.table-error{
    color:#c62828;
    text-align:center;
    padding:20px !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .container{
        width:94%;
    }

    .card{
        padding:14px;
    }

    .topbar{
        padding:0 12px;
    }

    .brand{
        font-size:15px;
    }

    .dashboard{
        font-size:12px;
    }

    .summary-box{
        flex:1;
        min-width:135px;
    }

    .tab{
        flex:1;
        min-width:145px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        💰 Salary Management
    </div>

    <a href="dashboard.html" class="dashboard">
        ← Dashboard
    </a>

</header>


<div class="container">

<!-- =========================
     SALARY FORM
========================= -->

<div class="card">

    <div class="tabs">

        <button
            type="button"
            class="tab active"
            id="teacherTab">
            👨‍🏫 Teacher Salary
        </button>

        <button
            type="button"
            class="tab"
            id="employeeTab">
            👨‍💼 Employee Salary
        </button>

    </div>


    <h2 class="title" id="formTitle">
        ➕ Add Teacher Salary
    </h2>


    <form id="salaryForm">

        <input
            type="hidden"
            id="editId"
            value=""
        >


        <div class="grid">

            <!-- PERSON -->

            <div class="form-group">

                <label id="personLabel">
                    Teacher *
                </label>

                <select id="personId" required>

                    <option value="">
                        Teacher নির্বাচন করুন
                    </option>

                </select>

                <div class="hint">
                    যাকে Salary দেওয়া হচ্ছে তাকে নির্বাচন করুন।
                </div>

            </div>


            <!-- MONTH -->

            <div class="form-group">

                <label>
                    Salary Month *
                </label>

                <input
                    type="month"
                    id="salaryMonth"
                    required
                >

            </div>


            <!-- SALARY -->

            <div class="form-group">

                <label>
                    Salary Amount *
                </label>

                <input
                    type="number"
                    id="amount"
                    min="0"
                    step="0.01"
                    required
                    placeholder="যেমন: 15000"
                >

            </div>


            <!-- PAID -->

            <div class="form-group">

                <label>
                    Paid Amount *
                </label>

                <input
                    type="number"
                    id="paidAmount"
                    min="0"
                    step="0.01"
                    required
                    placeholder="যেমন: 15000"
                >

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label>
                    Payment Date
                </label>

                <input
                    type="date"
                    id="paymentDate"
                >

            </div>


            <!-- METHOD -->

            <div class="form-group">

                <label>
                    Payment Method
                </label>

                <select id="method">

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="bKash">
                        bKash
                    </option>

                    <option value="Nagad">
                        Nagad
                    </option>

                    <option value="Bank">
                        Bank
                    </option>

                </select>

            </div>


            <div class="full">

                <button
                    type="submit"
                    class="btn"
                    id="saveBtn">

                    💾 Save Salary

                </button>


                <button
                    type="button"
                    class="btn cancel-btn"
                    id="cancelBtn"
                    style="display:none">

                    Cancel

                </button>


                <div
                    id="msg"
                    class="message">
                </div>

            </div>

        </div>

    </form>

</div>


<!-- =========================
     SALARY LIST
========================= -->

<div class="card">

    <h2 class="title" id="listTitle">
        👨‍🏫 Teacher Salary List
    </h2>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-box">

            Total Salary

            <strong id="totalSalary">
                0.00
            </strong>

        </div>


        <div class="summary-box">

            Paid

            <strong id="totalPaid">
                0.00
            </strong>

        </div>


        <div class="summary-box">

            Due

            <strong id="totalDue">
                0.00
            </strong>

        </div>

    </div>


    <!-- SEARCH -->

    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔍 নাম / ID / মোবাইল দিয়ে খুঁজুন..."
    >


    <!-- TABLE -->

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Name
                    </th>

                    <th>
                        ID
                    </th>

                    <th>
                        Month
                    </th>

                    <th>
                        Salary
                    </th>

                    <th>
                        Paid
                    </th>

                    <th>
                        Due
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Method
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="salaryList">

                <tr>

                    <td
                        colspan="9"
                        class="loading">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPQ";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let mode = "teacher";

let teachers = [];

let employees = [];

let teacherSalaries = [];

let employeeSalaries = [];


/* =========================================================
   ELEMENTS
========================================================= */

const teacherTab =
document.getElementById("teacherTab");

const employeeTab =
document.getElementById("employeeTab");

const personId =
document.getElementById("personId");

const personLabel =
document.getElementById("personLabel");

const formTitle =
document.getElementById("formTitle");

const listTitle =
document.getElementById("listTitle");

const salaryList =
document.getElementById("salaryList");

const saveBtn =
document.getElementById("saveBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const msg =
document.getElementById("msg");


/* =========================================================
   TODAY
========================================================= */

function today(){

    const d = new Date();

    const y =
        d.getFullYear();

    const m =
        String(d.getMonth()+1)
        .padStart(2,"0");

    const day =
        String(d.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${day}`;

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type=""
){

    msg.textContent =
        text;

    msg.className =
        "message " + type;

}


function clearMessage(){

    msg.textContent =
        "";

    msg.className =
        "message";

}


/* =========================================================
   START
========================================================= */

async function start(){

    try{

        const {
            data,
            error
        } =
        await db.auth.getSession();


        if(error){

            showMessage(
                "❌ Session Error: " +
                error.message,
                "error"
            );

            return;

        }


        if(!data.session){

            location.href =
                "admin.html";

            return;

        }


        document.getElementById(
            "paymentDate"
        ).value =
            today();


        await loadTeachers();

        await loadEmployees();

        loadPersonDropdown();

        await loadCurrentSalary();

    }

    catch(error){

        showMessage(
            "❌ Page Error: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   LOAD TEACHERS
========================================================= */

async function loadTeachers(){

    const {
        data,
        error
    } =
    await db
        .from("teachers")
        .select("id,name,phone")
        .order("name",{
            ascending:true
        });


    if(error){

        teachers = [];

        showMessage(
            "❌ Teacher Load Error: " +
            error.message,
            "error"
        );

        return;

    }


    teachers =
        data || [];

}


/* =========================================================
   LOAD EMPLOYEES
========================================================= */

async function loadEmployees(){

    const {
        data,
        error
    } =
    await db
        .from("employees")
        .select(
            "id,employee_id,name,phone"
        )
        .order("name",{
            ascending:true
        });


    if(error){

        employees = [];

        showMessage(
            "❌ Employee Load Error: " +
            error.message,
            "error"
        );

        return;

    }


    employees =
        data || [];

}


/* =========================================================
   PERSON DROPDOWN
========================================================= */

function loadPersonDropdown(){

    personId.innerHTML =
        "";


    const first =
        document.createElement("option");

    first.value =
        "";

    first.textContent =
        mode === "teacher"
        ?
        "Teacher নির্বাচন করুন"
        :
        "Employee নির্বাচন করুন";

    personId.appendChild(
        first
    );


    if(mode === "teacher"){

        teachers.forEach(
            teacher=>{

                if(
                    teacher.id === null ||
                    teacher.id === undefined
                ){

                    return;

                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    String(
                        teacher.id
                    );


                option.textContent =
                    `${teacher.name || "Unknown"}${
                        teacher.phone
                        ?
                        " - " +
                        teacher.phone
                        :
                        ""
                    }`;


                personId.appendChild(
                    option
                );

            }
        );

    }

    else{

        employees.forEach(
            employee=>{

                if(
                    employee.id === null ||
                    employee.id === undefined
                ){

                    return;

                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    String(
                        employee.id
                    );


                option.textContent =
                    `${
                        employee.employee_id
                        ?
                        employee.employee_id +
                        " - "
                        :
                        ""
                    }${
                        employee.name ||
                        "Unknown"
                    }${
                        employee.phone
                        ?
                        " - " +
                        employee.phone
                        :
                        ""
                    }`;


                personId.appendChild(
                    option
                );

            }
        );

    }

}


/* =========================================================
   LOAD CURRENT
========================================================= */

async function loadCurrentSalary(){

    if(mode === "teacher"){

        await loadTeacherSalary();

    }

    else{

        await loadEmployeeSalary();

    }

}


/* =========================================================
   LOAD TEACHER SALARY
========================================================= */

async function loadTeacherSalary(){

    salaryList.innerHTML = `
        <tr>
            <td colspan="9" class="loading">
                ⏳ Teacher Salary Loading...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } =
    await db
        .from("teacher_salaries")
        .select("*")
        .order("id",{
            ascending:false
        });


    if(error){

        teacherSalaries = [];

        salaryList.innerHTML = `
            <tr>
                <td colspan="9" class="table-error">
                    ❌ ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        updateSummary(
            0,
            0
        );

        return;

    }


    teacherSalaries =
        data || [];


    renderTeacherSalary();

}


/* =========================================================
   LOAD EMPLOYEE SALARY
========================================================= */

async function loadEmployeeSalary(){

    salaryList.innerHTML = `
        <tr>
            <td colspan="9" class="loading">
                ⏳ Employee Salary Loading...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } =
    await db
        .from("employee_salaries")
        .select("*")
        .order("id",{
            ascending:false
        });


    if(error){

        employeeSalaries = [];

        salaryList.innerHTML = `
            <tr>
                <td colspan="9" class="table-error">
                    ❌ ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        updateSummary(
            0,
            0
        );

        return;

    }


    employeeSalaries =
        data || [];


    renderEmployeeSalary();

}


/* =========================================================
   TEACHER RENDER
========================================================= */

function renderTeacherSalary(
    list = teacherSalaries
){

    let salaryTotal = 0;

    let paidTotal = 0;


    list.forEach(
        salary=>{

            salaryTotal +=
                Number(
                    salary.amount
                ) || 0;

            paidTotal +=
                Number(
                    salary.paid_amount
                ) || 0;

        }
    );


    updateSummary(
        salaryTotal,
        paidTotal
    );


    if(!list.length){

        salaryList.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    কোনো Teacher Salary record নেই।
                </td>
            </tr>
        `;

        return;

    }


    salaryList.innerHTML =
        list.map(
            salary=>{

                const teacher =
                    teachers.find(
                        t =>
                        String(t.id) ===
                        String(
                            salary.teacher_id
                        )
                    );


                const name =
                    teacher?.name ||
                    "Unknown";


                const phone =
                    teacher?.phone ||
                    "";


                const id =
                    teacher?.id ??
                    "—";


                const amount =
                    Number(
                        salary.amount
                    ) || 0;


                const paid =
                    Number(
                        salary.paid_amount
                    ) || 0;


                const due =
                    amount - paid;


                return `
                    <tr>

                        <td>

                            <div class="person-name">
                                ${escapeHtml(name)}
                            </div>

                            ${
                                phone
                                ?
                                `<div class="person-sub">
                                    📱 ${escapeHtml(phone)}
                                </div>`
                                :
                                ""
                            }

                        </td>


                        <td>
                            ${escapeHtml(
                                String(id)
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                salary.salary_month || "-"
                            )}
                        </td>


                        <td>
                            ৳ ${amount.toFixed(2)}
                        </td>


                        <td>
                            ৳ ${paid.toFixed(2)}
                        </td>


                        <td class="${
                            due > 0
                            ?
                            "due-positive"
                            :
                            "due-zero"
                        }">
                            ৳ ${due.toFixed(2)}
                        </td>


                        <td>
                            ${escapeHtml(
                                salary.payment_date || "-"
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                salary.payment_method || "-"
                            )}
                        </td>


                        <td class="action">

                            <button
                                class="btn edit-btn small-btn"
                                data-id="${escapeHtml(
                                    String(salary.id)
                                )}"
                                onclick="editSalaryFromButton(this)">
                                Edit
                            </button>


                            <button
                                class="btn delete-btn small-btn"
                                data-id="${escapeHtml(
                                    String(salary.id)
                                )}"
                                onclick="deleteSalaryFromButton(this)">
                                Delete
                            </button>


                            <button
                                class="btn print-btn small-btn"
                                data-id="${escapeHtml(
                                    String(salary.id)
                                )}"
                                onclick="printSalaryFromButton(this)">
                                🖨️ Print
                            </button>

                        </td>

                    </tr>
                `;

            }
        )
        .join("");

}


/* =========================================================
   EMPLOYEE RENDER
========================================================= */

function renderEmployeeSalary(
    list = employeeSalaries
){

    let salaryTotal = 0;

    let paidTotal = 0;


    list.forEach(
        salary=>{

            salaryTotal +=
                Number(
                    salary.amount
                ) || 0;

            paidTotal +=
                Number(
                    salary.paid_amount
                ) || 0;

        }
    );


    updateSummary(
        salaryTotal,
        paidTotal
    );


    if(!list.length){

        salaryList.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    কোনো Employee Salary record নেই।
                </td>
            </tr>
        `;

        return;

    }


    salaryList.innerHTML =
        list.map(
            salary=>{

                const employee =
                    employees.find(
                        e =>
                        String(e.id) ===
                        String(
                            salary.employee_id
                        )
                    );


                const name =
                    employee?.name ||
                    "Unknown";


                const employeeId =
                    employee?.employee_id ||
                    "—";


                const phone =
                    employee?.phone ||
                    "";


                const amount =
                    Number(

/* =========================================================
   SAVE SALARY
========================================================= */

document.getElementById(
    "salaryForm"
).addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        clearMessage();


        const editId =
            document.getElementById(
                "editId"
            ).value.trim();


        const selectedPerson =
            personId.value;


        const salaryMonth =
            document.getElementById(
                "salaryMonth"
            ).value;


        const amount =
            Number(
                document.getElementById(
                    "amount"
                ).value
            );


        const paid =
            Number(
                document.getElementById(
                    "paidAmount"
                ).value
            );


        const paymentDate =
            document.getElementById(
                "paymentDate"
            ).value ||
            null;


        const paymentMethod =
            document.getElementById(
                "method"
            ).value;


        /* VALIDATION */

        if(!selectedPerson){

            showMessage(
                mode === "teacher"
                ?
                "❌ Teacher নির্বাচন করুন।"
                :
                "❌ Employee নির্বাচন করুন।",
                "error"
            );

            return;

        }


        if(!salaryMonth){

            showMessage(
                "❌ Salary Month নির্বাচন করুন।",
                "error"
            );

            return;

        }


        if(
            !Number.isFinite(amount) ||
            amount < 0
        ){

            showMessage(
                "❌ সঠিক Salary Amount দিন।",
                "error"
            );

            return;

        }


        if(
            !Number.isFinite(paid) ||
            paid < 0
        ){

            showMessage(
                "❌ সঠিক Paid Amount দিন।",
                "error"
            );

            return;

        }


        if(paid > amount){

            showMessage(
                "❌ Paid Amount Salary Amount-এর বেশি হতে পারবে না।",
                "error"
            );

            return;

        }


        const record = {

            salary_month:
                salaryMonth,

            amount:
                amount,

            paid_amount:
                paid,

            payment_date:
                paymentDate,

            payment_method:
                paymentMethod

        };


        if(mode === "teacher"){

            record.teacher_id =
                Number(selectedPerson);

        }

        else{

            record.employee_id =
                Number(selectedPerson);

        }


        saveBtn.disabled =
            true;


        saveBtn.textContent =
            editId
            ?
            "Updating..."
            :
            "Saving...";


        try{

            let result;


            const table =
                mode === "teacher"
                ?
                "teacher_salaries"
                :
                "employee_salaries";


            if(editId){

                result =
                    await db
                        .from(table)
                        .update(record)
                        .eq(
                            "id",
                            Number(editId)
                        )
                        .select();

            }

            else{

                result =
                    await db
                        .from(table)
                        .insert(record)
                        .select();

            }


            if(result.error){

                showMessage(
                    "❌ Save Error: " +
                    result.error.message,
                    "error"
                );

                return;

            }


            showMessage(
                editId
                ?
                "✅ Salary সফলভাবে Update হয়েছে।"
                :
                "✅ Salary সফলভাবে Save হয়েছে।",
                "success"
            );


            resetForm();


            await loadCurrentSalary();

        }

        catch(error){

            showMessage(
                "❌ " +
                error.message,
                "error"
            );

        }

        finally{

            saveBtn.disabled =
                false;

            saveBtn.textContent =
                "💾 Save Salary";

        }

    }
);

        );

        return;

    }


    document.getElementById(
        "editId"
    ).value =
        String(salary.id);

    const selectedPerson =
        mode === "teacher"
        ?
        salary.teacher_id
        :
        salary.employee_id;


    personId.value =
        String(selectedPerson);


    document.getElementById(
        "salaryMonth"
    ).value =
        salary.salary_month || "";


    document.getElementById(

/* =========================================================
   DELETE
========================================================= */

async function deleteSalary(id){

    if(
        !confirm(
            "এই Salary record Delete করতে চান?"
        )
    ){

        return;

    }


    const table =
        mode === "teacher"
        ?
        "teacher_salaries"
        :
        "employee_salaries";


    const {
        data,
        error
    } =
    await db
        .from(table)
        .delete()
        .eq(
            "id",
            Number(id)
        )
        .select("id");


    if(error){

        alert(
            "❌ Delete Error:\n" +
            error.message
        );

        return;

    }


    if(!data || !data.length){

        alert(
            "❌ Record পাওয়া যায়নি অথবা Delete permission নেই।"
        );

        return;

    }


    await loadCurrentSalary();


    showMessage(
        "✅ Salary record deleted successfully.",
        "success"
    );

}


function deleteSalaryFromButton(button){

    deleteSalary(
        button.getAttribute(
            "data-id"
        )
    );

}

/* =========================================================
   SEARCH
========================================================= */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function(){

        const q =
            this.value
            .toLowerCase()
            .trim();


        if(mode === "teacher"){

            const filtered =
                teacherSalaries.filter(
                    salary=>{

                        const teacher =
                            teachers.find(
                                t =>
                                String(t.id) ===
                                String(
                                    salary.teacher_id
                                )
                            );


                        if(!teacher){
                            return false;
                        }


                        const text =
                            [
                                teacher.name,
                                teacher.phone,
                                teacher.id,
                                salary.salary_month,
                                salary.payment_method
                            ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();


                        return text.includes(q);

                    }
                );


            renderTeacherSalary(
                filtered
            );

        }

        else{

            const filtered =
                employeeSalaries.filter(
                    salary=>{

                        const employee =
                            employees.find(
                                e =>
                                String(e.id) ===
                                String(
                                    salary.employee_id
                                )
                            );


                        if(!employee){
                            return false;
                        }


                        const text =
                            [
                                employee.name,
                                employee.phone,
                                employee.employee_id,
                                salary.salary_month,
                                salary.payment_method
                            ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();


                        return text.includes(q);

                    }
                );


            renderEmployeeSalary(
                filtered
            );

        }

    }
);

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

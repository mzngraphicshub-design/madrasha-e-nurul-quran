<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salary Management | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#222}
.top{background:#075c43;color:#fff;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0;color:#fff;font-size:20px}
.top a{color:#fff;text-decoration:none}
.container{max-width:1200px;margin:25px auto;padding:0 15px}
.box{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:20px}
h3{color:#075c43;margin:0 0 18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{font-weight:bold;font-size:14px}
input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #ddd;border-radius:7px;font-size:14px}
button{border:0;padding:10px 16px;border-radius:7px;background:#087f5b;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.cancel{background:#777;margin-left:7px}
.edit{background:#1565c0}
.delete{background:#c62828}
.search{margin-bottom:15px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
th{background:#075c43;color:#fff}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:#eee;padding:12px 18px;border-radius:8px;font-weight:bold}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab{background:#ddd;color:#222}
.tab.active{background:#087f5b;color:#fff}
#msg{margin-top:12px;min-height:20px}
.loading{text-align:center;padding:20px}
@media(max-width:650px){
.form{grid-template-columns:1fr}
.full{grid-column:auto}
table{min-width:950px}
}
</style>
</head>

<body>

<header class="top">
<h2>💰 Salary Management</h2>
<a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="box">

<div class="tabs">
<button class="tab active" id="teacherTab">👨‍🏫 Teacher Salary</button>
<button class="tab" id="employeeTab">👨‍💼 Employee Salary</button>
</div>

<h3 id="formTitle">➕ Add Teacher Salary</h3>

<form id="salaryForm">

<input type="hidden" id="editId">

<div>
<label id="personLabel">Teacher *</label>
<select id="personId" required>
<option value="">Teacher নির্বাচন করুন</option>
</select>
</div>

<div>
<label>Salary Month *</label>
<input type="month" id="salaryMonth" required>
</div>

<div>
<label>Salary Amount *</label>
<input type="number" id="amount" min="0" step="0.01" required>
</div>

<div>
<label>Paid Amount *</label>
<input type="number" id="paidAmount" min="0" step="0.01" required>
</div>

<div>
<label>Payment Date</label>
<input type="date" id="paymentDate">
</div>

<div>
<label>Payment Method</label>
<select id="method">
<option value="Cash">Cash</option>
<option value="bKash">bKash</option>
<option value="Nagad">Nagad</option>
<option value="Bank">Bank</option>
</select>
</div>

<div class="full">

<button type="submit" id="saveBtn">💾 Save Salary</button>

<button type="button" class="cancel" id="cancelBtn" style="display:none">
Cancel
</button>

<div id="msg"></div>

</div>

</form>
</div>


<div class="box">

<h3 id="listTitle">👨‍🏫 Teacher Salary List</h3>

<div class="summary">

<div class="card">
Total Salary:
<span id="totalSalary">0.00</span>
</div>

<div class="card">
Paid:
<span id="totalPaid">0.00</span>
</div>

<div class="card">
Due:
<span id="totalDue">0.00</span>
</div>

</div>

<input
class="search"
id="search"
placeholder="🔍 নাম / ID / মোবাইল দিয়ে খুঁজুন..."
>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Name</th>
<th>ID</th>
<th>Month</th>
<th>Salary</th>
<th>Paid</th>
<th>Due</th>
<th>Date</th>
<th>Method</th>
<th>Action</th>
</tr>
</thead>

<tbody id="salaryList">
<tr>
<td colspan="9" class="loading">Loading...</td>
</tr>
</tbody>

</table>

</div>
</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let mode = "teacher";

let teachers = [];
let employees = [];

let teacherSalaries = [];
let employeeSalaries = [];


function today(){

return new Date()
.toISOString()
.split("T")[0];

}


/* =========================
   START
========================= */

async function start(){

const {
data:{session}
}=await db.auth.getSession();

if(!session){

location.href="admin.html";
return;

}

await loadTeachers();
await loadEmployees();

loadPersonDropdown();

await loadCurrentSalary();

}


/* =========================
   TEACHERS
========================= */

async function loadTeachers(){

const {data,error}=await db
.from("teachers")
.select("id,name,phone")
.order("name");

if(error){

showMessage("❌ Teacher load error: "+error.message);

return;

}

teachers=data||[];

}


/* =========================
   EMPLOYEES
========================= */

async function loadEmployees(){

const {data,error}=await db
.from("employees")
.select("id,employee_id,name,phone")
.order("name");

if(error){

showMessage("❌ Employee load error: "+error.message);

return;

}

employees=data||[];

}


/* =========================
   DROPDOWN
========================= */

function loadPersonDropdown(){

const select=document.getElementById("personId");

select.innerHTML="";

if(mode==="teacher"){

select.innerHTML=
'<option value="">Teacher নির্বাচন করুন</option>';

teachers.forEach(t=>{

const option=document.createElement("option");

option.value=t.id;

option.textContent=
`${t.name}${t.phone ? " - "+t.phone : ""}`;

select.appendChild(option);

});

}else{

select.innerHTML=
'<option value="">Employee নির্বাচন করুন</option>';

employees.forEach(e=>{

const option=document.createElement("option");

option.value=e.id;

option.textContent=
`${e.employee_id ? e.employee_id+" - " : ""}${e.name}${e.phone ? " - "+e.phone : ""}`;

select.appendChild(option);

});

}

}


/* =========================
   LOAD CURRENT
========================= */

async function loadCurrentSalary(){

if(mode==="teacher"){

await loadTeacherSalary();

}else{

await loadEmployeeSalary();

}

}


/* =========================
   TEACHER SALARY LOAD
========================= */

async function loadTeacherSalary(){

const tbody=document.getElementById("salaryList");

tbody.innerHTML=
'<tr><td colspan="9" class="loading">Loading...</td></tr>';

const {data,error}=await db
.from("teacher_salaries")
.select("*")
.order("payment_date",{ascending:false});

if(error){

tbody.innerHTML=
`<tr><td colspan="9">❌ ${escapeHtml(error.message)}</td></tr>`;

return;

}

teacherSalaries=data||[];

renderTeacherSalary();

}


/* =========================
   EMPLOYEE SALARY LOAD
========================= */

async function loadEmployeeSalary(){

const tbody=document.getElementById("salaryList");

tbody.innerHTML=
'<tr><td colspan="9" class="loading">Loading...</td></tr>';

const {data,error}=await db
.from("employee_salaries")
.select("*")
.order("payment_date",{ascending:false});

if(error){

tbody.innerHTML=
`<tr><td colspan="9">❌ ${escapeHtml(error.message)}</td></tr>`;

return;

}

employeeSalaries=data||[];

renderEmployeeSalary();

}


/* =========================
   TEACHER RENDER
========================= */

function renderTeacherSalary(list=teacherSalaries){

let totalSalary=0;
let totalPaid=0;

list.forEach(s=>{

totalSalary+=Number(s.amount)||0;
totalPaid+=Number(s.paid_amount)||0;

});

updateSummary(totalSalary,totalPaid);

const tbody=document.getElementById("salaryList");

if(!list.length){

tbody.innerHTML=
'<tr><td colspan="9" style="text-align:center">কোনো Teacher Salary record নেই</td></tr>';

return;

}

tbody.innerHTML=list.map(s=>{

const teacher=teachers.find(
t=>String(t.id)===String(s.teacher_id)
);

const name=teacher?.name||"Unknown";
const phone=teacher?.phone||"";
const amount=Number(s.amount)||0;
const paid=Number(s.paid_amount)||0;
const due=amount-paid;

return `
<tr>

<td>
${escapeHtml(name)}
${phone ? "<br><small>"+escapeHtml(phone)+"</small>" : ""}
</td>

<td>—</td>

<td>${escapeHtml(s.salary_month||"-")}</td>

<td>${amount.toFixed(2)}</td>

<td>${paid.toFixed(2)}</td>

<td>${due.toFixed(2)}</td>

<td>${escapeHtml(s.payment_date||"-")}</td>

<td>${escapeHtml(s.payment_method||"-")}</td>

<td>

<button class="edit"
onclick="editSalary('${s.id}')">
Edit
</button>

<button class="delete"
onclick="deleteSalary('${s.id}')">
Delete
</button>

</td>

</tr>
`;

}).join("");

}


/* =========================
   EMPLOYEE RENDER
========================= */

function renderEmployeeSalary(list=employeeSalaries){

let totalSalary=0;
let totalPaid=0;

list.forEach(s=>{

totalSalary+=Number(s.amount)||0;
totalPaid+=Number(s.paid_amount)||0;

});

updateSummary(totalSalary,totalPaid);

const tbody=document.getElementById("salaryList");

if(!list.length){

tbody.innerHTML=
'<tr><td colspan="9" style="text-align:center">কোনো Employee Salary record নেই</td></tr>';

return;

}

tbody.innerHTML=list.map(s=>{

const employee=employees.find(
e=>String(e.id)===String(s.employee_id)
);

const name=employee?.name||"Unknown";
const empId=employee?.employee_id||"—";
const phone=employee?.phone||"";

const amount=Number(s.amount)||0;
const paid=Number(s.paid_amount)||0;
const due=amount-paid;

return `
<tr>

<td>
${escapeHtml(name)}
${phone ? "<br><small>"+escapeHtml(phone)+"</small>" : ""}
</td>

<td>${escapeHtml(empId)}</td>

<td>${escapeHtml(s.salary_month||"-")}</td>

<td>${amount.toFixed(2)}</td>

<td>${paid.toFixed(2)}</td>

<td>${due.toFixed(2)}</td>

<td>${escapeHtml(s.payment_date||"-")}</td>

<td>${escapeHtml(s.payment_method||"-")}</td>

<td>

<button class="edit"
onclick="editSalary('${s.id}')">
Edit
</button>

<button class="delete"
onclick="deleteSalary('${s.id}')">
Delete
</button>

</td>

</tr>
`;

}).join("");

}


/* =========================
   SUMMARY
========================= */

function updateSummary(totalSalary,totalPaid){

document.getElementById("totalSalary").textContent=
totalSalary.toFixed(2);

document.getElementById("totalPaid").textContent=
totalPaid.toFixed(2);

document.getElementById("totalDue").textContent=
(totalSalary-totalPaid).toFixed(2);

}


/* =========================
   SAVE
========================= */

document.getElementById("salaryForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const editId=
document.getElementById("editId").value;

const personId=
document.getElementById("personId").value;

if(!personId){

showMessage("❌ Teacher/Employee নির্বাচন করুন");

return;

}

const amount=
Number(document.getElementById("amount").value);

const paid=
Number(document.getElementById("paidAmount").value);

if(paid>amount){

showMessage(
"❌ Paid Amount Salary Amount-এর চেয়ে বেশি হতে পারবে না।"
);

return;

}

const record={

salary_month:
document.getElementById("salaryMonth").value,

amount:amount,

paid_amount:paid,

payment_date:
document.getElementById("paymentDate").value||null,

payment_method:
document.getElementById("method").value

};

if(mode==="teacher"){

record.teacher_id=Number(personId);

}else{

record.employee_id=Number(personId);

}

const saveBtn=document.getElementById("saveBtn");

saveBtn.disabled=true;

showMessage("Saving...");

try{

let result;

if(mode==="teacher"){

if(editId){

result=await db
.from("teacher_salaries")
.update(record)
.eq("id",editId);

}else{

result=await db
.from("teacher_salaries")
.insert(record);

}

}else{

if(editId){

result=await db
.from("employee_salaries")
.update(record)
.eq("id",editId);

}else{

result=await db
.from("employee_salaries")
.insert(record);

}

}

if(result.error){

showMessage("❌ "+result.error.message);

return;

}

showMessage("✅ Saved successfully");

resetForm();

await loadCurrentSalary();

}catch(error){

showMessage("❌ "+error.message);

}finally{

saveBtn.disabled=false;

}

});


/* =========================
   EDIT
========================= */

function editSalary(id){

const list=
mode==="teacher"
?teacherSalaries
:employeeSalaries;

const s=list.find(
x=>String(x.id)===String(id)
);

if(!s)return;

document.getElementById("editId").value=s.id;

document.getElementById("personId").value=
mode==="teacher"
?s.teacher_id
:s.employee_id;

document.getElementById("salaryMonth").value=
s.salary_month||"";

document.getElementById("amount").value=
s.amount||0;

document.getElementById("paidAmount").value=
s.paid_amount||0;

document.getElementById("paymentDate").value=
s.payment_date||"";

document.getElementById("method").value=
s.payment_method||"Cash";

document.getElementById("formTitle").textContent=
mode==="teacher"
?"✏️ Edit Teacher Salary"
:"✏️ Edit Employee Salary";

document.getElementById("saveBtn").textContent=
"💾 Update Salary";

document.getElementById("cancelBtn").style.display=
"inline-block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   DELETE
========================= */

async function deleteSalary(id){

if(!confirm("এই Salary record Delete করতে চান?"))return;

const table=
mode==="teacher"
?"teacher_salaries"
:"employee_salaries";

const {error}=await db
.from(table)
.delete()
.eq("id",id);

if(error){

alert("❌ Delete failed: "+error.message);

return;

}

alert("✅ Deleted successfully");

await loadCurrentSalary();

}


/* =========================
   TEACHER TAB
========================= */

document.getElementById("teacherTab")
.onclick=async function(){

if(mode==="teacher")return;

mode="teacher";

this.classList.add("active");

document.getElementById("employeeTab")
.classList.remove("active");

document.getElementById("personLabel").textContent=
"Teacher *";

document.getElementById("listTitle").textContent=
"👨‍🏫 Teacher Salary List";

resetForm();

loadPersonDropdown();

await loadTeacherSalary();

};


/* =========================
   EMPLOYEE TAB
========================= */

document.getElementById("employeeTab")
.onclick=async function(){

if(mode==="employee")return;

mode="employee";

this.classList.add("active");

document.getElementById("teacherTab")
.classList.remove("active");

document.getElementById("personLabel").textContent=
"Employee *";

document.getElementById("listTitle").textContent=
"👨‍💼 Employee Salary List";

resetForm();

loadPersonDropdown();

await loadEmployeeSalary();

};


/* =========================
   SEARCH
========================= */

document.getElementById("search")
.addEventListener("input",function(){

const q=this.value.toLowerCase().trim();

if(mode==="teacher"){

const filtered=teacherSalaries.filter(s=>{

const teacher=teachers.find(
t=>String(t.id)===String(s.teacher_id)
);

const name=teacher?.name||"";
const phone=teacher?.phone||"";

return(
name.toLowerCase().includes(q)||
phone.toLowerCase().includes(q)
);

});

renderTeacherSalary(filtered);

}else{

const filtered=employeeSalaries.filter(s=>{

const employee=employees.find(
e=>String(e.id)===String(s.employee_id)
);

const name=employee?.name||"";
const empId=employee?.employee_id||"";
const phone=employee?.phone||"";

return(
name.toLowerCase().includes(q)||
empId.toLowerCase().includes(q)||
phone.toLowerCase().includes(q)
);

});

renderEmployeeSalary(filtered);

}

});


/* =========================
   RESET
========================= */

function resetForm(){

document.getElementById("salaryForm").reset();

document.getElementById("editId").value="";

document.getElementById("paymentDate").value=today();

document.getElementById("saveBtn").textContent=
"💾 Save Salary";

document.getElementById("cancelBtn").style.display=
"none";

document.getElementById("msg").textContent="";

if(mode==="teacher"){

document.getElementById("formTitle").textContent=
"➕ Add Teacher Salary";

}else{

document.getElementById("formTitle").textContent=
"➕ Add Employee Salary";

}

loadPersonDropdown();

}


document.getElementById("cancelBtn")
.onclick=resetForm;


/* =========================
   MESSAGE
========================= */

function showMessage(text){

document.getElementById("msg").textContent=text;

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* START */

document.getElementById("paymentDate").value=today();

start();

</script>

</body>
</html>

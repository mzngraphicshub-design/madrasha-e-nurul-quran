<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Salary Management | মাদরাসায়ে নূরুল কুরআন</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#222;
}

.top{
    background:#075c43;
    color:#fff;
    padding:17px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.top h2{
    margin:0;
    color:#fff;
    font-size:20px;
}

.top a{
    color:#fff;
    text-decoration:none;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.box{
    background:#fff;
    padding:22px;
    border-radius:12px;
    box-shadow:0 2px 10px #0001;
    margin-bottom:20px;
}

h3{
    color:#075c43;
    margin:0 0 18px;
}


/* =========================
   TABS
========================= */

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.tab{
    background:#ddd;
    color:#222;
}

.tab.active{
    background:#087f5b;
    color:#fff;
}


/* =========================
   FORM
========================= */

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    font-size:14px;
}

input,
select{
    width:100%;
    padding:11px;
    margin-top:6px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:14px;
    background:#fff;
}

button{
    border:0;
    padding:10px 16px;
    border-radius:7px;
    background:#087f5b;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.cancel{
    background:#777;
    margin-left:7px;
}

.edit{
    background:#1565c0;
}

.delete{
    background:#c62828;
}

.print{
    background:#6a1b9a;
}


/* =========================
   MESSAGE
========================= */

#msg{
    margin-top:12px;
    min-height:20px;
    font-weight:bold;
}

.success{
    color:#087f5b;
}

.error{
    color:#c62828;
}


/* =========================
   SUMMARY
========================= */

.summary{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.card{
    background:#eee;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
}


/* =========================
   SEARCH
========================= */

.search{
    width:100%;
    margin-bottom:15px;
}


/* =========================
   TABLE
========================= */

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:10px 8px;
    border-bottom:1px solid #ddd;
    text-align:left;
    font-size:14px;
}

th{
    background:#075c43;
    color:#fff;
}

.action{
    white-space:nowrap;
}

.action button{
    padding:7px 10px;
    font-size:12px;
    margin:2px;
}

.loading{
    text-align:center;
    padding:20px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .form{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    table{
        min-width:1050px;
    }

}

</style>

</head>


<body>


<header class="top">

<h2>
💰 Salary Management

<div class="container">


<!-- =========================

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";


const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let mode = "teacher";

let teachers = [];

let employees = [];

let teacherSalaries = [];

let employeeSalaries = [];


/* =====================================================
   TODAY
===================================================== */

function today(){

    return new Date()
    .toISOString()
    .split("T")[0];

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type=""
){

    const msg =
        document.getElementById("msg");

    msg.textContent = text;

    msg.className = type;

}


/* =====================================================
   START
===================================================== */

async function start(){

    try{

        const {
            data,
            error
        } =
        await db.auth.getSession();


        if(error){

            showMessage(
                "❌ Session error: " +
                error.message,
                "error"
            );

            return;

        }


        if(!data.session){

            location.href =
                "admin.html";

            return;

        }


        document.getElementById(
            "paymentDate"
        ).value = today();


        await loadTeachers();

        await loadEmployees();

        loadPersonDropdown();

        await loadCurrentSalary();

    }

    catch(error){

        showMessage(
            "❌ Start error: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LOAD TEACHERS
===================================================== */

async function loadTeachers(){

    const {
        data,
        error
    } =
    await db

        .from("teachers")

        .select(
            "id,name,phone"
        )

        .order(
            "name",
            {
                ascending:true
            }
        );


    if(error){

        showMessage(
            "❌ Teacher load error: " +
            error.message,
            "error"
        );

        teachers = [];

        return;

    }


    teachers =
        data || [];

}


/* =====================================================
   LOAD EMPLOYEES
===================================================== */

async function loadEmployees(){

    const {
        data,
        error
    } =
    await db

        .from("employees")

        .select(
            "id,employee_id,name,phone"
        )

        .order(
            "name",
            {
                ascending:true
            }
        );


    if(error){

        showMessage(
            "❌ Employee load error: " +
            error.message,
            "error"
        );

        employees = [];

        return;

    }


    employees =
        data || [];

}


/* =====================================================
   PERSON DROPDOWN
===================================================== */

function loadPersonDropdown(){

    const select =
        document.getElementById(
            "personId"
        );


    select.innerHTML = "";


    if(mode === "teacher"){

        const first =
            document.createElement(
                "option"
            );

        first.value = "";

        first.textContent =
            "Teacher নির্বাচন করুন";

        select.appendChild(
            first
        );


        teachers.forEach(
            function(t){

                if(
                    t.id === null ||
                    t.id === undefined
                ){

                    return;

                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    String(t.id);


                option.textContent =
                    `${t.name || "Unknown"}${
                        t.phone
                        ? " - " + t.phone
                        : ""
                    }`;


                select.appendChild(
                    option
                );

            }
        );

    }

    else{

        const first =
            document.createElement(
                "option"
            );

        first.value = "";

        first.textContent =
            "Employee নির্বাচন করুন";

        select.appendChild(
            first
        );


        employees.forEach(
            function(e){

                if(
                    e.id === null ||
                    e.id === undefined
                ){

                    return;

                }


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    String(e.id);


                option.textContent =
                    `${
                        e.employee_id
                        ? e.employee_id + " - "
                        : ""
                    }${
                        e.name || "Unknown"
                    }${
                        e.phone
                        ? " - " + e.phone
                        : ""
                    }`;


                select.appendChild(
                    option
                );

            }
        );

    }

}


/* =====================================================
   CURRENT SALARY
===================================================== */

async function loadCurrentSalary(){

    if(mode === "teacher"){

        await loadTeacherSalary();

    }

    else{

        await loadEmployeeSalary();

    }

}


/* =====================================================
   LOAD TEACHER SALARY
===================================================== */

async function loadTeacherSalary(){

    const tbody =
        document.getElementById(
            "salaryList"
        );


    tbody.innerHTML = `
        <tr>
            <td
                colspan="9"
                class="loading">

                Loading...

            </td>
        </tr>
    `;


    const {
        data,
        error
    } =
    await db

        .from("teacher_salaries")

        .select("*")

        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        teacherSalaries = [];


        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="error">

                    ❌ ${
                        escapeHtml(
                            error.message
                        )
                    }

                </td>
            </tr>
        `;

        return;

    }


    teacherSalaries =
        data || [];


    renderTeacherSalary();

}


/* =====================================================
   LOAD EMPLOYEE SALARY
===================================================== */

async function loadEmployeeSalary(){

    const tbody =
        document.getElementById(
            "salaryList"
        );


    tbody.innerHTML = `
        <tr>
            <td
                colspan="9"
                class="loading">

                Loading...

            </td>
        </tr>
    `;


    const {
        data,
        error
    } =
    await db

        .from("employee_salaries")

        .select("*")

        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        employeeSalaries = [];


        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="error">

                    ❌ ${
                        escapeHtml(
                            error.message
                        )
                    }

                </td>
            </tr>
        `;

        return;

    }


    employeeSalaries =
        data || [];


    renderEmployeeSalary();

}


/* =====================================================
   RENDER TEACHER
===================================================== */

function renderTeacherSalary(
    list = teacherSalaries
){

    let totalSalary = 0;

    let totalPaid = 0;


    list.forEach(
        function(s){

            totalSalary +=
                Number(s.amount) || 0;

            totalPaid +=
                Number(s.paid_amount) || 0;

        }
    );


    updateSummary(
        totalSalary,
        totalPaid
    );


    const tbody =
        document.getElementById(
            "salaryList"
        );


    if(!list.length){

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    style="text-align:center">

                    কোনো Teacher Salary record নেই

                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        list.map(
            function(s){

                const teacher =
                    teachers.find(
                        function(t){

                            return String(t.id) ===
                                String(s.teacher_id);

                        }
                    );


                const name =
                    teacher?.name ||
                    "Unknown";


                const phone =
                    teacher?.phone ||
                    "";


                const teacherId =
                    teacher?.id !== null &&
                    teacher?.id !== undefined
                    ?
                    teacher.id
                    :
                    "—";


                const amount =
                    Number(s.amount) || 0;


                const paid =
                    Number(s.paid_amount) || 0;


                const due =
                    amount - paid;


                return `

                <tr>

                    <td>

                        ${escapeHtml(name)}

                        ${
                            phone
                            ?
                            "<br><small>" +
                            escapeHtml(phone) +
                            "</small>"
                            :
                            ""
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                String(teacherId)
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                s.salary_month ||
                                "-"
                            )
                        }

                    </td>


                    <td>
                        ${amount.toFixed(2)}
                    </td>


                    <td>
                        ${paid.toFixed(2)}
                    </td>


                    <td>
                        ${due.toFixed(2)}
                    </td>


                    <td>

                        ${
                            escapeHtml(
                                s.payment_date ||
                                "-"
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                s.payment_method ||
                                "-"
                            )
                        }

                    </td>


                    <td class="action">


                        <button
                            type="button"
                            class="edit"
                            data-salary-id="${
                                escapeHtml(
                                    String(s.id)
                                )
                            }"
                            onclick="editSalaryFromButton(this)">

                            Edit

                        </button>


                        <button
                            type="button"
                            class="delete"
                            data-salary-id="${
                                escapeHtml(
                                    String(s.id)
                                )
                            }"
                            onclick="deleteSalaryFromButton(this)">

                            Delete

                        </button>


                        <button
                            type="button"
                            class="print"
                            data-salary-id="${
                                escapeHtml(
                                    String(s.id)
                                )
                            }"
                            onclick="printSalaryFromButton(this)">

                            🖨️ Print

                        </button>


                    </td>

                </tr>

                `;

            }
        )
        .join("");

}


/* =====================================================
   RENDER EMPLOYEE
===================================================== */

function renderEmployeeSalary(
    list = employeeSalaries
){

    let totalSalary = 0;

    let totalPaid = 0;


    list.forEach(
        function(s){

            totalSalary +=
                Number(s.amount) || 0;

            totalPaid +=
                Number(s.paid_amount) || 0;

        }
    );


    updateSummary(
        totalSalary,
        totalPaid
    );


    const tbody =
        document.getElementById(
            "salaryList"
        );


    if(!list.length){

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    style="text-align:center">

                    কোনো Employee Salary record নেই

                </td>
            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        list.map(
            function(s){

                const employee =
                    employees.find(
                        function(e){

                            return String(e.id) ===
                                String(s.employee_id);

                        }
                    );


                const name =
                    employee?.name ||
                    "Unknown";


                const empId =
                    employee?.employee_id ||
                    "—";


                const phone =
                    employee?.phone ||
                    "";


                const amount =
                    Number(s.amount) || 0;


                const paid =
                    Number(s.paid_amount) || 0;


                const due =
                    amount - paid;


                return `

                <tr>

                    <td>

                        ${escapeHtml(name)}

                        ${
                            phone
                            ?
                            "<br><small>" +
                            escapeHtml(phone) +
                            "</small>"
                            :
                            ""
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                String(empId)
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                s.salary_month ||
                                "-"
                            )
                        }

                    </td>


                    <td>
                        ${amount.toFixed(2)}
                    </td>


                    <td>
                        ${paid.toFixed(2)}
                    </td>


                    <td>
                        ${due.toFixed(2)}
                    </td>


                    <td>

                        ${
                            escapeHtml(
                                s.payment_date ||
                                "-"
                            )
                        }

                    </td>


                    <td>

                        ${
                            escapeHtml(
                                s.payment_method ||
                                "-"
                            )
                        }

                    </td>


                    <td class="action">


                        <button
                            type="button"
                            class="edit"
                            data-salary-id="${
                                escapeHtml(
                                    String(s.id)
                                )
                            }"
                            onclick="editSalaryFromButton(this)">

                            Edit

                        </button>


                        <button
                            type="button"
                            class="delete"
                            data-salary-id="${
                                escapeHtml(
                                    String(s.id)
                                )
                            }"
                            onclick="deleteSalaryFromButton(this)">

                            Delete

                        </button>


                        <button
                            type="button"
                            class="print"
                            data-salary-id="${
                                escapeHtml(
                                    String(s.id)
                                )
                            }"
                            onclick="printSalaryFromButton(this)">

                            🖨️ Print

                        </button>


                    </td>

                </tr>

                `;

            }
        )
        .join("");

}


/* =====================================================
   BUTTON HANDLERS
===================================================== */

function editSalaryFromButton(button){

    const id =
        button.getAttribute(
            "data-salary-id"
        );

    editSalary(id);

}


function deleteSalaryFromButton(button){

    const id =
        button.getAttribute(
            "data-salary-id"
        );

    deleteSalary(id);

}


function printSalaryFromButton(button){

    const id =
        button.getAttribute(
            "data-salary-id"
        );

    printSalary(id);

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(
    totalSalary,
    totalPaid
){

    document.getElementById(
        "totalSalary"
    ).textContent =
        totalSalary.toFixed(2);


    document.getElementById(
        "totalPaid"
    ).textContent =
        totalPaid.toFixed(2);


    document.getElementById(
        "totalDue"
    ).textContent =
        (
            totalSalary -
            totalPaid
        ).toFixed(2);

}


/* =====================================================
   SAVE / UPDATE
===================================================== */

document.getElementById(
    "salaryForm"
).addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const editId =
            document.getElementById(
                "editId"
            ).value.trim();


        const personId =
            document.getElementById(
                "personId"
            ).value.trim();


        const salaryMonth =
            document.getElementById(
                "salaryMonth"
            ).value;


        const amount =
            Number(
                document.getElementById(
                    "amount"
                ).value
            );


        const paid =
            Number(
                document.getElementById(
                    "paidAmount"
                ).value
            );


        if(!personId){

            showMessage(
                "❌ Teacher/Employee নির্বাচন করুন",
                "error"
            );

            return;

        }


        if(!salaryMonth){

            showMessage(
                "❌ Salary Month নির্বাচন করুন",
                "error"
            );

            return;

        }


        if(
            !Number.isFinite(amount) ||
            amount < 0
        ){

            showMessage(
                "❌ Salary Amount সঠিকভাবে দিন",
                "error"
            );

            return;

        }


        if(
            !Number.isFinite(paid) ||
            paid < 0
        ){

            showMessage(
                "❌ Paid Amount সঠিকভাবে দিন",
                "error"
            );

            return;

        }


        if(paid > amount){

            showMessage(
                "❌ Paid Amount Salary Amount-এর চেয়ে বেশি হতে পারবে না।",
                "error"
            );

            return;

        }


        const record = {

            salary_month:
                salaryMonth,

            amount:
                amount,

            paid_amount:
                paid,

            payment_date:
                document.getElementById(
                    "paymentDate"
                ).value || null,

            payment_method:
                document.getElementById(
                    "method"
                ).value

        };


        if(mode === "teacher"){

            record.teacher_id =
                Number(personId);

        }

        else{

            record.employee_id =
                Number(personId);

        }


        const saveBtn =
            document.getElementById(
                "saveBtn"
            );


        saveBtn.disabled = true;


        showMessage(
            editId
            ?
            "Updating..."
            :
            "Saving..."
        );


        try{

            let result;


            if(mode === "teacher"){

                if(editId){

                    result =
                        await db

                        .from(
                            "teacher_salaries"
                        )

                        .update(record)

                        .eq(
                            "id",
                            editId
                        )

                        .select();

                }

                else{

                    result =
                        await db

                        .from(
                            "teacher_salaries"
                        )

                        .insert(record)

                        .select();

                }

            }

            else{

                if(editId){

                    result =
                        await db

                        .from(
                            "employee_salaries"
                        )

                        .update(record)

                        .eq(
                            "id",
                            editId
                        )

                        .select();

                }

                else{

                    result =
                        await db

                        .from(
                            "employee_salaries"
                        )

                        .insert(record)

                        .select();

                }

            }


            if(result.error){

                showMessage(
                    "❌ " +
                    result.error.message,
                    "error"
                );

                return;

            }


            showMessage(
                editId
                ?
                "✅ Updated successfully"
                :
                "✅ Saved successfully",
                "success"
            );


            resetForm();


            await loadCurrentSalary();

        }

        catch(error){

            showMessage(
                "❌ " +
                error.message,
                "error"
            );

        }

        finally{

            saveBtn.disabled = false;

        }

    }
);

/* =====================================================
   DELETE SALARY
===================================================== */

async function deleteSalary(id){

    if(
        id === null ||
        id === undefined ||
        String(id).trim() === ""
    ){

        alert(
            "❌ Invalid salary ID"
        );

        return;

    }


    if(
        !confirm(
            "এই Salary record Delete করতে চান?"
        )
    ){

        return;

    }


    const table =
        mode === "teacher"
        ?
        "teacher_salaries"
        :
        "employee_salaries";


    const {
        data,
        error
    } =
    await db

        .from(table)

        .delete()

        .eq(
            "id",
            id
        )

        .select("id");


    if(error){

        alert(
            "❌ Delete failed:\n" +
            error.message
        );

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        alert(
            "❌ Record পাওয়া যায়নি অথবা Delete permission নেই।"
        );

        return;

    }


    alert(
        "✅ Salary deleted successfully"
    );


    await loadCurrentSalary();

}

/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function(){

        const q =
            this.value
            .toLowerCase()
            .trim();


        if(mode === "teacher"){

            const filtered =
                teacherSalaries.filter(
                    function(s){

                        const teacher =
                            teachers.find(
                                function(t){

                                    return String(t.id) ===
                                        String(s.teacher_id);

                                }
                            );


                        const name =
                            teacher?.name ||
                            "";


                        const phone =
                            teacher?.phone ||
                            "";


                        const id =
                            teacher?.id !== null &&
                            teacher?.id !== undefined
                            ?
                            String(
                                teacher.id
                            )
                            :
                            "";


                        return (

                            name
                            .toLowerCase()
                            .includes(q)

                            ||

                            phone
                            .toLowerCase()
                            .includes(q)

                            ||

                            id
                            .toLowerCase()
                            .includes(q)

                        );

                    }
                );


            renderTeacherSalary(
                filtered
            );

        }


        else{

            const filtered =
                employeeSalaries.filter(
                    function(s){

                        const employee =
                            employees.find(
                                function(e){

                                    return String(e.id) ===
                                        String(s.employee_id);

                                }
                            );


                        const name =
                            employee?.name ||
                            "";


                        const empId =
                            employee?.employee_id ||
                            "";


                        const phone =
                            employee?.phone ||
                            "";


                        return (

                            name
                            .toLowerCase()
                            .includes(q)

                            ||

                            String(empId)
                            .toLowerCase()
                            .includes(q)

                            ||

                            phone
                            .toLowerCase()
                            .includes(q)

                        );

                    }
                );


            renderEmployeeSalary(
                filtered
            );

        }

    }
);

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

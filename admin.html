<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;background:linear-gradient(135deg,#075c43,#0b9b70);
  padding:20px
}
.box{
  width:100%;max-width:400px;background:white;padding:32px 25px;
  border-radius:18px;box-shadow:0 15px 40px #0003
}
.logo{
  width:70px;height:70px;margin:auto auto 15px;border-radius:50%;
  background:#087f5b;color:white;display:flex;align-items:center;
  justify-content:center;font-size:30px
}
h1{text-align:center;color:#075c43;font-size:22px}
.sub{text-align:center;color:#777;margin:7px 0 25px;font-size:13px}
label{display:block;margin:13px 0 6px;font-weight:bold}
input{
  width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;
  font-size:15px
}
button{
  width:100%;padding:13px;margin-top:20px;border:0;border-radius:8px;
  background:#087f5b;color:white;font-size:16px;font-weight:bold
}
#msg{text-align:center;margin-top:15px;font-size:14px}
.back{display:block;text-align:center;margin-top:18px;color:#087f5b}
</style>
</head>

<body>

<div class="box">

<div class="logo">🕌</div>

<h1>মাদরাসায়ে নূরুল কুরআন</h1>
<div class="sub">ADMIN MANAGEMENT SYSTEM</div>

<form id="loginForm">

<label>Email</label>
<input id="email" type="email"
placeholder="Admin Email" required>

<label>Password</label>
<input id="password" type="password"
placeholder="Password" required>

<button type="submit">🔐 Login</button>

<div id="msg"></div>

</form>

<a class="back" href="index.html">← Website Home</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

document.getElementById("loginForm").addEventListener(
"submit", async function(e){

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("msg");

msg.textContent="Login হচ্ছে...";

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){
msg.textContent="❌ "+error.message;
return;
}

window.location.href="dashboard.html";

});
</script>

</body>
</html>

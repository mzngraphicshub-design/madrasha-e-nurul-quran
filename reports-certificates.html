@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600;700&display=swap');
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef2f4;color:#17202a;font-family:"Cormorant Garamond",Georgia,serif}
body{min-height:100vh}
.topbar{height:58px;background:linear-gradient(90deg,#075b7c,#08739b,#0d8eb5);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 3px 12px #0002}
.brand{font-size:17px;font-weight:700;line-height:1.05}
.brand small{display:block;font-size:9px;letter-spacing:1px;opacity:.85;margin-top:2px}
.navbtn{border:1px solid #ffffff55;background:#ffffff15;color:#fff;padding:9px 14px;border-radius:6px;cursor:pointer;font-family:inherit}
.wrap{max-width:1180px;margin:20px auto;padding:0 14px}
h1{margin:0 0 4px;font-size:27px;color:#143746}
.sub{margin:0 0 16px;color:#68747d;font-size:13px}
.panel{background:#fff;border:1px solid #dde4e8;border-radius:12px;padding:18px;box-shadow:0 5px 20px #16425a12;margin-bottom:18px}
.panel h2{margin:0 0 14px;color:#075b7c;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;color:#43515b}
input,select,textarea{width:100%;border:1px solid #ccd7dd;border-radius:7px;padding:10px 11px;font-family:inherit;font-size:14px;background:#fbfcfd;color:#1c2830;outline:none}
input:focus,select:focus,textarea:focus{border-color:#08739b;box-shadow:0 0 0 3px #08739b16}
textarea{min-height:86px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-family:inherit;font-weight:700}
.primary{background:#08739b;color:#fff}.gold{background:#bd8b16;color:#fff}.light{background:#eaf1f4;color:#173746}.danger{background:#b73a32;color:#fff}
.msg{font-size:12px;margin-top:9px;color:#66757d;min-height:16px}
.preview-panel{overflow:hidden}
.preview-scroll{overflow:auto;background:#d9dee1;border-radius:9px;padding:18px}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#edf1f4;color:#202625;font-family:"Playfair Display",Georgia,serif;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
button,input,select,textarea{font:inherit}
.topbar{height:60px;background:linear-gradient(90deg,#075b7c,#087fba,#075b7c);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 3px 16px rgba(0,0,0,.14)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:50%}
.brand-title{font-family:Bornomala,"Times New Roman",serif;font-size:15px;font-weight:700}
.brand-sub{font-size:8px;letter-spacing:1.3px;opacity:.86}
.top-actions{display:flex;gap:8px}
.top-actions button,.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:12px;font-weight:700}
.top-actions button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28)}
.container{max-width:1320px;margin:auto;padding:22px}
.page-title{margin:0 0 4px;font-size:28px;color:#153943}
.page-sub{margin:0 0 18px;color:#6b777a;font-size:12px}
.panel{background:#fff;border-radius:15px;padding:18px;margin-bottom:18px;box-shadow:0 5px 24px rgba(10,45,60,.09)}
.panel h2{margin:0 0 13px;color:#075b7c;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:700;color:#405256}
.field input,.field select,.field textarea{width:100%;border:1px solid #d4dfe2;background:#fbfcfd;border-radius:8px;padding:10px 11px;font-size:13px;outline:none;color:#253033}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#087fba;box-shadow:0 0 0 3px rgba(8,127,186,.08)}
.field textarea{min-height:92px;resize:vertical;line-height:1.55}
.full{grid-column:1/-1}
.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.primary{background:#087fba;color:#fff}
.gold{background:#b88916;color:#fff}
.light{background:#eaf3f7;color:#075b7c}
.danger{background:#f8e5e2;color:#9b3a30}
.status{font-size:11px;color:#a13b31;margin-top:9px;min-height:16px}
.status.ok{color:#13704e}
.preview-wrap{background:#cfd5d8;padding:22px;border-radius:13px;overflow:auto}

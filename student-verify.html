<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শিক্ষার্থী যাচাই | মাদরাসায়ে নূরুল কুরআন</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:Bornomala;src:url(fonts/Bornomala-Regular.ttf)}
:root{--ff:"Bornomala","Noto Naskh Arabic",system-ui,sans-serif;--g:#0e5a40;--gd:#0a3d2c;--gold:#c9a227;--bg:#f4efe0}
*{box-sizing:border-box;font-family:var(--ff)!important}
body{margin:0;background:var(--bg);color:#17382c;min-height:100vh;padding:16px}
.w{max-width:460px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;background:#fffdf8;border:1px solid rgba(201,162,39,.4);border-radius:20px;padding:12px 14px}
.top img{width:52px;height:52px;object-fit:contain}
.top b{flex:1;color:var(--g);font-size:19px;line-height:1.3}
.top select{border:1px solid rgba(201,162,39,.5);border-radius:10px;padding:7px;background:#fff;font-size:14px}
.card{margin-top:14px;background:#fffdf8;border:1px solid rgba(201,162,39,.4);border-radius:24px;overflow:hidden;box-shadow:0 10px 26px rgba(14,70,50,.14)}
.st{padding:14px;text-align:center;color:#fff;font-size:18px}
.st.ok{background:linear-gradient(135deg,var(--gd),var(--g))}.st.no{background:#b4690e}.st.bad{background:#b03a2e}
.ph{width:130px;height:130px;border-radius:50%;margin:20px auto 10px;border:6px solid var(--gold);overflow:hidden;background:#dfe7ea;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover}.ph svg{width:70%;height:70%;fill:#9fb0b8}
h1{margin:0;text-align:center;font-size:26px;color:var(--g);padding:0 14px}
.rows{margin:16px 18px 6px;border-radius:14px;overflow:hidden;border:1px solid #e3eee7}
.r{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;font-size:17px}
.r:nth-child(odd){background:#f1f8f4}.r span{color:#55646f}.r b{text-align:end}
.note{margin:12px 18px 20px;text-align:center;color:#5b7468;font-size:13px;line-height:1.7}
.msg{padding:34px 18px;text-align:center;font-size:18px;line-height:1.8}
a.home{display:block;text-align:center;margin:16px 0 4px;color:var(--g);font-size:15px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid #d9d2b8;border-top-color:var(--g);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="w">
 <div class="top"><img src="img/logo.png" alt=""><b id="nm"></b>
  <select id="lg"><option value="bn">বাংলা</option><option value="en">English</option><option value="ar">العربية</option></select></div>
 <div class="card" id="card"><div class="msg"><span class="spin"></span></div></div>
 <a class="home" href="index.html" id="home"></a>
</div>
<script>
const TX={
 school:["মাদরাসায়ে নূরুল কুরআন","Madrasa-e Nurul Quran","مدرسة نور القرآن"],
 ok:["✅ যাচাইকৃত শিক্ষার্থী","✅ Verified Student","✅ طالب موثّق"],
 inactive:["⚠ বর্তমানে নিষ্ক্রিয়","⚠ Currently inactive","⚠ غير نشط حالياً"],
 nf:["❌ এই আইডির কোনো শিক্ষার্থী পাওয়া যায়নি","❌ No student found for this ID","❌ لم يتم العثور على طالب بهذا الرقم"],
 err:["যাচাই করা যাচ্ছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।","Could not verify right now. Please try again shortly.","تعذّر التحقق الآن. حاول مرة أخرى بعد قليل."],
 noid:["কোনো আইডি পাওয়া যায়নি।","No ID provided.","لم يتم تحديد رقم."],
 id:["আইডি","Student ID","رقم الطالب"],cls:["ক্লাস","Class","الصف"],roll:["রোল","Roll","رقم التسجيل"],father:["পিতার নাম","Father's name","اسم الأب"],ses:["শিক্ষাবর্ষ","Session","العام الدراسي"],
 foot:["এই তথ্য মাদরাসার ডাটাবেস থেকে সরাসরি দেখানো হয়েছে।","This information is shown directly from the madrasa database.","هذه المعلومات من قاعدة بيانات المدرسة مباشرة."],
 home:["← ওয়েবসাইটে ফিরুন","← Back to website","← العودة إلى الموقع"]
};
let lang=(function(){var v=String(localStorage.getItem("nurul_dashboard_language")||"bn").toLowerCase();return v==="en"||v==="ar"?v:"bn"})();
const $=id=>document.getElementById(id);
const t=k=>TX[k][lang==="en"?1:lang==="ar"?2:0];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dg=v=>{v=String(v==null?"":v);if(lang==="bn")return v.replace(/[0-9]/g,d=>"০১২৩৪৫৬৭৮৯"[d]);if(lang==="ar")return v.replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);return v};
const ID=new URLSearchParams(location.search).get("id")||"";
const sb=window.supabase?window.supabase.createClient("https://qavublwhqiqsgpcmfyft.supabase.co","sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ"):null;
let DATA=undefined; // undefined=loading, null=not found, false=error, object=found
async function load(){
  if(!ID){DATA=null;return render()}
  try{
    let obj=null;
    const r=await sb.rpc("verify_student",{p_student_id:ID});
    if(!r.error){obj=r.data||null}
    else{ /* ফাংশন তৈরি না থাকলে সরাসরি টেবিল থেকে */
      const a=await sb.from("students").select("*").eq("student_id",ID).limit(1);
      if(a.error)throw a.error;
      const s=(a.data||[])[0];
      if(s){const c=await sb.from("classes").select("*").eq("id",s.class_id).limit(1);const cl=(c.data||[])[0]||{};
        obj={student_id:String(s.student_id),name:s.name,father_name:s.father_name,roll_number:s.roll_number,session:s.session,photo_url:s.photo_url,is_active:s.is_active!==false,class_name:cl.class_name||cl.name}}
    }
    DATA=obj;
  }catch(e){console.error(e);DATA=false}
  render();
}
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("lg").value=lang;
  $("nm").textContent=t("school");$("home").textContent=t("home");document.title=t("school");
  const c=$("card");
  if(DATA===undefined){c.innerHTML='<div class="msg"><span class="spin"></span></div>';return}
  if(DATA===false){c.innerHTML='<div class="st bad">'+esc(t("err"))+'</div>';return}
  if(!DATA){c.innerHTML='<div class="st bad">'+esc(ID?t("nf"):t("noid"))+'</div>';return}
  const d=DATA,USR='<svg viewBox="0 0 448 512"><path d="M224 248a120 120 0 1 0 0-240 120 120 0 1 0 0 240m-29.7 56C95.8 304 16 383.8 16 482.3c0 16.4 13.3 29.7 29.7 29.7h356.6c16.4 0 29.7-13.3 29.7-29.7 0-98.5-79.8-178.3-178.3-178.3z"/></svg>';
  const row=(k,v)=>v?'<div class="r"><span>'+esc(t(k))+'</span><b>'+esc(dg(v))+'</b></div>':"";
  c.innerHTML='<div class="st '+(d.is_active?"ok":"no")+'">'+esc(t(d.is_active?"ok":"inactive"))+'</div>'+
   '<div class="ph">'+(d.photo_url?'<img src="'+esc(d.photo_url)+'" alt="">':USR)+'</div><h1>'+esc(d.name)+'</h1>'+
   '<div class="rows">'+row("id",d.student_id)+row("cls",d.class_name)+row("roll",d.roll_number)+row("father",d.father_name)+row("ses",d.session)+'</div>'+
   '<div class="note">'+esc(t("foot"))+'</div>';
}
$("lg").onchange=function(){lang=this.value;localStorage.setItem("nurul_dashboard_language",lang);render()};
render();load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Results Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
    background:#eef5fb;
    color:#17364f;
}

.header{
    background:linear-gradient(90deg,#063b70,#0875d1);
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:18px;
}

.back{
    color:white;
    text-decoration:none;
    background:#ffffff22;
    padding:8px 13px;
    border-radius:7px;
}

.container{
    max-width:1400px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 15px #0000000d;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
    display:block;
}

input,select{
    width:100%;
    height:42px;
    border:1px solid #d6e1eb;
    border-radius:7px;
    padding:0 10px;
    background:white;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    cursor:pointer;
}

.primary{
    background:#0769bc;
    color:white;
}

.success{
    background:#daf5e3;
    color:#137a38;
}

.danger{
    background:#ffe2e2;
    color:#c62828;
}

.info{
    background:#edf7ff;
    border-left:4px solid #0875d1;
    padding:12px;
    line-height:1.7;
    margin-bottom:15px;
}

.message{
    display:none;
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
}

.message.ok{
    display:block;
    background:#e5f8eb;
    color:#147a35;
}

.message.err{
    display:block;
    background:#ffe7e7;
    color:#c62828;
}

.table-wrap{
    width:100%;
    overflow:auto;
}

table{
    border-collapse:collapse;
    width:max-content;
    min-width:100%;
}

th{
    background:#0755a0;
    color:white;
    padding:10px;
    font-size:12px;
    white-space:nowrap;
    text-align:center;
}

td{
    border-bottom:1px solid #e3e9ef;
    padding:7px;
    font-size:12px;
    text-align:center;
    white-space:nowrap;
}

.student-info{
    text-align:left;
    min-width:180px;
}

.mark-input{
    width:75px;
    height:35px;
    text-align:center;
    border:1px solid #cbd9e5;
    border-radius:5px;
}

.mark-head{
    font-size:11px;
    line-height:1.5;
}

.pass{
    background:#e9f9ef;
}

.fail{
    background:#ffe9e9;
}

.total{
    font-weight:bold;
    background:#f1f7fc;
}

.result-pass{
    color:#13823c;
    font-weight:bold;
}

.result-fail{
    color:#d21e1e;
    font-weight:bold;
}

.save-row{
    background:#f8fbfe;
}

.empty{
    padding:25px;
    text-align:center;
    color:#777;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .header h2{
        font-size:14px;
    }

    .card{
        padding:14px;
    }

    .title{
        font-size:17px;
    }

}

</style>

</head>

<body>

<header class="header">

<h2>📊 ফলাফল / Results Management</h2>

<a class="back" href="dashboard.html">
← Dashboard
</a>

</header>


<div class="container">


<div class="card">

<div class="title">
📊 ফলাফল যোগ করুন
</div>

<div id="message"
     class="message"></div>


<div class="info">

<b>ব্যবহার:</b><br>

Session নির্বাচন করুন → Class নির্বাচন করুন →
Exam Name লিখুন → Load Students চাপুন।

তারপর ঐ Class-এর সকল শিক্ষার্থী এবং
subjects.html-এ যোগ করা সকল Subject
automatically দেখাবে।

</div>


<div class="form-grid">


<div>

<label>Session *</label>

<select id="sessionSelect">

<option value="">
Session নির্বাচন করুন
</option>

</select>

</div>


<div>

<label>Class *</label>

<select id="classSelect">

<option value="">
Class নির্বাচন করুন
</option>

<option value="নূরানী">নূরানী</option>
<option value="১ম শ্রেণি">১ম শ্রেণি</option>
<option value="২য় শ্রেণি">২য় শ্রেণি</option>
<option value="৩য় শ্রেণি">৩য় শ্রেণি</option>
<option value="৪র্থ শ্রেণি">৪র্থ শ্রেণি</option>
<option value="৫ম শ্রেণি">৫ম শ্রেণি</option>
<option value="নাজেরা">নাজেরা</option>
<option value="হিফজ">হিফজ</option>

</select>

</div>


<div>

<label>Exam Name *</label>

<input
id="examName"
placeholder="যেমন: Half Yearly Examination"
>

</div>


<div style="display:flex;align-items:end">

<button
class="primary"
id="loadBtn"
style="width:100%">
🔎 Load Students
</button>

</div>


</div>

</div>



<div class="card"
     id="resultCard"
     style="display:none">


<div class="title">
📝 শিক্ষার্থীদের নম্বর
</div>


<div class="table-wrap">

<table>

<thead id="tableHead"></thead>

<tbody id="resultBody"></tbody>

</table>

</div>

</div>


</div>


<script>


/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);



/* =========================================
   VARIABLES
========================================= */

let students = [];
let subjects = [];
let existingResults = [];

let selectedSession = "";
let selectedClass = "";
let selectedExam = "";



const sessionSelect =
document.getElementById("sessionSelect");

const classSelect =
document.getElementById("classSelect");

const examName =
document.getElementById("examName");

const resultCard =
document.getElementById("resultCard");

const tableHead =
document.getElementById("tableHead");

const resultBody =
document.getElementById("resultBody");

const message =
document.getElementById("message");



/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " +
        (type === "ok" ? "ok" : "err");

}



/* =========================================
   LOAD SESSION FROM STUDENTS
========================================= */

async function loadSessions(){

    const {data,error} =
        await db
        .from("students")
        .select("session");

    if(error){

        console.error(error);

        showMessage(
            "Session load error: " + error.message,
            "err"
        );

        return;
    }


    const sessions =
        [...new Set(
            (data || [])
            .map(x => x.session)
            .filter(Boolean)
        )]
        .sort()
        .reverse();


    sessionSelect.innerHTML =
        `<option value="">
        Session নির্বাচন করুন
        </option>`;


    sessions.forEach(s=>{

        const option =
            document.createElement("option");

        option.value = s;
        option.textContent = s;

        sessionSelect.appendChild(option);

    });

}



/* =========================================
   LOAD STUDENTS + SUBJECTS
========================================= */

document.getElementById("loadBtn")
.addEventListener("click",loadData);


async function loadData(){

    selectedSession =
        sessionSelect.value;

    selectedClass =
        classSelect.value;

    selectedExam =
        examName.value.trim();


    if(
        !selectedSession ||
        !selectedClass ||
        !selectedExam
    ){

        showMessage(
            "Session, Class এবং Exam Name দিন।",
            "err"
        );

        return;
    }


    showMessage(
        "Loading...",
        "ok"
    );


    /* =========================
       STUDENTS
    ========================= */

    const studentResult =
        await db
        .from("students")
        .select(`
            id,
            name,
            roll,
            student_id,
            class,
            session
        `)
        .eq("class",selectedClass)
        .eq("session",selectedSession)
        .order("roll");


    if(studentResult.error){

        console.error(studentResult.error);

        showMessage(
            "Student load error: " +
            studentResult.error.message,
            "err"
        );

        return;
    }


    students =
        studentResult.data || [];


    /* =========================
       SUBJECTS
    ========================= */

    const subjectResult =
        await db
        .from("subjects")
        .select(`
            id,
            class_name,
            subject_name,
            subject_code,
            full_mark,
            pass_mark
        `)
        .eq("class_name",selectedClass)
        .order("subject_name");


    if(subjectResult.error){

        console.error(subjectResult.error);

        showMessage(
            "Subject load error: " +
            subjectResult.error.message,
            "err"
        );

        return;
    }


    subjects =
        subjectResult.data || [];


    if(!subjects.length){

        resultCard.style.display =
            "block";

        tableHead.innerHTML = "";

        resultBody.innerHTML = `

        <tr>
        <td class="empty">

        ❌ এই Class-এর জন্য কোনো Subject নেই।<br><br>

        আগে <b>subjects.html</b> থেকে
        Subject যোগ করুন।

        </td>
        </tr>

        `;

        return;
    }


    if(!students.length){

        resultCard.style.display =
            "block";

        tableHead.innerHTML = "";

        resultBody.innerHTML = `

        <tr>
        <td class="empty">

        ❌ এই Session এবং Class-এর
        কোনো শিক্ষার্থী পাওয়া যায়নি।

        </td>
        </tr>

        `;

        return;
    }


    /* =========================
       EXISTING RESULTS
    ========================= */

    const resultQuery =
        await db
        .from("results")
        .select(`
            id,
            student_id,
            subject_id,
            exam_name,
            marks
        `)
        .eq("exam_name",selectedExam)
        .in(
            "student_id",
            students.map(s=>s.student_id)
        );


    if(resultQuery.error){

        console.error(resultQuery.error);

        showMessage(
            "Existing result load error: " +
            resultQuery.error.message,
            "err"
        );

        return;
    }


    existingResults =
        resultQuery.data || [];


    renderTable();


    showMessage(
        students.length +
        " জন শিক্ষার্থী এবং " +
        subjects.length +
        " টি Subject পাওয়া গেছে।",
        "ok"
    );

}



/* =========================================
   RENDER RESULT TABLE
========================================= */

function renderTable(){


    /* =========================
       HEADER
    ========================= */

    let head = `

    <tr>

    <th>
    #
    </th>

    <th>
    Student ID
    </th>

    <th>
    Roll
    </th>

    <th class="student-info">
    শিক্ষার্থীর নাম
    </th>

    `;


    subjects.forEach(subject=>{

        head += `

        <th>

        <div class="mark-head">

        ${escapeHtml(subject.subject_name)}

        <br>

        Full:
        ${subject.full_mark ?? 100}

        |

        Pass:
        ${subject.pass_mark ?? 33}

        </div>

        </th>

        `;

    });


    head += `

    <th>
    Total
    </th>

    <th>
    Result
    </th>

    <th>
    Save
    </th>

    </tr>

    `;


    tableHead.innerHTML = head;



    /* =========================
       BODY
    ========================= */

    resultBody.innerHTML =
        students.map((student,index)=>{

            let total = 0;

            let allPass = true;


            let cells = "";


            subjects.forEach(subject=>{


                const old =
                    existingResults.find(r=>

                        String(r.student_id)
                        === String(student.student_id)

                        &&

                        String(r.subject_id)
                        === String(subject.id)

                    );


                const marks =
                    old?.marks ?? "";


                if(
                    marks !== "" &&
                    !isNaN(Number(marks))
                ){

                    total +=
                        Number(marks);

                    if(
                        Number(marks) <
                        Number(subject.pass_mark ?? 33)
                    ){

                        allPass = false;

                    }

                }


                cells += `

                <td>

                <input

                class="mark-input"

                type="number"

                min="0"

                max="${subject.full_mark ?? 100}"

                value="${marks}"

                data-student="${escapeAttr(student.student_id)}"

                data-subject="${subject.id}"

                data-full="${subject.full_mark ?? 100}"

                data-pass="${subject.pass_mark ?? 33}"

                oninput="calculateRow(this)"

                >

                </td>

                `;

            });


            return `

            <tr id="row-${index}">

            <td>${index+1}</td>

            <td>
            ${escapeHtml(student.student_id)}
            </td>

            <td>
            ${escapeHtml(student.roll ?? "-")}
            </td>

            <td class="student-info">
            <b>${escapeHtml(student.name)}</b>
            </td>

            ${cells}

            <td
            class="total"
            id="total-${index}">
            ${total}
            </td>

            <td
            id="status-${index}"
            class="${allPass
                ? "result-pass"
                : "result-fail"}">

            ${allPass ? "PASS" : "FAIL"}

            </td>

            <td>

            <button
            class="primary"
            onclick="saveStudentResult(${index})">

            💾 Save

            </button>

            </td>

            </tr>

            `;

        })
        .join("");


    resultCard.style.display =
        "block";


    /* Calculate every row */
    students.forEach((_,i)=>{

        const input =
            document.querySelector(
                `#row-${i} .mark-input`
            );

        if(input)
            calculateRow(input);

    });

}



/* =========================================
   CALCULATE ROW
========================================= */

window.calculateRow =
function(input){

    const row =
        input.closest("tr");

    if(!row) return;


    const inputs =
        row.querySelectorAll(
            ".mark-input"
        );


    let total = 0;

    let allPass = true;

    let entered = 0;


    inputs.forEach(i=>{

        const value =
            i.value.trim();

        if(value !== ""){

            entered++;

            const mark =
                Number(value);

            const full =
                Number(i.dataset.full);

            const pass =
                Number(i.dataset.pass);


            if(mark < 0 || mark > full){

                i.style.border =
                    "2px solid #e53935";

            }else{

                i.style.border =
                    "1px solid #cbd9e5";

            }


            total += mark;


            if(mark < pass){

                allPass = false;

                i.classList.add("fail");

            }else{

                i.classList.remove("fail");

            }

        }

    });


    const totalCell =
        row.querySelector(".total");

    const statusCell =
        row.querySelector(
            "td:nth-last-child(2)"
        );


    if(totalCell)
        totalCell.textContent =
            total;


    if(statusCell){

        statusCell.textContent =
            entered === 0
            ? "-"
            : allPass
                ? "PASS"
                : "FAIL";

        statusCell.className =
            entered === 0
            ? ""
            : allPass
                ? "result-pass"
                : "result-fail";

    }

};



/* =========================================
   SAVE ONE STUDENT
========================================= */

window.saveStudentResult =
async function(index){

    const student =
        students[index];


    const row =
        document.getElementById(
            "row-" + index
        );


    const inputs =
        row.querySelectorAll(
            ".mark-input"
        );


    const rows = [];


    for(const input of inputs){

        const value =
            input.value.trim();


        if(value === "")
            continue;


        const marks =
            Number(value);


        const full =
            Number(input.dataset.full);


        if(
            isNaN(marks) ||
            marks < 0 ||
            marks > full
        ){

            showMessage(
                `${student.name}-এর নম্বর সঠিক নয়।`,
                "err"
            );

            return;
        }


        rows.push({

            student_id:
                student.student_id,

            subject_id:
                Number(input.dataset.subject),

            exam_name:
                selectedExam,

            marks:
                marks

        });

    }


    if(!rows.length){

        showMessage(
            student.name +
            "-এর কোনো নম্বর দেওয়া হয়নি।",
            "err"
        );

        return;
    }


    /* =========================
       DELETE OLD RESULTS
    ========================= */

    const deleteResult =
        await db
        .from("results")
        .delete()
        .eq(
            "student_id",
            student.student_id
        )
        .eq(
            "exam_name",
            selectedExam
        );


    if(deleteResult.error){

        console.error(deleteResult.error);

        showMessage(
            "Old result delete error: " +
            deleteResult.error.message,
            "err"
        );

        return;
    }


    /* =========================
       INSERT NEW RESULTS
    ========================= */

    const insertResult =
        await db
        .from("results")
        .insert(rows);


    if(insertResult.error){

        console.error(insertResult.error);

        showMessage(
            "❌ Result save error: " +
            insertResult.error.message,
            "err"
        );

        return;
    }


    showMessage(
        "✅ " +
        student.name +
        "-এর ফলাফল সফলভাবে Save হয়েছে।",
        "ok"
    );

};



/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHtml(value);

}



/* =========================================
   START
========================================= */

loadSessions();

</script>

</body>

</html>

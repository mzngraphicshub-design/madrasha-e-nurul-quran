<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Results | মাদরাসায়ে নূরুল কুরআন</title>

<style>

*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:18px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{margin:0}

header a{
    color:white;
    text-decoration:none;
    background:#ffffff22;
    padding:9px 14px;
    border-radius:8px;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.box{
    background:white;
    padding:22px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 3px 15px #0001;
}

h3{
    color:#0d47a1;
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #d5dbe5;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#0d47a1;
    color:white;
}

.green{
    background:#16a34a;
    color:white;
}

.searchBtn{
    background:#1976d2;
    color:white;
    width:100%;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    padding:11px 9px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#0d47a1;
    color:white;
}

.markInput{
    width:100px;
}

.pass{
    color:#15803d;
    font-weight:bold;
}

.fail{
    color:#dc2626;
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:18px;
}

.summary div{
    background:#eff6ff;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.summary strong{
    display:block;
    font-size:22px;
    color:#0d47a1;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.result-card{
    border:1px solid #dbeafe;
    border-radius:12px;
    overflow:hidden;
}

.result-head{
    background:#0d47a1;
    color:white;
    padding:18px;
}

.result-head h2{
    margin:0 0 7px;
}

.result-body{
    padding:18px;
}

.searchGrid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:12px;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .searchGrid{
        grid-template-columns:1fr 1fr;
    }

    .summary{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:550px){

    header{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

    .grid,
    .searchGrid{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<header>

<h2>📊 ফলাফল ব্যবস্থাপনা</h2>

<a href="dashboard.html">← Dashboard</a>

</header>


<div class="container">


<!-- ================= ADMIN ================= -->

<div class="box">

<h3>📝 শিক্ষার্থীর Result যোগ করুন</h3>

<div id="message" class="message"></div>

<div class="grid">

<div>

<label>Session</label>

<input
id="adminSession"
placeholder="যেমন: 2026"
>

</div>


<div>

<label>Exam</label>

<input
id="examName"
placeholder="যেমন: Half Yearly Exam"
>

</div>


<div>

<label>Class</label>

<select id="adminClass">

<option value="">Class নির্বাচন করুন</option>

<option value="নূরানী">নূরানী</option>
<option value="১ম শ্রেণি">১ম শ্রেণি</option>
<option value="২য় শ্রেণি">২য় শ্রেণি</option>
<option value="৩য় শ্রেণি">৩য় শ্রেণি</option>
<option value="৪র্থ শ্রেণি">৪র্থ শ্রেণি</option>
<option value="৫ম শ্রেণি">৫ম শ্রেণি</option>
<option value="নাজেরা">নাজেরা</option>
<option value="হিফজ">হিফজ</option>

</select>

</div>

</div>

<br>

<div class="grid">

<div>

<label>Student</label>

<select id="studentSelect">

<option value="">প্রথমে Class নির্বাচন করুন</option>

</select>

</div>

</div>

</div>


<!-- SUBJECT MARKS -->

<div class="box">

<h3>📚 Subject-wise Mark</h3>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Subject</th>
<th>Full Mark</th>
<th>Pass Mark</th>
<th>Obtained Mark</th>
<th>Status</th>

</tr>

</thead>

<tbody id="subjectMarks">

<tr>

<td colspan="5">
Class এবং Student নির্বাচন করুন
</td>

</tr>

</tbody>

</table>

</div>


<div id="summary" class="summary">

<div>
Total
<strong id="totalMark">0</strong>
</div>

<div>
Percentage
<strong id="percentage">0%</strong>
</div>

<div>
Grade
<strong id="grade">-</strong>
</div>

<div>
Result
<strong id="overallResult">-</strong>
</div>

</div>

<br>

<button
class="green"
onclick="saveResult()">

💾 Result Save করুন

</button>

</div>


<!-- ================= PUBLIC SEARCH ================= -->

<div class="box">

<h3>🔎 অভিভাবকদের Result Search</h3>

<div class="searchGrid">

<div>

<label>Session</label>

<input
id="publicSession"
placeholder="2026"
>

</div>


<div>

<label>Exam</label>

<input
id="publicExam"
placeholder="Half Yearly Exam"
>

</div>


<div>

<label>Student ID / Roll</label>

<input
id="publicStudent"
placeholder="ID অথবা Roll"
>

</div>


<div>

<label>&nbsp;</label>

<button
class="searchBtn"
onclick="publicSearch()">

🔍 Search

</button>

</div>

</div>

</div>


<div id="publicResult"></div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let students=[];
let subjects=[];
let currentMarks=[];


/* ================= MESSAGE ================= */

function message(text,type){

    const box=document.getElementById("message");

    box.textContent=text;

    box.className="message "+type;

    setTimeout(()=>{
        box.className="message";
    },3500);
}


/* ================= LOAD STUDENTS ================= */

async function loadStudents(){

    const className=
        document.getElementById("adminClass").value;

    const select=
        document.getElementById("studentSelect");

    select.innerHTML=
        `<option value="">Student নির্বাচন করুন</option>`;

    if(!className)return;

    const {data,error}=await db
        .from("students")
        .select("id,name,roll,student_id,class,session")
        .eq("class",className)
        .order("roll",{ascending:true});

    if(error){

        console.error(error);

        message(error.message,"error");
        return;
    }

    students=data||[];

    students.forEach(s=>{

        const option=
            document.createElement("option");

        option.value=s.id;

        option.textContent=
            `${s.name} | Roll: ${s.roll||"-"} | ID: ${s.student_id||"-"}`;

        select.appendChild(option);

    });

    loadSubjects();
}


/* ================= LOAD SUBJECTS ================= */

async function loadSubjects(){

    const className=
        document.getElementById("adminClass").value;

    const tbody=
        document.getElementById("subjectMarks");

    tbody.innerHTML=
        `<tr><td colspan="5">Loading...</td></tr>`;

    if(!className){

        tbody.innerHTML=
        `<tr><td colspan="5">
        Class নির্বাচন করুন
        </td></tr>`;

        return;
    }

    const {data,error}=await db
        .from("subjects")
        .select("*")
        .eq("class_name",className)
        .order("subject_name",{ascending:true});

    if(error){

        console.error(error);

        tbody.innerHTML=
        `<tr><td colspan="5">
        ${escapeHtml(error.message)}
        </td></tr>`;

        return;
    }

    subjects=data||[];

    if(!subjects.length){

        tbody.innerHTML=
        `<tr><td colspan="5">
        এই Class-এর কোনো Subject নেই। আগে subjects.html থেকে Subject যোগ করুন।
        </td></tr>`;

        return;
    }

    tbody.innerHTML=subjects.map((s,i)=>`

        <tr>

        <td>
        <strong>${escapeHtml(s.subject_name)}</strong>
        </td>

        <td>${s.full_mark}</td>

        <td>${s.pass_mark}</td>

        <td>

        <input
        class="markInput"
        type="number"
        min="0"
        max="${s.full_mark}"
        data-subject="${s.id}"
        data-full="${s.full_mark}"
        data-pass="${s.pass_mark}"
        oninput="calculate()"
        placeholder="Mark">

        </td>

        <td id="status-${s.id}">
        -
        </td>

        </tr>

    `).join("");

}


/* ================= CALCULATE ================= */

function calculate(){

    let total=0;
    let fullTotal=0;
    let failed=false;

    document
    .querySelectorAll(".markInput")
    .forEach(input=>{

        let mark=
            Number(input.value);

        const full=
            Number(input.dataset.full);

        const pass=
            Number(input.dataset.pass);

        fullTotal+=full;

        if(mark>full){
            mark=full;
            input.value=full;
        }

        if(input.value!==""){
            total+=mark;
        }

        const status=
            document.getElementById(
                "status-"+input.dataset.subject
            );

        if(input.value===""){

            status.textContent="-";
            status.className="";

        }else if(mark>=pass){

            status.textContent="PASS";
            status.className="pass";

        }else{

            status.textContent="FAIL";
            status.className="fail";

            failed=true;
        }

    });


    const percentage=
        fullTotal
        ?(total/fullTotal)*100
        :0;

    document.getElementById("totalMark")
        .textContent=total;

    document.getElementById("percentage")
        .textContent=percentage.toFixed(2)+"%";

    let grade="-";

    if(percentage>=80)grade="A+";
    else if(percentage>=70)grade="A";
    else if(percentage>=60)grade="A-";
    else if(percentage>=50)grade="B";
    else if(percentage>=40)grade="C";
    else if(percentage>=33)grade="D";
    else if(percentage>0)grade="F";

    document.getElementById("grade")
        .textContent=grade;

    document.getElementById("overallResult")
        .textContent=
        failed ? "FAIL" :
        percentage>=33 ? "PASS" : "-";
}


/* ================= SAVE RESULT ================= */

async function saveResult(){

    const session=
        document.getElementById("adminSession")
        .value.trim();

    const exam=
        document.getElementById("examName")
        .value.trim();

    const studentId=
        document.getElementById("studentSelect")
        .value;

    if(!session || !exam || !studentId){

        message(
            "Session, Exam এবং Student নির্বাচন করুন।",
            "error"
        );

        return;
    }

    if(!subjects.length){

        message(
            "এই Class-এর Subject নেই।",
            "error"
        );

        return;
    }

    const rows=[];

    let incomplete=false;

    document
    .querySelectorAll(".markInput")
    .forEach(input=>{

        if(input.value===""){

            incomplete=true;
            return;
        }

        rows.push({

            student_id:studentId,

            session:session,

            exam_name:exam,

            subject_id:input.dataset.subject,

            marks:Number(input.value)

        });

    });


    if(incomplete){

        message(
            "সব Subject-এর Mark দিতে হবে।",
            "error"
        );

        return;
    }


    /* Existing result remove */

    const {error:deleteError}=await db
        .from("results")
        .delete()
        .eq("student_id",studentId)
        .eq("session",session)
        .eq("exam_name",exam);

    if(deleteError){

        console.error(deleteError);

        message(deleteError.message,"error");
        return;
    }


    const {error}=await db
        .from("results")
        .insert(rows);

    if(error){

        console.error(error);

        message(error.message,"error");
        return;
    }


    message(
        "Result সফলভাবে Save হয়েছে।",
        "success"
    );

}


/* ================= PUBLIC SEARCH ================= */

async function publicSearch(){

    const session=
        document.getElementById("publicSession")
        .value.trim();

    const exam=
        document.getElementById("publicExam")
        .value.trim();

    const search=
        document.getElementById("publicStudent")
        .value.trim();

    const box=
        document.getElementById("publicResult");

    if(!session || !exam || !search){

        box.innerHTML=
        `<div class="box">
        Session, Exam এবং Student ID/Roll দিন।
        </div>`;

        return;
    }


    /* Find student */

    let query=db
        .from("students")
        .select("id,name,roll,student_id,class")
        .or(
            `student_id.eq.${search},roll.eq.${search}`
        )
        .limit(1);


    const {data:studentData,error:studentError}
        =await query;


    if(studentError){

        console.error(studentError);

        box.innerHTML=
        `<div class="box">${escapeHtml(
            studentError.message
        )}</div>`;

        return;
    }


    if(!studentData || !studentData.length){

        box.innerHTML=
        `<div class="box">
        ❌ কোনো Student পাওয়া যায়নি।
        </div>`;

        return;
    }


    const student=studentData[0];


    /* Get results */

    const {data:resultData,error:resultError}
        =await db
        .from("results")
        .select(`
            marks,
            session,
            exam_name,
            subject_id,
            subjects(
                subject_name,
                subject_code,
                full_mark,
                pass_mark
            )
        `)
        .eq("student_id",student.id)
        .eq("session",session)
        .eq("exam_name",exam);


    if(resultError){

        console.error(resultError);

        box.innerHTML=
        `<div class="box">${escapeHtml(
            resultError.message
        )}</div>`;

        return;
    }


    if(!resultData || !resultData.length){

        box.innerHTML=
        `<div class="box">
        ❌ এই Session/Exam-এর Result পাওয়া যায়নি।
        </div>`;

        return;
    }


    let total=0;
    let fullTotal=0;
    let failed=false;


    const rows=resultData.map(r=>{

        const subject=r.subjects;

        const mark=Number(r.marks||0);

        const full=Number(subject?.full_mark||0);

        const pass=Number(subject?.pass_mark||0);

        total+=mark;
        fullTotal+=full;

        const isPass=mark>=pass;

        if(!isPass)failed=true;

        return `

        <tr>

        <td>
        ${escapeHtml(subject?.subject_name||"-")}
        </td>

        <td>
        ${full}
        </td>

        <td>
        ${pass}
        </td>

        <td>
        <strong>${mark}</strong>
        </td>

        <td class="${isPass?"pass":"fail"}">
        ${isPass?"PASS":"FAIL"}
        </td>

        </tr>

        `;

    }).join("");


    const percentage=
        fullTotal
        ?(total/fullTotal)*100
        :0;


    let grade="F";

    if(percentage>=80)grade="A+";
    else if(percentage>=70)grade="A";
    else if(percentage>=60)grade="A-";
    else if(percentage>=50)grade="B";
    else if(percentage>=40)grade="C";
    else if(percentage>=33)grade="D";


    box.innerHTML=`

    <div class="box">

    <div class="result-card">

    <div class="result-head">

    <h2>
    মাদরাসায়ে নূরুল কুরআন
    </h2>

    <div>
    ${escapeHtml(exam)}
    </div>

    </div>

    <div class="result-body">

    <p>
    <strong>Student:</strong>
    ${escapeHtml(student.name)}
    </p>

    <p>
    <strong>Roll:</strong>
    ${escapeHtml(student.roll||"-")}
    &nbsp;&nbsp;
    <strong>ID:</strong>
    ${escapeHtml(student.student_id||"-")}
    </p>

    <p>
    <strong>Class:</strong>
    ${escapeHtml(student.class||"-")}
    &nbsp;&nbsp;
    <strong>Session:</strong>
    ${escapeHtml(session)}
    </p>

    <div class="table-wrap">

    <table>

    <thead>

    <tr>
    <th>Subject</th>
    <th>Full Mark</th>
    <th>Pass Mark</th>
    <th>Obtained</th>
    <th>Status</th>
    </tr>

    </thead>

    <tbody>
    ${rows}
    </tbody>

    </table>

    </div>

    <div class="summary">

    <div>
    Total
    <strong>${total}/${fullTotal}</strong>
    </div>

    <div>
    Percentage
    <strong>${percentage.toFixed(2)}%</strong>
    </div>

    <div>
    Grade
    <strong>${grade}</strong>
    </div>

    <div>
    Result
    <strong class="${failed?"fail":"pass"}">
    ${failed?"FAIL":"PASS"}
    </strong>
    </div>

    </div>

    </div>

    </div>

    </div>

    `;

}


/* ================= EVENTS ================= */

document
.getElementById("adminClass")
.addEventListener("change",loadStudents);


/* ================= ESCAPE ================= */

function escapeHtml(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>
</html>

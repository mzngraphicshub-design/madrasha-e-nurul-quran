<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

.top{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    box-shadow:0 3px 15px #0002;
}

.top h2{margin:0;font-size:20px}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.top a{
    color:white;
    text-decoration:none;
}

.lang{
    display:flex;
    background:#ffffff22;
    padding:3px;
    border-radius:8px;
}

.lang button{
    border:0;
    background:transparent;
    color:white;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.lang button.active{
    background:white;
    color:#0d47a1;
}

.container{
    width:100%;
    max-width:1250px;
    margin:25px auto;
    padding:0 15px;
}

.box{
    background:white;
    padding:22px;
    margin-bottom:20px;
    border-radius:14px;
    border:1px solid #e3e8f0;
    box-shadow:0 3px 15px #0000000c;
}

h3{
    color:#0d47a1;
    margin:0 0 18px;
}

.filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #d5dce7;
    border-radius:8px;
    background:white;
    font-size:14px;
    outline:none;
}

input:focus,select:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px #1976d215;
}

.student-info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.info{
    padding:14px;
    background:#f5f9ff;
    border:1px solid #dcecff;
    border-radius:9px;
}

.info small{
    display:block;
    color:#64748b;
    margin-bottom:5px;
}

.info strong{
    color:#0d47a1;
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

button.action{
    border:0;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.load-btn{
    background:#0d47a1;
    color:white;
}

.save-btn{
    background:#16a34a;
    color:white;
}

.clear-btn{
    background:#64748b;
    color:white;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

th,td{
    padding:11px 10px;
    border-bottom:1px solid #e9edf3;
    text-align:left;
}

th{
    background:#0d47a1;
    color:white;
}

td input{
    max-width:120px;
}

.subject-no{
    font-weight:bold;
    color:#64748b;
}

.total-box{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:20px;
}

.total-item{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.total-item small{
    display:block;
    color:#64748b;
    margin-bottom:6px;
}

.total-item strong{
    font-size:22px;
    color:#0d47a1;
}

.status{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

.success{
    display:block;
    background:#ecfdf5;
    color:#166534;
    border:1px solid #bbf7d0;
}

.error{
    display:block;
    background:#fef2f2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.loading{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.grade{
    font-weight:bold;
    color:#0d47a1;
}

@media(max-width:900px){
    .filters{
        grid-template-columns:repeat(2,1fr);
    }

    .student-info{
        grid-template-columns:repeat(2,1fr);
    }

    .total-box{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .top-right{
        width:100%;
        justify-content:space-between;
    }

    .filters,
    .student-info,
    .total-box{
        grid-template-columns:1fr;
    }

    .box{
        padding:15px;
    }
}
</style>
</head>

<body>

<header class="top">

<h2 id="pageTitle">📊 ফলাফল ব্যবস্থাপনা</h2>

<div class="top-right">

<div class="lang">
<button id="bnBtn" class="active" onclick="setLanguage('bn')">বাংলা</button>
<button id="enBtn" onclick="setLanguage('en')">English</button>
</div>

<a href="dashboard.html" id="dashboardLink">← Dashboard</a>

</div>

</header>

<div class="container">

<div id="status" class="status"></div>

<!-- FILTER -->

<div class="box">

<h3 id="filterTitle">📌 ফলাফল নির্বাচন করুন</h3>

<div class="filters">

<div>
<label id="sessionLabel">Session</label>
<select id="sessionSelect">
<option value="">Session নির্বাচন করুন</option>
</select>
</div>

<div>
<label id="classLabel">Class</label>
<select id="classSelect">
<option value="">Class নির্বাচন করুন</option>
</select>
</div>

<div>
<label id="examLabel">পরীক্ষার নাম</label>
<input id="examName" placeholder="যেমন: বার্ষিক পরীক্ষা">
</div>

<div>
<label id="studentLabel">Student</label>
<select id="studentSelect">
<option value="">Student নির্বাচন করুন</option>
</select>
</div>

</div>

<div class="actions">

<button class="action clear-btn" onclick="clearForm()">
↻ Clear
</button>

<button class="action load-btn" onclick="loadSubjectsAndResults()">
🔄 Load Result
</button>

</div>

</div>


<!-- STUDENT INFORMATION -->

<div class="box">

<h3>👨‍🎓 <span id="studentInfoTitle">Student Information</span></h3>

<div class="student-info">

<div class="info">
<small id="nameLabel">Name</small>
<strong id="studentName">-</strong>
</div>

<div class="info">
<small id="rollInfoLabel">Roll</small>
<strong id="studentRoll">-</strong>
</div>

<div class="info">
<small id="idInfoLabel">Student ID</small>
<strong id="studentId">-</strong>
</div>

<div class="info">
<small id="classInfoLabel">Class</small>
<strong id="studentClass">-</strong>
</div>

</div>

</div>


<!-- SUBJECT MARKS -->

<div class="box">

<h3>📝 <span id="marksTitle">Subject-wise Marks</span></h3>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>#</th>
<th id="subjectHeader">Subject</th>
<th id="marksHeader">Marks</th>
<th id="gradeHeader">Grade</th>
</tr>

</thead>

<tbody id="subjectList">

<tr>
<td colspan="4" class="empty">
প্রথমে Session, Class এবং Student নির্বাচন করুন
</td>
</tr>

</tbody>

</table>

</div>


<div class="total-box">

<div class="total-item">
<small id="totalLabel">Total Marks</small>
<strong id="totalMarks">0</strong>
</div>

<div class="total-item">
<small id="averageLabel">Average</small>
<strong id="averageMarks">0</strong>
</div>

<div class="total-item">
<small id="gpaLabel">GPA</small>
<strong id="gpa">0.00</strong>
</div>

<div class="total-item">
<small id="resultLabel">Result</small>
<strong id="finalResult">-</strong>
</div>

</div>


<div class="actions">

<button
class="action save-btn"
id="saveBtn"
onclick="saveResults()">

💾 Save Result

</button>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentLanguage = "bn";

let allStudents = [];

let subjects = [];

let existingResults = [];

let selectedStudent = null;


/* =====================================================
   CLASS LIST
===================================================== */

const classes = [
"নূরানী",
"১ম শ্রেণি",
"২য় শ্রেণি",
"৩য় শ্রেণি",
"৪র্থ শ্রেণি",
"৫ম শ্রেণি",
"নাজেরা",
"হিফজ"
];


/* =====================================================
   TRANSLATION
===================================================== */

const text = {

bn:{
selectSession:"Session নির্বাচন করুন",
selectClass:"Class নির্বাচন করুন",
selectStudent:"Student নির্বাচন করুন",
noSubject:"এই Class-এর কোনো Subject পাওয়া যায়নি",
noStudent:"এই Session ও Class-এ কোনো Student নেই",
load:"Load Result",
save:"💾 Save Result",
success:"ফলাফল সফলভাবে সংরক্ষণ হয়েছে",
error:"সমস্যা হয়েছে",
pass:"Pass",
fail:"Fail"
},

en:{
selectSession:"Select Session",
selectClass:"Select Class",
selectStudent:"Select Student",
noSubject:"No subjects found for this Class",
noStudent:"No students found",
load:"Load Result",
save:"💾 Save Result",
success:"Result saved successfully",
error:"Something went wrong",
pass:"Pass",
fail:"Fail"
}

};


/* =====================================================
   LANGUAGE
===================================================== */

function setLanguage(lang){

currentLanguage = lang;

const t = text[lang];

document.documentElement.lang =
lang==="bn" ? "bn" : "en";

document.getElementById("bnBtn")
.classList.toggle("active",lang==="bn");

document.getElementById("enBtn")
.classList.toggle("active",lang==="en");

document.getElementById("sessionLabel")
.textContent="Session";

document.getElementById("classLabel")
.textContent=lang==="bn"?"Class":"Class";

document.getElementById("examLabel")
.textContent=
lang==="bn"?"পরীক্ষার নাম":"Exam Name";

document.getElementById("studentLabel")
.textContent=
lang==="bn"?"Student":"Student";

document.getElementById("marksTitle")
.textContent=
lang==="bn"?"বিষয়ভিত্তিক নম্বর":"Subject-wise Marks";

document.getElementById("subjectHeader")
.textContent=
lang==="bn"?"বিষয়":"Subject";

document.getElementById("marksHeader")
.textContent=
lang==="bn"?"নম্বর":"Marks";

document.getElementById("gradeHeader")
.textContent=
lang==="bn"?"গ্রেড":"Grade";

document.getElementById("totalLabel")
.textContent=
lang==="bn"?"মোট নম্বর":"Total Marks";

document.getElementById("averageLabel")
.textContent=
lang==="bn"?"গড়":"Average";

document.getElementById("gpaLabel")
.textContent="GPA";

document.getElementById("resultLabel")
.textContent=
lang==="bn"?"ফলাফল":"Result";

document.getElementById("saveBtn")
.textContent=t.save;

loadSessions();

}


/* =====================================================
   AUTH
===================================================== */

async function checkAuth(){

const {
data:{session}
}=await db.auth.getSession();

if(!session){

location.href="admin.html";

return false;

}

return true;

}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

const {data,error} =

await db
.from("students")
.select(`
id,
name,
roll,
student_id,
class,
session
`)
.order("roll",{ascending:true});

if(error){

console.error(error);

showStatus(error.message,"error");

return;

}

allStudents=data || [];

loadSessions();

}


/* =====================================================
   LOAD SESSION
===================================================== */

function loadSessions(){

const select =
document.getElementById("sessionSelect");

const old =
select.value;

select.innerHTML="";

const first =
document.createElement("option");

first.value="";

first.textContent=
text[currentLanguage].selectSession;

select.appendChild(first);


const sessions=[
...new Set(
allStudents
.map(s=>s.session)
.filter(Boolean)
)
];

sessions.sort().reverse();

sessions.forEach(session=>{

const option =
document.createElement("option");

option.value=session;
option.textContent=session;

select.appendChild(option);

});

if(old) select.value=old;

}


/* =====================================================
   LOAD CLASS
===================================================== */

function loadClasses(){

const select =
document.getElementById("classSelect");

select.innerHTML="";

const first =
document.createElement("option");

first.value="";

first.textContent=
text[currentLanguage].selectClass;

select.appendChild(first);

classes.forEach(c=>{

const option =
document.createElement("option");

option.value=c;

option.textContent=c;

select.appendChild(option);

});

}


/* =====================================================
   SESSION CHANGE
===================================================== */

document
.getElementById("sessionSelect")
.addEventListener("change",function(){

loadStudentList();

});


/* =====================================================
   CLASS CHANGE
===================================================== */

document
.getElementById("classSelect")
.addEventListener("change",function(){

loadStudentList();

});


/* =====================================================
   LOAD STUDENT LIST
===================================================== */

function loadStudentList(){

const session =
document.getElementById("sessionSelect").value;

const cls =
document.getElementById("classSelect").value;

const select =
document.getElementById("studentSelect");

select.innerHTML="";

const first =
document.createElement("option");

first.value="";

first.textContent=
text[currentLanguage].selectStudent;

select.appendChild(first);

if(!session || !cls){

return;

}


/*
   IMPORTANT:
   এখানে কোনো LIMIT নেই।
   একই Class-এ যতজন Student থাকবে
   সবাই dropdown-এ আসবে।
*/

const list =
allStudents.filter(s=>

String(s.session)===String(session)
&&
String(s.class)===String(cls)

);

list.forEach(student=>{

const option =
document.createElement("option");

option.value=student.id;

option.textContent=
`${student.name} — Roll: ${student.roll || "-"} — ID: ${student.student_id || "-"}`;

select.appendChild(option);

});

if(!list.length){

showStatus(
text[currentLanguage].noStudent,
"error"
);

}

}


/* =====================================================
   STUDENT CHANGE
===================================================== */

document
.getElementById("studentSelect")
.addEventListener("change",function(){

const id=this.value;

selectedStudent =
allStudents.find(s=>
String(s.id)===String(id)
);

if(selectedStudent){

document.getElementById("studentName")
.textContent=
selectedStudent.name || "-";

document.getElementById("studentRoll")
.textContent=
selectedStudent.roll || "-";

document.getElementById("studentId")
.textContent=
selectedStudent.student_id || "-";

document.getElementById("studentClass")
.textContent=
selectedStudent.class || "-";

}else{

clearStudentInfo();

}

});


/* =====================================================
   LOAD SUBJECTS
===================================================== */

async function loadSubjects(){

const cls =
document.getElementById("classSelect").value;

const tbody =
document.getElementById("subjectList");

tbody.innerHTML=`
<tr>
<td colspan="4" class="loading">
Loading subjects...
</td>
</tr>
`;

if(!cls){

tbody.innerHTML=`
<tr>
<td colspan="4" class="empty">
Select Class first
</td>
</tr>
`;

return;

}


/*
   SUBJECTS TABLE

   Expected:
   subjects
   id
   class
   subject_name

*/

const {data,error}=

await db
.from("subjects")
.select(`
id,
class,
subject_name
`)
.eq("class",cls)
.order("id",{ascending:true});


if(error){

console.error(error);

tbody.innerHTML=`
<tr>
<td colspan="4" class="empty">
${escapeHtml(error.message)}
</td>
</tr>
`;

return;

}

subjects=data || [];

renderSubjects();

}


/* =====================================================
   LOAD EXISTING RESULTS
===================================================== */

async function loadExistingResults(){

existingResults=[];

if(!selectedStudent){

return;

}

const session =
document.getElementById("sessionSelect").value;

const examName =
document.getElementById("examName").value.trim();

if(!session || !examName){

return;

}


/*
   Existing result query.
*/

const {data,error}=

await db
.from("results")
.select(`
id,
student_id,
session,
exam_name,
subject_id,
marks
`)
.eq("student_id",selectedStudent.id)
.eq("session",session)
.eq("exam_name",examName);


if(error){

/*
   যদি result table এখনো ঠিকভাবে না থাকে,
   subject render বন্ধ হবে না।
*/

console.warn(error);

existingResults=[];

return;

}

existingResults=data || [];

renderSubjects();

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadSubjectsAndResults(){

if(!selectedStudent){

showStatus(
"প্রথমে Student নির্বাচন করুন",
"error"
);

return;

}

await loadSubjects();

await loadExistingResults();

}


/* =====================================================
   RENDER SUBJECTS
===================================================== */

function renderSubjects(){

const tbody =
document.getElementById("subjectList");

if(!subjects.length){

tbody.innerHTML=`
<tr>
<td colspan="4" class="empty">
${text[currentLanguage].noSubject}
</td>
</tr>
`;

return;

}


tbody.innerHTML=

subjects.map((subject,index)=>{

const old =
existingResults.find(r=>
String(r.subject_id)===String(subject.id)
);

const marks =
old ? old.marks : "";

return `

<tr>

<td class="subject-no">
${index+1}
</td>

<td>
<strong>
${escapeHtml(subject.subject_name)}
</strong>
</td>

<td>

<input
type="number"
min="0"
max="100"
step="0.01"
class="mark-input"
data-subject-id="${subject.id}"
value="${marks}"
placeholder="0-100"
oninput="calculateResult()"
>

</td>

<td>

<span
class="grade"
id="grade-${subject.id}">

${marks!=="" ? getGrade(marks) : "-"}

</span>

</td>

</tr>

`;

}).join("");

calculateResult();

}


/* =====================================================
   GRADE
===================================================== */

function getGrade(mark){

mark=Number(mark);

if(isNaN(mark)) return "-";

if(mark>=80) return "A+";

if(mark>=70) return "A";

if(mark>=60) return "A-";

if(mark>=50) return "B";

if(mark>=40) return "C";

if(mark>=33) return "D";

return "F";

}


/* =====================================================
   GPA
===================================================== */

function getPoint(mark){

mark=Number(mark);

if(mark>=80) return 5.00;

if(mark>=70) return 4.00;

if(mark>=60) return 3.50;

if(mark>=50) return 3.00;

if(mark>=40) return 2.00;

if(mark>=33) return 1.00;

return 0.00;

}


/* =====================================================
   CALCULATE
===================================================== */

function calculateResult(){

const inputs =
document.querySelectorAll(".mark-input");

let total=0;

let count=0;

let fail=false;


inputs.forEach(input=>{

const value=input.value;

const subjectId=
input.dataset.subjectId;

const gradeEl =
document.getElementById(
"grade-"+subjectId
);

if(value===""){

gradeEl.textContent="-";

return;

}

const mark=Number(value);

if(mark<0 || mark>100){

gradeEl.textContent="-";

return;

}

total+=mark;

count++;

const grade=getGrade(mark);

gradeEl.textContent=grade;

if(grade==="F"){

fail=true;

}

});


let average=0;

let gpa=0;

if(count){

average=total/count;

let points=0;

inputs.forEach(input=>{

if(input.value!==""){

points+=
getPoint(input.value);

}

});

gpa=points/count;

}


document.getElementById("totalMarks")
.textContent=total.toFixed(2);

document.getElementById("averageMarks")
.textContent=average.toFixed(2);

document.getElementById("gpa")
.textContent=gpa.toFixed(2);

document.getElementById("finalResult")
.textContent=
count===0
?"-"
:fail
?text[currentLanguage].fail
:text[currentLanguage].pass;

}


/* =====================================================
   SAVE RESULTS
===================================================== */

async function saveResults(){

if(!selectedStudent){

showStatus(
"Student নির্বাচন করুন",
"error"
);

return;

}

const session =
document.getElementById("sessionSelect").value;

const cls =
document.getElementById("classSelect").value;

const examName =
document.getElementById("examName").value.trim();

if(!session || !cls || !examName){

showStatus(
"Session, Class এবং Exam Name দিন",
"error"
);

return;

}

if(!subjects.length){

showStatus(
"কোনো Subject পাওয়া যায়নি",
"error"
);

return;

}


const btn =
document.getElementById("saveBtn");

btn.disabled=true;


try{

/*
   আগে এই Student + Session + Exam-এর
   পুরোনো result delete করা হবে।

   তারপর নতুন marks insert হবে।
*/

const {error:deleteError}=

await db
.from("results")
.delete()
.eq("student_id",selectedStudent.id)
.eq("session",session)
.eq("exam_name",examName);


if(deleteError){

throw deleteError;

}


const inputs =
document.querySelectorAll(".mark-input");

const rows=[];


inputs.forEach(input=>{

if(input.value==="") return;

const mark=Number(input.value);

if(isNaN(mark)) return;

if(mark<0 || mark>100) return;

rows.push({

student_id:selectedStudent.id,

session:session,

exam_name:examName,

subject_id:Number(input.dataset.subjectId),

marks:mark

});

});


if(!rows.length){

throw new Error(
"কমপক্ষে একটি Subject-এর Marks দিন"
);

}


const {error:insertError}=

await db
.from("results")
.insert(rows);


if(insertError){

throw insertError;

}


showStatus(
text[currentLanguage].success,
"success"
);


await loadExistingResults();


}catch(error){

console.error(error);

showStatus(
error.message ||
text[currentLanguage].error,
"error"
);

}finally{

btn.disabled=false;

}

}

/* =====================================================
   CLEAR STUDENT INFO
===================================================== */

function clearStudentInfo(){

document.getElementById("studentName")
.textContent="-";

document.getElementById("studentRoll")
.textContent="-";

document.getElementById("studentId")
.textContent="-";

document.getElementById("studentClass")
.textContent="-";

}


/* =====================================================
   EXAM NAME CHANGE
===================================================== */

document
.getElementById("examName")
.addEventListener(
"change",
async function(){

if(selectedStudent){

await loadExistingResults();

}

});


/* =====================================================
   STATUS
===================================================== */

function showStatus(message,type){

const box =
document.getElementById("status");

box.textContent=message;

box.className=
"status "+type;

setTimeout(()=>{

box.className="status";

},5000);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   START
===================================================== */

async function start(){

const authenticated =
await checkAuth();

if(!authenticated)return;

loadClasses();

await loadStudents();

}

start();

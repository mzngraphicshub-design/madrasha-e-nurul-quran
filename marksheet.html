<!DOCTYPE html>
<html lang="bn">
<head>
<script>/* MNQ access guard (inline) */
/* =========================================================
   মাদরাসায়ে নূরুল কুরআন — Shared Access Guard
   সব পেজের <head> এর একদম শুরুতে লোড হয়:
   (এই কোড প্রতিটি পেজের <head> এ inline বসানো আছে)
   - Admin   : সব পেজ
   - Teacher : শুধু dashboard + allowed_pages (hub/settings বন্ধ)
   - Student : শুধু student-dashboard, payment-receipt, invoice
   নতুন পেজ বানালে কিছু করতে হবে না; Teacher-কে access দিতে
   teacher-access পেজ থেকে পেজের নাম (যেমন: students) যোগ করুন।
   ========================================================= */
(function () {
  "use strict";
  window.MNQ_GUARD_VERSION = "20261116b";

  /* ---------------------------------------------------------
     Teacher session shim
     Teacher login RPC দিয়ে হয়, Supabase Auth session তৈরি হয় না।
     কিন্তু বেশিরভাগ পেজ getSession() খালি দেখলে login এ ফেরত পাঠায়।
     তাই শুধু Teacher হলে getSession()/getUser() এ "teacher session"
     দেখানো হয়। (Admin/Student এ কিছুই বদলায় না।)
     supabase-js CDN <script> এর ঠিক পরে mnqPatchSupabase() চালাতে হয়।
     --------------------------------------------------------- */
  window.mnqPatchSupabase = function () {
    try {
      if ((sessionStorage.getItem("madrasa_login_role") || "").toLowerCase() !== "teacher") return;
      var sb = window.supabase;
      if (!sb || typeof sb.createClient !== "function" || sb.__mnqPatched) return;
      var t = {};
      try { t = JSON.parse(sessionStorage.getItem("madrasa_teacher_login") || "{}") || {}; } catch (e) {}
      var user = {
        id: String(t.id || t.teacher_id || t.phone || "teacher"),
        email: t.email || "",
        role: "authenticated",
        aud: "authenticated",
        app_metadata: { role: "teacher" },
        user_metadata: { role: "teacher", name: t.name || "" }
      };
      var fake = {
        access_token: "teacher-session", refresh_token: "", token_type: "bearer",
        expires_in: 86400, expires_at: Math.floor(Date.now() / 1000) + 86400, user: user
      };
      var orig = sb.createClient;
      var wrapped = function () {
        var c = orig.apply(this, arguments);
        try {
          var a = c.auth, rs = a.getSession.bind(a), ru = a.getUser.bind(a), ro = a.onAuthStateChange.bind(a);
          a.getSession = async function () {
            var r = await rs();
            return (r && r.data && r.data.session) ? r : { data: { session: fake }, error: null };
          };
          a.getUser = async function () {
            var r = await ru();
            return (r && r.data && r.data.user) ? r : { data: { user: user }, error: null };
          };
          a.onAuthStateChange = function (cb) {
            return ro(function (ev, s) { return cb(ev, s || fake); });
          };
        } catch (e) { console.warn("teacher shim:", e); }
        return c;
      };
      var copy = {};
      Object.keys(sb).forEach(function (k) { copy[k] = sb[k]; });
      copy.createClient = wrapped;
      copy.__mnqPatched = true;
      window.supabase = copy;
    } catch (e) { console.warn("mnqPatchSupabase:", e); }
  };

  var PUBLIC = ["", "index", "login", "login-teacher", "students-login", "online-admission-public"];
  var TEACHER_BLOCKED = ["donations-hub", "accounts-hub", "settings-hub", "settings", "teacher-access", "admin"];
  var STUDENT_ALLOWED = ["student-dashboard", "payment-receipt", "invoice", "students-login"];

  function keyFor(url) {
    return String(url || "").split(/[?#]/)[0].split("/").pop().toLowerCase().replace(/\.html$/, "");
  }
  function read(k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return null; } }

  var current = keyFor(location.pathname) || "index";
  if (PUBLIC.indexOf(current) > -1) return;

  var role = (sessionStorage.getItem("madrasa_login_role") || "").toLowerCase();
  var isStudent = !!sessionStorage.getItem("madrasa_student_login") && role !== "admin" && role !== "teacher";

  if (role === "admin") return;                       // Admin = সব

  if (!role && !isStudent) {                          // লগইন নেই
    location.replace("login.html");
    return;
  }

  var allowed = {};
  if (role === "teacher") {
    var t = read("madrasa_teacher_login") || {};
    (Array.isArray(t.allowed_pages) ? t.allowed_pages : []).forEach(function (p) {
      p = keyFor(p); if (p) allowed[p] = 1;
    });
  }

  function can(url) {
    var k = keyFor(url);
    if (!k) return true;
    if (isStudent) return STUDENT_ALLOWED.indexOf(k) > -1;
    if (TEACHER_BLOCKED.indexOf(k) > -1) return false;
    if (k === "teacher-dashboard") return true;      /* শিক্ষকের নিজস্ব ড্যাশবোর্ড */
    if (k === "dashboard" || k === "student-dashboard") return false;  /* admin dashboard শিক্ষকের জন্য নয় */
    return !!allowed[k] || !!allowed["*"];
  }

  var home = isStudent ? "student-dashboard.html" : "teacher-dashboard.html";

  /* সরাসরি URL দিয়ে ঢোকা আটকানো */
  if (!can(current)) {
    document.documentElement.style.visibility = "hidden";
    location.replace(home);
    return;
  }

  /* লুকানোর CSS (পেজ আঁকার আগেই) */
  var st = document.createElement("style");
  st.textContent = 'html body [data-denied="1"],html body a[data-denied="1"]{display:none!important;visibility:hidden!important;pointer-events:none!important}';
  document.documentElement.appendChild(st);

  var SD_MAP = { sms: "sms", stu: "students", inv: "invoice", pay: "payment-receipt" };

  function deny(el) {
    el.setAttribute("data-denied", "1");
    el.setAttribute("aria-hidden", "true");
    el.setAttribute("tabindex", "-1");
    /* inline !important — পেজের নিজের CSS যেন ওভাররাইড করতে না পারে */
    el.style.setProperty("display", "none", "important");
  }

  function sweep() {
    document.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href") || "";
      if (!/\.html(?:[?#]|$)/i.test(h)) return;
      if (!isStudent && keyFor(h) === "dashboard") { a.setAttribute("href", "teacher-dashboard.html"); return; }
      if (!can(h)) deny(a);
    });
    /* onclick="location.href='x.html'" ধরনের বাটন/কার্ড */
    document.querySelectorAll("[onclick*='.html']").forEach(function (el) {
      var m = /([A-Za-z0-9_\-]+\.html)/.exec(el.getAttribute("onclick") || "");
      if (m && !can(m[1])) deny(el);
    });
    document.querySelectorAll("[data-href],[data-url]").forEach(function (el) {
      var u = el.getAttribute("data-href") || el.getAttribute("data-url") || "";
      if (/\.html/i.test(u) && !can(u)) deny(el);
    });
    document.querySelectorAll(".sd .opt").forEach(function (b) {
      var k = SD_MAP[b.dataset.a];
      if (k && !can(k)) deny(b);
    });
    /* খালি গ্রুপ লুকানো */
    document.querySelectorAll(".nav-group, .bottom-nav-group").forEach(function (g) {
      var l = g.querySelectorAll("a[href]");
      if (l.length && Array.prototype.every.call(l, function (a) { return a.getAttribute("data-denied") === "1"; }))
        g.style.setProperty("display", "none", "important");
    });
  }


  /* ডিবাগ: যেকোনো পেজের URL এর শেষে ?guarddebug দিলে নিচে একটা বার্তা আসবে */
  if (/[?&]guarddebug/.test(location.search)) {
    document.addEventListener("DOMContentLoaded", function () {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;left:6px;right:6px;top:6px;z-index:2147483647;background:#111;color:#0f0;font:12px monospace;padding:8px;border-radius:8px;white-space:pre-wrap";
      d.textContent = "guard v" + window.MNQ_GUARD_VERSION + " | page=" + current + " | role=" + (role || (isStudent ? "student" : "none")) +
        " | allowed=" + Object.keys(allowed).join(",") +
        " | hidden=" + document.querySelectorAll('[data-denied="1"]').length;
      document.body.appendChild(d);
    });
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("[data-denied=\"1\"]");
    if (a) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  document.addEventListener("DOMContentLoaded", function () {
    sweep();
    var pending = false;
    new MutationObserver(function () {
      if (pending) return; pending = true;
      setTimeout(function () { pending = false; sweep(); }, 50);
    }).observe(document.body, { childList: true, subtree: true });
  });
})();

</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marksheet | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f6;font-family:Arial,sans-serif;color:#222}
.top{background:#075c43;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0;color:#fff;font-size:20px}
.top a{color:#fff;text-decoration:none}
.container{max-width:900px;margin:25px auto;padding:0 15px}
.box{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:7px;margin:8px 0 15px;font-size:15px}
button{border:0;padding:11px 18px;border-radius:7px;background:#087f5b;color:#fff;font-weight:bold;cursor:pointer}
.print{background:#333;margin-left:7px}
#msg{margin:12px 0}
.sheet{margin-top:25px;border:1px solid #ddd;padding:30px;display:none}
.header{text-align:center;border-bottom:2px solid #075c43;padding-bottom:15px}
.header h1{margin:0;color:#075c43;font-size:25px}
.header p{margin:5px 0}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #777;padding:10px;text-align:center}
th{background:#075c43;color:#fff}
.total{text-align:right;margin-top:15px;font-weight:bold}
.sign{display:flex;justify-content:space-between;margin-top:70px}
.sign div{border-top:1px solid #555;padding-top:7px;text-align:center;width:180px}

@media(max-width:600px){
.info{grid-template-columns:1fr}
.sheet{padding:15px}
}

@media print{
body{background:#fff}
.top,.box{display:none!important}
.container{margin:0;padding:0;max-width:none}
.sheet{display:block!important;border:0;margin:0;padding:20px}
}
</style>
</head>

<body>

<header class="top">
<h2>📄 Marksheet</h2>
<a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="box">
<label><b>Result নির্বাচন করুন</b></label>

<select id="resultSelect">
<option value="">-- Result নির্বাচন করুন --</option>
</select>

<button onclick="showMarksheet()">View Marksheet</button>
<button class="print" onclick="window.print()">🖨️ Print</button>

<div id="msg"></div>
</div>

<div id="sheet" class="sheet">

<div class="header">
<h1>মাদরাসায়ে নূরুল কুরআন</h1>
<p>MARKSHEET / RESULT</p>
</div>

<div class="info">
<div><b>Student ID:</b> <span id="sid"></span></div>
<div><b>Student Name:</b> <span id="sname"></span></div>
<div><b>Class:</b> <span id="className"></span></div>
<div><b>Exam:</b> <span id="exam"></span></div>
<div><b>Year:</b> <span id="year"></span></div>
</div>

<table>
<thead>
<tr>
<th>ক্রমিক</th>
<th>Subject</th>
<th>Marks</th>
<th>Grade</th>
</tr>
</thead>
<tbody id="subjects"></tbody>
</table>

<div class="total">
Total Marks: <span id="total"></span><br>
Average: <span id="average"></span><br>
Result: <span id="resultStatus"></span>
</div>

<div class="sign">
<div>Class Teacher</div>
<div>Principal</div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.mnqPatchSupabase&&window.mnqPatchSupabase()</script>

<script>
const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";
const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let results=[];

async function start(){

const {data:{session}}=await db.auth.getSession();

if(!session){
location.href="admin.html";
return;
}

const {data,error}=await db
.from("results")
.select(`
id,
exam_name,
exam_year,
students(
student_id,
name,
classes(name)
)
`)
.order("created_at",{ascending:false});

if(error){
document.getElementById("msg").textContent="❌ "+error.message;
return;
}

results=data||[];

const select=document.getElementById("resultSelect");

results.forEach(r=>{
const option=document.createElement("option");
option.value=r.id;
option.textContent=
(r.students?.student_id||"")+" - "+
(r.students?.name||"")+" | "+
(r.exam_name||"")+" | "+
(r.exam_year||"");
select.appendChild(option);
});
}

async function showMarksheet(){

const id=document.getElementById("resultSelect").value;

if(!id){
alert("একটি Result নির্বাচন করুন");
return;
}

const result=results.find(r=>String(r.id)===String(id));

const {data,error}=await db
.from("result_subjects")
.select("subject_name,marks")
.eq("result_id",id)
.order("created_at");

if(error){
alert(error.message);
return;
}

document.getElementById("sid").textContent=
result.students?.student_id||"-";

document.getElementById("sname").textContent=
result.students?.name||"-";

document.getElementById("className").textContent=
result.students?.classes?.name||"-";

document.getElementById("exam").textContent=
result.exam_name||"-";

document.getElementById("year").textContent=
result.exam_year||"-";

let total=0;
let failed=false;

const tbody=document.getElementById("subjects");

tbody.innerHTML=(data||[]).map((s,i)=>{

const marks=Number(s.marks)||0;
total+=marks;

if(marks<33) failed=true;

return `
<tr>
<td>${i+1}</td>
<td>${escapeHtml(s.subject_name)}</td>
<td>${marks}</td>
<td>${grade(marks)}</td>
</tr>
`;

}).join("");

const count=(data||[]).length;
const average=count?total/count:0;

document.getElementById("total").textContent=
total.toFixed(2);

document.getElementById("average").textContent=
average.toFixed(2);

document.getElementById("resultStatus").textContent=
failed?"Failed":"Passed";

document.getElementById("sheet").style.display="block";

window.scrollTo({
top:document.getElementById("sheet").offsetTop,
behavior:"smooth"
});
}

function grade(mark){

if(mark>=80)return"A+";
if(mark>=70)return"A";
if(mark>=60)return"A-";
if(mark>=50)return"B";
if(mark>=40)return"C";
if(mark>=33)return"D";
return"F";
}

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

start();
</script>

</body>
</html>

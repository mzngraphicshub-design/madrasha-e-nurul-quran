<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notice Management | মাদরাসায়ে নূরুল কুরআন</title>

<style>
@font-face{
    font-family:"Bornomala";
    src:url("./fonts/Bornomala-Regular.ttf") format("truetype");
    font-display:swap;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Bornomala",Arial,sans-serif;
    background:#f2f8fd;
    color:#173452;
}

a{
    text-decoration:none;
    color:inherit;
}

.top{
    background:linear-gradient(135deg,#031a35,#0875df);
    color:#fff;
    padding:15px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    width:55px;
    height:55px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
}

.brand h2{
    font-size:21px;
}

.brand small{
    font-family:Arial;
    font-size:8px;
    letter-spacing:2px;
    opacity:.8;
}

.home-btn{
    background:#ffd447;
    color:#092440;
    padding:10px 18px;
    border-radius:10px;
    font-weight:bold;
}

.container{
    width:min(1200px,94%);
    margin:35px auto;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    color:#062b55;
    font-size:34px;
}

.page-title p{
    color:#718399;
    margin-top:5px;
}

.grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:25px;
    align-items:start;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,40,80,.10);
    border:1px solid #e0eaf3;
}

.card h2{
    color:#062b55;
    font-size:23px;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin:12px 0 6px;
}

input,
textarea{
    width:100%;
    border:1px solid #d6e2ec;
    border-radius:10px;
    padding:13px;
    outline:none;
    font-family:inherit;
    background:#fff;
}

input:focus,
textarea:focus{
    border-color:#0875df;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.file-box{
    border:2px dashed #cbddeb;
    border-radius:12px;
    padding:15px;
    background:#f8fbff;
}

.file-box small{
    color:#718399;
    display:block;
    margin-top:7px;
}

.publish-btn{
    width:100%;
    border:0;
    padding:14px;
    margin-top:18px;
    border-radius:10px;
    background:linear-gradient(135deg,#031a35,#0875df);
    color:#fff;
    cursor:pointer;
    font-size:16px;
    font-family:inherit;
}

.publish-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-weight:bold;
}

.success{
    display:block;
    background:#e7f8ed;
    color:#13733b;
}

.error{
    display:block;
    background:#ffe9e9;
    color:#c62828;
}

.notice-list{
    display:grid;
    gap:15px;
}

.notice-item{
    border:1px solid #e1eaf2;
    border-radius:17px;
    padding:20px;
    background:#fff;
}

.notice-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
}

.notice-title{
    color:#062b55;
    font-size:21px;
}

.notice-date{
    color:#0875df;
    font-size:14px;
    white-space:nowrap;
}

.notice-description{
    color:#718399;
    line-height:1.8;
    margin-top:10px;
    white-space:pre-line;
}

.pdf-btn{
    display:inline-block;
    margin-top:15px;
    background:#eaf4ff;
    color:#0875df;
    padding:9px 15px;
    border-radius:9px;
    font-weight:bold;
}

.delete-btn{
    border:0;
    background:#ffe9e9;
    color:#c62828;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
    font-family:inherit;
    margin-left:7px;
}

.empty{
    text-align:center;
    padding:45px 15px;
    background:#f7fbff;
    border-radius:15px;
    color:#8b9aab;
}

.footer{
    text-align:center;
    color:#718399;
    padding:35px 10px;
}

@media(max-width:850px){
    .grid{
        grid-template-columns:1fr;
    }

    .top{
        padding:12px 4%;
    }

    .brand h2{
        font-size:17px;
    }

    .home-btn{
        font-size:13px;
        padding:8px 12px;
    }

    .page-title h1{
        font-size:28px;
    }
}

@media(max-width:500px){
    .notice-top{
        flex-direction:column;
    }

    .container{
        margin-top:25px;
    }

    .card{
        padding:18px;
    }
}
</style>
</head>

<body>

<header class="top">

    <div class="brand">
        <img src="img/logo.png" alt="Logo">
        <div>
            <h2>নোটিশ ম্যানেজমেন্ট</h2>
            <small>MADRASHA-E NURUL QURAN</small>
        </div>
    </div>

    <a href="index.html#notices" class="home-btn">
        ← Home Notice
    </a>

</header>


<main class="container">

    <div class="page-title">
        <h1>📢 Notice Management</h1>
        <p>নতুন নোটিশ লিখুন, PDF আপলোড করুন এবং প্রকাশিত নোটিশ পরিচালনা করুন।</p>
    </div>


    <div class="grid">

        <!-- ADD NOTICE -->

        <div class="card">

            <h2>➕ নতুন নোটিশ যোগ করুন</h2>

            <label for="noticeTitle">
                নোটিশের শিরোনাম *
            </label>

            <input
                type="text"
                id="noticeTitle"
                placeholder="যেমন: পরীক্ষার রুটিন প্রকাশ করা হয়েছে"
            >


            <label for="noticeDate">
                নোটিশের তারিখ *
            </label>

            <input
                type="date"
                id="noticeDate"
            >


            <label for="noticeDescription">
                নোটিশের বিস্তারিত
            </label>

            <textarea
                id="noticeDescription"
                placeholder="নোটিশের বিস্তারিত এখানে লিখুন..."
            ></textarea>


            <label for="noticePdf">
                PDF ফাইল
            </label>

            <div class="file-box">

                <input
                    type="file"
                    id="noticePdf"
                    accept="application/pdf,.pdf"
                >

                <small>
                    শুধু PDF ফাইল নির্বাচন করুন।
                    সর্বোচ্চ 10MB।
                </small>

            </div>


            <button
                class="publish-btn"
                id="publishBtn"
                onclick="publishNotice()"
            >
                📢 নোটিশ প্রকাশ করুন
            </button>

            <div id="message" class="message"></div>

        </div>


        <!-- PUBLISHED NOTICE -->

        <div class="card">

            <h2>📋 প্রকাশিত নোটিশ</h2>

            <div
                id="noticeList"
                class="notice-list"
            >
                <div class="empty">
                    নোটিশ লোড হচ্ছে...
                </div>
            </div>

        </div>

    </div>

</main>


<footer class="footer">
    © <span id="year"></span>
    মাদরাসায়ে নূরুল কুরআন — সর্বস্বত্ব সংরক্ষিত।
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE CONFIG
========================================== */

const SUPABASE_URL =
    "https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   SETTINGS
========================================== */

const BUCKET_NAME = "notice-pdfs";


/* ==========================================
   YEAR
========================================== */

document.getElementById("year").textContent =
    new Date().getFullYear();


/* ==========================================
   DEFAULT DATE
========================================== */

document.getElementById("noticeDate").value =
    new Date().toISOString().split("T")[0];


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.textContent = text;

}


/* ==========================================
   FILE NAME
========================================== */

function safeFileName(name){

    return name
        .replace(/[^\w.\-]+/g,"_")
        .replace(/_+/g,"_");

}


/* ==========================================
   PUBLISH NOTICE
========================================== */

async function publishNotice(){

    const button =
        document.getElementById("publishBtn");

    const title =
        document.getElementById("noticeTitle")
        .value.trim();

    const date =
        document.getElementById("noticeDate")
        .value;

    const description =
        document.getElementById("noticeDescription")
        .value.trim();

    const pdf =
        document.getElementById("noticePdf")
        .files[0];


    if(!title){

        showMessage(
            "নোটিশের শিরোনাম লিখুন।",
            "error"
        );

        return;
    }


    if(!date){

        showMessage(
            "নোটিশের তারিখ নির্বাচন করুন।",
            "error"
        );

        return;
    }


    if(pdf){

        if(pdf.type !== "application/pdf"){

            showMessage(
                "শুধু PDF ফাইল আপলোড করা যাবে।",
                "error"
            );

            return;
        }


        if(pdf.size > 10 * 1024 * 1024){

            showMessage(
                "PDF ফাইল সর্বোচ্চ 10MB হতে পারবে।",
                "error"
            );

            return;
        }

    }


    button.disabled = true;

    button.textContent =
        "⏳ প্রকাশ করা হচ্ছে...";


    try{

        let pdfUrl = null;


        /* ==================================
           PDF UPLOAD
        ================================== */

        if(pdf){

            const uniqueName =
                Date.now() +
                "_" +
                safeFileName(pdf.name);

            const filePath =
                "notices/" + uniqueName;


            const uploadResult =
                await supabaseClient
                .storage
                .from(BUCKET_NAME)
                .upload(
                    filePath,
                    pdf,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:"application/pdf"
                    }
                );


            if(uploadResult.error){

                throw new Error(
                    "PDF Upload Error: " +
                    uploadResult.error.message
                );

            }


            const publicResult =
                supabaseClient
                .storage
                .from(BUCKET_NAME)
                .getPublicUrl(filePath);


            pdfUrl =
                publicResult.data.publicUrl;

        }


        /* ==================================
           INSERT NOTICE
        ================================== */

        const {error} =
            await supabaseClient
            .from("notices")
            .insert({

                title:title,

                notice_date:date,

                description:description || null,

                pdf_url:pdfUrl

            });


        if(error){

            throw new Error(
                "Notice Save Error: " +
                error.message
            );

        }


        showMessage(
            "✅ নোটিশ সফলভাবে প্রকাশ হয়েছে।",
            "success"
        );


        document.getElementById(
            "noticeTitle"
        ).value = "";

        document.getElementById(
            "noticeDescription"
        ).value = "";

        document.getElementById(
            "noticePdf"
        ).value = "";

        document.getElementById(
            "noticeDate"
        ).value =
            new Date().toISOString().split("T")[0];


        await loadNotices();


    }catch(error){

        console.error(error);

        showMessage(
            "❌ সমস্যা: " + error.message,
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "📢 নোটিশ প্রকাশ করুন";

}


/* ==========================================
   LOAD NOTICES
========================================== */

async function loadNotices(){

    const list =
        document.getElementById("noticeList");


    const {data,error} =
        await supabaseClient
        .from("notices")
        .select("*")
        .order("notice_date",{ascending:false})
        .order("created_at",{ascending:false});


    if(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                ❌ নোটিশ লোড করা যাচ্ছে না।<br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML = `
            <div class="empty">
                এখনো কোনো নোটিশ প্রকাশ করা হয়নি।
            </div>
        `;

        return;
    }


    list.innerHTML =
        data.map(notice => {

            const date =
                formatBanglaDate(
                    notice.notice_date
                );


            let pdfButton = "";

            if(notice.pdf_url){

                pdfButton = `
                    <a
                        class="pdf-btn"
                        href="${escapeAttr(notice.pdf_url)}"
                        target="_blank"
                        rel="noopener"
                    >
                        📄 PDF দেখুন
                    </a>
                `;

            }


            return `

                <div class="notice-item">

                    <div class="notice-top">

                        <h3 class="notice-title">
                            ${escapeHtml(notice.title || "")}
                        </h3>

                        <div class="notice-date">
                            📅 ${date}
                        </div>

                    </div>


                    ${
                        notice.description
                        ?
                        `<div class="notice-description">
                            ${escapeHtml(notice.description)}
                        </div>`
                        :
                        ""
                    }


                    <div>

                        ${pdfButton}

                        <button
                            class="delete-btn"
                            onclick="deleteNotice('${escapeAttr(notice.id)}','${escapeAttr(notice.pdf_url || "")}')"
                        >
                            🗑️ মুছুন
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* ==========================================
   DELETE NOTICE
========================================== */

async function deleteNotice(id,pdfUrl){

    if(!confirm(
        "এই নোটিশটি মুছে ফেলতে চান?"
    )){
        return;
    }


    try{

        const {error} =
            await supabaseClient
            .from("notices")
            .delete()
            .eq("id",id);


        if(error){

            throw error;

        }


        /* PDF Storage থেকে delete */

        if(pdfUrl){

            try{

                const marker =
                    "/storage/v1/object/public/" +
                    BUCKET_NAME + "/";

                const position =
                    pdfUrl.indexOf(marker);


                if(position !== -1){

                    const path =
                        decodeURIComponent(
                            pdfUrl.substring(
                                position + marker.length
                            )
                        );


                    await supabaseClient
                    .storage
                    .from(BUCKET_NAME)
                    .remove([path]);

                }

            }catch(storageError){

                console.log(
                    "Storage delete warning:",
                    storageError
                );

            }

        }


        showMessage(
            "নোটিশ মুছে ফেলা হয়েছে।",
            "success"
        );


        loadNotices();


    }catch(error){

        showMessage(
            "মুছতে সমস্যা: " +
            error.message,
            "error"
        );

    }

}


/* ==========================================
   BANGLA DATE
========================================== */

function formatBanglaDate(dateString){

    if(!dateString) return "";

    const d =
        new Date(
            dateString + "T00:00:00"
        );


    return d.toLocaleDateString(
        "bn-BD",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* ==========================================
   SECURITY HELPERS
========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;");

}


/* ==========================================
   START
========================================== */

loadNotices();

</script>

</body>
</html>

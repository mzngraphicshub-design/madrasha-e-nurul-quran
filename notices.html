<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নোটিশ ম্যানেজমেন্ট | মাদরাসায়ে নূরুল কুরআন</title>

<style>
@font-face{
    font-family:"Bornomala";
    src:url("./fonts/Bornomala-Regular.ttf") format("truetype");
    font-display:swap;
}

:root{
    --navy:#031a35;
    --blue:#0875df;
    --gold:#ffd447;
    --red:#dc3545;
    --green:#198754;
    --white:#fff;
    --bg:#f3f8fd;
    --text:#173452;
    --muted:#718399;
    --border:#dce7f1;
    --shadow:0 20px 60px rgba(0,25,60,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Bornomala",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,textarea{
    font-family:inherit;
}

.container{
    width:min(1100px,94%);
    margin:auto;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,var(--navy),#075db6);
    color:#fff;
    padding:22px 0;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:58px;
    height:58px;
    object-fit:contain;
    border-radius:50%;
    background:#fff;
}

.brand h1{
    font-size:25px;
}

.brand small{
    font-family:Arial,sans-serif;
    color:#b9d7f4;
    font-size:9px;
    letter-spacing:2px;
}

.back-btn{
    text-decoration:none;
    color:var(--navy);
    background:var(--gold);
    padding:11px 18px;
    border-radius:10px;
    font-weight:bold;
}

/* MAIN */

main{
    padding:45px 0 80px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
}

.page-title small{
    color:var(--blue);
}

.page-title h2{
    font-size:38px;
    color:var(--navy);
    margin-top:5px;
}

/* FORM */

.admin-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:25px;
    padding:30px;
    box-shadow:var(--shadow);
    margin-bottom:35px;
}

.form-title{
    color:var(--navy);
    font-size:25px;
    margin-bottom:22px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    color:var(--navy);
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:14px;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
    background:#fbfdff;
    font-size:16px;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(8,117,223,.08);
}

.form-group textarea{
    min-height:130px;
    resize:vertical;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.file-box{
    padding:18px;
    border:2px dashed #c9dbea;
    border-radius:14px;
    background:#f7fbff;
}

.file-box input{
    width:100%;
}

.file-note{
    color:var(--muted);
    font-size:13px;
    margin-top:7px;
}

.button-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:11px;
    padding:13px 22px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.btn-save{
    background:var(--gold);
    color:var(--navy);
}

.btn-cancel{
    background:#e8eef5;
    color:var(--text);
    display:none;
}

.btn:hover{
    opacity:.9;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    display:none;
}

.message.success{
    display:block;
    background:#e7f7ef;
    color:var(--green);
}

.message.error{
    display:block;
    background:#ffe9ec;
    color:var(--red);
}

/* NOTICE LIST */

.list-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
}

.list-title h2{
    color:var(--navy);
}

.notice-count{
    background:#e8f3ff;
    color:var(--blue);
    padding:7px 13px;
    border-radius:20px;
}

.notice-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    margin-bottom:15px;
    box-shadow:0 8px 30px rgba(0,25,60,.06);
}

.notice-top{
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.notice-info{
    flex:1;
}

.notice-date{
    display:inline-block;
    background:#eaf4ff;
    color:var(--blue);
    padding:5px 10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:8px;
}

.notice-info h3{
    color:var(--navy);
    font-size:22px;
}

.notice-description{
    color:var(--muted);
    line-height:1.8;
    margin-top:8px;
    white-space:pre-wrap;
}

.notice-actions{
    display:flex;
    gap:8px;
    align-items:flex-start;
    flex-wrap:wrap;
}

.action-btn{
    border:0;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
    text-decoration:none;
    font-size:14px;
    display:inline-block;
}

.edit-btn{
    background:#fff4d0;
    color:#8a6500;
}

.delete-btn{
    background:#ffe7ea;
    color:var(--red);
}

.pdf-btn{
    background:#e8f7ef;
    color:var(--green);
}

.loading{
    text-align:center;
    padding:35px;
    color:var(--muted);
}

.empty{
    text-align:center;
    background:#fff;
    padding:45px 20px;
    border-radius:20px;
    border:1px dashed var(--border);
    color:var(--muted);
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login-screen{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#02152c,#075db6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
}

.login-box{
    width:min(420px,100%);
    background:#fff;
    padding:35px;
    border-radius:25px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
    text-align:center;
}

.login-box h2{
    color:var(--navy);
    margin-bottom:8px;
}

.login-box p{
    color:var(--muted);
    margin-bottom:22px;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
}

.login-box button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:var(--gold);
    color:var(--navy);
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-error{
    color:var(--red);
    margin-top:12px;
    min-height:20px;
}

.logout-btn{
    background:#ffe7ea;
    color:#dc3545;
    border:0;
    border-radius:9px;
    padding:10px 14px;
    cursor:pointer;
    font-family:inherit;
}

@media(max-width:700px){

    .header-inner{
        align-items:flex-start;
    }

    .brand h1{
        font-size:18px;
    }

    .brand small{
        display:none;
    }

    .logo{
        width:48px;
        height:48px;
    }

    .back-btn{
        font-size:13px;
        padding:9px 12px;
    }

    .page-title h2{
        font-size:29px;
    }

    .admin-card{
        padding:20px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    .notice-top{
        flex-direction:column;
    }

    .notice-actions{
        width:100%;
    }

    .action-btn{
        flex:1;
        text-align:center;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

    <div class="login-box">

        <div style="font-size:55px;margin-bottom:10px">🔐</div>

        <h2>অ্যাডমিন লগইন</h2>

        <p>নোটিশ ম্যানেজমেন্ট প্যানেল</p>

        <input
            type="email"
            id="loginEmail"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="adminLogin()">
            লগইন করুন
        </button>

        <div class="login-error" id="loginError"></div>

    </div>

</div>


<header class="header">

    <div class="container header-inner">

        <div class="brand">

            <img src="img/logo.png" class="logo" alt="Logo">

            <div>
                <h1>নোটিশ ম্যানেজমেন্ট</h1>
                <small>MADRASHA-E NURUL QURAN</small>
            </div>

        </div>

        <div style="display:flex;gap:8px;align-items:center">

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

            <a href="index.html" class="back-btn">
                ← ওয়েবসাইট
            </a>

        </div>

    </div>

</header>


<main>

<div class="container">

    <div class="page-title">

        <small>ADMIN PANEL</small>

        <h2>📢 নোটিশ ম্যানেজমেন্ট</h2>

    </div>


    <!-- FORM -->

    <div class="admin-card">

        <div class="form-title" id="formTitle">
            ➕ নতুন নোটিশ যোগ করুন
        </div>

        <form id="noticeForm">

            <div class="form-group">

                <label>নোটিশের শিরোনাম *</label>

                <input
                    type="text"
                    id="noticeTitle"
                    placeholder="যেমন: পরীক্ষার সময়সূচি প্রকাশ"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>নোটিশের তারিখ *</label>

                    <input
                        type="date"
                        id="noticeDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>PDF ফাইল</label>

                    <div class="file-box">

                        <input
                            type="file"
                            id="noticePdf"
                            accept="application/pdf,.pdf"
                        >

                        <div class="file-note">
                            শুধুমাত্র PDF • সর্বোচ্চ 10MB
                        </div>

                    </div>

                </div>

            </div>


            <div class="form-group">

                <label>নোটিশের বিস্তারিত</label>

                <textarea
                    id="noticeDescription"
                    placeholder="নোটিশের বিস্তারিত লিখুন..."
                ></textarea>

            </div>


            <div class="button-row">

                <button
                    type="submit"
                    class="btn btn-save"
                    id="saveBtn"
                >
                    💾 নোটিশ সংরক্ষণ করুন
                </button>

                <button
                    type="button"
                    class="btn btn-cancel"
                    id="cancelBtn"
                    onclick="cancelEdit()"
                >
                    বাতিল
                </button>

            </div>

            <div id="formMessage" class="message"></div>

        </form>

    </div>


    <!-- LIST -->

    <div class="list-title">

        <h2>📋 প্রকাশিত নোটিশ</h2>

        <span class="notice-count" id="noticeCount">
            ০ টি
        </span>

    </div>


    <div id="noticeContainer">

        <div class="loading">
            নোটিশ লোড হচ্ছে...
        </div>

    </div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==================================================
   SUPABASE
   ================================================== */

const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let editingId = null;


/* ==================================================
   LOGIN CHECK
   ================================================== */

async function checkAdmin(){

    const {
        data:{
            session
        }
    } = await supabaseClient.auth.getSession();

    if(session){

        document
        .getElementById("loginScreen")
        .classList.add("hidden");

        loadNotices();

    }else{

        document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    }

}


/* ==================================================
   LOGIN
   ================================================== */

async function adminLogin(){

    const email =
        document.getElementById("loginEmail")
        .value.trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    const error =
        document.getElementById("loginError");

    error.textContent = "";

    if(!email || !password){

        error.textContent =
            "Email এবং Password দিন।";

        return;

    }

    const {
        error:loginError
    } =
    await supabaseClient.auth.signInWithPassword({

        email:email,
        password:password

    });

    if(loginError){

        error.textContent =
            loginError.message;

        return;

    }

    document
    .getElementById("loginScreen")
    .classList.add("hidden");

    loadNotices();

}


/* ==================================================
   LOGOUT
   ================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


/* ==================================================
   LOAD
   ================================================== */

async function loadNotices(){

    const container =
        document.getElementById("noticeContainer");

    container.innerHTML =
        `<div class="loading">
            নোটিশ লোড হচ্ছে...
        </div>`;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("notices")
        .select("*")
        .order("notice_date",{ascending:false})
        .order("created_at",{ascending:false});


    if(error){

        container.innerHTML =
        `<div class="empty">
            ❌ নোটিশ লোড করা যায়নি।<br><br>
            ${escapeHtml(error.message)}
        </div>`;

        return;

    }


    document.getElementById("noticeCount")
        .textContent =
        data.length.toLocaleString("bn-BD") + " টি";


    if(!data.length){

        container.innerHTML =
        `<div class="empty">
            📭 এখনো কোনো নোটিশ প্রকাশ করা হয়নি।
        </div>`;

        return;

    }


    container.innerHTML =
        data.map(createNoticeHTML).join("");

}


/* ==================================================
   NOTICE HTML
   ================================================== */

function createNoticeHTML(notice){

    let pdf = "";

    if(notice.pdf_url){

        pdf = `
            <a
                class="action-btn pdf-btn"
                href="${escapeAttribute(notice.pdf_url)}"
                target="_blank"
                rel="noopener"
            >
                📄 PDF দেখুন
            </a>
        `;

    }


    return `

    <div class="notice-card">

        <div class="notice-top">

            <div class="notice-info">

                <span class="notice-date">
                    📅 ${formatDate(notice.notice_date)}
                </span>

                <h3>
                    ${escapeHtml(notice.title)}
                </h3>

                ${
                    notice.description
                    ?
                    `<div class="notice-description">
                        ${escapeHtml(notice.description)}
                    </div>`
                    :
                    ""
                }

            </div>

            <div class="notice-actions">

                ${pdf}

                <button
                    class="action-btn edit-btn"
                    onclick="editNotice(${notice.id})"
                >
                    ✏️ Edit
                </button>

                <button
                    class="action-btn delete-btn"
                    onclick="deleteNotice(${notice.id})"
                >
                    🗑️ Delete
                </button>

            </div>

        </div>

    </div>

    `;

}


/* ==================================================
   SAVE
   ================================================== */

document
.getElementById("noticeForm")
.addEventListener("submit",async function(e){

    e.preventDefault();


    const title =
        document.getElementById("noticeTitle")
        .value.trim();

    const description =
        document.getElementById("noticeDescription")
        .value.trim();

    const noticeDate =
        document.getElementById("noticeDate")
        .value;

    const file =
        document.getElementById("noticePdf")
        .files[0];


    if(file){

        if(file.type !== "application/pdf"){

            showMessage(
                "শুধু PDF ফাইল দেওয়া যাবে।",
                "error"
            );

            return;

        }

        if(file.size > 10 * 1024 * 1024){

            showMessage(
                "PDF সর্বোচ্চ 10MB হতে পারবে।",
                "error"
            );

            return;

        }

    }


    const saveBtn =
        document.getElementById("saveBtn");

    saveBtn.disabled = true;
    saveBtn.textContent = "⏳ সংরক্ষণ হচ্ছে...";


    try{

        let pdfUrl = null;
        let pdfPath = null;


        /* EDIT */

        if(editingId){

            const {
                data:oldNotice,
                error:oldError
            } =
            await supabaseClient
                .from("notices")
                .select("*")
                .eq("id",editingId)
                .single();


            if(oldError)
                throw oldError;


            pdfUrl = oldNotice.pdf_url;
            pdfPath = oldNotice.pdf_path;


            if(file){

                if(oldNotice.pdf_path){

                    await supabaseClient
                        .storage
                        .from("notice-pdfs")
                        .remove([oldNotice.pdf_path]);

                }


                const path =
                    createPdfPath(file);


                const {
                    error:uploadError
                } =
                await supabaseClient
                    .storage
                    .from("notice-pdfs")
                    .upload(
                        path,
                        file,
                        {
                            contentType:"application/pdf",
                            upsert:false
                        }
                    );


                if(uploadError)
                    throw uploadError;


                const {
                    data:publicData
                } =
                supabaseClient
                    .storage
                    .from("notice-pdfs")
                    .getPublicUrl(path);


                pdfUrl = publicData.publicUrl;
                pdfPath = path;

            }


            const {
                error:updateError
            } =
            await supabaseClient
                .from("notices")
                .update({

                    title:title,

                    description:
                        description || null,

                    notice_date:
                        noticeDate,

                    pdf_url:
                        pdfUrl,

                    pdf_path:
                        pdfPath,

                    updated_at:
                        new Date().toISOString()

                })
                .eq("id",editingId);


            if(updateError)
                throw updateError;


            showMessage(
                "নোটিশ সফলভাবে আপডেট হয়েছে।",
                "success"
            );

        }


        /* NEW */

        else{

            if(file){

                const path =
                    createPdfPath(file);


                const {
                    error:uploadError
                } =
                await supabaseClient
                    .storage
                    .from("notice-pdfs")
                    .upload(
                        path,
                        file,
                        {
                            contentType:"application/pdf",
                            upsert:false
                        }
                    );


                if(uploadError)
                    throw uploadError;


                const {
                    data:publicData
                } =
                supabaseClient
                    .storage
                    .from("notice-pdfs")
                    .getPublicUrl(path);


                pdfUrl =
                    publicData.publicUrl;

                pdfPath =
                    path;

            }


            const {
                error:insertError
            } =
            await supabaseClient
                .from("notices")
                .insert({

                    title:title,

                    description:
                        description || null,

                    notice_date:
                        noticeDate,

                    pdf_url:
                        pdfUrl,

                    pdf_path:
                        pdfPath

                });


            if(insertError)
                throw insertError;


            showMessage(
                "নতুন নোটিশ সফলভাবে প্রকাশ হয়েছে।",
                "success"
            );

        }


        resetForm();
        loadNotices();


    }catch(error){

        console.error(error);

        showMessage(
            "সমস্যা হয়েছে: " + error.message,
            "error"
        );

    }


    saveBtn.disabled = false;

    saveBtn.textContent =
        editingId
        ?
        "💾 পরিবর্তন সংরক্ষণ করুন"
        :
        "💾 নোটিশ সংরক্ষণ করুন";

});


/* ==================================================
   PDF PATH
   ================================================== */

function createPdfPath(file){

    const random =
        Math.random()
        .toString(36)
        .substring(2,10);

    return `
        notices/${Date.now()}_${random}.pdf
    `.replace(/\s/g,"");

}


/* ==================================================
   EDIT
   ================================================== */

async function editNotice(id){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("notices")
        .select("*")
        .eq("id",id)
        .single();


    if(error){

        alert("নোটিশ পাওয়া যায়নি।");
        return;

    }


    editingId = id;


    document.getElementById("noticeTitle")
        .value = data.title || "";

    document.getElementById("noticeDescription")
        .value = data.description || "";

    document.getElementById("noticeDate")
        .value = data.notice_date || "";


    document.getElementById("formTitle")
        .textContent =
        "✏️ নোটিশ এডিট করুন";


    document.getElementById("saveBtn")
        .textContent =
        "💾 পরিবর্তন সংরক্ষণ করুন";


    document.getElementById("cancelBtn")
        .style.display =
        "inline-block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==================================================
   DELETE
   ================================================== */

async function deleteNotice(id){

    if(!confirm(
        "এই নোটিশটি কি Delete করতে চান?"
    )) return;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("notices")
            .select("pdf_path")
            .eq("id",id)
            .single();


        if(error)
            throw error;


        if(data.pdf_path){

            await supabaseClient
                .storage
                .from("notice-pdfs")
                .remove([data.pdf_path]);

        }


        const {
            error:deleteError
        } =
        await supabaseClient
            .from("notices")
            .delete()
            .eq("id",id);


        if(deleteError)
            throw deleteError;


        loadNotices();


    }catch(error){

        alert(
            "Delete করতে সমস্যা হয়েছে:\n" +
            error.message
        );

    }

}

/* ==================================================
   HELPERS
   ================================================== */

function formatDate(date){

    if(!date) return "";

    return new Date(
        date + "T00:00:00"
    ).toLocaleDateString(
        "bn-BD",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

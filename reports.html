<script>/* MNQ access guard (inline) */
/* =========================================================
   মাদরাসায়ে নূরুল কুরআন — Shared Access Guard
   সব পেজের <head> এর একদম শুরুতে লোড হয়:
   (এই কোড প্রতিটি পেজের <head> এ inline বসানো আছে)
   - Admin   : সব পেজ
   - Teacher : শুধু dashboard + allowed_pages (hub/settings বন্ধ)
   - Student : শুধু student-dashboard, payment-receipt, invoice
   নতুন পেজ বানালে কিছু করতে হবে না; Teacher-কে access দিতে
   teacher-access পেজ থেকে পেজের নাম (যেমন: students) যোগ করুন।
   ========================================================= */
(function () {
  "use strict";
  window.MNQ_GUARD_VERSION = "20261116b";

  /* ---------------------------------------------------------
     Teacher session shim
     Teacher login RPC দিয়ে হয়, Supabase Auth session তৈরি হয় না।
     কিন্তু বেশিরভাগ পেজ getSession() খালি দেখলে login এ ফেরত পাঠায়।
     তাই শুধু Teacher হলে getSession()/getUser() এ "teacher session"
     দেখানো হয়। (Admin/Student এ কিছুই বদলায় না।)
     supabase-js CDN <script> এর ঠিক পরে mnqPatchSupabase() চালাতে হয়।
     --------------------------------------------------------- */
  window.mnqPatchSupabase = function () {
    try {
      if ((sessionStorage.getItem("madrasa_login_role") || "").toLowerCase() !== "teacher") return;
      var sb = window.supabase;
      if (!sb || typeof sb.createClient !== "function" || sb.__mnqPatched) return;
      var t = {};
      try { t = JSON.parse(sessionStorage.getItem("madrasa_teacher_login") || "{}") || {}; } catch (e) {}
      var user = {
        id: String(t.id || t.teacher_id || t.phone || "teacher"),
        email: t.email || "",
        role: "authenticated",
        aud: "authenticated",
        app_metadata: { role: "teacher" },
        user_metadata: { role: "teacher", name: t.name || "" }
      };
      var fake = {
        access_token: "teacher-session", refresh_token: "", token_type: "bearer",
        expires_in: 86400, expires_at: Math.floor(Date.now() / 1000) + 86400, user: user
      };
      var orig = sb.createClient;
      var wrapped = function () {
        var c = orig.apply(this, arguments);
        try {
          var a = c.auth, rs = a.getSession.bind(a), ru = a.getUser.bind(a), ro = a.onAuthStateChange.bind(a);
          a.getSession = async function () {
            var r = await rs();
            return (r && r.data && r.data.session) ? r : { data: { session: fake }, error: null };
          };
          a.getUser = async function () {
            var r = await ru();
            return (r && r.data && r.data.user) ? r : { data: { user: user }, error: null };
          };
          a.onAuthStateChange = function (cb) {
            return ro(function (ev, s) { return cb(ev, s || fake); });
          };
        } catch (e) { console.warn("teacher shim:", e); }
        return c;
      };
      var copy = {};
      Object.keys(sb).forEach(function (k) { copy[k] = sb[k]; });
      copy.createClient = wrapped;
      copy.__mnqPatched = true;
      window.supabase = copy;
    } catch (e) { console.warn("mnqPatchSupabase:", e); }
  };

  var PUBLIC = ["", "index", "login", "login-teacher", "students-login", "online-admission-public"];
  var TEACHER_BLOCKED = ["donations-hub", "accounts-hub", "settings-hub", "settings", "teacher-access", "admin"];
  var STUDENT_ALLOWED = ["student-dashboard", "payment-receipt", "invoice", "students-login"];

  function keyFor(url) {
    return String(url || "").split(/[?#]/)[0].split("/").pop().toLowerCase().replace(/\.html$/, "");
  }
  function read(k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return null; } }

  var current = keyFor(location.pathname) || "index";
  if (PUBLIC.indexOf(current) > -1) return;

  var role = (sessionStorage.getItem("madrasa_login_role") || "").toLowerCase();
  var isStudent = !!sessionStorage.getItem("madrasa_student_login") && role !== "admin" && role !== "teacher";

  if (role === "admin") return;                       // Admin = সব

  if (!role && !isStudent) {                          // লগইন নেই
    location.replace("login.html");
    return;
  }

  var allowed = {};
  if (role === "teacher") {
    var t = read("madrasa_teacher_login") || {};
    (Array.isArray(t.allowed_pages) ? t.allowed_pages : []).forEach(function (p) {
      p = keyFor(p); if (p) allowed[p] = 1;
    });
  }

  function can(url) {
    var k = keyFor(url);
    if (!k) return true;
    if (isStudent) return STUDENT_ALLOWED.indexOf(k) > -1;
    if (TEACHER_BLOCKED.indexOf(k) > -1) return false;
    if (k === "teacher-dashboard") return true;      /* শিক্ষকের নিজস্ব ড্যাশবোর্ড */
    if (k === "dashboard" || k === "student-dashboard") return false;  /* admin dashboard শিক্ষকের জন্য নয় */
    return !!allowed[k] || !!allowed["*"];
  }

  var home = isStudent ? "student-dashboard.html" : "teacher-dashboard.html";

  /* সরাসরি URL দিয়ে ঢোকা আটকানো */
  if (!can(current)) {
    document.documentElement.style.visibility = "hidden";
    location.replace(home);
    return;
  }

  /* লুকানোর CSS (পেজ আঁকার আগেই) */
  var st = document.createElement("style");
  st.textContent = 'html body [data-denied="1"],html body a[data-denied="1"]{display:none!important;visibility:hidden!important;pointer-events:none!important}';
  document.documentElement.appendChild(st);

  var SD_MAP = { sms: "sms", stu: "students", inv: "invoice", pay: "payment-receipt" };

  function deny(el) {
    el.setAttribute("data-denied", "1");
    el.setAttribute("aria-hidden", "true");
    el.setAttribute("tabindex", "-1");
    /* inline !important — পেজের নিজের CSS যেন ওভাররাইড করতে না পারে */
    el.style.setProperty("display", "none", "important");
  }

  function sweep() {
    document.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href") || "";
      if (!/\.html(?:[?#]|$)/i.test(h)) return;
      if (!isStudent && keyFor(h) === "dashboard") { a.setAttribute("href", "teacher-dashboard.html"); return; }
      if (!can(h)) deny(a);
    });
    /* onclick="location.href='x.html'" ধরনের বাটন/কার্ড */
    document.querySelectorAll("[onclick*='.html']").forEach(function (el) {
      var m = /([A-Za-z0-9_\-]+\.html)/.exec(el.getAttribute("onclick") || "");
      if (m && !can(m[1])) deny(el);
    });
    document.querySelectorAll("[data-href],[data-url]").forEach(function (el) {
      var u = el.getAttribute("data-href") || el.getAttribute("data-url") || "";
      if (/\.html/i.test(u) && !can(u)) deny(el);
    });
    document.querySelectorAll(".sd .opt").forEach(function (b) {
      var k = SD_MAP[b.dataset.a];
      if (k && !can(k)) deny(b);
    });
    /* খালি গ্রুপ লুকানো */
    document.querySelectorAll(".nav-group, .bottom-nav-group").forEach(function (g) {
      var l = g.querySelectorAll("a[href]");
      if (l.length && Array.prototype.every.call(l, function (a) { return a.getAttribute("data-denied") === "1"; }))
        g.style.setProperty("display", "none", "important");
    });
  }


  /* ডিবাগ: যেকোনো পেজের URL এর শেষে ?guarddebug দিলে নিচে একটা বার্তা আসবে */
  if (/[?&]guarddebug/.test(location.search)) {
    document.addEventListener("DOMContentLoaded", function () {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;left:6px;right:6px;top:6px;z-index:2147483647;background:#111;color:#0f0;font:12px monospace;padding:8px;border-radius:8px;white-space:pre-wrap";
      d.textContent = "guard v" + window.MNQ_GUARD_VERSION + " | page=" + current + " | role=" + (role || (isStudent ? "student" : "none")) +
        " | allowed=" + Object.keys(allowed).join(",") +
        " | hidden=" + document.querySelectorAll('[data-denied="1"]').length;
      document.body.appendChild(d);
    });
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("[data-denied=\"1\"]");
    if (a) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  document.addEventListener("DOMContentLoaded", function () {
    sweep();
    var pending = false;
    new MutationObserver(function () {
      if (pending) return; pending = true;
      setTimeout(function () { pending = false; sweep(); }, 50);
    }).observe(document.body, { childList: true, subtree: true });
  });
})();

</script>

"⏳ শিক্ষার্থীর তথ্য খোঁজা হচ্ছে...",
"success"
);


try{


/* =====================================================
STUDENT
===================================================== */

const {
data:student,
error:studentError
} =
await supabaseClient

.from("students")

.select("*")

.eq("roll",roll)

.eq("student_id",studentId)

.maybeSingle();

throw studentError;

}

showMessage(
"❌ এই রোল ও শিক্ষার্থী আইডির কোনো তথ্য পাওয়া যায়নি।",
"error"
);

}


/* =====================================================
EXAMS
===================================================== */

const {
data:exams,
error:examError
} =
await supabaseClient

.from("report_exams")

.select("*")

.eq("status","published")

.order(
"created_at",
{
ascending:false
}
);

===================================================== */

}

/* =========================================================
LOAD REPORT
========================================================= */

async function loadReport(
examId,
studentDbId
){

if(!examId){

return;

}


const target =
document.getElementById(
"dynamicReport"
);


target.innerHTML=`

<div class="loading">
⏳ ফলাফল লোড হচ্ছে...
</div>

`;


try{


/* =====================================================
RESULTS
===================================================== */

const {
data:results,
error:resultError
} =
await supabaseClient

.from("report_results")

.select("*")

.eq("student_id",studentDbId)

.eq("exam_id",examId)

.order(
"id",
{
ascending:true
}
);


if(resultError){

throw resultError;

}


const resultRows =
results || [];


let totalMarks=0;

let obtainedMarks=0;


resultRows.forEach(row=>{

totalMarks +=
Number(
row.full_marks || 0
);

obtainedMarks +=
Number(
row.obtained_marks || 0
);

});


const percentage =
totalMarks > 0
?
(
obtainedMarks /
totalMarks *
100
).toFixed(2)
:
"0.00";


const grade =
calculateGrade(
Number(percentage)
);


/* =====================================================
RESULT ROWS
===================================================== */

let rows="";


if(resultRows.length){

rows =
resultRows.map(
(row,index)=>{

const full =
Number(
row.full_marks || 0
);


const obtained =
Number(
row.obtained_marks || 0
);


const subjectPercent =
full > 0
?
obtained /
full *
100
:
0;


return `

<tr>

<td>
${index+1}
</td>

<td>
${escapeHTML(
row.subject_name
)}
</td>

<td>
${full}
</td>

<td>
${obtained}
</td>

<td class="grade">

${calculateGrade(
subjectPercent
)}

</td>

</tr>

`;

}).join("");


}else{

rows=`

<tr>

<td colspan="5">

এই পরীক্ষার কোনো ফলাফল প্রকাশ করা হয়নি।

</td>

</tr>

`;

}


/* =====================================================
ATTENDANCE
===================================================== */

const {
data:attendance
} =
await supabaseClient

.from("report_attendance")

.select("*")

.eq("student_id",studentDbId);


const attendanceData =
attendance || [];


const totalDays =
attendanceData.length;


const present =
attendanceData.filter(
item =>
String(
item.status
).toLowerCase()
===
"present"
||
String(
item.status
).toLowerCase()
===
"presented"
||
String(
item.status
).includes("উপস্থিত")
).length;


const absent =
attendanceData.filter(
item =>
String(
item.status
).toLowerCase()
===
"absent"
||
String(
item.status
).includes("অনুপস্থিত")
).length;


const attendancePercent =
totalDays > 0
?
(
present /
totalDays *
100
).toFixed(1)
:
"0.0";



/* =====================================================
SHOW
===================================================== */

target.innerHTML=`


<h3 class="section-title">

📚 ${escapeHTML(
getSelectedExamName()
)}

</h3>



<div class="table-wrap">

<table>

<thead>

<tr>

<th>
ক্রম
</th>

<th>
বিষয়
</th>

<th>
পূর্ণমান
</th>

<th>
প্রাপ্ত নম্বর
</th>

<th>
গ্রেড
</th>

</tr>

</thead>


<tbody>

${rows}


${
resultRows.length
?
`

<tr class="total-row">

<td colspan="2">
মোট
</td>

<td>
${totalMarks}
</td>

<td>
${obtainedMarks}
</td>

<td>
${grade}
</td>

</tr>

`
:
""
}

</tbody>

</table>

</div>



<!-- SUMMARY -->

<div class="summary">


<div class="summary-box">

<span>
বিষয় সংখ্যা
</span>

<strong>
${resultRows.length}
</strong>

</div>


<div class="summary-box">

<span>
মোট নম্বর
</span>

<strong>
${totalMarks}
</strong>

</div>


<div class="summary-box">

<span>
প্রাপ্ত নম্বর
</span>

<strong>
${obtainedMarks}
</strong>

</div>


<div class="summary-box">

<span>
Percentage
</span>

<strong>
${percentage}%
</strong>

</div>


</div>



<h3 class="section-title">

📅 হাজিরা

</h3>



<div class="attendance-grid">


<div class="attendance-box">

<span>
মোট দিন
</span>

<strong>
${totalDays}
</strong>

</div>


<div class="attendance-box">

<span>
উপস্থিত
</span>

<strong>
${present}
</strong>

</div>


<div class="attendance-box">

<span>
অনুপস্থিত
</span>

<strong>
${absent}
</strong>

</div>


<div class="attendance-box">

<span>
উপস্থিতির হার
</span>

<strong>
${attendancePercent}%
</strong>

</div>


</div>



<button
class="print-btn"
onclick="window.print()">

🖨️ রিপোর্ট প্রিন্ট করুন

</button>

`;



}catch(error){

console.error(error);

target.innerHTML=`

<div class="message error">

❌ ফলাফল লোড করতে সমস্যা হয়েছে:

${escapeHTML(
error.message
)}

</div>

`;

}

}



/* =========================================================
SELECTED EXAM NAME
========================================================= */

function getSelectedExamName(){

const select =
document.getElementById(
"examSelect"
);

if(!select){

return "পরীক্ষার ফলাফল";

}

const option =
select.options[
select.selectedIndex
];

return option
?
option.textContent.trim()
:
"পরীক্ষার ফলাফল";

}



/* =========================================================
GRADE
========================================================= */

function calculateGrade(
percentage
){

if(percentage >= 80){

return "A+";

}

if(percentage >= 70){

return "A";

}

if(percentage >= 60){

return "A-";

}

if(percentage >= 50){

return "B";

}

if(percentage >= 40){

return "C";

}

if(percentage >= 33){

return "D";

}

return "F";

}



/* =========================================================
ESCAPE HTML
========================================================= */

function escapeHTML(value){

return String(value ?? "")

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


function escapeAttribute(value){

return escapeHTML(value);

}

if(e.key === "Enter"){

document

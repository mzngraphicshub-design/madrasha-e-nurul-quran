<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teachers | মাদরাসায়ে নূরুল কুরআন</title>
<style>
@font-face{font-family:Bornomala;src:url("./fonts/Bornomala-Regular.ttf") format("truetype");font-display:swap}
:root{--navy:#031a35;--navy2:#062b55;--blue:#0875df;--blue2:#18a0ff;--gold:#ffd447;--white:#fff;--text:#173452;--muted:#718399;--line:#dfeaf5;--shadow:0 20px 55px rgba(0,55,120,.12)}
*{box-sizing:border-box}
body{margin:0;font-family:Bornomala,Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#f3f8fd,#eaf4ff);min-height:100vh}
body:before{content:"";position:fixed;width:420px;height:420px;border-radius:50%;background:rgba(8,117,223,.10);filter:blur(100px);left:-180px;top:10%;z-index:-1}
body:after{content:"";position:fixed;width:380px;height:380px;border-radius:50%;background:rgba(255,212,71,.10);filter:blur(100px);right:-160px;bottom:5%;z-index:-1}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2),var(--blue));color:#fff;padding:18px 4%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 35px rgba(0,35,80,.18);position:sticky;top:0;z-index:20}
.top h2{margin:0;color:#fff;font-size:22px}
.top a{color:#fff;text-decoration:none;padding:10px 16px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(255,255,255,.08);transition:.3s}
.top a:hover{background:var(--gold);color:var(--navy);transform:translateY(-2px)}
.container{max-width:1150px;margin:30px auto;padding:0 18px}
.box{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);padding:26px;border-radius:22px;box-shadow:var(--shadow);margin-bottom:24px;backdrop-filter:blur(18px)}
.box h3{margin:0 0 22px;color:var(--navy);font-size:24px}
.box h3:after{content:"";display:block;width:55px;height:3px;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:5px;margin-top:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
label{display:block;font-weight:bold;font-size:14px;color:#244663}
input,textarea{width:100%;padding:13px 14px;margin-top:7px;border:1px solid #d5e3f0;border-radius:11px;font-size:14px;outline:none;background:#f9fcff;transition:.25s}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(8,117,223,.10);background:#fff}
textarea{resize:vertical}
button{border:0;border-radius:11px;padding:12px 18px;background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;font-weight:bold;cursor:pointer;transition:.3s;box-shadow:0 7px 20px rgba(8,117,223,.16)}
button:hover{transform:translateY(-2px);box-shadow:0 11px 25px rgba(8,117,223,.25)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.cancel{background:#718096;margin-left:7px}
.delete{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.action{padding:7px 11px;font-size:12px;margin:2px}
.search{margin-bottom:16px}
.table-wrap{overflow-x:auto;border-radius:15px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:13px 10px;border-bottom:1px solid #e9f0f7;text-align:left;font-size:14px}
th{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;white-space:nowrap}
tbody tr{transition:.2s}
tbody tr:hover{background:#f3f8ff}
#msg{margin-top:12px;min-height:20px;color:var(--blue)}
.loading{text-align:center;padding:24px!important;color:var(--muted)}
@media(max-width:650px){
.top{padding:15px}
.top h2{font-size:18px}
.top a{font-size:13px;padding:8px 10px}
.container{margin:18px auto;padding:0 12px}
.box{padding:19px;border-radius:18px}
.box h3{font-size:20px}
.form{grid-template-columns:1fr}
.full{grid-column:auto}
table{min-width:700px}
}
</style>
</head>
<body>
<header class="top">
<h2>👨‍🏫 Teacher Management</h2>
<a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">
<div class="box">
<h3 id="formTitle">➕ Add Teacher</h3>
<form id="teacherForm">
<input type="hidden" id="editId">

<div><label>Teacher Name *</label><input id="name" required placeholder="শিক্ষকের নাম"></div>
<div><label>Mobile</label><input id="phone" type="tel" placeholder="মোবাইল নম্বর"></div>
<div><label>Designation</label><input id="designation" placeholder="পদবি"></div>
<div><label>Subject</label><input id="subject" placeholder="বিষয়"></div>
<div class="full"><label>Address</label><textarea id="address" rows="2" placeholder="ঠিকানা"></textarea></div>

<div class="full">
<button type="submit" id="saveBtn">💾 Save Teacher</button>
<button type="button" class="cancel" id="cancelBtn" style="display:none">Cancel</button>
<div id="msg"></div>
</div>
</form>
</div>

<div class="box">
<h3>👨‍🏫 Teacher List</h3>
<input class="search" id="search" placeholder="🔍 নাম / মোবাইল দিয়ে খুঁজুন...">
<div class="table-wrap">
<table>
<thead><tr><th>নাম</th><th>মোবাইল</th><th>পদবি</th><th>বিষয়</th><th>ঠিকানা</th><th>Action</th></tr></thead>
<tbody id="teacherList"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody>
</table>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";
const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let teachers=[];

async function start(){
try{
const {data:{session}}=await db.auth.getSession();
if(!session){location.href="admin.html";return}
await loadTeachers();
}catch(error){
document.getElementById("teacherList").innerHTML=`<tr><td colspan="6">❌ ${escapeHtml(error.message)}</td></tr>`;
}}
async function loadTeachers(){
const tbody=document.getElementById("teacherList");
tbody.innerHTML=`<tr><td colspan="6" class="loading">Loading...</td></tr>`;
const {data,error}=await db.from("teachers").select("id,name,phone,designation,subject,address").order("created_at",{ascending:false});
if(error){tbody.innerHTML=`<tr><td colspan="6">❌ ${escapeHtml(error.message)}</td></tr>`;return}
teachers=data||[];render(teachers);
}
function render(list){
const tbody=document.getElementById("teacherList");
if(!list.length){tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:25px">কোনো Teacher নেই</td></tr>`;return}
tbody.innerHTML=list.map(t=>`<tr>
<td>${escapeHtml(t.name||"-")}</td><td>${escapeHtml(t.phone||"-")}</td>
<td>${escapeHtml(t.designation||"-")}</td><td>${escapeHtml(t.subject||"-")}</td>
<td>${escapeHtml(t.address||"-")}</td><td>
<button class="action" onclick="editTeacher('${t.id}')">✏️ Edit</button>
<button class="action delete" onclick="deleteTeacher('${t.id}')">🗑️ Delete</button>
</td></tr>`).join("");
}
document.getElementById("teacherForm").addEventListener("submit",async function(e){
e.preventDefault();
const editId=document.getElementById("editId").value;
const teacher={
name:document.getElementById("name").value.trim(),
phone:document.getElementById("phone").value.trim(),
designation:document.getElementById("designation").value.trim(),
subject:document.getElementById("subject").value.trim(),
address:document.getElementById("address").value.trim()
};
const msg=document.getElementById("msg"),saveBtn=document.getElementById("saveBtn");
msg.textContent="Saving...";saveBtn.disabled=true;
try{
let result;
if(editId)result=await db.from("teachers").update(teacher).eq("id",editId).select("id,name,phone,designation,subject,address").single();
else result=await db.from("teachers").insert(teacher).select("id,name,phone,designation,subject,address").single();
if(result.error){msg.textContent="❌ "+result.error.message;return}
if(editId){const index=teachers.findIndex(x=>String(x.id)===String(editId));if(index!==-1)teachers[index]=result.data}
else teachers.unshift(result.data);
render(teachers);msg.textContent="✅ Saved successfully";resetForm();
}catch(error){msg.textContent="❌ "+error.message}
finally{saveBtn.disabled=false}
});
function editTeacher(id){
const teacher=teachers.find(x=>String(x.id)===String(id));if(!teacher)return;
document.getElementById("editId").value=teacher.id;
document.getElementById("name").value=teacher.name||"";
document.getElementById("phone").value=teacher.phone||"";
document.getElementById("designation").value=teacher.designation||"";
document.getElementById("subject").value=teacher.subject||"";
document.getElementById("address").value=teacher.address||"";
document.getElementById("formTitle").textContent="✏️ Edit Teacher";
document.getElementById("saveBtn").textContent="💾 Update Teacher";
document.getElementById("cancelBtn").style.display="inline-block";
window.scrollTo({top:0,behavior:"smooth"});
}
async function deleteTeacher(id){
if(!confirm("এই Teacher-কে Delete করতে চান?"))return;
try{
const {error}=await db.from("teachers").delete().eq("id",id);
if(error){alert(error.message);return}
teachers=teachers.filter(t=>String(t.id)!==String(id));render(teachers);
}catch(error){alert(error.message)}
}
function resetForm(){
document.getElementById("teacherForm").reset();
document.getElementById("editId").value="";
document.getElementById("formTitle").textContent="➕ Add Teacher";
document.getElementById("saveBtn").textContent="💾 Save Teacher";
document.getElementById("cancelBtn").style.display="none";
}
document.getElementById("cancelBtn").onclick=resetForm;
document.getElementById("search").addEventListener("input",function(){
const q=this.value.toLowerCase().trim();
render(teachers.filter(t=>(t.name||"").toLowerCase().includes(q)||(t.phone||"").toLowerCase().includes(q)));
});
function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
start();
</script>
</body>
</html>

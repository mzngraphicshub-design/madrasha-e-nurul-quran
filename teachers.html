<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Teachers | মাদরাসায়ে নূরুল কুরআন</title>

<link
href="https://banglawebfonts.pages.dev/css/bornomala.css"
rel="stylesheet"
>

<style>

/* =========================
   GLOBAL
========================= */

*{
    box-sizing:border-box;
}

:root{
    --primary:#0d47a1;
    --primary2:#1976d2;
    --dark:#083b82;

    --light:#e3f2fd;
    --bg:#f4f7fb;

    --white:#fff;

    --text:#1e293b;
    --muted:#64748b;

    --border:#e2e8f0;

    --danger:#dc2626;
    --danger-light:#fee2e2;

    --success:#15803d;

    --shadow:#0d47a115;
}

body{
    margin:0;

    font-family:
    "Bornomala",
    "Bornomala-Regular",
    serif;

    background:var(--bg);

    color:var(--text);
}


/* =========================
   TOPBAR
========================= */

.topbar{
    background:
    linear-gradient(
        135deg,
        #0d47a1,
        #1976d2
    );

    color:#fff;

    min-height:72px;

    padding:14px 28px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    position:sticky;

    top:0;

    z-index:100;

    box-shadow:
    0 3px 15px #0002;
}

.brand-title{
    font-size:21px;
    font-weight:800;
}

.brand-sub{
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:1px;
    opacity:.8;
}

.top-right{
    display:flex;
    align-items:center;
    gap:9px;
}

.dashboard-link{
    color:#fff;

    background:#ffffff20;

    border:1px solid #ffffff35;

    padding:9px 14px;

    border-radius:8px;

    text-decoration:none;

    font-weight:700;

    transition:.2s;
}

.dashboard-link:hover{
    background:#fff;
    color:var(--primary);
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:1250px;

    margin:26px auto;

    padding:
    0 18px 50px;
}


/* =========================
   BOX
========================= */

.box{
    background:#fff;

    border:
    1px solid var(--border);

    border-radius:15px;

    padding:23px;

    margin-bottom:20px;

    box-shadow:
    0 3px 15px #0d47a110;
}

.box-header{
    margin-bottom:19px;
}

.box-title{
    font-size:20px;
    font-weight:800;
    color:var(--primary);
}

.box-description{
    font-size:13px;
    color:var(--muted);
    margin-top:4px;
}


/* =========================
   FORM
========================= */

.form-grid{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:16px;
}

.full{
    grid-column:1/-1;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
}

input,
textarea{
    width:100%;

    border:
    1px solid #d5dce6;

    border-radius:9px;

    padding:
    11px 13px;

    font-family:
    "Bornomala",
    serif;

    font-size:14px;

    outline:none;

    background:#fff;

    color:var(--text);

    transition:.2s;
}

input:focus,
textarea:focus{
    border-color:var(--primary2);

    box-shadow:
    0 0 0 3px #1976d215;
}

textarea{
    resize:vertical;
}


/* =========================
   BUTTONS
========================= */

.buttons{
    display:flex;

    gap:9px;

    flex-wrap:wrap;
}

button{
    border:0;

    border-radius:9px;

    padding:10px 17px;

    font-family:
    "Bornomala",
    serif;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.btn-primary{
    background:
    linear-gradient(
        135deg,
        #0d47a1,
        #1976d2
    );

    color:#fff;
}

.btn-secondary{
    background:#eef2f7;
    color:#374151;
}

.btn-danger{
    background:var(--danger-light);
    color:#b91c1c;
}

.btn-edit{
    background:#e3f2fd;
    color:#0d47a1;
}

.btn-print{
    background:#1976d2;
    color:#fff;
}

.btn-print-all{
    background:#0d47a1;
    color:#fff;
}

.action-buttons{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.action-buttons button{
    padding:6px 9px;
    font-size:11px;
}


/* =========================
   MESSAGE
========================= */

#msg{
    min-height:22px;
    margin-top:12px;
    font-size:13px;
    font-weight:600;
}

.success{
    color:var(--success);
}

.error{
    color:#c62828;
}


/* =========================
   SEARCH
========================= */

.search-row{
    display:grid;

    grid-template-columns:
    1fr auto auto;

    gap:10px;

    margin-bottom:16px;
}

.search{
    width:100%;
}


/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;

    border:
    1px solid var(--border);

    border-radius:11px;
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:900px;
}

th{
    background:
    linear-gradient(
        135deg,
        #0d47a1,
        #1976d2
    );

    color:#fff;

    padding:
    13px 11px;

    font-size:13px;

    text-align:left;

    white-space:nowrap;
}

td{
    padding:
    12px 11px;

    border-bottom:
    1px solid #edf0f5;

    font-size:13px;

    vertical-align:middle;
}

tbody tr:hover td{
    background:#f7faff;
}

.loading{
    text-align:center;

    padding:
    30px!important;

    color:var(--muted);
}


/* =========================
   PRINT AREA
========================= */

#printArea{
    display:none;
}


/* =========================
   PRINT
========================= */

@media print{

    body{
        background:#fff;
    }

    body *{
        visibility:hidden;
    }

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{
        display:block;

        position:absolute;

        left:0;
        top:0;

        width:100%;

        background:#fff;

        color:#000;

        padding:10mm;
    }

    .print-header{
        text-align:center;

        border-bottom:
        2px solid #000;

        padding-bottom:10px;

        margin-bottom:15px;
    }

    .print-header h1{
        margin:0;
        font-size:24px;
    }

    .print-header p{
        margin:4px 0;

        font-family:Arial,sans-serif;

        font-size:12px;
    }

    .print-title{
        text-align:center;

        font-size:18px;

        font-weight:800;

        margin:15px 0;
    }

    .print-table{
        width:100%;

        border-collapse:collapse;

        font-size:11px;
    }

    .print-table th,
    .print-table td{
        border:
        1px solid #000;

        padding:7px;

        text-align:left;
    }

    .print-table th{
        background:#eee!important;
        color:#000!important;
    }

    .single-teacher{
        width:100%;
        max-width:750px;
        margin:auto;
    }

    .single-info{
        width:100%;

        border-collapse:collapse;

        margin-top:20px;
    }

    .single-info td{
        border:
        1px solid #222;

        padding:10px;

        font-size:13px;
    }

    .single-info td:first-child{
        width:30%;

        font-weight:700;

        background:#f2f2f2;
    }

    .print-footer{
        margin-top:40px;

        display:flex;

        justify-content:space-between;

        font-size:12px;
    }

    @page{
        size:A4;
        margin:10mm;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .topbar{
        padding:13px 16px;
    }

    .brand-title{
        font-size:18px;
    }

    .container{
        margin:18px auto;

        padding:
        0 12px 40px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .box{
        padding:17px;
    }

    .search-row{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .top-right{
        width:100%;
    }

    .dashboard-link{
        width:100%;
        text-align:center;
    }
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

<div>

<div class="brand-title">
📚 মাদরাসায়ে নূরুল কুরআন
</div>

<div class="brand-sub">
TEACHER MANAGEMENT SYSTEM
</div>

</div>


<div class="top-right">

<a
href="dashboard.html"
class="dashboard-link"
>
← Dashboard
</a>

</div>

</header>



<main class="container">


<!-- =========================
     ADD / EDIT TEACHER
========================= -->

<section class="box">

<div class="box-header">

<div
class="box-title"
id="formTitle"
>
➕ Add Teacher
</div>

<div class="box-description">
শিক্ষকদের তথ্য সংরক্ষণ, সম্পাদনা ও ব্যবস্থাপনা
</div>

type="hidden"

শিক্ষকের নাম *

id="name"

id="phone"

<!-- =========================
     TEACHER LIST
========================= -->

<section class="box">

<div class="box-header">

<div class="box-title">
👨‍🏫 Teacher List
</div>

</div>

id="search"

<div class="table-wrap">

<table>

<tr>

<th>

</th>

<th>
মোবাইল
</th>

<th>
পদবি
</th>

<th>
বিষয়
</th>

<th>
ঠিকানা
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody id="teacherList">

<tr>

<td
colspan="6"
class="loading"
>
Loading...
</td>

</tr>

</section>


</main>



<!-- =========================
     PRINT AREA
========================= -->

<div id="printArea"></div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";


const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let teachers = [];



/* =========================
   AUTH
========================= */

async function start(){

    try{

        const {
            data:{session},
            error
        } =
        await db.auth.getSession();


        if(error)
            throw error;


        if(!session){

            location.href =
            "admin.html";

            return;

        }


        await loadTeachers();

    }

    catch(error){

        document.getElementById(
            "teacherList"
        ).innerHTML = `

        <tr>

        <td
        colspan="6"
        class="loading"
        >

        ❌
        ${escapeHtml(
            error.message
        )}

        </td>

        </tr>

        `;

    }

}



/* =========================
   AUTH STATE
========================= */

db.auth.onAuthStateChange(
(event,session)=>{

    if(!session){

        location.href =
        "admin.html";

    }

});



/* =========================
   LOAD
========================= */

async function loadTeachers(){

    const tbody =
    document.getElementById(
        "teacherList"
    );


    tbody.innerHTML = `

    <tr>

    <td
    colspan="6"
    class="loading"
    >

    Loading...

    </td>

    </tr>

    `;


    const {
        data,
        error
    } =
    await db
    .from("teachers")
    .select(`
        id,
        name,
        phone,
        designation,
        subject,
        address,
        created_at
    `)
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        tbody.innerHTML = `

        <tr>

        <td
        colspan="6"
        class="loading"
        >

        ❌
        ${escapeHtml(
            error.message
        )}

        </td>

        </tr>

        `;

        return;

    }


    teachers =
    data || [];


    render(teachers);

}



/* =========================
   RENDER
========================= */

function render(list){

    const tbody =
    document.getElementById(
        "teacherList"
    );


    if(!list.length){

        tbody.innerHTML = `

        <tr>

        <td
        colspan="6"
        class="loading"
        >

        👨‍🏫
        কোনো Teacher পাওয়া যায়নি

        </td>

        </tr>

        `;

        return;

    }


    tbody.innerHTML =
    list.map(
        t=>`

        <tr>

        <td>

        <strong>
        ${escapeHtml(
            t.name || "-"
        )}
        </strong>

        </td>


        <td>
        ${escapeHtml(
            t.phone || "-"
        )}
        </td>


        <td>
        ${escapeHtml(
            t.designation || "-"
        )}
        </td>


        <td>
        ${escapeHtml(
            t.subject || "-"
        )}
        </td>


        <td>
        ${escapeHtml(
            t.address || "-"
        )}
        </td>


        <td>

        <div
        class="action-buttons"
        >

        <button
        class="btn-edit"
        onclick="
        editTeacher('${escapeHtml(
            t.id
        )}')
        "
        >
        ✏ Edit
        </button>


        <button
        class="btn-print"
        onclick="
        printSingleTeacher('${escapeHtml(
            t.id
        )}')
        "
        >
        🖨
        </button>


        <button
        class="btn-danger"
        onclick="
        deleteTeacher('${escapeHtml(
            t.id
        )}')
        "
        >
        🗑
        </button>

        </div>

        </td>

        </tr>

        `
    ).join("");

}



/* =========================
   SAVE
========================= */

document
.getElementById(
    "teacherForm"
)
.addEventListener(
    "submit",
    async e=>{

        e.preventDefault();


        const editId =
        document.getElementById(
            "editId"
        ).value;


        const teacher = {

            name:
            document.getElementById(
                "name"
            ).value.trim(),

            phone:
            document.getElementById(
                "phone"
            ).value.trim(),

            designation:
            document.getElementById(
                "designation"
            ).value.trim(),

            subject:
            document.getElementById(
                "subject"
            ).value.trim(),

            address:
            document.getElementById(
                "address"
            ).value.trim()

        };


        if(!teacher.name){

            showMessage(
                "শিক্ষকের নাম দিন।",
                "error"
            );

            return;

        }


        const msg =
        document.getElementById(
            "msg"
        );


        const saveBtn =
        document.getElementById(
            "saveBtn"
        );


        saveBtn.disabled =
        true;


        msg.className =
        "message";


        msg.textContent =
        "Saving...";


        try{

            let result;


            /* UPDATE */

            if(editId){

                result =
                await db
                .from("teachers")
                .update(teacher)
                .eq(
                    "id",
                    editId
                )
                .select(`
                    id,
                    name,
                    phone,
                    designation,
                    subject,
                    address,
                    created_at
                `)
                .single();

            }


            /* INSERT */

            else{

                result =
                await db
                .from("teachers")
                .insert(teacher)
                .select(`
                    id,
                    name,
                    phone,
                    designation,
                    subject,
                    address,
                    created_at
                `)
                .single();

            }


            if(result.error)
                throw result.error;


            if(editId){

                const index =
                teachers.findIndex(
                    x =>
                    String(x.id) ===
                    String(editId)
                );


                if(index !== -1)
                    teachers[index] =
                    result.data;

            }


            else{

                teachers.unshift(
                    result.data
                );

            }


            render(teachers);


            msg.className =
            "message success";


            msg.textContent =
            editId
            ? "Teacher updated successfully."
            : "Teacher added successfully.";


            setTimeout(
                resetForm,
                800
            );

        }

        catch(error){

            msg.className =
            "message error";


            msg.textContent =
            error.message;

        }

        finally{

            saveBtn.disabled =
            false;

        }

    }
);



/* =========================
   EDIT
========================= */

function editTeacher(id){

    const teacher =
    teachers.find(
        x =>
        String(x.id) ===
        String(id)
    );


    if(!teacher)
        return;


    document.getElementById(
        "editId"
    ).value =
    teacher.id;


    document.getElementById(
        "name"
    ).value =
    teacher.name || "";


    document.getElementById(
        "phone"
    ).value =
    teacher.phone || "";


    document.getElementById(
        "designation"
    ).value =
    teacher.designation || "";


    document.getElementById(
        "subject"
    ).value =
    teacher.subject || "";


    document.getElementById(
        "address"
    ).value =
    teacher.address || "";


    document.getElementById(
        "formTitle"
    ).textContent =
    "✏ Edit Teacher";


    document.getElementById(
        "saveBtn"
    ).textContent =
    "💾 Update Teacher";


    document.getElementById(
        "cancelBtn"
    ).style.display =
    "inline-block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =========================
   DELETE
========================= */

async function deleteTeacher(id){

    const teacher =
    teachers.find(
        x =>
        String(x.id) ===
        String(id)
    );


    if(!teacher)
        return;


    const ok =
    confirm(
        "“"+
        (teacher.name || "Teacher")+
        "” কে Delete করতে চান?"
    );


    if(!ok)
        return;


    try{

        const {
            error
        } =
        await db
        .from("teachers")
        .delete()
        .eq(
            "id",
            id
        );


        if(error)
            throw error;


        teachers =
        teachers.filter(
            t =>
            String(t.id) !==
            String(id)
        );


        render(teachers);


        alert(
            "Teacher successfully deleted."
        );

    }

    catch(error){

        alert(
            error.message
        );

    }

}



/* =========================
   RESET
========================= */

function resetForm(){

    document
    .getElementById(
        "teacherForm"
    )
    .reset();


    document.getElementById(
        "editId"
    ).value = "";


    document.getElementById(
        "formTitle"
    ).textContent =
    "➕ Add Teacher";


    document.getElementById(
        "saveBtn"
    ).textContent =
    "💾 Save Teacher";


    document.getElementById(
        "cancelBtn"
    ).style.display =
    "none";


    document.getElementById(
        "msg"
    ).textContent = "";

}


document
.getElementById(
    "cancelBtn"
)
.onclick =
resetForm;



/* =========================
   SEARCH
========================= */

document
.getElementById(
    "search"
)
.addEventListener(
    "input",
    function(){

        const q =
        this.value
        .toLowerCase()
        .trim();


        const filtered =
        teachers.filter(
            t =>

            String(
                t.name || ""
            )
            .toLowerCase()
            .includes(q)

            ||

            String(
                t.phone || ""
            )
            .toLowerCase()
            .includes(q)

            ||

            String(
                t.designation || ""
            )
            .toLowerCase()
            .includes(q)

            ||

            String(
                t.subject || ""
            )
            .toLowerCase()
            .includes(q)

        );


        render(filtered);

    }
);



/* =========================
   PRINT LIST
========================= */

function printTeachers(
    list,
    title
){

    if(!list.length){

        alert(
            "Print করার জন্য কোনো Teacher পাওয়া যায়নি।"
        );

        return;

    }


    const rows =
    list.map(
        (t,index)=>`

        <tr>

        <td>
        ${index+1}
        </td>

        <td>
        ${escapeHtml(
            t.name || "-"
        )}
        </td>

        <td>
        ${escapeHtml(
            t.phone || "-"
        )}
        </td>

        <td>
        ${escapeHtml(
            t.designation || "-"
        )}
        </td>

        <td>
        ${escapeHtml(
            t.subject || "-"
        )}
        </td>

        <td>
        ${escapeHtml(
            t.address || "-"
        )}
        </td>

        </tr>

        `
    ).join("");


    document.getElementById(
        "printArea"
    ).innerHTML = `

    <div class="print-header">

        <h1>
        মাদরাসায়ে নূরুল কুরআন
        </h1>

        <p>
        TEACHER MANAGEMENT SYSTEM
        </p>

    </div>


    <div class="print-title">

        ${escapeHtml(title)}

    </div>


    <p
    style="
    text-align:center;
    font-size:12px;
    "
    >

    Total Teacher:
    ${list.length}

    &nbsp; | &nbsp;

    Print Date:
    ${new Date()
    .toLocaleDateString(
        "bn-BD"
    )}

    </p>


    <table class="print-table">

        <thead>

        <tr>

        <th>#</th>

        <th>নাম</th>

        <th>মোবাইল</th>

        <th>পদবি</th>

        <th>বিষয়</th>

        <th>ঠিকানা</th>

        </tr>

        </thead>


        <tbody>

        ${rows}

        </tbody>

    </table>


    <div class="print-footer">

        <span>
        মাদরাসায়ে নূরুল কুরআন

        <span>
        কর্তৃপক্ষ
        </span>

    </div>

    `;


    window.print();

}

            !q

            .toLowerCase()
            .includes(q)

            ||

            String(
                t.phone || ""
            )
            .toLowerCase()
            .includes(q)

            ||

            String(
                t.designation || ""
            )
            .toLowerCase()
            .includes(q)

            ||

            String(
                t.subject || ""
            )

    msg.textContent =

/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}

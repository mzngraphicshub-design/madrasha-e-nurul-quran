<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Management | মাদরাসায়ে নূরুল কুরআন</title>

<link rel="stylesheet" href="https://banglawebfonts.pages.dev/css/bornomala.css">

<style>
:root{
  --navy:#031a35;
  --blue:#0875df;
  --blue2:#54b3d0;
  --gold:#ffd447;
  --bg:#f4f7fb;
  --card:#ffffff;
  --line:#dce7f2;
  --text:#102033;
  --muted:#6b7a8c;
  --danger:#ef4444;
  --success:#0b8f62;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Bornomala, "Noto Sans Bengali", sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(84,179,208,.13),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(8,117,223,.10),transparent 30%),
    var(--bg);
  color:var(--text);
}

.top{
  background:linear-gradient(135deg,var(--navy),#075b7c);
  color:#fff;
  padding:18px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  box-shadow:0 8px 25px rgba(3,26,53,.15);
}

.top h2{
  margin:0;
  font-size:23px;
}

.top a{
  color:#fff;
  text-decoration:none;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:10px;
  background:rgba(255,255,255,.08);
}

.container{
  max-width:1200px;
  margin:25px auto;
  padding:0 18px;
}

.box{
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:20px;
  padding:24px;
  margin-bottom:22px;
  box-shadow:0 10px 35px rgba(3,26,53,.07);
}

.box h3{
  margin:0 0 20px;
  font-size:21px;
  color:var(--navy);
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:17px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
  font-size:14px;
}

input,
textarea{
  width:100%;
  border:1px solid #d5e1ec;
  border-radius:11px;
  padding:12px 13px;
  font-family:inherit;
  font-size:15px;
  outline:none;
  background:#fff;
  transition:.2s;
}

input:focus,
textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(8,117,223,.10);
}

input[readonly]{
  background:#eef6fb;
  color:#075b7c;
  font-weight:800;
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:45px;
}

.toggle-password{
  position:absolute;
  right:8px;
  top:7px;
  height:36px;
  width:36px;
  border:0;
  border-radius:8px;
  background:#edf5fa;
  cursor:pointer;
  color:var(--navy);
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg,var(--blue),#075b7c);
  color:#fff;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.cancel{
  background:#718096;
  margin-left:7px;
}

.action{
  padding:7px 11px;
  font-size:12px;
  margin:2px;
  background:#0875df;
}

.action.delete{
  background:var(--danger);
}

.search{
  margin-bottom:16px;
}

.table-wrap{
  overflow-x:auto;
  border-radius:15px;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  min-width:950px;
}

th,
td{
  padding:13px 10px;
  border-bottom:1px solid #e9f0f7;
  text-align:left;
  font-size:14px;
}

th{
  background:linear-gradient(135deg,var(--navy),#08739b);
  color:#fff;
  white-space:nowrap;
}

tbody tr{
  transition:.2s;
}

tbody tr:hover{
  background:#f3f8ff;
}

.teacher-number{
  font-weight:800;
  color:#075b7c;
  background:#eaf7fb;
  padding:5px 9px;
  border-radius:8px;
  display:inline-block;
}

.password-note{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

#msg{
  margin-top:12px;
  min-height:20px;
  color:var(--blue);
}

.loading{
  text-align:center;
  padding:24px!important;
  color:var(--muted);
}

@media(max-width:700px){
  .top{
    padding:15px;
  }

  .top h2{
    font-size:18px;
  }

  .top a{
    font-size:13px;
    padding:8px 10px;
  }

  .container{
    margin:18px auto;
    padding:0 12px;
  }

  .box{
    padding:19px;
    border-radius:18px;
  }

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  table{
    min-width:950px;
  }
}
</style>
</head>

<body>

<header class="top">
  <h2>Teacher Management</h2>
  <a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

  <div class="box">

    <h3 id="formTitle">Add Teacher</h3>

    <form id="teacherForm">

      <input type="hidden" id="editId">

      <div>
        <label>Teacher Number</label>
        <input
          id="teacherId"
          readonly
          placeholder="Auto Generated">
        <div class="password-note">
          এই Number দিয়েই Teacher Login করবে।
        </div>
      </div>

      <div>
        <label>Teacher Name *</label>
        <input
          id="name"
          required
          placeholder="শিক্ষকের নাম">
      </div>

      <div>
        <label>Login Password *</label>

        <div class="password-wrap">
          <input
            id="loginPassword"
            type="password"
            minlength="4"
            placeholder="Teacher Login Password">

          <button
            type="button"
            class="toggle-password"
            onclick="togglePassword()">
            Show
          </button>
        </div>

        <div class="password-note">
          Teacher Number + এই Password দিয়ে Teacher Login করবে।
        </div>
      </div>

      <div>
        <label>Mobile</label>
        <input
          id="phone"
          type="tel"
          placeholder="মোবাইল নম্বর">
      </div>

      <div>
        <label>Designation</label>
        <input
          id="designation"
          placeholder="পদবি">
      </div>

      <div>
        <label>Subject</label>
        <input
          id="subject"
          placeholder="বিষয়">
      </div>

      <div class="full">
        <label>Address</label>
        <textarea
          id="address"
          rows="2"
          placeholder="ঠিকানা"></textarea>
      </div>

      <div class="full">

        <button
          type="submit"
          id="saveBtn">
          Save Teacher
        </button>

        <button
          type="button"
          class="cancel"
          id="cancelBtn"
          style="display:none">
          Cancel
        </button>

        <div id="msg"></div>

      </div>

    </form>

  </div>


  <div class="box">

    <h3>Teacher List</h3>

    <input
      class="search"
      id="search"
      placeholder="নাম / Teacher Number / মোবাইল দিয়ে খুঁজুন...">

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Teacher Number</th>
            <th>নাম</th>
            <th>মোবাইল</th>
            <th>পদবি</th>
            <th>বিষয়</th>
            <th>ঠিকানা</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="teacherList">
          <tr>
            <td colspan="7" class="loading">
              Loading...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let teachers = [];


/* =========================
   AUTH
========================= */

async function start(){

  try{

    const {
      data:{session}
    } = await db.auth.getSession();

    if(!session){

      location.href = "admin.html";
      return;

    }

    await loadTeachers();

  }catch(error){

    document.getElementById("teacherList").innerHTML =
      `<tr>
        <td colspan="7">
          Error: ${escapeHtml(error.message)}
        </td>
      </tr>`;

  }

}


/* =========================
   LOAD TEACHERS
========================= */

async function loadTeachers(){

  const tbody =
    document.getElementById("teacherList");

  tbody.innerHTML =
    `<tr>
      <td colspan="7" class="loading">
        Loading...
      </td>
    </tr>`;

  const {
    data,
    error
  } = await db
    .from("teachers")
    .select(
      "id,teacher_id,name,phone,designation,subject,address,login_password"
    )
    .order("created_at",{ascending:false});

  if(error){

    tbody.innerHTML =
      `<tr>
        <td colspan="7">
          Error: ${escapeHtml(error.message)}
        </td>
      </tr>`;

    return;
  }

  teachers = data || [];

  render(teachers);

}


/* =========================
   GENERATE TEACHER NUMBER
========================= */

async function generateTeacherNumber(){

  const {
    data,
    error
  } = await db
    .from("teachers")
    .select("teacher_id");

  if(error){

    throw error;

  }

  let max = 0;

  (data || []).forEach(t=>{

    const value =
      String(t.teacher_id || "").trim();

    const match =
      value.match(/^T-(\d+)$/i);

    if(match){

      const number =
        parseInt(match[1],10);

      if(number > max){

        max = number;

      }

    }

  });

  let next =
    max + 1;

  let teacherId =
    "T-" + String(next).padStart(3,"0");


  /*
    Extra duplicate protection
  */

  while(
    (data || []).some(
      t =>
        String(t.teacher_id || "").toUpperCase()
        === teacherId.toUpperCase()
    )
  ){

    next++;

    teacherId =
      "T-" + String(next).padStart(3,"0");

  }

  return teacherId;

}


/* =========================
   RENDER
========================= */

function render(list){

  const tbody =
    document.getElementById("teacherList");


  if(!list.length){

    tbody.innerHTML =
      `<tr>
        <td
          colspan="7"
          style="text-align:center;padding:25px">
          কোনো Teacher নেই
        </td>
      </tr>`;

    return;

  }


  tbody.innerHTML =
    list.map(t=>`

      <tr>

        <td>
          <span class="teacher-number">
            ${escapeHtml(t.teacher_id || "-")}
          </span>
        </td>

        <td>
          ${escapeHtml(t.name || "-")}
        </td>

        <td>
          ${escapeHtml(t.phone || "-")}
        </td>

        <td>
          ${escapeHtml(t.designation || "-")}
        </td>

        <td>
          ${escapeHtml(t.subject || "-")}
        </td>

        <td>
          ${escapeHtml(t.address || "-")}
        </td>

        <td>

          <button
            class="action"
            onclick="editTeacher('${t.id}')">
            Edit
          </button>

          <button
            class="action delete"
            onclick="deleteTeacher('${t.id}')">
            Delete
          </button>

        </td>

      </tr>

    `).join("");

}


/* =========================
   SAVE TEACHER
========================= */

document
  .getElementById("teacherForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const editId =
        document
          .getElementById("editId")
          .value
          .trim();


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const designation =
        document
          .getElementById("designation")
          .value
          .trim();


      const subject =
        document
          .getElementById("subject")
          .value
          .trim();


      const address =
        document
          .getElementById("address")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPassword")
          .value
          .trim();


      const msg =
        document.getElementById("msg");


      const saveBtn =
        document.getElementById("saveBtn");


      if(!name){

        msg.textContent =
          "Teacher Name দিন।";

        return;

      }


      if(!editId && !password){

        msg.textContent =
          "Teacher Login Password দিন।";

        return;

      }


      if(password && password.length < 4){

        msg.textContent =
          "Password কমপক্ষে ৪ অক্ষরের হতে হবে।";

        return;

      }


      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving...";


      try{

        let teacherId =
          document
            .getElementById("teacherId")
            .value
            .trim();


        /*
          নতুন Teacher হলে
          Auto Teacher Number
        */

        if(!editId){

          teacherId =
            await generateTeacherNumber();

        }


        const teacher = {

          teacher_id: teacherId,

          name: name,

          phone:
            phone || null,

          designation:
            designation || null,

          subject:
            subject || null,

          address:
            address || null

        };


        /*
          Password only save/change
          যখন password দেওয়া হয়েছে
        */

        if(password){

          teacher.login_password =
            password;

        }


        let result;


        if(editId){

          result =
            await db
              .from("teachers")
              .update(teacher)
              .eq("id",editId)
              .select(
                "id,teacher_id,name,phone,designation,subject,address,login_password"
              )
              .single();

        }else{

          result =
            await db
              .from("teachers")
              .insert(teacher)
              .select(
                "id,teacher_id,name,phone,designation,subject,address,login_password"
              )
              .single();

        }


        if(result.error){

          /*
            Duplicate Teacher Number
          */

          if(
            String(result.error.message || "")
              .toLowerCase()
              .includes("duplicate")
          ){

            msg.textContent =
              "Teacher Number already exists. আবার Save করুন।";

          }else{

            msg.textContent =
              "Error: " +
              result.error.message;

          }

          return;

        }


        if(editId){

          const index =
            teachers.findIndex(
              x =>
                String(x.id)
                === String(editId)
            );

          if(index !== -1){

            teachers[index] =
              result.data;

          }

        }else{

          teachers.unshift(
            result.data
          );

        }


        render(teachers);


        msg.textContent =
          `Teacher ${result.data.teacher_id} সফলভাবে Save হয়েছে।`;


        resetForm();


      }catch(error){

        msg.textContent =
          "Error: " +
          error.message;

      }finally{

        saveBtn.disabled = false;

        if(
          document
            .getElementById("editId")
            .value
            .trim()
        ){

          saveBtn.textContent =
            "Update Teacher";

        }else{

          saveBtn.textContent =
            "Save Teacher";

        }

      }

    }
  );


/* =========================
   EDIT
========================= */

function editTeacher(id){

  const teacher =
    teachers.find(
      x =>
        String(x.id)
        === String(id)
    );


  if(!teacher) return;


  document
    .getElementById("editId")
    .value =
    teacher.id;


  document
    .getElementById("teacherId")
    .value =
    teacher.teacher_id || "";


  document
    .getElementById("name")
    .value =
    teacher.name || "";


  document
    .getElementById("phone")
    .value =
    teacher.phone || "";


  document
    .getElementById("designation")
    .value =
    teacher.designation || "";


  document
    .getElementById("subject")
    .value =
    teacher.subject || "";


  document
    .getElementById("address")
    .value =
    teacher.address || "";


  /*
    Password blank রাখা হচ্ছে।
    নতুন password দিলে change হবে।
  */

  document
    .getElementById("loginPassword")
    .value = "";


  document
    .getElementById("formTitle")
    .textContent =
    "Edit Teacher";


  document
    .getElementById("saveBtn")
    .textContent =
    "Update Teacher";


  document
    .getElementById("cancelBtn")
    .style.display =
    "inline-block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE
========================= */

async function deleteTeacher(id){

  const teacher =
    teachers.find(
      x =>
        String(x.id)
        === String(id)
    );


  if(!teacher) return;


  const ok =
    confirm(
      `${teacher.teacher_id || ""} - ${teacher.name || "Teacher"} কে Delete করতে চান?`
    );


  if(!ok) return;


  try{

    const {
      error
    } =
      await db
        .from("teachers")
        .delete()
        .eq("id",id);


    if(error){

      alert(error.message);

      return;

    }


    /*
      Permission record থাকলে
      সেটাও delete করা হবে।
    */

    if(teacher.teacher_id){

      await db
        .from("teacher_permissions")
        .delete()
        .eq(
          "teacher_id",
          teacher.teacher_id
        );

    }


    teachers =
      teachers.filter(
        t =>
          String(t.id)
          !== String(id)
      );


    render(teachers);


  }catch(error){

    alert(error.message);

  }

}


/* =========================
   RESET
========================= */

function resetForm(){

  document
    .getElementById("teacherForm")
    .reset();


  document
    .getElementById("editId")
    .value = "";


  document
    .getElementById("teacherId")
    .value = "";


  document
    .getElementById("formTitle")
    .textContent =
    "Add Teacher";


  document
    .getElementById("saveBtn")
    .textContent =
    "Save Teacher";


  document
    .getElementById("cancelBtn")
    .style.display =
    "none";


  document
    .getElementById("msg")
    .textContent = "";

}


document
  .getElementById("cancelBtn")
  .onclick =
  resetForm;


/* =========================
   SEARCH
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    function(){

      const q =
        this.value
          .toLowerCase()
          .trim();


      render(
        teachers.filter(t =>

          String(
            t.teacher_id || ""
          )
            .toLowerCase()
            .includes(q)

          ||

          String(
            t.name || ""
          )
            .toLowerCase()
            .includes(q)

          ||

          String(
            t.phone || ""
          )
            .toLowerCase()
            .includes(q)

          ||

          String(
            t.designation || ""
          )
            .toLowerCase()
            .includes(q)

          ||

          String(
            t.subject || ""
          )
            .toLowerCase()
            .includes(q)

        )
      );

    }
  );


/* =========================
   PASSWORD SHOW/HIDE
========================= */

function togglePassword(){

  const input =
    document.getElementById(
      "loginPassword"
    );

  const button =
    document.querySelector(
      ".toggle-password"
    );


  if(input.type === "password"){

    input.type = "text";

    button.textContent =
      "Hide";

  }else{

    input.type = "password";

    button.textContent =
      "Show";

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

start();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Management | মাদরাসায়ে নূরুল কুরআন</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bornomala:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Bornomala',sans-serif;
    background:#f4f9fb;
    color:#123;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#075b7c,#08739b,#54b3d0);
    color:#fff;
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 4px 18px rgba(0,0,0,.12);
}

.header h1{
    font-size:25px;
    font-weight:700;
}

.header a{
    color:#fff;
    text-decoration:none;
    background:rgba(255,255,255,.15);
    padding:9px 16px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.25);
}

.container{
    width:min(1200px,94%);
    margin:25px auto;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    margin-bottom:22px;
    box-shadow:0 8px 25px rgba(7,91,124,.08);
    border:1px solid #e3eef2;
}

.card h2{
    color:#075b7c;
    margin-bottom:18px;
    font-size:21px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label{
    font-weight:600;
    color:#16495d;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid #cbdde4;
    border-radius:10px;
    outline:none;
    font-family:inherit;
    font-size:15px;
    background:#fbfdfe;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#08739b;
    box-shadow:0 0 0 3px rgba(8,115,155,.10);
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

.btn{
    border:0;
    padding:11px 20px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
}

.btn-primary{
    background:#08739b;
    color:#fff;
}

.btn-primary:hover{
    background:#075b7c;
}

.btn-secondary{
    background:#e8f2f5;
    color:#075b7c;
}

.btn-danger{
    background:#dc3545;
    color:#fff;
}

.btn-edit{
    background:#54b3d0;
    color:#fff;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#075b7c;
    color:#fff;
    padding:12px;
    text-align:left;
    white-space:nowrap;
}

td{
    padding:11px 12px;
    border-bottom:1px solid #e4edf0;
    vertical-align:middle;
}

tr:hover td{
    background:#f7fbfc;
}

.action-buttons{
    display:flex;
    gap:7px;
}

.action-buttons button{
    border:0;
    padding:7px 11px;
    border-radius:7px;
    cursor:pointer;
    font-family:inherit;
}

.edit-btn{
    background:#54b3d0;
    color:#fff;
}

.delete-btn{
    background:#dc3545;
    color:#fff;
}

.search-box{
    margin-bottom:15px;
}

.search-box input{
    width:100%;
    padding:12px;
    border:1px solid #cbdde4;
    border-radius:10px;
    font-family:inherit;
}

.teacher-number{
    font-weight:700;
    color:#08739b;
}

.status{
    margin-top:12px;
    padding:11px 14px;
    border-radius:9px;
    display:none;
}

.status.success{
    display:block;
    background:#e8f7ef;
    color:#167442;
}

.status.error{
    display:block;
    background:#fdecec;
    color:#a72828;
}

.password-note{
    font-size:12px;
    color:#6d7d84;
}

@media(max-width:700px){
    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

    .header h1{
        font-size:21px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .card{
        padding:16px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>Teacher Management</h1>
    <a href="dashboard.html">Dashboard</a>
</header>

<main class="container">

    <section class="card">
        <h2 id="formTitle">Add Teacher</h2>

        <form id="teacherForm">

            <div class="form-grid">

                <div class="field">
                    <label>Teacher Number</label>
                    <input type="text" id="teacherId" readonly placeholder="Auto Generated">
                </div>

                <div class="field">
                    <label>Teacher Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="field">
                    <label>Mobile Number</label>
                    <input type="text" id="phone" required>
                </div>

                <div class="field">
                    <label>Login Password</label>
                    <input type="text" id="loginPassword" required>
                    <span class="password-note">
                        Teacher login: Mobile Number + Password
                    </span>
                </div>

                <div class="field">
                    <label>Designation</label>
                    <input type="text" id="designation">
                </div>

                <div class="field">
                    <label>Subject</label>
                    <input type="text" id="subject">
                </div>

                <div class="field full">
                    <label>Address</label>
                    <textarea id="address"></textarea>
                </div>

            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary" id="saveBtn">
                    Save Teacher
                </button>

                <button type="button"
                        class="btn btn-secondary"
                        id="cancelBtn"
                        style="display:none;">
                    Cancel
                </button>
            </div>

            <div id="status" class="status"></div>

        </form>
    </section>

    <section class="card">
        <h2>Teachers List</h2>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search teacher by name, number or mobile..."
            >
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Teacher No.</th>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Designation</th>
                        <th>Subject</th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="teacherTableBody">
                    <tr>
                        <td colspan="7" style="text-align:center;">
                            Loading...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script>
const SUPABASE_URL =
    "https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let teachers = [];
let editingId = null;


/* AUTH */
async function start(){

    const {
        data:{session},
        error
    } = await db.auth.getSession();

    if(error){
        console.error(error);
    }

    if(!session){
        location.href = "admin.html";
        return;
    }

    await loadTeachers();
}


/* STATUS */
function showStatus(message,type="success"){

    const box = document.getElementById("status");

    box.textContent = message;
    box.className = "status " + type;

    setTimeout(()=>{
        box.className = "status";
    },4000);
}


/* GENERATE TEACHER NUMBER */
function generateTeacherNumber(){

    const numbers = teachers
        .map(t => t.teacher_id)
        .filter(Boolean)
        .map(id => {

            const match = String(id).match(/T-(\d+)/);

            return match
                ? parseInt(match[1],10)
                : 0;
        });

    const max =
        numbers.length
            ? Math.max(...numbers)
            : 0;

    return "T-" + String(max + 1).padStart(3,"0");
}


/* LOAD TEACHERS */
async function loadTeachers(){

    const tbody =
        document.getElementById("teacherTableBody");

    tbody.innerHTML = `
        <tr>
            <td colspan="7" style="text-align:center;">
                Loading...
            </td>
        </tr>
    `;

    const {
        data,
        error
    } = await db
        .from("teachers")
        .select(`
            id,
            teacher_id,
            name,
            phone,
            designation,
            subject,
            address,
            login_password
        `)
        .order("id",{ascending:false});

    if(error){

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center;color:#c00;">
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        return;
    }

    teachers = data || [];

    renderTeachers();

    if(!editingId){
        document.getElementById("teacherId").value =
            generateTeacherNumber();
    }
}


/* RENDER */
function renderTeachers(){

    const tbody =
        document.getElementById("teacherTableBody");

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    const filtered =
        teachers.filter(t => {

            return (
                String(t.teacher_id || "")
                    .toLowerCase()
                    .includes(search)
                ||
                String(t.name || "")
                    .toLowerCase()
                    .includes(search)
                ||
                String(t.phone || "")
                    .toLowerCase()
                    .includes(search)
            );
        });

    if(!filtered.length){

        tbody.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center;">
                    No teacher found
                </td>
            </tr>
        `;

        return;
    }

    tbody.innerHTML =
        filtered.map(t => `

            <tr>

                <td>
                    <span class="teacher-number">
                        ${escapeHtml(t.teacher_id || "-")}
                    </span>
                </td>

                <td>
                    ${escapeHtml(t.name || "-")}
                </td>

                <td>
                    ${escapeHtml(t.phone || "-")}
                </td>

                <td>
                    ${escapeHtml(t.designation || "-")}
                </td>

                <td>
                    ${escapeHtml(t.subject || "-")}
                </td>

                <td>
                    ${escapeHtml(t.address || "-")}
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="edit-btn"
                            onclick="editTeacher('${t.id}')">
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteTeacher('${t.id}')">
                            Delete
                        </button>

                    </div>

                </td>

            </tr>

        `).join("");
}


/* SAVE */
document
.getElementById("teacherForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const saveBtn =
        document.getElementById("saveBtn");

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    const teacherId =
        document.getElementById("teacherId").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const loginPassword =
        document.getElementById("loginPassword").value.trim();

    const designation =
        document.getElementById("designation").value.trim();

    const subject =
        document.getElementById("subject").value.trim();

    const address =
        document.getElementById("address").value.trim();


    const payload = {

        teacher_id:teacherId,
        name:name,
        phone:phone,
        designation:designation,
        subject:subject,
        address:address,
        login_password:loginPassword
    };


    let result;


    if(editingId){

        result =
            await db
                .from("teachers")
                .update(payload)
                .eq("id",editingId);

    }else{

        result =
            await db
                .from("teachers")
                .insert([payload]);
    }


    if(result.error){

        console.error(result.error);

        showStatus(
            result.error.message,
            "error"
        );

        saveBtn.disabled = false;
        saveBtn.textContent =
            editingId
                ? "Update Teacher"
                : "Save Teacher";

        return;
    }


    showStatus(
        editingId
            ? "Teacher updated successfully."
            : "Teacher added successfully.",
        "success"
    );


    resetForm();

    await loadTeachers();

    saveBtn.disabled = false;
    saveBtn.textContent = "Save Teacher";

});


/* EDIT */
function editTeacher(id){

    const teacher =
        teachers.find(t => String(t.id) === String(id));

    if(!teacher) return;

    editingId = teacher.id;

    document.getElementById("teacherId").value =
        teacher.teacher_id || "";

    document.getElementById("name").value =
        teacher.name || "";

    document.getElementById("phone").value =
        teacher.phone || "";

    document.getElementById("loginPassword").value =
        teacher.login_password || "";

    document.getElementById("designation").value =
        teacher.designation || "";

    document.getElementById("subject").value =
        teacher.subject || "";

    document.getElementById("address").value =
        teacher.address || "";

    document.getElementById("formTitle").textContent =
        "Edit Teacher";

    document.getElementById("saveBtn").textContent =
        "Update Teacher";

    document.getElementById("cancelBtn").style.display =
        "inline-block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* DELETE */
async function deleteTeacher(id){

    const teacher =
        teachers.find(t => String(t.id) === String(id));

    if(!teacher) return;

    const ok =
        confirm(
            `Are you sure you want to delete ${teacher.name || "this teacher"}?`
        );

    if(!ok) return;


    try{

        /*
         * First remove teacher permission.
         * If permission row/table is unavailable,
         * continue with teacher deletion.
         */

        if(teacher.teacher_id){

            const permissionDelete =
                await db
                    .from("teacher_permissions")
                    .delete()
                    .eq("teacher_id",teacher.teacher_id);

            if(permissionDelete.error){

                console.warn(
                    "Teacher permission delete warning:",
                    permissionDelete.error
                );
            }
        }


        /* Delete teacher */

        const {
            error
        } = await db
            .from("teachers")
            .delete()
            .eq("id",id);


        if(error){

            console.error(
                "Teacher delete error:",
                error
            );

            let message =
                error.message ||
                "Teacher delete failed.";

            if(
                message.toLowerCase().includes("foreign key") ||
                message.toLowerCase().includes("violates")
            ){
                message =
                    "এই শিক্ষককে অন্য কোনো তথ্যের সাথে যুক্ত করা আছে। আগে সংশ্লিষ্ট তথ্য মুছে/সরিয়ে আবার Delete করুন।";
            }

            showStatus(
                message,
                "error"
            );

            return;
        }


        showStatus(
            "Teacher deleted successfully.",
            "success"
        );


        if(
            editingId &&
            String(editingId) === String(id)
        ){
            resetForm();
        }


        await loadTeachers();

    }catch(err){

        console.error(err);

        showStatus(
            err.message ||
            "Teacher delete failed.",
            "error"
        );
    }
}


/* CANCEL */
document
.getElementById("cancelBtn")
.addEventListener("click",resetForm);


/* RESET */
function resetForm(){

    editingId = null;

    document
        .getElementById("teacherForm")
        .reset();

    document.getElementById("formTitle").textContent =
        "Add Teacher";

    document.getElementById("saveBtn").textContent =
        "Save Teacher";

    document.getElementById("cancelBtn").style.display =
        "none";

    document.getElementById("teacherId").value =
        generateTeacherNumber();
}


/* SEARCH */
document
.getElementById("searchInput")
.addEventListener("input",renderTeachers);


/* HTML ESCAPE */
function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* START */
start();

</script>

</body>
</html>

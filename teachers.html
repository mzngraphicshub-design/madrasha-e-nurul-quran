<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teachers | মাদরাসায়ে নূরুল কুরআন</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#222}
.top{background:#075c43;color:#fff;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0;color:#fff;font-size:20px}
.top a{color:#fff;text-decoration:none}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.box{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:20px}
h2,h3{color:#075c43;margin-bottom:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:block;font-weight:bold;font-size:14px}
input,textarea{width:100%;padding:11px;margin-top:6px;border:1px solid #ddd;border-radius:7px;font-size:14px}
textarea{resize:vertical}
button{border:0;border-radius:7px;padding:10px 16px;background:#087f5b;color:#fff;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.cancel{background:#777;margin-left:7px}
.delete{background:#c62828}
.search{margin-bottom:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
th{background:#075c43;color:#fff}
.action{padding:7px 10px;font-size:12px;margin:2px}
#msg{margin-top:10px;min-height:20px}
.table-wrap{overflow-x:auto}
.loading{text-align:center;padding:20px}
@media(max-width:650px){
.form{grid-template-columns:1fr}
.full{grid-column:auto}
table{min-width:700px}
}
</style>
</head>

<body>

<header class="top">
<h2>👨‍🏫 Teacher Management</h2>
<a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="box">

<h3 id="formTitle">➕ Add Teacher</h3>

<form id="teacherForm">

<input type="hidden" id="editId">

<div>
<label>Teacher Name *</label>
<input id="name" required placeholder="শিক্ষকের নাম">
</div>

<div>
<label>Mobile</label>
<input id="phone" type="tel" placeholder="মোবাইল নম্বর">
</div>

<div>
<label>Designation</label>
<input id="designation" placeholder="পদবি">
</div>

<div>
<label>Subject</label>
<input id="subject" placeholder="বিষয়">
</div>

<div class="full">
<label>Address</label>
<textarea id="address" rows="2" placeholder="ঠিকানা"></textarea>
</div>

<div class="full">

<button type="submit" id="saveBtn">
💾 Save Teacher
</button>

<button type="button" class="cancel" id="cancelBtn" style="display:none">
Cancel
</button>

<div id="msg"></div>

</div>

</form>
</div>


<div class="box">

<h3>👨‍🏫 Teacher List</h3>

<input
class="search"
id="search"
placeholder="🔍 নাম / মোবাইল দিয়ে খুঁজুন..."
>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>নাম</th>
<th>মোবাইল</th>
<th>পদবি</th>
<th>বিষয়</th>
<th>ঠিকানা</th>
<th>Action</th>
</tr>
</thead>

<tbody id="teacherList">

<tr>
<td colspan="6" class="loading">
Loading...
</td>
</tr>

</tbody>

</table>

</div>
</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let teachers=[];


// ===============================
// START
// ===============================

async function start(){

try{

const {data:{session}} =
await db.auth.getSession();

if(!session){

location.href="admin.html";
return;

}

await loadTeachers();

}catch(error){

document.getElementById("teacherList").innerHTML=
`<tr>
<td colspan="6">
❌ ${escapeHtml(error.message)}
</td>
</tr>`;

}

}


// ===============================
// LOAD TEACHERS
// ===============================

async function loadTeachers(){

const tbody =
document.getElementById("teacherList");

tbody.innerHTML=
`<tr>
<td colspan="6" class="loading">
Loading...
</td>
</tr>`;


const {data,error} =
await db
.from("teachers")
.select(`
id,
name,
phone,
designation,
subject,
address
`)
.order("created_at",{ascending:false});


if(error){

tbody.innerHTML=
`<tr>
<td colspan="6">
❌ ${escapeHtml(error.message)}
</td>
</tr>`;

return;

}


teachers=data||[];

render(teachers);

}


// ===============================
// RENDER
// ===============================

function render(list){

const tbody =
document.getElementById("teacherList");


if(!list.length){

tbody.innerHTML=
`<tr>
<td colspan="6" style="text-align:center">
কোনো Teacher নেই
</td>
</tr>`;

return;

}


tbody.innerHTML =
list.map(t=>`

<tr>

<td>
${escapeHtml(t.name||"-")}
</td>

<td>
${escapeHtml(t.phone||"-")}
</td>

<td>
${escapeHtml(t.designation||"-")}
</td>

<td>
${escapeHtml(t.subject||"-")}
</td>

<td>
${escapeHtml(t.address||"-")}
</td>

<td>

<button
class="action"
onclick="editTeacher('${t.id}')">
Edit
</button>

<button
class="action delete"
onclick="deleteTeacher('${t.id}')">
Delete
</button>

</td>

</tr>

`).join("");

}


// ===============================
// ADD / UPDATE
// ===============================

document
.getElementById("teacherForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();


const editId =
document.getElementById("editId").value;


const teacher={

name:
document.getElementById("name")
.value.trim(),

phone:
document.getElementById("phone")
.value.trim(),

designation:
document.getElementById("designation")
.value.trim(),

subject:
document.getElementById("subject")
.value.trim(),

address:
document.getElementById("address")
.value.trim()

};


const msg =
document.getElementById("msg");

const saveBtn =
document.getElementById("saveBtn");


msg.textContent="Saving...";

saveBtn.disabled=true;


try{

let result;


if(editId){

result =
await db
.from("teachers")
.update(teacher)
.eq("id",editId)
.select(`
id,
name,
phone,
designation,
subject,
address
`)
.single();

}else{

result =
await db
.from("teachers")
.insert(teacher)
.select(`
id,
name,
phone,
designation,
subject,
address
`)
.single();

}


if(result.error){

msg.textContent =
"❌ "+result.error.message;

return;

}


// ===============================
// Local update
// ===============================

if(editId){

const index =
teachers.findIndex(
x=>String(x.id)===String(editId)
);

if(index!==-1){

teachers[index]=result.data;

}

}else{

teachers.unshift(result.data);

}


render(teachers);


msg.textContent=
"✅ Saved successfully";


resetForm();


}catch(error){

msg.textContent=
"❌ "+error.message;

}finally{

saveBtn.disabled=false;

}

});


// ===============================
// EDIT
// ===============================

function editTeacher(id){

const teacher =
teachers.find(
x=>String(x.id)===String(id)
);


if(!teacher)return;


document.getElementById("editId").value =
teacher.id;

document.getElementById("name").value =
teacher.name||"";

document.getElementById("phone").value =
teacher.phone||"";

document.getElementById("designation").value =
teacher.designation||"";

document.getElementById("subject").value =
teacher.subject||"";

document.getElementById("address").value =
teacher.address||"";


document.getElementById("formTitle").textContent =
"✏️ Edit Teacher";


document.getElementById("saveBtn").textContent =
"💾 Update Teacher";


document.getElementById("cancelBtn").style.display =
"inline-block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


// ===============================
// DELETE
// ===============================

async function deleteTeacher(id){

if(!confirm(
"এই Teacher-কে Delete করতে চান?"
))return;


try{

const {error} =
await db
.from("teachers")
.delete()
.eq("id",id);


if(error){

alert(error.message);
return;

}


teachers =
teachers.filter(
t=>String(t.id)!==String(id)
);


render(teachers);


}catch(error){

alert(error.message);

}

}


// ===============================
// RESET
// ===============================

function resetForm(){

document
.getElementById("teacherForm")
.reset();


document.getElementById("editId").value="";


document.getElementById("formTitle").textContent =
"➕ Add Teacher";


document.getElementById("saveBtn").textContent =
"💾 Save Teacher";


document.getElementById("cancelBtn").style.display =
"none";

}


document
.getElementById("cancelBtn")
.onclick=resetForm;


// ===============================
// SEARCH
// ===============================

document
.getElementById("search")
.addEventListener(
"input",
function(){

const q =
this.value
.toLowerCase()
.trim();


const filtered =
teachers.filter(t=>

(t.name||"")
.toLowerCase()
.includes(q)

||

(t.phone||"")
.toLowerCase()
.includes(q)

);


render(filtered);

});


// ===============================
// ESCAPE HTML
// ===============================

function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


// START
start();

</script>

</body>
</html>

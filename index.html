<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>মাদরাসায়ে নূরুল কুরআন</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    nav {
      background: white;
      padding: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    nav a {
      color: #087f5b;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    .hero {
      max-width: 1000px;
      margin: 30px auto;
      padding: 50px 20px;
      text-align: center;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .hero h2 {
      color: #087f5b;
      font-size: 30px;
      margin-bottom: 15px;
    }

    .hero p {
      line-height: 1.8;
      color: #555;
    }

    .classes {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
    }

    .classes h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #087f5b;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    .class-box {
      background: white;
      padding: 25px 10px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      background: #075c43;
      color: white;
      text-align: center;
      padding: 25px 10px;
    }

    .admin-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #087f5b;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>মাদরাসায়ে নূরুল কুরআন</h1>
    <p>MADRASHA-E NURUL QURAN</p>
  </header>

  <nav>
    <a href="#">হোম</a>
    <a href="#">আমাদের সম্পর্কে</a>
    <a href="#">নোটিশ</a>
    <a href="#">যোগাযোগ</a>
  </nav>

  <section class="hero">
    <h2>স্বাগতম</h2>
    <p>
      মাদরাসায়ে নূরুল কুরআন-এর অফিসিয়াল ওয়েবসাইটে
      আপনাকে স্বাগতম।
    </p>

    <a href="admin.html" class="admin-btn">
      🔐 Admin Login
    </a>
  </section>

  <section class="classes">
    <h2>আমাদের বিভাগ ও শ্রেণি</h2>

    <div class="class-grid">
      <div class="class-box">নূরানী</div>
      <div class="class-box">১ম শ্রেণি</div>
      <div class="class-box">২য় শ্রেণি</div>
      <div class="class-box">৩য় শ্রেণি</div>
      <div class="class-box">৪র্থ শ্রেণি</div>
      <div class="class-box">৫ম শ্রেণি</div>
      <div class="class-box">নাজেরা</div>
      <div class="class-box">হিফজ</div>
    </div>
  </section>

  <footer>
    <p>© 2026 মাদরাসায়ে নূরুল কুরআন</p>
  </footer>

</body>
</html>

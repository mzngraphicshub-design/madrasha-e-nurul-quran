<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Members | মাদরাসায়ে নূরুল কুরআন</title>
<style>
@font-face{font-family:Bornomala;src:url("./fonts/Bornomala-Regular.ttf") format("truetype");font-display:swap}
:root{--navy:#031a35;--navy2:#062b55;--blue:#0875df;--gold:#ffd447;--text:#173452;--line:#dfeaf5}
*{box-sizing:border-box}body{margin:0;font-family:Bornomala,Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#f3f8fd,#eaf4ff);min-height:100vh}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2),var(--blue));color:#fff;padding:18px 4%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 35px #0023502e;position:sticky;top:0;z-index:20}.top h2{margin:0;color:#fff;font-size:22px}.top a{color:#fff;text-decoration:none;padding:10px 16px;border:1px solid #ffffff40;border-radius:10px;background:#ffffff14}.top a:hover{background:var(--gold);color:var(--navy)}
.container{max-width:1200px;margin:30px auto;padding:0 18px}.box{background:#ffffffd1;border:1px solid #fff;padding:26px;border-radius:22px;box-shadow:0 20px 55px #0037801f;margin-bottom:24px;backdrop-filter:blur(18px)}.box h3{margin:0 0 22px;color:var(--navy);font-size:24px}.box h3:after{content:"";display:block;width:55px;height:3px;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:5px;margin-top:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:bold;font-size:14px;color:#244663}input,select,textarea{width:100%;padding:13px 14px;margin-top:7px;border:1px solid #d5e3f0;border-radius:11px;font-size:14px;outline:none;background:#f9fcff;transition:.25s;font-family:inherit}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px #0875df1a;background:#fff}textarea{resize:vertical}
button{border:0;border-radius:11px;padding:12px 18px;background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;font-weight:bold;cursor:pointer;transition:.3s;font-family:inherit;box-shadow:0 7px 20px #0875df29}button:hover{transform:translateY(-2px)}button:disabled{opacity:.6;cursor:not-allowed}.cancel{background:#718096;margin-left:7px}.delete{background:linear-gradient(135deg,#b91c1c,#ef4444)}.print{background:linear-gradient(135deg,#087f5b,#10b981)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:220px;margin:0}.table-wrap{overflow-x:auto;border-radius:15px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:13px 10px;border-bottom:1px solid #e9f0f7;text-align:left;font-size:14px}th{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;white-space:nowrap}tbody tr:hover{background:#f3f8ff}.action{padding:7px 11px;font-size:12px;margin:2px}#msg{margin-top:12px;min-height:20px;color:var(--blue)}.loading{text-align:center;padding:24px!important;color:#718399}
@media(max-width:650px){.top{padding:15px}.top h2{font-size:18px}.top a{font-size:13px;padding:8px 10px}.container{margin:18px auto;padding:0 12px}.box{padding:19px;border-radius:18px}.box h3{font-size:20px}.form{grid-template-columns:1fr}.full{grid-column:auto}table{min-width:1050px}}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff!important}.top,.box:first-child,.toolbar,.no-print,#msg{display:none!important}.container{max-width:none;margin:0;padding:0}.box{box-shadow:none!important;border:0!important;padding:0!important;margin:0!important;background:#fff!important}.box h3{text-align:center;color:#000!important;font-size:20px}.box h3:after{display:none}.table-wrap{overflow:visible;border:1px solid #222}table{min-width:0!important}th{background:#ddd!important;color:#000!important;border:1px solid #222}td{border:1px solid #333;color:#000!important}}
</style>
</head>
<body>
<header class="top"><h2>👥 Member Management</h2><a href="dashboard.html">← Dashboard</a></header>
<div class="container">
<div class="box">
<h3 id="formTitle">➕ Add Member</h3>
<form id="memberForm">
<input type="hidden" id="editId">
<div><label>Member Name / সদস্যের নাম *</label><input id="name" required placeholder="সদস্যের নাম"></div>
<div><label>Member ID / সদস্য ID</label><input id="memberId" placeholder="যেমন: MEM-001"></div>
<div><label>Mobile / মোবাইল</label><input id="phone" type="tel" placeholder="মোবাইল নম্বর"></div>
<div><label>Designation / পদবি</label><input id="designation" placeholder="যেমন: সভাপতি / সদস্য / কোষাধ্যক্ষ"></div>
<div><label>Member Type / সদস্যের ধরন</label><select id="memberType"><option value="">সদস্যের ধরন নির্বাচন করুন</option><option>পরিচালনা কমিটি</option><option>সাধারণ সদস্য</option><option>দাতা সদস্য</option><option>অভিভাবক সদস্য</option><option>অন্যান্য</option></select></div>
<div><label>Joining Date / যোগদানের তারিখ</label><input id="joiningDate" type="date"></div>
<div class="full"><label>Address / ঠিকানা</label><textarea id="address" rows="2" placeholder="ঠিকানা"></textarea></div>
<div class="full"><button type="submit" id="saveBtn">💾 Save Member</button><button type="button" class="cancel" id="cancelBtn" style="display:none">Cancel</button><div id="msg"></div></div>
</form>
</div>
<div class="box">
<h3>👥 Member List / সদস্য তালিকা</h3>
<div class="toolbar no-print"><input class="search" id="search" placeholder="🔍 নাম / ID / মোবাইল / পদবি দিয়ে খুঁজুন..."><button class="print" onclick="window.print()">🖨️ Print List</button></div>
<div class="table-wrap"><table><thead><tr><th>Member ID</th><th>নাম</th><th>মোবাইল</th><th>পদবি</th><th>সদস্যের ধরন</th><th>যোগদানের তারিখ</th><th>ঠিকানা</th><th class="no-print">Action</th></tr></thead><tbody id="memberList"><tr><td colspan="8" class="loading">Loading...</td></tr></tbody></table></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";
const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let members=[];
const fields=["memberId","name","phone","designation","memberType","joiningDate","address"];

async function start(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){location.href="admin.html";return}
 await loadMembers();
}
async function loadMembers(){
 const tbody=document.getElementById("memberList");
 tbody.innerHTML='<tr><td colspan="8" class="loading">Loading...</td></tr>';
 const {data,error}=await db.from("members").select("id,member_id,name,phone,designation,member_type,joining_date,address").order("created_at",{ascending:false});
 if(error){tbody.innerHTML='<tr><td colspan="8">❌ '+escapeHtml(error.message)+'</td></tr>';return}
 members=data||[];render(members);
}
function render(list){
 const tbody=document.getElementById("memberList");
 if(!list.length){tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:25px">কোনো সদস্য নেই</td></tr>';return}
 tbody.innerHTML=list.map(m=>`<tr><td>${escapeHtml(m.member_id||"-")}</td><td>${escapeHtml(m.name||"-")}</td><td>${escapeHtml(m.phone||"-")}</td><td>${escapeHtml(m.designation||"-")}</td><td>${escapeHtml(m.member_type||"-")}</td><td>${formatDate(m.joining_date)}</td><td>${escapeHtml(m.address||"-")}</td><td class="no-print"><button class="action" onclick="editMember('${m.id}')">✏️ Edit</button><button class="action delete" onclick="deleteMember('${m.id}')">🗑️ Delete</button></td></tr>`).join("");
}
document.getElementById("memberForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const editId=document.getElementById("editId").value;
 const member={member_id:v("memberId")||null,name:v("name"),phone:v("phone")||null,designation:v("designation")||null,member_type:v("memberType")||null,joining_date:v("joiningDate")||null,address:v("address")||null};
 const msg=document.getElementById("msg"),btn=document.getElementById("saveBtn");msg.textContent="Saving...";btn.disabled=true;
 try{
  let result=editId?await db.from("members").update(member).eq("id",editId).select("id,member_id,name,phone,designation,member_type,joining_date,address").single():await db.from("members").insert(member).select("id,member_id,name,phone,designation,member_type,joining_date,address").single();
  if(result.error){msg.textContent="❌ "+result.error.message;return}
  if(editId){const i=members.findIndex(x=>String(x.id)===String(editId));if(i!==-1)members[i]=result.data}else members.unshift(result.data);
  render(members);msg.textContent="✅ Saved successfully";resetForm();
 }catch(err){msg.textContent="❌ "+err.message}finally{btn.disabled=false}
});
function v(id){return document.getElementById(id).value.trim()}
function editMember(id){
 const m=members.find(x=>String(x.id)===String(id));if(!m)return;
 document.getElementById("editId").value=m.id;
 document.getElementById("memberId").value=m.member_id||"";
 document.getElementById("name").value=m.name||"";
 document.getElementById("phone").value=m.phone||"";
 document.getElementById("designation").value=m.designation||"";
 document.getElementById("memberType").value=m.member_type||"";
 document.getElementById("joiningDate").value=m.joining_date||"";
 document.getElementById("address").value=m.address||"";
 document.getElementById("formTitle").textContent="✏️ Edit Member";
 document.getElementById("saveBtn").textContent="💾 Update Member";
 document.getElementById("cancelBtn").style.display="inline-block";
 scrollTo({top:0,behavior:"smooth"});
}
async function deleteMember(id){
 if(!confirm("এই সদস্যকে Delete করতে চান?"))return;
 const {error}=await db.from("members").delete().eq("id",id);
 if(error){alert(error.message);return}
 members=members.filter(x=>String(x.id)!==String(id));render(members);
}
function resetForm(){document.getElementById("memberForm").reset();document.getElementById("editId").value="";document.getElementById("formTitle").textContent="➕ Add Member";document.getElementById("saveBtn").textContent="💾 Save Member";document.getElementById("cancelBtn").style.display="none"}
document.getElementById("cancelBtn").onclick=resetForm;
document.getElementById("search").addEventListener("input",function(){const q=this.value.toLowerCase().trim();render(members.filter(m=>[m.name,m.member_id,m.phone,m.designation,m.member_type].some(x=>(x||"").toLowerCase().includes(q))))});
function formatDate(x){if(!x)return "-";const d=new Date(x+"T00:00:00");return isNaN(d)?x:d.toLocaleDateString("bn-BD",{day:"2-digit",month:"2-digit",year:"numeric"})}
function escapeHtml(x){return String(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
start();
</script>
</body>
</html>

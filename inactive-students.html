<!DOCTYPE html><html lang="bn"><head>
<script>/* MNQ access guard (inline) */
/* =========================================================
   মাদরাসায়ে নূরুল কুরআন — Shared Access Guard
   সব পেজের <head> এর একদম শুরুতে লোড হয়:
   (এই কোড প্রতিটি পেজের <head> এ inline বসানো আছে)
   - Admin   : সব পেজ
   - Teacher : শুধু dashboard + allowed_pages (hub/settings বন্ধ)
   - Student : শুধু student-dashboard, payment-receipt, invoice
   নতুন পেজ বানালে কিছু করতে হবে না; Teacher-কে access দিতে
   teacher-access পেজ থেকে পেজের নাম (যেমন: students) যোগ করুন।
   ========================================================= */
(function () {
  "use strict";
  window.MNQ_GUARD_VERSION = "20261116b";

  /* ---------------------------------------------------------
     Teacher session shim
     Teacher login RPC দিয়ে হয়, Supabase Auth session তৈরি হয় না।
     কিন্তু বেশিরভাগ পেজ getSession() খালি দেখলে login এ ফেরত পাঠায়।
     তাই শুধু Teacher হলে getSession()/getUser() এ "teacher session"
     দেখানো হয়। (Admin/Student এ কিছুই বদলায় না।)
     supabase-js CDN <script> এর ঠিক পরে mnqPatchSupabase() চালাতে হয়।
     --------------------------------------------------------- */
  window.mnqPatchSupabase = function () {
    try {
      if ((sessionStorage.getItem("madrasa_login_role") || "").toLowerCase() !== "teacher") return;
      var sb = window.supabase;
      if (!sb || typeof sb.createClient !== "function" || sb.__mnqPatched) return;
      var t = {};
      try { t = JSON.parse(sessionStorage.getItem("madrasa_teacher_login") || "{}") || {}; } catch (e) {}
      var user = {
        id: String(t.id || t.teacher_id || t.phone || "teacher"),
        email: t.email || "",
        role: "authenticated",
        aud: "authenticated",
        app_metadata: { role: "teacher" },
        user_metadata: { role: "teacher", name: t.name || "" }
      };
      var fake = {
        access_token: "teacher-session", refresh_token: "", token_type: "bearer",
        expires_in: 86400, expires_at: Math.floor(Date.now() / 1000) + 86400, user: user
      };
      var orig = sb.createClient;
      var wrapped = function () {
        var c = orig.apply(this, arguments);
        try {
          var a = c.auth, rs = a.getSession.bind(a), ru = a.getUser.bind(a), ro = a.onAuthStateChange.bind(a);
          a.getSession = async function () {
            var r = await rs();
            return (r && r.data && r.data.session) ? r : { data: { session: fake }, error: null };
          };
          a.getUser = async function () {
            var r = await ru();
            return (r && r.data && r.data.user) ? r : { data: { user: user }, error: null };
          };
          a.onAuthStateChange = function (cb) {
            return ro(function (ev, s) { return cb(ev, s || fake); });
          };
        } catch (e) { console.warn("teacher shim:", e); }
        return c;
      };
      var copy = {};
      Object.keys(sb).forEach(function (k) { copy[k] = sb[k]; });
      copy.createClient = wrapped;
      copy.__mnqPatched = true;
      window.supabase = copy;
    } catch (e) { console.warn("mnqPatchSupabase:", e); }
  };

  var PUBLIC = ["", "index", "login", "login-teacher", "students-login", "online-admission-public"];
  var TEACHER_BLOCKED = ["donations-hub", "accounts-hub", "settings-hub", "settings", "teacher-access", "admin"];
  var STUDENT_ALLOWED = ["student-dashboard", "payment-receipt", "invoice", "students-login"];

  function keyFor(url) {
    return String(url || "").split(/[?#]/)[0].split("/").pop().toLowerCase().replace(/\.html$/, "");
  }
  function read(k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return null; } }

  var current = keyFor(location.pathname) || "index";
  if (PUBLIC.indexOf(current) > -1) return;

  var role = (sessionStorage.getItem("madrasa_login_role") || "").toLowerCase();
  var isStudent = !!sessionStorage.getItem("madrasa_student_login") && role !== "admin" && role !== "teacher";

  if (role === "admin") return;                       // Admin = সব

  if (!role && !isStudent) {                          // লগইন নেই
    location.replace("login.html");
    return;
  }

  var allowed = {};
  if (role === "teacher") {
    var t = read("madrasa_teacher_login") || {};
    (Array.isArray(t.allowed_pages) ? t.allowed_pages : []).forEach(function (p) {
      p = keyFor(p); if (p) allowed[p] = 1;
    });
  }

  function can(url) {
    var k = keyFor(url);
    if (!k) return true;
    if (isStudent) return STUDENT_ALLOWED.indexOf(k) > -1;
    if (TEACHER_BLOCKED.indexOf(k) > -1) return false;
    if (k === "teacher-dashboard") return true;      /* শিক্ষকের নিজস্ব ড্যাশবোর্ড */
    if (k === "dashboard" || k === "student-dashboard") return false;  /* admin dashboard শিক্ষকের জন্য নয় */
    return !!allowed[k] || !!allowed["*"];
  }

  var home = isStudent ? "student-dashboard.html" : "teacher-dashboard.html";

  /* সরাসরি URL দিয়ে ঢোকা আটকানো */
  if (!can(current)) {
    document.documentElement.style.visibility = "hidden";
    location.replace(home);
    return;
  }

  /* লুকানোর CSS (পেজ আঁকার আগেই) */
  var st = document.createElement("style");
  st.textContent = 'html body [data-denied="1"],html body a[data-denied="1"]{display:none!important;visibility:hidden!important;pointer-events:none!important}';
  document.documentElement.appendChild(st);

  var SD_MAP = { sms: "sms", stu: "students", inv: "invoice", pay: "payment-receipt" };

  function deny(el) {
    el.setAttribute("data-denied", "1");
    el.setAttribute("aria-hidden", "true");
    el.setAttribute("tabindex", "-1");
    /* inline !important — পেজের নিজের CSS যেন ওভাররাইড করতে না পারে */
    el.style.setProperty("display", "none", "important");
  }

  function sweep() {
    document.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href") || "";
      if (!/\.html(?:[?#]|$)/i.test(h)) return;
      if (!isStudent && keyFor(h) === "dashboard") { a.setAttribute("href", "teacher-dashboard.html"); return; }
      if (!can(h)) deny(a);
    });
    /* onclick="location.href='x.html'" ধরনের বাটন/কার্ড */
    document.querySelectorAll("[onclick*='.html']").forEach(function (el) {
      var m = /([A-Za-z0-9_\-]+\.html)/.exec(el.getAttribute("onclick") || "");
      if (m && !can(m[1])) deny(el);
    });
    document.querySelectorAll("[data-href],[data-url]").forEach(function (el) {
      var u = el.getAttribute("data-href") || el.getAttribute("data-url") || "";
      if (/\.html/i.test(u) && !can(u)) deny(el);
    });
    document.querySelectorAll(".sd .opt").forEach(function (b) {
      var k = SD_MAP[b.dataset.a];
      if (k && !can(k)) deny(b);
    });
    /* খালি গ্রুপ লুকানো */
    document.querySelectorAll(".nav-group, .bottom-nav-group").forEach(function (g) {
      var l = g.querySelectorAll("a[href]");
      if (l.length && Array.prototype.every.call(l, function (a) { return a.getAttribute("data-denied") === "1"; }))
        g.style.setProperty("display", "none", "important");
    });
  }


  /* ডিবাগ: যেকোনো পেজের URL এর শেষে ?guarddebug দিলে নিচে একটা বার্তা আসবে */
  if (/[?&]guarddebug/.test(location.search)) {
    document.addEventListener("DOMContentLoaded", function () {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;left:6px;right:6px;top:6px;z-index:2147483647;background:#111;color:#0f0;font:12px monospace;padding:8px;border-radius:8px;white-space:pre-wrap";
      d.textContent = "guard v" + window.MNQ_GUARD_VERSION + " | page=" + current + " | role=" + (role || (isStudent ? "student" : "none")) +
        " | allowed=" + Object.keys(allowed).join(",") +
        " | hidden=" + document.querySelectorAll('[data-denied="1"]').length;
      document.body.appendChild(d);
    });
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("[data-denied=\"1\"]");
    if (a) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  document.addEventListener("DOMContentLoaded", function () {
    sweep();
    var pending = false;
    new MutationObserver(function () {
      if (pending) return; pending = true;
      setTimeout(function () { pending = false; sweep(); }, 50);
    }).observe(document.body, { childList: true, subtree: true });
  });
})();

      if(page>1)add(page-1,"‹");const a=Math.max(1,page-2),b=Math.min(pages,page+2);for(let p=a;p<=b;p++)add(p,fmtN(p),p===page);if(page<pages)add(page+1,"›")}
    $(o.pgr).innerHTML=h;if(o.after)o.after(part);
  }
  $(o.pgr).onclick=e=>{const b=e.target.closest("button[data-p]");if(b){page=Number(b.dataset.p);run()}};
  $(o.size).onchange=()=>{page=1;run()};$(o.q).oninput=()=>{page=1;run()};
  return {run,reset(){page=1}};
}

let ST=[],CL=[],PG=null,SEL=new Set();
const isInactive=s=>s.is_active===false||["inactive","dismissed","suspended","withdrawn","transferred","graduated"].indexOf(String(s.status||"").toLowerCase())>-1;
const REASONS=["r1","r2","r3","r4","r5"];
function fill(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("lang").value=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(e=>e.placeholder=t(e.dataset.tp));
  document.title=t("title")+" | "+t("schoolName");
  const keep=$("dc").value;
  $("dc").innerHTML='<option value="">'+esc(t("allClass"))+'</option>'+CL.map(c=>'<option value="'+c.id+'">'+esc(clsName(c))+'</option>').join("");$("dc").value=keep||"";
  const kr=$("dr").value;$("dr").innerHTML=REASONS.map(r=>'<option value="'+r+'">'+esc(t(r))+'</option>').join("");if(kr)$("dr").value=kr;
  render();
}
function inList(){return ST.filter(isInactive)}
function render(){
  const ina=inList();
  $("nIn").textContent=fmtN(ina.length);$("nAct").textContent=fmtN(ST.length-ina.length);$("cnt").textContent=fmtN(ina.length)+" "+t("inactive");
  PG.run();updSel();
}
function reasonText(r){const k=REASONS.find(x=>TX[x][0]===r||TX[x][1]===r||TX[x][2]===r);return k?t(k):(r||"-")}
function mkPager(){
 PG=pager({rows:inList,tbody:"tb",info:"info",pgr:"pgr",size:"ps",q:"q",cols:6,
  text:r=>[r.name,r.student_id,r.roll_number,clsName(CL.find(c=>String(c.id)===String(r.class_id)))].join(" "),
  render:(part,st)=>part.map((r,i)=>{const c=CL.find(x=>String(x.id)===String(r.class_id));
   return '<tr><td><input type="checkbox" data-sel="'+r.id+'" '+(SEL.has(r.id)?"checked":"")+'> '+fmtN(st+i+1)+'</td>'+
   '<td><b>'+esc(r.name)+'</b><br><small style="color:#6b7c74">ID: '+esc(r.student_id||r.id)+(r.roll_number?" · Roll "+esc(r.roll_number):"")+'</small></td>'+
   '<td>'+esc(clsName(c)||"-")+'</td><td>'+esc(r.inactive_at?String(r.inactive_at).slice(0,10):"-")+'</td>'+
   '<td><span class="pill g">'+esc(reasonText(r.inactive_reason))+'</span></td>'+
   '<td><div class="ca"><button class="rb a" data-act="on" data-id="'+r.id+'">'+esc(t("actv"))+'</button><button class="rb d" data-act="del" data-id="'+r.id+'">'+esc(t("del"))+'</button></div></td></tr>'}).join("")});
}
function updSel(){$("selc").textContent=fmtN(SEL.size);$("bBulk").disabled=!SEL.size}
function colErr(e){return /is_active|inactive_at|inactive_reason|column/i.test(e.message||"")?t("errCol")+" ("+e.message+")":(e.message||String(e))}
async function setActive(ids){
  const r=await sb.from("students").update({is_active:true,inactive_at:null,inactive_reason:null}).in("id",ids);
  if(r.error){alertBox(colErr(r.error),1);return false}
  ids.forEach(id=>{const s=ST.find(x=>x.id===id);if(s){s.is_active=true;s.inactive_at=null;s.inactive_reason=null;if(s.status&&isInactive(s))s.status="active"}});
  ids.forEach(id=>SEL.delete(id));return true;
}
$("tb").addEventListener("click",async e=>{
  const sel=e.target.closest("[data-sel]");if(sel){const id=Number(sel.dataset.sel);sel.checked?SEL.add(id):SEL.delete(id);updSel();return}
  const b=e.target.closest("[data-act]");if(!b)return;const id=Number(b.dataset.id);b.disabled=true;
  if(b.dataset.act==="on"){
    if(!confirm(t("cActv"))){b.disabled=false;return}
    if(await setActive([id])){toast(t("okAct"));render()}else b.disabled=false;
  }else{
    if(!confirm(t("cDel"))||!confirm(t("cDel2"))){b.disabled=false;return}
    const r=await sb.from("students").delete().eq("id",id);
    if(r.error){alertBox(r.error.message,1);b.disabled=false;return}
    ST=ST.filter(x=>x.id!==id);SEL.delete(id);toast(t("okDel"));render();
  }
});
$("chkAll").onchange=function(){document.querySelectorAll("[data-sel]").forEach(c=>{c.checked=this.checked;const id=Number(c.dataset.sel);this.checked?SEL.add(id):SEL.delete(id)});updSel()};
$("bBulk").onclick=async()=>{if(!SEL.size||!confirm(t("cBulk")))return;if(await setActive([...SEL])){toast(t("okAct"));render()}};

/* ---- শিক্ষার্থী নিষ্ক্রিয় করুন (modal) ---- */
let DSEL=new Set();
function dList(){
  const q=($("dq").value||"").trim().toLowerCase(),c=$("dc").value;
  const list=ST.filter(s=>!isInactive(s)&&(!c||String(s.class_id)===c)&&(!q||[s.name,s.student_id,s.roll_number].join(" ").toLowerCase().includes(q))).slice(0,80);
  $("dl").innerHTML=list.length?list.map(s=>{const cl=CL.find(x=>String(x.id)===String(s.class_id));
    return '<label><input type="checkbox" data-d="'+s.id+'" '+(DSEL.has(s.id)?"checked":"")+'><span><b>'+esc(s.name)+'</b> <small>ID: '+esc(s.student_id||s.id)+' · '+esc(clsName(cl))+(s.roll_number?" · Roll "+esc(s.roll_number):"")+'</small></span></label>'}).join(""):'<div class="empty2">'+esc(t("noRes"))+'</div>';
  $("dsel").textContent=fmtN(DSEL.size);
}
$("bNew").onclick=()=>{DSEL.clear();$("dq").value="";dList();$("dm").classList.add("show")};
$("bX").onclick=()=>$("dm").classList.remove("show");
$("dm").onclick=e=>{if(e.target.id==="dm")$("dm").classList.remove("show")};
$("dq").oninput=dList;$("dc").onchange=dList;
$("dl").addEventListener("change",e=>{const c=e.target.closest("[data-d]");if(!c)return;const id=Number(c.dataset.d);c.checked?DSEL.add(id):DSEL.delete(id);$("dsel").textContent=fmtN(DSEL.size)});
$("bDo").onclick=async()=>{
  if(!DSEL.size){toast(t("pickSome"),1);return}
  const rk=$("dr").value,reason=(t(rk)||"")+($("dn").value.trim()?" — "+$("dn").value.trim():"");
  const ids=[...DSEL],now=new Date().toISOString();
  const r=await sb.from("students").update({is_active:false,inactive_at:now,inactive_reason:reason}).in("id",ids);
  if(r.error){toast(colErr(r.error),1);return}
  ids.forEach(id=>{const s=ST.find(x=>x.id===id);if(s){s.is_active=false;s.inactive_at=now;s.inactive_reason=reason}});
  $("dm").classList.remove("show");toast(fmtN(ids.length)+" — "+t("okDeact"));render();
};
(async function(){
  mkPager();fill();
  if(!sb){alertBox("Supabase offline",1);return}
  const s=await sb.auth.getSession();if(!(s.data&&s.data.session)){location.href="login.html";return}
  const [a,b]=await Promise.all([sb.from("students").select("*").order("id",{ascending:true}),sb.from("classes").select("*").order("id",{ascending:true})]);
  if(a.error){alertBox(a.error.message,1);return}
  ST=a.data||[];CL=b.data||[];fill();
})();

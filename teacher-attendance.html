<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Attendance</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#222}
.top{background:#075c43;color:#fff;padding:17px 22px;display:flex;justify-content:space-between}
.top h2{margin:0;color:#fff}.top a{color:#fff;text-decoration:none}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.box{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{font-weight:bold;font-size:14px}
input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #ddd;border-radius:7px}
button{border:0;padding:11px 17px;border-radius:7px;background:#087f5b;color:#fff;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
th{background:#075c43;color:#fff}
.table-wrap{overflow:auto}
#msg{margin-top:12px}
@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>

<body>

<header class="top">
<h2>👨‍🏫 Teacher Attendance</h2>
<a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="box">
<h3>Attendance নেওয়া</h3>

<div class="form">

<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Teacher</label>
<select id="teacher">
<option value="">সব Teacher</option>
</select>
</div>

<div class="full">
<button onclick="loadTeachers()">Load Teachers</button>
</div>

</div>
</div>

<div class="box">
<h3>👨‍🏫 Teacher List</h3>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>নাম</th>
<th>পদবি</th>
<th>Attendance</th>
</tr>
</thead>
<tbody id="teacherList">
<tr><td colspan="3">Date নির্বাচন করে Load Teachers চাপুন</td></tr>
</tbody>
</table>
</div>

<br>
<button onclick="saveAttendance()">💾 Save Attendance</button>
<div id="msg"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";
const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let teachers=[];

document.getElementById("date").value=
new Date().toISOString().split("T")[0];

async function start(){

const {data:{session}}=await db.auth.getSession();

if(!session){
location.href="admin.html";
return;
}

const {data,error}=await db
.from("teachers")
.select("id,name,designation")
.order("name");

if(error){
alert(error.message);
return;
}

teachers=data||[];

const select=document.getElementById("teacher");

teachers.forEach(t=>{
select.innerHTML+=`
<option value="${t.id}">
${escapeHtml(t.name)}
</option>`;
});

loadTeachers();
}

async function loadTeachers(){

const selected=document.getElementById("teacher").value;

let list=teachers;

if(selected){
list=teachers.filter(t=>String(t.id)===String(selected));
}

const date=document.getElementById("date").value;

const {data:old,error}=await db
.from("teacher_attendance")
.select("teacher_id,status")
.eq("attendance_date",date);

if(error){
document.getElementById("msg").textContent=
"❌ "+error.message;
return;
}

const oldMap={};
(old||[]).forEach(x=>{
oldMap[x.teacher_id]=x.status;
});

const tbody=document.getElementById("teacherList");

if(!list.length){
tbody.innerHTML=
'<tr><td colspan="3">কোনো Teacher নেই</td></tr>';
return;
}

tbody.innerHTML=list.map((t,i)=>{

const status=oldMap[t.id]||"present";

return `
<tr>
<td>${escapeHtml(t.name)}</td>
<td>${escapeHtml(t.designation||"-")}</td>
<td>
<select id="status_${t.id}">
<option value="present" ${status==="present"?"selected":""}>
উপস্থিত
</option>
<option value="absent" ${status==="absent"?"selected":""}>
অনুপস্থিত
</option>
</select>
</td>
</tr>
`;

}).join("");
}

async function saveAttendance(){

const date=document.getElementById("date").value;
const selected=document.getElementById("teacher").value;

let list=teachers;

if(selected){
list=teachers.filter(t=>String(t.id)===String(selected));
}

if(!list.length){
alert("Teacher পাওয়া যায়নি");
return;
}

const rows=list.map(t=>({
teacher_id:t.id,
attendance_date:date,
status:document.getElementById("status_"+t.id).value
}));

const {error}=await db
.from("teacher_attendance")
.upsert(rows,{
onConflict:"teacher_id,attendance_date"
});

if(error){
document.getElementById("msg").textContent=
"❌ "+error.message;
return;
}

document.getElementById("msg").textContent=
"✅ Teacher Attendance saved successfully";
}

document.getElementById("date").addEventListener(
"change",loadTeachers
);

document.getElementById("teacher").addEventListener(
"change",loadTeachers
);

function escapeHtml(value){
return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

start();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | মাদরাসায়ে নূরুল কুরআন</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f6;color:#17212b;font-family:"Noto Sans Bengali",Arial,sans-serif}
header{height:76px;background:#55afd0;color:#fff;display:flex;align-items:center;padding:0 18px;gap:16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0002}
header button{background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
.logo{font-size:22px;font-weight:800;margin-right:auto}
.top-user{font-size:13px}
.logout{border:1px solid #ffffff77!important;border-radius:7px!important;padding:7px 10px!important;font-size:12px!important}
main{max-width:1250px;margin:auto;padding:18px}
.admin-banner{
background:#fff;border-radius:16px;box-shadow:0 2px 10px #00000012;
overflow:hidden;margin-bottom:16px;border:1px solid #e6eaed
}
.admin-banner img{display:block;width:100%;height:auto;max-height:420px;object-fit:cover;filter:saturate(.88) hue-rotate(0deg)}
.hero{background:linear-gradient(120deg,#101820,#173449);color:#fff;border-radius:16px;padding:28px;min-height:220px}
.hero h1{font-size:30px;margin:0 0 8px}.hero p{font-size:17px;margin:0;color:#dce8ef}
.date{margin-top:25px;background:#ffffff12;border:1px solid #ffffff20;border-radius:12px;padding:14px;font-size:17px}
.title{font-size:21px;font-weight:800;margin:24px 0 10px;color:#155f80}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card,.panel{background:#fff;border-radius:14px;box-shadow:0 2px 10px #00000012}
.card{padding:17px;display:flex;align-items:center;gap:13px;border:1px solid #e6eaed}
.icon{width:48px;height:48px;border-radius:10px;background:#126b8e;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.card strong{display:block;font-size:23px;color:#12688e}.card span{color:#65727b;font-size:13px}
.panel{padding:17px;margin-bottom:16px}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.menu .card{min-height:112px;justify-content:center;flex-direction:column;cursor:pointer;text-align:center;transition:.15s}
.menu .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0002;border-color:#8bc8df}
.chart{height:300px;position:relative}
.notice{background:#eaf6fb;border:1px solid #c9e6f0;padding:12px;border-radius:9px;color:#17607c;font-size:13px}
footer{text-align:center;padding:28px;color:#7a858b;font-size:12px}
.drawer{position:fixed;inset:0;z-index:50;display:none}.drawer.show{display:block}
.drawer-bg{position:absolute;inset:0;background:#0005}.drawer-box{position:absolute;left:0;top:0;bottom:0;width:290px;background:#fff;padding:20px;overflow:auto}
.drawer-box h3{margin:5px 0 20px;color:#12688e}.drawer-box a{display:block;padding:11px;border-radius:8px;text-decoration:none;color:#333;margin-bottom:5px}.drawer-box a:hover{background:#edf7fb}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.menu{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.admin-banner img{max-height:240px;object-fit:cover}header{height:68px}.logo{font-size:17px}.top-user{display:none}main{padding:12px}.hero{padding:20px}.hero h1{font-size:23px}.grid{grid-template-columns:1fr}.menu{grid-template-columns:repeat(2,1fr)}.card strong{font-size:21px}}

:root{
  --theme:#55afd0;
  --theme-dark:#086a91;
  --theme-deep:#075777;
  --bg:#f1f4f6;
  --card:#ffffff;
  --text:#17212b;
  --muted:#68737d;
  --border:#e3e8eb;
  --success:#079447;
  --danger:#c90000;
  --info:#07589a;
}
body{background:var(--bg);color:var(--text)}
header{background:var(--theme)!important}
a,.link,.section-title,.nav-title{color:var(--theme-dark)}
button,.btn,.primary,.save-btn{background:var(--theme-dark)}
button:hover,.btn:hover,.primary:hover,.save-btn:hover{background:var(--theme-deep)}
.card,.panel,.modal,.table-wrap,.stat-card,.admin-banner{
  background:var(--card);
  border-color:var(--border);
}
input,select,textarea{
  border-color:#d8e0e5;
  background:#fff;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--theme);
  outline:2px solid #55afd033;
}
.sidebar,.side-menu{background:#fff!important}
.sidebar a,.side-menu a{color:#17465a!important}
.sidebar a:hover,.side-menu a:hover,.sidebar a.active,.side-menu a.active{
  background:#e8f6fb!important;color:var(--theme-dark)!important;
}
.stat-card .icon,.menu-icon,.feature-icon{background:var(--theme-dark)!important}
.stat-card h3,.number,.count{color:var(--theme-dark)}
.badge,.year-badge{background:var(--theme-dark)!important}
.section-header{border-bottom-color:var(--border)}
table th{background:#e8f6fb!important;color:#17465a}
table td{border-color:var(--border)}
.success,.income{background:var(--success)!important}
.danger,.expense{background:var(--danger)!important}
.info,.balance{background:var(--info)!important}
.admin-banner{box-shadow:0 2px 10px #00000012}

</style>
</head>

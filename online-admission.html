.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fffdf8;border-bottom:1px solid rgba(201,162,39,.3);position:sticky;top:0;z-index:20}
.sn{flex:1;color:var(--g);font-size:15px}
.acts{display:flex;gap:8px;align-items:center}
.tb,select{border:1px solid rgba(201,162,39,.35);background:#fffdf8;color:var(--g);border-radius:12px;padding:8px 11px;font-size:14px;cursor:pointer}
main{max-width:1100px;margin:14px auto;padding:0 14px}
.hero{display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,#0c4a34,#093a29);color:#fff;border-radius:22px;padding:30px 16px;box-shadow:0 10px 26px rgba(14,70,50,.25)}
.hi{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#e8c766}
h1{font-size:22px;font-weight:700}.nm{font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.card{background:#fffdf8;border:1px solid rgba(201,162,39,.25);border-top:3px solid var(--gold);border-radius:20px;padding:20px 8px 16px;text-align:center;box-shadow:0 8px 20px rgba(14,70,50,.1);color:inherit;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:12px;transition:.2s}
.card:hover{transform:translateY(-3px)}
.ic{width:52px;height:52px;border-radius:50%;background:var(--cream);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:20px}
.nm{font-size:13px;line-height:1.4}
@media(min-width:760px){.grid{grid-template-columns:repeat(5,1fr)}.nm{font-size:15px}}
.bn{position:fixed;inset:auto 0 0 0;display:flex;background:#fffdf8;border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(14,70,50,.15);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.bn a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#6b7d73;padding:6px 2px;border-radius:16px;text-decoration:none}
.bn a i{font-size:20px}.bn a.active{background:#e9f1ea;color:var(--g);font-weight:700}
.fab{position:fixed;inset-inline-end:16px;bottom:92px;width:54px;height:54px;border-radius:50%;background:var(--g);color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 8px 20px rgba(14,90,64,.4);z-index:31}

.sv{width:1em;height:1em;fill:currentColor;vertical-align:-.125em;display:inline-block}
.rail{position:fixed;inset-block:58px 0;inset-inline-start:0;width:46px;background:linear-gradient(180deg,#0f5a40,#093a29);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:14px;z-index:25}
.rail a{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#e8c766;font-size:16px}
.rail a.on{background:#e8c766;color:#073826}

.top{padding-inline-start:56px}

.hero2{background:linear-gradient(135deg,#0c4a34,#093a29);color:#fff;border-radius:22px;padding:20px 14px;text-align:center;box-shadow:0 10px 26px rgba(14,70,50,.25)}
.hero2 h1{font-size:22px;display:flex;gap:10px;align-items:center;justify-content:center}.hero2 .bt{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.hbt{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.wrap{background:#fffdf8;border-radius:22px;padding:14px;margin-top:14px;box-shadow:0 8px 20px rgba(14,70,50,.1)}
.stepper{border:1px solid #e3e3e3;border-radius:16px;padding:14px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.sp{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:#f0f2f2;border:1px solid #dde;color:#444;font-size:14px}.sp b{width:30px;height:30px;border-radius:9px;background:#dfe5e3;display:flex;align-items:center;justify-content:center}
.sp.on{background:#0e5a40;color:#fff;border-color:#0e5a40}.sp.on b{background:rgba(255,255,255,.2)}.sp.done{background:#dff3e8;border-color:#b7dcc8;color:#0e5a40}.sp.done b{background:#0e5a40;color:#fff}.ln{width:34px;height:2px;background:#0e5a40}

.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px}.f label{display:block;font-size:13px;margin-bottom:6px;color:#222;line-height:1.35}.f label i{color:#d33;font-style:normal}

.ex{border:1px solid #e3e3e3;border-radius:14px;margin-top:16px;overflow:hidden}.ex h4{padding:12px 14px;display:flex;gap:8px;align-items:center;font-weight:600}.exg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding:14px}

.msg{margin-top:12px;padding:12px;border-radius:12px;font-size:14px;display:none}.msg.ok{display:block;background:#dff3e8;color:#0e5a40}.msg.bad{display:block;background:#fde8e8;color:#a11}
.hid{display:none}

.ra{display:flex;gap:8px;flex-wrap:wrap;width:100%}.ra button{border:0;border-radius:9px;padding:8px 14px;color:#fff;font-family:inherit;cursor:pointer}

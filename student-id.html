<!DOCTYPE html>

<style>

*{

padding:0;

font-family:'Noto Sans Bengali',sans-serif;

body{

header{

}

header p{

}

.back-btn{

padding:10px 18px;

text-decoration:none;

color:#fff;

font-weight:bold;

}

.container{

max-width:1400px;

margin:auto;

padding:20px;

display:grid;

grid-template-columns:360px 1fr;

}

.sidebar{

background:#fff;

border-radius:15px;

padding:20px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.viewer{

background:#fff;

border-radius:15px;

padding:20px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.search-box{

width:100%;

padding:12px;

border:1px solid #ddd;

border-radius:8px;

margin-bottom:12px;

}

.btn{

width:100%;

padding:12px;

background:#087f5b;

border:none;

border-radius:8px;

color:#fff;

font-weight:bold;

margin-bottom:15px;

}

.student-list{

max-height:650px;

overflow:auto;

}

.student-item{

display:flex;

cursor:pointer;

}

background:#f5f5f5;

}

.student-item img{

width:55px;

height:55px;

border-radius:50%;

object-fit:cover;

}

#idCard{

display:none;

width:360px;

margin:auto;

border-radius:18px;

overflow:hidden;

background:#fff;

border:3px solid #075c43;

}

</style>

</head>

<body>

<header>

<div>

<h2>

মাদরাসায়ে নূরুল কুরআন

</h2>

<p>

Professional Student ID Card System

</p>

</div>

<a href="dashboard.html" class="back-btn">

⬅ Dashboard

</a>

</header> 

 <div class="container">

<div class="sidebar">

<input
type="text"
id="searchBox"
class="search-box"
placeholder="Student ID / Roll / Name">

<button
id="searchBtn"
class="btn">

🔍 Search Student

</button>

<div
id="studentList"
class="student-list">

Loading Students...

</div>

</div>

<div class="viewer">

<div id="idCard">

<div style="background:#075c43;color:#fff;padding:15px;text-align:center;">

<img
src="logo.png"
style="
width:70px;
height:70px;
object-fit:contain;
">

<h2 style="margin-top:10px;">

মাদরাসায়ে নূরুল কুরআন

</h2>

<p>

STUDENT ID CARD

</p>

</div>

<div style="padding:20px;text-align:center;">

<img
id="cardPhoto"
style="
width:120px;
height:120px;
border-radius:50%;
border:4px solid #075c43;
object-fit:cover;
">

<h2
id="cardName"
style="
margin-top:12px;
color:#075c43;
">

</h2>

<p
id="cardID"
style="
font-size:18px;
font-weight:bold;
margin-top:5px;
">

</p>

<hr style="margin:15px 0;">

<table style="width:100%;line-height:2;">

<tr>

<td><b>Father</b></td>

<td id="cardFather"></td>

</tr>

<tr>

<td><b>Mother</b></td>

<td id="cardMother"></td>

</tr>

<tr>

<td><b>Class</b></td>

<td id="cardClass"></td>

</tr>

<tr>

<td><b>Roll</b></td>

<td id="cardRoll"></td>

</tr>

<tr>

<td><b>Session</b></td>

<td id="cardSession"></td>

</tr>

<tr>

<td><b>Blood</b></td>

<td id="cardBlood"></td>

</tr>

<tr>

<td><b>Mobile</b></td>

<td id="cardMobile"></td>

</tr>

</table>

<div
id="qr"
style="
margin-top:20px;
display:flex;
justify-content:center;
">

</div>

<button
id="printBtn"
class="btn"
style="margin-top:15px;">

🖨 Print ID

</button>

<button
id="pdfBtn"
class="btn">

📄 Download PDF

</button>

</div>

</div>

</div>

</div> 

<script>

const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY="তোমার Publishable Key";

const db=window.supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);

let students=[];

async function loadStudents(){

const {data,error}=await db

.from("students")

.select("*")

.order("id",{ascending:true});

if(error){

alert(error.message);

return;

}

students=data||[];

renderStudents();

}

function renderStudents(){

const list=document.getElementById("studentList");

if(students.length===0){

list.innerHTML="<center>No Student Found</center>";

return;

}

list.innerHTML="";

students.forEach(student=>{

const div=document.createElement("div");

div.className="student-item";

div.innerHTML=`

<img src="${student.photo_url||'no-image.png'}">

<div>

<b>${student.student_name}</b><br>

${student.class_name||""}<br>

Roll : ${student.roll||""}

</div>

`;

div.onclick=()=>showCard(student.id);

list.appendChild(div);

});

} 
async function showCard(id){

const s=students.find(x=>x.id===id);

if(!s) return;

/* Auto Student ID */

if(!s.student_id){

const code=`MQ-${new Date().getFullYear()}-${String(s.id).padStart(4,"0")}`;

const {error}=await db

.from("students")

.update({

student_id:code

})

.eq("id",s.id);

if(!error){

s.student_id=code;

}

}

/* Card Show */

document.getElementById("idCard").style.display="block";

document.getElementById("cardPhoto").src=s.photo_url||"no-image.png";

document.getElementById("cardName").innerText=s.student_name||"";

document.getElementById("cardID").innerText=s.student_id||"";

document.getElementById("cardFather").innerText=s.father_name||"-";

document.getElementById("cardMother").innerText=s.mother_name||"-";

document.getElementById("cardClass").innerText=s.class_name||"-";

document.getElementById("cardRoll").innerText=s.roll||"-";

document.getElementById("cardSession").innerText=s.session||"-";

document.getElementById("cardBlood").innerText=s.blood_group||"-";

document.getElementById("cardMobile").innerText=s.mobile||"-";

/* QR */

const qr=document.getElementById("qr");

qr.innerHTML="";

const canvas=document.createElement("canvas");

QRCode.toCanvas(canvas,s.student_id);

qr.appendChild(canvas);

}

loadStudents();
 /* ===========================
   SEARCH SYSTEM
=========================== */

document.getElementById("searchBtn").onclick=searchStudent;

document.getElementById("searchBox").addEventListener("keyup",function(e){

if(e.key==="Enter"){

searchStudent();

}

});

function searchStudent(){

const key=document.getElementById("searchBox").value.trim().toLowerCase();

if(key===""){

renderStudents();

return;

}

const result=students.filter(s=>

(s.student_name||"").toLowerCase().includes(key)||

(s.student_id||"").toLowerCase().includes(key)||

(s.roll||"").toString().includes(key)||

(s.class_name||"").toLowerCase().includes(key)

);

const list=document.getElementById("studentList");

list.innerHTML="";

if(result.length===0){

list.innerHTML="<center>No Student Found</center>";

return;

}

result.forEach(student=>{

const div=document.createElement("div");

div.className="student-item";

div.innerHTML=`

<img src="${student.photo_url||'no-image.png'}">

<div>

<b>${student.student_name}</b><br>

${student.class_name||""}<br>

Roll : ${student.roll||""}

</div>

`;

div.onclick=()=>showCard(student.id);

list.appendChild(div);

});

}

/* ===========================
   PRINT
=========================== */

document.getElementById("printBtn").onclick=function(){

window.print();

};

/* ===========================
   PDF
=========================== */

document.getElementById("pdfBtn").onclick=function(){

window.print();

};

/* ===========================
   AUTO REFRESH
=========================== */

setInterval(loadStudents,10000);

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Student ID Card</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Bengali',sans-serif;
}

body{

background:#eef2f7;

}

header{

background:#075c43;

color:#fff;

padding:18px 25px;

display:flex;

justify-content:space-between;

align-items:center;

}

header a{

color:#fff;

text-decoration:none;

font-weight:bold;

}

.container{

max-width:1400px;

margin:auto;

padding:20px;

display:grid;

grid-template-columns:350px 1fr;

gap:20px;

}

.left{

background:#fff;

padding:20px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.right{

background:#fff;

padding:20px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

display:flex;

justify-content:center;

align-items:flex-start;

}

.search{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:8px;

margin-bottom:10px;

}

.btn{

width:100%;

padding:12px;

border:none;

background:#087f5b;

color:#fff;

border-radius:8px;

font-weight:bold;

cursor:pointer;

margin-bottom:15px;

}

.student-item{

display:flex;

gap:10px;

padding:10px;

border-bottom:1px solid #eee;

cursor:pointer;

}

.student-item:hover{

background:#f7f7f7;

}

.student-item img{

width:55px;

height:55px;

border-radius:50%;

object-fit:cover;

border:2px solid #087f5b;

}

#idCard{

width:360px;

border:3px solid #075c43;

border-radius:18px;

overflow:hidden;

background:#fff;

display:none;

}

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

}

</style>

</head> 
   <body>

<header>

<div>

<h2>মাদরাসায়ে নূরুল কুরআন</h2>

<p style="font-size:13px;opacity:.8">
Professional Student ID Card System
</p>

</div>

<a href="dashboard.html">
← Dashboard
</a>

</header>

<div class="container">

<!-- LEFT -->

<div class="left">

<input
type="text"
id="searchBox"
class="search"
placeholder="Student ID / Roll / Name">

<button
id="searchBtn"
class="btn">

🔍 Search Student

</button>

<div id="studentList">

Loading Students...

</div>

</div>

<!-- RIGHT -->

<div class="right">

<div id="idCard">

<!-- Header -->

<div style="background:#075c43;color:#fff;text-align:center;padding:15px;">

<img
src="logo.png"
style="width:60px;height:60px;object-fit:contain;">

<h2 style="margin-top:10px;font-size:22px">

মাদরাসায়ে নূরুল কুরআন

</h2>

<p style="font-size:13px">

STUDENT ID CARD

</p>

</div>

<!-- Body -->

<div style="padding:20px;text-align:center;">

<img
id="cardPhoto"
style="
width:120px;
height:120px;
border-radius:50%;
border:4px solid #075c43;
object-fit:cover;
">

<h2
id="cardName"
style="
margin-top:10px;
color:#075c43;
">

</h2>

<p
id="cardStudentId"
style="
font-weight:bold;
font-size:18px;
margin-top:5px;
">

</p>

<hr style="margin:15px 0">

<table
style="
width:100%;
line-height:2;
font-size:15px;
">

<tr>

<td align="left"><b>Father</b></td>

<td id="cardFather"></td>

</tr>

<tr>

<td align="left"><b>Mother</b></td>

<td id="cardMother"></td>

</tr>

<tr>

<td align="left"><b>Class</b></td>

<td id="cardClass"></td>

</tr>

<tr>

<td align="left"><b>Admission</b></td>

<td id="cardAdmission"></td>

</tr>

<tr>

<td align="left"><b>Mobile</b></td>

<td id="cardPhone"></td>

</tr>

</table>

<div
id="qr"
style="
margin-top:18px;
display:flex;
justify-content:center;
">

</div>

<button
id="printBtn"
class="btn"
style="margin-top:15px">

🖨 Print ID

</button>

</div>

<div
style="
background:#075c43;
color:#fff;
padding:10px;
text-align:center;
font-size:12px;
">

If Found Please Return To Madrasah Office

</div>

</div>

</div>

</div> 
<script>

const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let students=[];
let classes=[];

async function init(){

const {data:{session}}=
await db.auth.getSession();

if(!session){

location.href="admin.html";

return;

}

await Promise.all([

loadClasses(),

loadStudents()

]);

}

async function loadClasses(){

const {data,error}=await db

.from("classes")

.select("id,name");

if(error){

console.log(error);

return;

}

classes=data||[];

}

async function loadStudents(){

const {data,error}=await db

.from("students")

.select("*")

.order("created_at",{ascending:false});

if(error){

alert(error.message);

return;

}

students=data||[];

renderStudents(students);

}

function getClassName(id){

const c=classes.find(x=>String(x.id)===String(id));

return c?c.name:"-";

}

function renderStudents(list){

const box=document.getElementById("studentList");

if(list.length===0){

box.innerHTML="<center>No Student Found</center>";

return;

}

box.innerHTML=list.map(s=>`

<div class="student-item"

onclick="showCard('${s.id}')">

<img src="${s.photo_url||'https://placehold.co/120x120'}">

<div>

<b>${s.name||"-"}</b><br>

ID : ${s.student_id||"-"}<br>

${getClassName(s.class_id)}

</div>

</div>

`).join("");

}

init(); 
   async function showCard(id){

const s=students.find(x=>String(x.id)===String(id));

if(!s) return;

/* Student ID Auto Generate */

if(!s.student_id){

const newId=`MQ-${new Date().getFullYear()}-${String(s.id).padStart(4,"0")}`;

const {error}=await db

.from("students")

.update({

student_id:newId

})

.eq("id",s.id);

if(!error){

s.student_id=newId;

}

}

/* Photo */

document.getElementById("cardPhoto").src=

s.photo_url||"https://placehold.co/120x120";

/* Information */

document.getElementById("cardName").innerText=

s.name||"-";

document.getElementById("cardStudentId").innerText=

s.student_id||"-";

document.getElementById("cardFather").innerText=

s.father_name||"-";

document.getElementById("cardMother").innerText=

s.mother_name||"-";

document.getElementById("cardClass").innerText=

getClassName(s.class_id);

document.getElementById("cardAdmission").innerText=

s.admission_date||"-";

document.getElementById("cardPhone").innerText=

s.phone||"-";

/* Show Card */

document.getElementById("idCard").style.display="block";

/* QR */

const qr=document.getElementById("qr");

qr.innerHTML="";

const canvas=document.createElement("canvas");

QRCode.toCanvas(

canvas,

s.student_id,

{width:140},

function(err){

if(!err){

qr.appendChild(canvas);

}

}

);

} 
/* ===========================
SEARCH
=========================== */

document.getElementById("searchBtn").onclick=searchStudent;

document.getElementById("searchBox").addEventListener("keyup",function(e){

if(e.key==="Enter"){

searchStudent();

}

});

function searchStudent(){

const key=document.getElementById("searchBox").value.trim().toLowerCase();

if(key===""){

renderStudents(students);

return;

}

const result=students.filter(s=>

(s.student_id||"").toLowerCase().includes(key)||

(s.name||"").toLowerCase().includes(key)||

(s.phone||"").toLowerCase().includes(key)

);

renderStudents(result);

}

/* ===========================
PRINT
=========================== */

document.getElementById("printBtn").onclick=function(){

window.print();

};

/* ===========================
AUTO REFRESH
=========================== */

setInterval(async()=>{

await loadStudents();

},15000);

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Student ID Card</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Bengali',sans-serif;
}

body{
background:#edf2f7;
}

header{

background:#075c43;

color:#fff;

padding:18px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 4px 12px rgba(0,0,0,.2);

}

header h2{

font-size:24px;

font-weight:700;

}

header p{

font-size:13px;

opacity:.8;

}

.back-btn{

background:#0b8b63;

padding:10px 18px;

border-radius:8px;

color:#fff;

text-decoration:none;

font-weight:bold;

}

.container{

max-width:1400px;

margin:auto;

padding:20px;

display:grid;

grid-template-columns:360px 1fr;

gap:20px;

}

.sidebar{

background:#fff;

padding:20px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.viewer{

background:#fff;

padding:20px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.search{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:8px;

margin-bottom:10px;

font-size:15px;

}

.btn{

width:100%;

padding:12px;

background:#087f5b;

color:#fff;

border:none;

border-radius:8px;

cursor:pointer;

font-size:15px;

font-weight:bold;

margin-bottom:15px;

}

.student-list{

max-height:700px;

overflow:auto;

}

.student-item{

display:flex;

gap:10px;

padding:10px;

border-bottom:1px solid #eee;

cursor:pointer;

transition:.3s;

}

.student-item:hover{

background:#f5f5f5;

}

.student-item img{

width:55px;

height:55px;

border-radius:50%;

object-fit:cover;

border:2px solid #075c43;

}

#idCard{

display:none;

width:360px;

margin:auto;

background:#fff;

border:3px solid #075c43;

border-radius:18px;

overflow:hidden;

}

</style>

</head> 
<body>

<header>

<div>

<h2>মাদরাসায়ে নূরুল কুরআন</h2>

<p>Professional Student ID Card System</p>

</div>

<a href="dashboard.html" class="back-btn">

⬅ Dashboard

</a>

</header>

<div class="container">

<div class="sidebar">

<input
type="text"
id="searchBox"
class="search"
placeholder="Student ID / Roll / Name">

<button
id="searchBtn"
class="btn">

Search Student

</button>

<div
id="studentList"
class="student-list">

Loading Students...

</div>

</div>

<div class="viewer">

<div id="idCard">

<div style="background:#075c43;color:#fff;text-align:center;padding:18px;">

<img
src="logo.png"
style="width:65px;height:65px;object-fit:contain;">

<h2 style="margin-top:8px;font-size:22px;">

মাদরাসায়ে নূরুল কুরআন

</h2>

<p>

STUDENT ID CARD

</p>

</div>

<div style="padding:20px;text-align:center;">

<img
id="cardPhoto"
style="

width:120px;

height:120px;

border-radius:50%;

border:4px solid #075c43;

object-fit:cover;

box-shadow:0 5px 15px rgba(0,0,0,.25);

">

<h2
id="cardName"
style="margin-top:12px;color:#075c43;">

</h2>

<p
id="cardID"
style="font-weight:bold;font-size:18px;margin-top:5px;">

</p>

<hr style="margin:15px 0;">

<table style="width:100%;line-height:2;font-size:15px;">

<tr>

<td align="left"><b>Father</b></td>

<td id="cardFather"></td>

</tr>

<tr>

<td align="left"><b>Mother</b></td>

<td id="cardMother"></td>

</tr>

<tr>

<td align="left"><b>Class</b></td>

<td id="cardClass"></td>

</tr>

<tr>

<td align="left"><b>Roll</b></td>

<td id="cardRoll"></td>

</tr>

<tr>

<td align="left"><b>Session</b></td>

<td id="cardSession"></td>

</tr>

<tr>

<td align="left"><b>Blood</b></td>

<td id="cardBlood"></td>

</tr>

<tr>

<td align="left"><b>Mobile</b></td>

<td id="cardMobile"></td>

</tr>

</table>

<div
id="qr"
style="margin-top:20px;display:flex;justify-content:center;">

</div>

<button
id="printBtn"
class="btn"
style="margin-top:15px;">

Print ID

</button>

</div>

</div>

</div>

</div> 
<script>

const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db=window.supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);

let students=[];

async function loadStudents(){

const {data,error}=await db

.from("students")

.select("*")

.order("id",{ascending:true});

if(error){

console.log(error);

alert(error.message);

return;

}

students=data||[];

renderStudents();

}

function renderStudents(){

const list=document.getElementById("studentList");

list.innerHTML="";

if(students.length===0){

list.innerHTML="<center>No Student Found</center>";

return;

}

students.forEach(s=>{

const div=document.createElement("div");

div.className="student-item";

div.innerHTML=`

<img src="${s.photo_url||'no-image.png'}">

<div>

<b>${s.student_name||''}</b><br>

${s.class_name||''}<br>

Roll : ${s.roll||''}

</div>

`;

div.onclick=()=>showCard(s.id);

list.appendChild(div);

});

} 
async function showCard(id){

const s=students.find(x=>x.id===id);

if(!s)return;

/* Auto Student ID */

if(!s.student_id){

const studentCode=
`MQ-${new Date().getFullYear()}-${String(s.id).padStart(4,"0")}`;

await db

.from("students")

.update({

student_id:studentCode

})

.eq("id",s.id);

s.student_id=studentCode;

}

/* Show Card */

document.getElementById("idCard").style.display="block";

cardPhoto.src=s.photo_url||"no-image.png";

cardName.innerText=s.student_name||"";

cardID.innerText=s.student_id||"";

cardFather.innerText=s.father_name||"-";

cardMother.innerText=s.mother_name||"-";

cardClass.innerText=s.class_name||"-";

cardRoll.innerText=s.roll||"-";

cardSession.innerText=s.session||"-";

cardBlood.innerText=s.blood_group||"-";

cardMobile.innerText=s.mobile||"-";

/* QR */

const qr=document.getElementById("qr");

qr.innerHTML="";

const canvas=document.createElement("canvas");

QRCode.toCanvas(

canvas,

s.student_id,

{width:140},

function(error){

if(!error){

qr.appendChild(canvas);

}

}

);

}

loadStudents(); 
/* =========================
   SEARCH
========================= */

document.getElementById("searchBtn").onclick=searchStudent;

document.getElementById("searchBox").addEventListener("keyup",function(e){

if(e.key==="Enter"){

searchStudent();

}

});

function searchStudent(){

const key=document.getElementById("searchBox").value.trim().toLowerCase();

if(key===""){

renderStudents();

return;

}

const result=students.filter(s=>

(s.student_name||"").toLowerCase().includes(key)||

(s.student_id||"").toLowerCase().includes(key)||

(s.roll||"").toString().includes(key)||

(s.class_name||"").toLowerCase().includes(key)

);

const list=document.getElementById("studentList");

list.innerHTML="";

if(result.length===0){

list.innerHTML="<center>No Student Found</center>";

return;

}

result.forEach(s=>{

const div=document.createElement("div");

div.className="student-item";

div.innerHTML=`

<img src="${s.photo_url||'no-image.png'}">

<div>

<b>${s.student_name}</b><br>

${s.student_id||""}<br>

${s.class_name||""} | Roll : ${s.roll||""}

</div>

`;

div.onclick=()=>showCard(s.id);

list.appendChild(div);

});

}

/* =========================
   PRINT
========================= */

document.getElementById("printBtn").onclick=function(){

window.print();

};

/* =========================
   AUTO REFRESH
========================= */

setInterval(loadStudents,10000);

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Professional Student ID</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Bengali',sans-serif;
}

body{
background:#eef3f5;
}

header{

background:#075c43;

color:#fff;

padding:18px;

display:flex;

justify-content:space-between;

align-items:center;

}

header a{

color:#fff;

text-decoration:none;

font-weight:bold;

}

.container{

max-width:1300px;

margin:auto;

padding:20px;

}

.box{

background:#fff;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

margin-bottom:20px;

}

.form{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}

.full{

grid-column:1/-1;

}

label{

font-weight:bold;

display:block;

margin-bottom:6px;

}

input,
textarea{

width:100%;

padding:10px;

border:1px solid #ddd;

border-radius:8px;

}

textarea{

height:110px;

resize:none;

}

button{

padding:10px 18px;

border:none;

border-radius:8px;

cursor:pointer;

font-weight:bold;

color:#fff;

}

.save{

background:#087f5b;

}

.print{

background:#1565c0;

}

.delete{

background:#c62828;

}

.upload{

border:2px dashed #0b8b63;

padding:20px;

text-align:center;

border-radius:10px;

}

.preview{

width:120px;

height:120px;

border-radius:50%;

border:3px solid #075c43;

object-fit:cover;

margin:10px auto;

display:none;

}

table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}

th{

background:#075c43;

color:#fff;

padding:10px;

}

td{

padding:10px;

border-bottom:1px solid #ddd;

}

.id-card{

width:340px;

background:#fff;

border-radius:18px;

overflow:hidden;

border:3px solid #075c43;

display:none;

margin:auto;

}

.top{

background:#075c43;

color:#fff;

padding:15px;

text-align:center;

}

.top img{

width:55px;

margin-bottom:8px;

}

.student-photo{

width:110px;

height:110px;

border-radius:50%;

border:4px solid #075c43;

object-fit:cover;

display:block;

margin:15px auto;

}

.info{

padding:15px;

line-height:1.8;

font-size:15px;

}

.qr{

display:flex;

justify-content:center;

margin:10px;

}

.footer{

background:#075c43;

color:#fff;

text-align:center;

padding:8px;

font-size:12px;

}

@media(max-width:768px){

.form{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<h2>🪪 Professional Student ID</h2>

<a href="dashboard.html">← Dashboard</a>

</header>

<div class="container">

<div class="box">

<h3>Add Student</h3>

<form id="studentForm">

<input type="hidden" id="editId">

<div class="form">

<input id="student_name" placeholder="Student Name" required>

<input id="father_name" placeholder="Father Name">

<input id="mother_name" placeholder="Mother Name">

<input id="class_name" placeholder="Class">

<input id="roll" placeholder="Roll">

<input id="session" placeholder="Session">

<input id="mobile" placeholder="Mobile">

<input id="blood_group" placeholder="Blood Group">

<div class="full">

<textarea id="address" placeholder="Address"></textarea>

</div>

<div class="full upload">

<input type="file" id="photo" accept="image/*">

<img id="preview" class="preview">

<p id="photoName">No Photo Selected</p>

</div>

<div class="full">

<button class="save" type="submit">

Save Student

</button>

</div>

</div>

</form>

</div> 

<!-- PART 2 -->

<div class="box">

<h3>Student List</h3>

<input id="search" placeholder="Search Student..." style="width:100%;padding:10px;margin-bottom:15px;">

<table>

<thead>

<tr>

<th>Photo</th>

<th>Name</th>

<th>ID</th>

<th>Class</th>

<th>Roll</th>

<th>Action</th>

</tr>

</thead>

<tbody id="studentList">

<tr>

<td colspan="6">Loading...</td>

</tr>

</tbody>

</table>

</div>

<div class="id-card" id="idCard">

<div class="top">

<img src="logo.png">

<h3>মাদরাসায়ে নূরুল কুরআন</h3>

<p>STUDENT ID CARD</p>

</div>

<img id="cardPhoto" class="student-photo">

<div class="info">

<b>Name :</b> <span id="c_name"></span><br>

<b>ID :</b> <span id="c_id"></span><br>

<b>Father :</b> <span id="c_father"></span><br>

<b>Class :</b> <span id="c_class"></span><br>

<b>Roll :</b> <span id="c_roll"></span><br>

<b>Session :</b> <span id="c_session"></span><br>

<b>Blood :</b> <span id="c_blood"></span><br>

<b>Mobile :</b> <span id="c_mobile"></span>

</div>

<div class="qr">

<canvas id="qr"></canvas>

</div>

<div class="footer">

Principal Signature

</div>

</div>

</div>

<script>

const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db=window.supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);

let students=[];

let editId=null;

let photoUrl="";  

// PART 3

document.getElementById("photo").addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

document.getElementById("photoName").innerHTML=file.name;

document.getElementById("preview").src=URL.createObjectURL(file);

document.getElementById("preview").style.display="block";

});

async function generateStudentCode(){

const year=new Date().getFullYear();

const {count}=await db

.from("student_id_cards")

.select("*",{

count:"exact",

head:true

});

return `MQ-${year}-${String((count||0)+1).padStart(4,"0")}`;

}

async function uploadPhoto(){

const file=document.getElementById("photo").files[0];

if(!file)return photoUrl;

const fileName=Date.now()+"_"+file.name;

const {error}=await db.storage

.from("student-photo")

.upload(fileName,file,{upsert:true});

if(error){

alert(error.message);

return "";

}

const {data}=db.storage

.from("student-photo")

.getPublicUrl(fileName);

photoUrl=data.publicUrl;

return photoUrl;

}

async function loadStudents(){

const {data,error}=await db

.from("student_id_cards")

.select("*")

.order("id",{ascending:false});

if(error){

alert(error.message);

return;

}

students=data||[];

renderStudents();

} 
// PART 4

function renderStudents(){

const tbody=document.getElementById("studentList");

if(!students.length){

tbody.innerHTML="<tr><td colspan='6'>No Student Found</td></tr>";

return;

}

tbody.innerHTML=students.map(s=>`

<tr>

<td>

<img src="${s.photo_url||''}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">

</td>

<td>${s.student_name}</td>

<td>${s.student_code}</td>

<td>${s.class_name}</td>

<td>${s.roll}</td>

<td>

<button class="print" onclick="printID(${s.id})">Print</button>

<button class="delete" onclick="deleteStudent(${s.id})">Delete</button>

</td>

</tr>

`).join("");

}

document.getElementById("studentForm").addEventListener("submit",async function(e){

e.preventDefault();

const code=await generateStudentCode();

const img=await uploadPhoto();

const obj={

student_code:code,

qr_url:`${location.origin}/student-profile.html?id=${code}`,

student_name:document.getElementById("student_name").value,

father_name:document.getElementById("father_name").value,

mother_name:document.getElementById("mother_name").value,

class_name:document.getElementById("class_name").value,

roll:document.getElementById("roll").value,

session:document.getElementById("session").value,

mobile:document.getElementById("mobile").value,

blood_group:document.getElementById("blood_group").value,

address:document.getElementById("address").value,

photo_url:img,

id_status:"Active"

};

const {error}=await db

.from("student_id_cards")

.insert([obj]);

if(error){

alert(error.message);

return;

}

alert("Student Saved Successfully");

document.getElementById("studentForm").reset();

document.getElementById("preview").style.display="none";

document.getElementById("photoName").innerHTML="No Photo Selected";

photoUrl="";

loadStudents();

});

async function deleteStudent(id){

if(!confirm("Delete Student?")) return;

await db

.from("student_id_cards")

.delete()

.eq("id",id);

loadStudents();

}

function printID(id){

const s=students.find(x=>x.id==id);

if(!s)return;

document.getElementById("idCard").style.display="block";

document.getElementById("cardPhoto").src=s.photo_url;

document.getElementById("c_name").innerHTML=s.student_name;

document.getElementById("c_id").innerHTML=s.student_code;

document.getElementById("c_father").innerHTML=s.father_name;

document.getElementById("c_class").innerHTML=s.class_name;

document.getElementById("c_roll").innerHTML=s.roll;

document.getElementById("c_session").innerHTML=s.session;

document.getElementById("c_blood").innerHTML=s.blood_group;

document.getElementById("c_mobile").innerHTML=s.mobile;

QRCode.toCanvas(

document.getElementById("qr"),

s.qr_url

);

setTimeout(()=>{

window.print();

document.getElementById("idCard").style.display="none";

},500);

}

document.getElementById("search").addEventListener("input",function(){

const q=this.value.toLowerCase();

students=students.filter(x=>

x.student_name.toLowerCase().includes(q)||

x.student_code.toLowerCase().includes(q)

);

renderStudents();

});

loadStudents();

</script>

</body>

</html>

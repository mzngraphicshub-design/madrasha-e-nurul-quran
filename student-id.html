<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student ID Management</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Bengali',sans-serif;
}

body{
background:#eef2f5;
}

header{
background:#075c43;
color:#fff;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
color:#fff;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.card h2{
color:#075c43;
margin-bottom:20px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.full{
grid-column:1/-1;
}

input,
textarea,
select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
}

textarea{
height:120px;
resize:none;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
color:#fff;
}

.save{
background:#087f5b;
}

.upload-box{
border:2px dashed #0b8b63;
padding:20px;
text-align:center;
border-radius:10px;
}

.preview{
width:120px;
height:120px;
border-radius:50%;
border:4px solid #075c43;
object-fit:cover;
margin:10px auto;
display:none;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#075c43;
color:#fff;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

.action button{
margin:2px;
padding:6px 10px;
font-size:12px;
}

.print{
background:#1565c0;
}

.delete{
background:#c62828;
}

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

}

</style>

</head>

<body>

<header>

<h2>🪪 Student ID Management</h2>

<a href="dashboard.html">← Dashboard</a>

</header>

<div class="container">

<div class="card">

<h2>Add Student</h2>

<form id="studentForm">

<input type="hidden" id="editId">

<div class="form-grid">

<input id="student_name" placeholder="Student Name" required>

<input id="father_name" placeholder="Father Name">

<input id="mother_name" placeholder="Mother Name">

<input id="class_name" placeholder="Class">

<input id="roll" placeholder="Roll">

<input id="session" placeholder="Session">

<input id="mobile" placeholder="Mobile">

<input id="blood_group" placeholder="Blood Group">

<div class="full">

<textarea id="address" placeholder="Address"></textarea>

</div>

<div class="full upload-box">

<input type="file" id="photo" accept="image/*">

<img id="preview" class="preview">

<p id="photoName">No Photo Selected</p>

</div>

<div class="full">

<button class="save" type="submit">

Save Student

</button>

</div>

</div>

</form>

</div> 
<!-- PART 2 -->

<div class="card">

<h2>Student List</h2>

<input
id="search"
placeholder="Search Student..."
style="width:100%;padding:10px;margin-bottom:15px;">

<div style="overflow:auto;">

<table>

<thead>

<tr>

<th>Photo</th>

<th>Student ID</th>

<th>Name</th>

<th>Class</th>

<th>Roll</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="studentList">

<tr>

<td colspan="7">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

<!-- PROFESSIONAL PVC ID -->

<div id="printArea" style="display:none;">

<div id="idCardFront" style="width:340px;background:#fff;border:3px solid #075c43;border-radius:18px;overflow:hidden;">

<div style="background:#075c43;color:#fff;text-align:center;padding:15px;">

<img
src="logo.png"
style="width:55px;height:55px;object-fit:contain;">

<h3>

মাদরাসায়ে নূরুল কুরআন

</h3>

<p>

STUDENT ID CARD

</p>

</div>

<div style="text-align:center;padding:15px;">

<img

id="cardPhoto"

style="width:110px;height:110px;border-radius:50%;border:4px solid #075c43;object-fit:cover;">

</div>

<div style="padding:15px;line-height:1.8;">

<b>ID :</b>

<span id="cardID"></span><br>

<b>Name :</b>

<span id="cardName"></span><br>

<b>Father :</b>

<span id="cardFather"></span><br>

<b>Class :</b>

<span id="cardClass"></span><br>

<b>Roll :</b>

<span id="cardRoll"></span><br>

<b>Session :</b>

<span id="cardSession"></span><br>

<b>Blood :</b>

<span id="cardBlood"></span><br>

<b>Mobile :</b>

<span id="cardMobile"></span>

</div>

<div
id="qr"
style="display:flex;justify-content:center;padding:10px;">

</div>

<div style="background:#075c43;color:#fff;text-align:center;padding:8px;">

Principal Signature

</div>

</div>

</div>

</div>

<script>

const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db=

window.supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);

let students=[];

let editId=null;

let photoUrl="";

// PART 3

document.getElementById("photo").addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

document.getElementById("photoName").innerHTML=file.name;

document.getElementById("preview").src=URL.createObjectURL(file);

document.getElementById("preview").style.display="block";

});

async function generateStudentCode(){

const year=new Date().getFullYear();

const {count}=await db

.from("student_id_cards")

.select("*",{

count:"exact",

head:true

});

return `MQ-${year}-${String((count||0)+1).padStart(4,"0")}`;

}

async function uploadPhoto(){

const file=document.getElementById("photo").files[0];

if(!file)return photoUrl;

const fileName=Date.now()+"_"+file.name;

const {error}=await db.storage

.from("student-photo")

.upload(fileName,file,{upsert:true});

if(error){

alert(error.message);

return "";

}

const {data}=db.storage

.from("student-photo")

.getPublicUrl(fileName);

photoUrl=data.publicUrl;

return photoUrl;

}

async function loadStudents(){

const {data,error}=await db

.from("student_id_cards")

.select("*")

.order("id",{ascending:false});

if(error){

alert(error.message);

return;

}

students=data||[];

renderStudents();

}
 // PART 4

function renderStudents(){

const tbody=document.getElementById("studentList");

if(!students.length){

tbody.innerHTML="<tr><td colspan='7'>No Student Found</td></tr>";

return;

}

tbody.innerHTML=students.map(s=>`

<tr>

<td>

<img src="${s.photo_url||''}"

style="width:50px;height:50px;border-radius:50%;object-fit:cover;">

</td>

<td>${s.student_code||''}</td>

<td>${s.student_name}</td>

<td>${s.class_name||''}</td>

<td>${s.roll||''}</td>

<td>${s.id_status||'Active'}</td>

<td class="action">

<button class="print"

onclick="printID(${s.id})">

Print

</button>

<button class="delete"

onclick="deleteStudent(${s.id})">

Delete

</button>

</td>

</tr>

`).join("");

}

document.getElementById("studentForm").addEventListener("submit",async function(e){

e.preventDefault();

const code=await generateStudentCode();

const img=await uploadPhoto();

const obj={

student_code:code,

qr_url:`${location.origin}/student-profile.html?id=${code}`,

student_name:student_name.value,

father_name:father_name.value,

mother_name:mother_name.value,

class_name:class_name.value,

roll:roll.value,

session:session.value,

mobile:mobile.value,

blood_group:blood_group.value,

address:address.value,

photo_url:img,

id_status:"Active"

};

const {error}=await db

.from("student_id_cards")

.insert([obj]);

if(error){

alert(error.message);

return;

}

alert("Student Saved Successfully");

studentForm.reset();

preview.style.display="none";

photoName.innerHTML="No Photo Selected";

photoUrl="";

loadStudents();

});

async function deleteStudent(id){

if(!confirm("Delete Student?")) return;

await db

.from("student_id_cards")

.delete()

.eq("id",id);

loadStudents();

}

function printID(id){

const s=students.find(x=>x.id==id);

if(!s)return;

printArea.style.display="block";

cardPhoto.src=s.photo_url;

cardID.innerHTML=s.student_code;

cardName.innerHTML=s.student_name;

cardFather.innerHTML=s.father_name;

cardClass.innerHTML=s.class_name;

cardRoll.innerHTML=s.roll;

cardSession.innerHTML=s.session;

cardBlood.innerHTML=s.blood_group;

cardMobile.innerHTML=s.mobile;

qr.innerHTML="";

QRCode.toCanvas(document.createElement("canvas"),s.qr_url,function(err,canvas){

if(!err) qr.appendChild(canvas);

});

setTimeout(()=>{

window.print();

printArea.style.display="none";

},700);

}

search.addEventListener("input",function(){

const q=this.value.toLowerCase();

const filtered=students.filter(x=>

(x.student_name||"").toLowerCase().includes(q)||

(x.student_code||"").toLowerCase().includes(q)

);

const old=students;

students=filtered;

renderStudents();

students=old;

});

loadStudents();

</script>

</body>

</html>

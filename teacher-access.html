*{box-sizing:border-box}
:root{--primary:#54b3d0;--deep:#075b7c;--blue:#08739b;--bg:#f1f6f8;--text:#17313d;--muted:#71838c;--border:#dce8ed;--danger:#c83242;--green:#16834b}
html,body,button,input,select,textarea{font-family:"Bornomala",serif!important}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
.top{background:linear-gradient(120deg,#075b7c,#08739b);color:#fff;padding:15px max(14px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:23px;margin:0}
.top p{margin:3px 0 0;font-size:14px;opacity:.9}
.top-actions{display:flex;gap:8px;align-items:center}
.top a{border:0;border-radius:9px;padding:9px 13px;background:#fff;color:var(--deep);text-decoration:none;font-weight:600;cursor:pointer}
.langmenu{display:flex;gap:5px;background:#ffffff20;padding:4px;border-radius:10px}
.langmenu button{border:0;background:transparent;color:white;padding:6px 9px;border-radius:7px;cursor:pointer}
.langmenu button.active{background:#fff;color:var(--deep)}
.wrap{max-width:1100px;margin:20px auto;padding:0 14px}
.panel{background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 6px 22px #0b48600b}
.panel h2{font-size:20px;margin:0 0 14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{flex:1;min-width:180px}
label{display:block;font-weight:600;margin:5px 0}
input{width:100%;padding:11px;border:1px solid #cbdbe2;border-radius:9px;font-size:15px;background:#fff;color:var(--text)}
button{border:0;border-radius:9px;padding:10px 15px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button.secondary{background:#e8f2f6;color:var(--deep)}
button.danger{background:var(--danger)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:12px}
.perm{border:1px solid #e1ebef;border-radius:9px;padding:9px;display:flex;gap:8px;align-items:center}
.perm input{width:auto}
.muted{color:var(--muted);font-size:14px}
.status{padding:11px 13px;border-radius:9px;margin:10px 0 14px;display:none}
.status.err{display:block;background:#fff0f0;color:#a21d2a}
.status.ok{display:block;background:#e9f8ef;color:#17683a}
.status.info{display:block;background:#eaf4fa;color:#075b7c}
.teacher{padding:12px;border:1px solid #e1ebef;border-radius:11px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
.teacher small{display:block;color:var(--muted)}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.all{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.loading{display:flex;align-items:center;gap:10px;padding:15px;color:var(--muted)}
.spinner{width:18px;height:18px;border:3px solid #d9e8ee;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
html[lang="en"] body,html[lang="en"] button,html[lang="en"] input{font-family:Inter,system-ui,sans-serif!important}
html[lang="ar"] body,html[lang="ar"] button,html[lang="ar"] input{font-family:"Noto Naskh Arabic",serif!important}
html[dir="rtl"] .top,html[dir="rtl"] .teacher{direction:rtl}
html[dir="rtl"] .perm{direction:rtl}
@media(max-width:600px){
.teacher{align-items:flex-start;flex-direction:column}
.top h1{font-size:20px}
.top{padding:13px 14px}
.panel{padding:14px}
}
</style>

<header class="top">
<div>
<h1 data-i="title">শিক্ষক অ্যাক্সেস ব্যবস্থাপনা</h1>
<p data-i="subtitle">মোবাইল নম্বরভিত্তিক লগইন ও পেজ অনুমতি</p>
</div>
<div class="top-actions">
<div class="langmenu" aria-label="Language">
<button data-lang="bn">বাংলা</button>
<button data-lang="en">EN</button>
<button data-lang="ar">العربية</button>
</div>
<a href="settings-hub.html" data-i="back">হাবে ফিরুন</a>
</div>
</header>

<main class="wrap">
<div id="status" class="status"></div>

<section class="panel">
<h2 id="formTitle" data-i="newAccount">নতুন শিক্ষক অ্যাকাউন্ট</h2>
<form id="teacherForm">
<input type="hidden" id="editId">
<div class="row">
<div class="field">
<label data-i="teacherName">শিক্ষকের নাম</label>
<input id="name" required data-ph="fullName" placeholder="পূর্ণ নাম">
</div>
<div class="field">
<label data-i="mobile">মোবাইল নম্বর</label>
<input id="mobile" required inputmode="tel" data-ph="mobilePh" placeholder="01XXXXXXXXX">
</div>
<div class="field">
<label data-i="password">পাসওয়ার্ড</label>
<input id="password" type="password" required data-ph="passwordPh" placeholder="লগইন পাসওয়ার্ড">
</div>
</div>
<div class="row" style="margin-top:12px">
<div class="field">
<label data-i="designation">পদবি</label>
<input id="designation" data-ph="designationPh" placeholder="সহকারী শিক্ষক">
</div>
<div class="field">
<label data-i="subject">বিষয়</label>
<input id="subject" data-ph="subjectPh" placeholder="কুরআন শিক্ষা">
</div>
</div>
<h3 data-i="choosePages">পেজ অ্যাক্সেস নির্বাচন করুন</h3>
<p class="muted" data-i="pageHint">যে পেজে টিক দেবেন, শিক্ষক ড্যাশবোর্ডে সেই পেজের লিংক দেখতে পাবেন।</p>
<div class="all">
<button type="button" class="secondary" id="selectAll" data-i="selectAll">সব নির্বাচন</button>
<button type="button" class="secondary" id="clearAll" data-i="clearAll">সব বাতিল</button>
</div>
<div id="pageList" class="list"></div>
<div class="all">
<button type="submit" id="saveBtn" data-i="save">শিক্ষক সংরক্ষণ করুন</button>
<button type="button" class="secondary" id="cancelBtn" hidden data-i="cancel">বাতিল</button>
</div>
</form>
</section>

<section class="panel">
<div class="headrow">
<h2 data-i="accounts">শিক্ষক অ্যাকাউন্টসমূহ</h2>
<span class="muted" id="count"></span>
</div>
<div id="teacherList">
<div class="loading"><span class="spinner"></span><span data-i="loading">লোড হচ্ছে...</span></div>
</div>
</section>
</main>

let lang=localStorage.getItem('nurul_dashboard_language')||'bn';
if(!I18N[lang])lang='bn';

let rows=[];
const $=id=>document.getElementById(id);
const tr=k=>I18N[lang][k]||I18N.bn[k]||k;

function applyLanguage(l){
 lang=I18N[l]?l:'bn';
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.title=tr('title')+' | Madrasa Nurul Quran';

 document.querySelectorAll('[data-i]').forEach(el=>{
  el.textContent=tr(el.dataset.i);
 });
 document.querySelectorAll('[data-ph]').forEach(el=>{
  el.placeholder=tr(el.dataset.ph);
 });
 document.querySelectorAll('[data-lang]').forEach(b=>{
  b.classList.toggle('active',b.dataset.lang===lang);
 });

 localStorage.setItem('nurul_dashboard_language',lang);
 drawPages(selectedPages());
 if(rows.length)renderTeachers();
}

document.querySelectorAll('[data-lang]').forEach(b=>{
 b.addEventListener('click',()=>applyLanguage(b.dataset.lang));
});

function notice(msg,type='ok'){
 const el=$('status');
 el.textContent=msg;
 el.className='status '+(type==='err'?'err':type==='info'?'info':'ok');
}

function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function drawPages(selected=[]){
 $('pageList').innerHTML=PAGES.map(p=>`
  <label class="perm">
   <input type="checkbox" class="pageCheck" value="${p.key}"
   ${selected.includes(p.key)?'checked':''}>
   <span>${esc(PAGE_NAMES[lang]?.[p.key]||p.label)}</span>
  </label>
 `).join('');
}

function selectedPages(){
 return [...document.querySelectorAll('.pageCheck:checked')]
  .map(x=>x.value);
}

function renderTeachers(){
 $('count').textContent=rows.length+' '+tr('count');

 $('teacherList').innerHTML=rows.map(t=>`
  <div class="teacher">
   <div>
    <strong>${esc(t.name||tr('noName'))}</strong>
    <small>
     ${esc(t.mobile||t.phone||tr('noMobile'))}
     · ${t.login_enabled===false?tr('disabled'):tr('enabled')}
     · ${(t.allowed_pages||[]).length} ${tr('pages')}
    </small>
   </div>
   <div class="actions">
    <button class="secondary" onclick="editTeacher(${Number(t.id)})">
     ${tr('edit')}
    </button>
    <button class="danger" onclick="removeTeacher(${Number(t.id)})">
     ${tr('delete')}
    </button>
   </div>
  </div>
 `).join('')||`<p class="muted">${tr('noTeachers')}</p>`;
}

async function load(){
 $('teacherList').innerHTML=`
  <div class="loading">
   <span class="spinner"></span>${tr('loading')}
  </div>`;

 try{
  const request=db.from('teachers')
   .select('id,teacher_id,name,mobile,phone,login_enabled,allowed_pages,designation,subject')
   .order('id',{ascending:false});

  const result=await Promise.race([
   request,
   new Promise((_,reject)=>setTimeout(
    ()=>reject(new Error('Request timed out. Check internet and Supabase RLS policies.')),
    20000
   ))
  ]);

  const {data,error}=result;

  if(error)throw error;

  rows=data||[];
  renderTeachers();

 }catch(error){
  $('teacherList').innerHTML=`
   <p class="muted">${tr('loadingFailed')} (${esc(error.message)})</p>
   <button type="button" id="retryLoad">${tr('retry')}</button>
  `;
  $('retryLoad').onclick=load;
  notice(tr('loadError')+error.message,'err');
 }
}

function reset(){
 $('teacherForm').reset();
 $('editId').value='';
 $('formTitle').textContent=tr('newAccount');
 $('password').required=true;
 $('password').placeholder=tr('passwordPh');
 $('cancelBtn').hidden=true;
 drawPages();
}

window.editTeacher=id=>{
 const t=rows.find(x=>Number(x.id)===Number(id));
 if(!t)return;

 $('editId').value=t.id;
 $('name').value=t.name||'';
 $('mobile').value=t.mobile||t.phone||'';

 // Existing password is never fetched or displayed.
 $('password').value='';
 $('password').placeholder=
  lang==='en'?'Leave blank to keep current password':
  lang==='ar'?'اتركه فارغاً للإبقاء على كلمة المرور':
  'পরিবর্তন না করলে ফাঁকা রাখুন';

 $('designation').value=t.designation||'';
 $('subject').value=t.subject||'';
 $('password').required=false;
 $('formTitle').textContent=tr('editTitle');
 $('cancelBtn').hidden=false;

 drawPages(t.allowed_pages||[]);
 window.scrollTo({top:0,behavior:'smooth'});
};

window.removeTeacher=async id=>{
 const t=rows.find(x=>Number(x.id)===Number(id));
 if(!t||!confirm(tr('confirmDelete')+' '+(t.name||'')))return;

 const {error}=await db.from('teachers').delete().eq('id',id);

 if(error){
  notice(tr('deleteError')+error.message,'err');
  return;
 }

 notice(tr('deleted'));
 await load();
};

$('teacherForm').addEventListener('submit',async e=>{
 e.preventDefault();

 const id=$('editId').value;
 const mobile=$('mobile').value.trim();
 const password=$('password').value.trim();

 if(!/^01[0-9]{9}$/.test(mobile)){
  notice(tr('invalidMobile'),'err');
  return;
 }

 if(!id&&!password){
  notice(tr('needPassword'),'err');
  return;
 }

 const payload={
  name:$('name').value.trim(),
  mobile,
  phone:mobile,
  teacher_id:mobile,
  designation:$('designation').value.trim(),
  subject:$('subject').value.trim(),
  allowed_pages:selectedPages(),
  login_enabled:true
 };

 // Current verify_teacher_login RPC compares the password
 // with the teachers.password column.
 if(password){
  payload.password=password;
  payload.login_password=password;
 }

 $('saveBtn').disabled=true;

 try{
  const q=id
   ?db.from('teachers').update(payload).eq('id',id)
   :db.from('teachers').insert(payload);

  const {error}=await q;

  if(error){
   notice(tr('saveError')+error.message,'err');
  }else{
   notice(id?tr('saved'):tr('created'));
   reset();
   await load();
  }

 }catch(err){
  notice(tr('saveError')+err.message,'err');
 }finally{
  $('saveBtn').disabled=false;
 }
});

$('selectAll').onclick=()=>{
 document.querySelectorAll('.pageCheck').forEach(x=>x.checked=true);
};

$('clearAll').onclick=()=>{
 document.querySelectorAll('.pageCheck').forEach(x=>x.checked=false);
};

$('cancelBtn').onclick=reset;

async function init(){
 applyLanguage(lang);
 drawPages();

 $('teacherList').innerHTML=`
  <div class="loading">
   <span class="spinner"></span>${tr('loading')}
  </div>`;

 try{
  const result=await Promise.race([
   db.auth.getSession(),
   new Promise((_,rej)=>setTimeout(
    ()=>rej(new Error('Connection timeout')),
    15000
   ))
  ]);

  const session=result?.data?.session;

  if(result?.error)throw result.error;

  if(!session){
   $('teacherForm').hidden=true;
   $('teacherList').innerHTML='';
   notice(tr('sessionMissing'),'err');
   return;
  }

  // Supabase RLS must enforce admin-only database access.
  await load();

 }catch(err){
  $('teacherForm').hidden=true;

  $('teacherList').innerHTML=`
   <p class="muted">${esc(err.message||'Connection error')}</p>
   <button id="retryInit">${tr('retry')}</button>
  `;

  $('retryInit').onclick=()=>{
   $('teacherForm').hidden=false;
   init();
  };

  notice(tr('loadError')+(err.message||''),'err');
 }
}

init();
</script>

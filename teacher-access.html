<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>শিক্ষক অ্যাক্সেস ব্যবস্থাপনা</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f9;color:#163344;font-family:'Hind Siliguri',sans-serif}.top{background:linear-gradient(120deg,#075b7c,#08739b);color:white;padding:22px max(16px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:23px;margin:0}.wrap{max-width:1100px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid #e2ebef;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 6px 22px #0b48600b}.row{display:flex;gap:12px;flex-wrap:wrap}.field{flex:1;min-width:180px}label{display:block;font-weight:600;margin:5px 0}input{width:100%;padding:11px;border:1px solid #cbdbe2;border-radius:9px;font:inherit}button,.btn{border:0;border-radius:9px;padding:10px 15px;background:#08739b;color:#fff;font:600 15px inherit;cursor:pointer}button.secondary{background:#e8f2f6;color:#075b7c}button.danger{background:#b42332}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:12px}.perm{border:1px solid #e1ebef;border-radius:9px;padding:9px;display:flex;gap:8px;align-items:center}.perm input{width:auto}.muted{color:#607987;font-size:14px}.status{padding:10px;border-radius:9px;margin:10px 0;display:none}.status.err{display:block;background:#fff0f0;color:#a21d2a}.status.ok{display:block;background:#e9f8ef;color:#17683a}.teacher{padding:12px;border:1px solid #e1ebef;border-radius:11px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.teacher small{display:block;color:#607987}.actions{display:flex;gap:7px;flex-wrap:wrap}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.all{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:600px){.teacher{align-items:flex-start;flex-direction:column}.top h1{font-size:19px}}</style></head><body><header class="top"><div><h1>শিক্ষক অ্যাক্সেস ব্যবস্থাপনা</h1><div>মোবাইল নম্বরভিত্তিক লগইন ও পেজ অনুমতি</div></div><a class="btn" href="settings-hub.html" style="background:#fff;color:#075b7c;text-decoration:none">হাবে ফিরুন</a></header><main class="wrap"><div id="status" class="status"></div><section class="panel"><h2 id="formTitle">নতুন শিক্ষক অ্যাকাউন্ট</h2><form id="teacherForm"><input type="hidden" id="editId"><div class="row"><div class="field"><label>শিক্ষকের নাম</label><input id="name" required placeholder="পূর্ণ নাম"></div><div class="field"><label>মোবাইল নম্বর</label><input id="mobile" required inputmode="tel" placeholder="01XXXXXXXXX"></div><div class="field"><label>পাসওয়ার্ড</label><input id="password" type="text" required placeholder="লগইন পাসওয়ার্ড"></div></div><div class="row" style="margin-top:12px"><div class="field"><label>পদবি</label><input id="designation" placeholder="সহকারী শিক্ষক"></div><div class="field"><label>বিষয়</label><input id="subject" placeholder="কুরআন শিক্ষা"></div></div><h3>পেজ অ্যাক্সেস নির্বাচন করুন</h3><p class="muted">যে পেজে টিক দেবেন, শিক্ষক ড্যাশবোর্ডে সেই পেজের লিংক দেখতে পাবেন।</p><div class="all"><button type="button" class="secondary" id="selectAll">সব নির্বাচন</button><button type="button" class="secondary" id="clearAll">সব বাতিল</button></div><div id="pageList" class="list"></div><div class="all"><button type="submit" id="saveBtn">শিক্ষক সংরক্ষণ করুন</button><button type="button" class="secondary" id="cancelBtn" hidden>বাতিল</button></div></form></section><section class="panel"><div class="headrow"><h2>শিক্ষক অ্যাকাউন্টসমূহ</h2><span class="muted" id="count">লোড হচ্ছে...</span></div><div id="teacherList">লোড হচ্ছে...</div></section></main><script>
'use strict';
const SUPABASE_URL='https://qavublwhqiqsgpcmfyft.supabase.co';
const SUPABASE_KEY='sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const PAGES=[{"key": "dashboard", "label": "ড্যাশবোর্ড", "url": "dashboard.html"}, {"key": "students", "label": "শিক্ষার্থী", "url": "students.html"}, {"key": "teachers", "label": "শিক্ষক", "url": "teachers.html"}, {"key": "employees", "label": "কর্মচারী", "url": "employees.html"}, {"key": "members", "label": "সদস্য", "url": "members.html"}, {"key": "classes", "label": "ক্লাস", "url": "classes.html"}, {"key": "subjects", "label": "বিষয়", "url": "subjects.html"}, {"key": "session", "label": "সেশন", "url": "session.html"}, {"key": "results", "label": "ফলাফল", "url": "results.html"}, {"key": "fees", "label": "ফি সংগ্রহ", "url": "fees.html"}, {"key": "salary", "label": "বেতন", "url": "salary.html"}, {"key": "income", "label": "দৈনন্দিন আয়", "url": "income.html"}, {"key": "expenses", "label": "দৈনন্দিন ব্যয়", "url": "expenses.html"}, {"key": "attendance-students", "label": "শিক্ষার্থী উপস্থিতি", "url": "attendance-students.html"}, {"key": "attendance-teachers", "label": "শিক্ষক উপস্থিতি", "url": "attendance-teachers.html"}, {"key": "attendance-employees", "label": "কর্মচারী উপস্থিতি", "url": "attendance-employees.html"}, {"key": "sms", "label": "SMS সিস্টেম", "url": "sms.html"}, {"key": "notices", "label": "নোটিশ", "url": "notices.html"}, {"key": "gallery", "label": "ফটো গ্যালারি", "url": "gallery.html"}, {"key": "videos", "label": "ভিডিও গ্যালারি", "url": "videos.html"}, {"key": "reports", "label": "রিপোর্ট", "url": "reports.html"}, {"key": "online-admission", "label": "অনলাইন ভর্তি", "url": "online-admission.html"}, {"key": "reports-certificates", "label": "রিপোর্ট ও সার্টিফিকেট", "url": "reports-certificates.html"}, {"key": "nazera-progress", "label": "নাজেরা অগ্রগতি", "url": "nazera-progress.html"}, {"key": "hifz-progress", "label": "হিফজ অগ্রগতি", "url": "hifz-progress.html"}, {"key": "quran-ampara-tracking", "label": "কুরআন/আমপারা ট্র্যাকিং", "url": "quran-ampara-tracking.html"}, {"key": "dua-hadith-record", "label": "দোয়া ও হাদিস", "url": "dua-hadith-record.html"}, {"key": "behavior-discipline", "label": "আচরণ ও শৃঙ্খলা", "url": "behavior-discipline.html"}, {"key": "parent-daily-report", "label": "অভিভাবক রিপোর্ট", "url": "parent-daily-report.html"}, {"key": "complaints", "label": "অভিযোগ বক্স", "url": "complaints.html"}, {"key": "settings-hub", "label": "সেটিংস হাব", "url": "settings-hub.html"}];
let rows=[];
const $=id=>document.getElementById(id);
function notice(msg,type='ok'){const el=$('status');el.textContent=msg;el.className='status '+(type==='err'?'err':'ok');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function drawPages(selected=[]){$('pageList').innerHTML=PAGES.map(p=>`<label class="perm"><input type="checkbox" class="pageCheck" value="${p.key}" ${selected.includes(p.key)?'checked':''}><span>${p.label}</span></label>`).join('');}
function selectedPages(){return [...document.querySelectorAll('.pageCheck:checked')].map(x=>x.value);}
async function init(){const {data:{session},error}=await db.auth.getSession();if(error||!session){location.href='admin.html';return;}const {data:{user}}=await db.auth.getUser();const role=user?.app_metadata?.role;if(role!=='admin'){notice('শুধু অ্যাডমিন এই পেজ ব্যবহার করতে পারবেন।','err');$('teacherForm').hidden=true;return;}drawPages();await load();}
async function load(){const {data,error}=await db.from('teachers').select('id,teacher_id,name,mobile,phone,password,login_password,login_enabled,allowed_pages,designation,subject').order('id',{ascending:false});if(error){notice('শিক্ষক তালিকা লোড হয়নি: '+error.message,'err');return;}rows=data||[];$('count').textContent=rows.length+' জন শিক্ষক';$('teacherList').innerHTML=rows.map(t=>`<div class="teacher"><div><strong>${esc(t.name||'নাম নেই')}</strong><small>${esc(t.mobile||t.phone||'মোবাইল নেই')} · ${t.login_enabled===false?'লগইন বন্ধ':'লগইন চালু'} · ${(t.allowed_pages||[]).length} পেজ</small></div><div class="actions"><button class="secondary" onclick="editTeacher(${Number(t.id)})">এডিট / অ্যাক্সেস</button><button class="danger" onclick="removeTeacher(${Number(t.id)})">ডিলিট</button></div></div>`).join('')||'<p class="muted">এখনো কোনো শিক্ষক নেই।</p>';}
function reset(){ $('teacherForm').reset();$('editId').value='';$('formTitle').textContent='নতুন শিক্ষক অ্যাকাউন্ট';$('password').required=true;$('cancelBtn').hidden=true;drawPages();}
window.editTeacher=id=>{const t=rows.find(x=>Number(x.id)===Number(id));if(!t)return;$('editId').value=t.id;$('name').value=t.name||'';$('mobile').value=t.mobile||t.phone||'';$('password').value=t.password||t.login_password||'';$('designation').value=t.designation||'';$('subject').value=t.subject||'';$('password').required=false;$('formTitle').textContent='শিক্ষক তথ্য ও অ্যাক্সেস সম্পাদনা';$('cancelBtn').hidden=false;drawPages(t.allowed_pages||[]);window.scrollTo({top:0,behavior:'smooth'});};
window.removeTeacher=async id=>{const t=rows.find(x=>Number(x.id)===Number(id));if(!t||!confirm((t.name||'এই শিক্ষক')+'-এর অ্যাকাউন্ট মুছে ফেলবেন?'))return;const {error}=await db.from('teachers').delete().eq('id',id);if(error){notice('ডিলিট হয়নি: '+error.message,'err');return;}notice('শিক্ষক অ্যাকাউন্ট মুছে ফেলা হয়েছে।');await load();};
$('teacherForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('editId').value,mobile=$('mobile').value.trim(),password=$('password').value.trim();if(!/^01[0-9]{9}$/.test(mobile)){notice('সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন।','err');return;}if(!id&&!password){notice('পাসওয়ার্ড লিখুন।','err');return;}const payload={name:$('name').value.trim(),mobile,phone:mobile,teacher_id:mobile,designation:$('designation').value.trim(),subject:$('subject').value.trim(),allowed_pages:selectedPages(),login_enabled:true};if(password){payload.password=password;payload.login_password=password;}$('saveBtn').disabled=true;let q=id?db.from('teachers').update(payload).eq('id',id):db.from('teachers').insert(payload);const {error}=await q;if(error){notice('সংরক্ষণ হয়নি: '+error.message,'err');}else{notice(id?'শিক্ষকের তথ্য ও অনুমতি আপডেট হয়েছে।':'নতুন শিক্ষক অ্যাকাউন্ট তৈরি হয়েছে।');reset();await load();}$('saveBtn').disabled=false;});
$('selectAll').onclick=()=>document.querySelectorAll('.pageCheck').forEach(x=>x.checked=true);$('clearAll').onclick=()=>document.querySelectorAll('.pageCheck').forEach(x=>x.checked=false);$('cancelBtn').onclick=reset;init();
</script></body></html>

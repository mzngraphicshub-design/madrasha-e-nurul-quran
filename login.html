<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | মাদরাসায়ে নূরুল কুরআন</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>

<style>
@font-face{
    font-family:'Bornomala';
    src:url('https://fonts.gstatic.com/s/bornomala/v1/6xKydSBYKcSV-LCoeQqfX1RYOo3ik4zwlxdu.woff2')
    format('woff2');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#020d1d;
    --bg2:#061a32;
    --card:rgba(255,255,255,.075);
    --border:rgba(255,255,255,.14);
    --primary:#0875df;
    --primary2:#2098ff;
    --text:#fff;
    --muted:#a9b8ca;
}

body{
    min-height:100vh;
    font-family:'Bornomala','Noto Serif Bengali',serif;
    background:
        radial-gradient(circle at 20% 20%,rgba(8,117,223,.18),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(0,196,255,.12),transparent 35%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:25px;
}

body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(8,117,223,.10);
    filter:blur(90px);
    top:-180px;
    left:-160px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    background:rgba(0,180,255,.08);
    filter:blur(100px);
    right:-160px;
    bottom:-180px;
    pointer-events:none;
}

.login-wrapper{
    width:100%;
    max-width:470px;
    position:relative;
    z-index:2;
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.logo-box{
    width:92px;
    height:92px;
    margin:0 auto 15px;
    border-radius:25px;
    padding:8px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(18px);
    box-shadow:
        0 20px 50px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.12);
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:18px;
}

.brand h1{
    font-size:27px;
    font-weight:700;
    line-height:1.4;
}

.brand p{
    color:var(--muted);
    font-size:14px;
    margin-top:5px;
}

.login-card{
    background:rgba(255,255,255,.075);
    border:1px solid var(--border);
    border-radius:28px;
    padding:28px;
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:
        0 30px 80px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.10);
}

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    padding:6px;
    background:rgba(0,0,0,.22);
    border-radius:15px;
    margin-bottom:25px;
}

.tab{
    border:0;
    background:transparent;
    color:#aebdce;
    padding:12px 6px;
    border-radius:11px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    transition:.25s;
}

.tab.active{
    color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    box-shadow:0 8px 22px rgba(8,117,223,.28);
}

.login-title{
    text-align:center;
    margin-bottom:22px;
}

.login-title h2{
    font-size:23px;
    margin-bottom:4px;
}

.login-title p{
    color:var(--muted);
    font-size:13px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-size:14px;
    margin-bottom:8px;
    color:#d9e4ef;
}

.input-wrap{
    position:relative;
}

.input-wrap i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#8fa4bb;
    font-size:15px;
}

.input-wrap input{
    width:100%;
    height:52px;
    padding:0 45px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.13);
    outline:none;
    background:rgba(0,0,0,.22);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    transition:.25s;
}

.input-wrap input::placeholder{
    color:#73869a;
}

.input-wrap input:focus{
    border-color:rgba(32,152,255,.75);
    box-shadow:0 0 0 3px rgba(32,152,255,.10);
}

.password-toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#8095aa;
}

.login-btn{
    width:100%;
    height:53px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 12px 30px rgba(8,117,223,.27);
    transition:.25s;
    margin-top:5px;
}

.login-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 16px 35px rgba(8,117,223,.35);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.biometric-btn{
    width:100%;
    height:50px;
    margin-top:11px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:14px;
    background:rgba(255,255,255,.055);
    color:#dce8f4;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    transition:.25s;
}

.biometric-btn:hover{
    background:rgba(255,255,255,.10);
    border-color:rgba(32,152,255,.45);
}

.biometric-btn i{
    margin-right:7px;
    color:#49b3ff;
}

.message{
    display:none;
    margin-bottom:17px;
    padding:12px 14px;
    border-radius:12px;
    font-size:13px;
    line-height:1.6;
}

.message.error{
    display:block;
    background:rgba(255,70,70,.10);
    border:1px solid rgba(255,90,90,.25);
    color:#ffb5b5;
}

.message.success{
    display:block;
    background:rgba(40,200,120,.10);
    border:1px solid rgba(40,200,120,.25);
    color:#9ff0c8;
}

.info{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,.09);
    text-align:center;
    color:#8195a9;
    font-size:12px;
    line-height:1.8;
}

.footer{
    text-align:center;
    color:#63778c;
    font-size:11px;
    margin-top:20px;
}

.hidden{
    display:none!important;
}

.loading{
    display:inline-flex;
    align-items:center;
    gap:8px;
}

.spinner{
    width:15px;
    height:15px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:520px){
    body{
        padding:15px;
    }

    .login-card{
        padding:21px 17px;
        border-radius:23px;
    }

    .brand h1{
        font-size:23px;
    }

    .logo-box{
        width:78px;
        height:78px;
        border-radius:21px;
    }

    .tab{
        font-size:12px;
        padding:11px 3px;
    }
}
</style>
</head>

<body>

<div class="login-wrapper">

    <div class="brand">
        <div class="logo-box">
            <img src="img/logo.png" alt="Madrasa Logo">
        </div>

        <h1>মাদরাসায়ে নূরুল কুরআন</h1>
        <p>Madrasa-e Nurul Quran</p>
    </div>

    <div class="login-card">

        <div class="tabs">

            <button class="tab active"
                    data-role="admin"
                    onclick="switchRole('admin')">
                <i class="fa-solid fa-user-shield"></i>
                অ্যাডমিন
            </button>

            <button class="tab"
                    data-role="teacher"
                    onclick="switchRole('teacher')">
                <i class="fa-solid fa-chalkboard-user"></i>
                শিক্ষক
            </button>

            <button class="tab"
                    data-role="guardian"
                    onclick="switchRole('guardian')">
                <i class="fa-solid fa-user-group"></i>
                অভিভাবক
            </button>

        </div>

        <div class="login-title">
            <h2 id="loginHeading">অ্যাডমিন লগইন</h2>
            <p id="loginSubheading">
                মাদরাসার প্রশাসনিক প্যানেলে প্রবেশ করুন
            </p>
        </div>

        <div id="message" class="message"></div>

        <!-- ADMIN / TEACHER LOGIN -->

        <div id="staffLogin">

            <div class="form-group">
                <label id="emailLabel">ইমেইল</label>

                <div class="input-wrap">
                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="আপনার ইমেইল লিখুন"
                        autocomplete="username">
                </div>
            </div>

            <div class="form-group">

                <label>পাসওয়ার্ড</label>

                <div class="input-wrap">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="পাসওয়ার্ড লিখুন"
                        autocomplete="current-password">

                    <span class="password-toggle"
                          onclick="togglePassword()">
                        <i id="passwordIcon"
                           class="fa-solid fa-eye"></i>
                    </span>

                </div>

            </div>

            <button class="login-btn"
                    id="loginBtn"
                    onclick="staffLogin()">

                <span id="loginBtnText">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    লগইন করুন
                </span>

            </button>

            <button
                class="biometric-btn hidden"
                id="biometricBtn"
                onclick="biometricLogin()">

                <i class="fa-solid fa-fingerprint"></i>
                Fingerprint / Passkey দিয়ে লগইন

            </button>

        </div>


        <!-- GUARDIAN / STUDENT LOGIN -->

        <div id="guardianLogin" class="hidden">

            <div class="form-group">

                <label>Student ID</label>

                <div class="input-wrap">

                    <i class="fa-solid fa-id-card"></i>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Student ID লিখুন"
                        autocomplete="off">

                </div>

            </div>


            <div class="form-group">

                <label>Roll Number</label>

                <div class="input-wrap">

                    <i class="fa-solid fa-hashtag"></i>

                    <input
                        type="text"
                        id="rollNumber"
                        placeholder="Roll Number লিখুন"
                        autocomplete="off">

                </div>

            </div>


            <button
                class="login-btn"
                id="studentLoginBtn"
                onclick="studentLogin()">

                <span id="studentLoginBtnText">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    লগইন করুন
                </span>

            </button>

        </div>


        <div class="info">
            আপনার অ্যাকাউন্টের তথ্য ব্যবহার করে লগইন করুন।
            <br>
            Student/Guardian Login-এর জন্য Student ID ও Roll Number প্রয়োজন।
        </div>

    </div>

    <div class="footer">
        © 2026 Madrasa-e Nurul Quran. All Rights Reserved.
    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                experimental:{
                    passkey:true
                }
            }
        }
    );


/* =========================================================
   SETTINGS
========================================================= */

let settings = {};

try{
    settings =
        JSON.parse(
            localStorage.getItem(
                "madrasa_system_settings_v1"
            ) || "{}"
        );
}catch(e){
    settings = {};
}


/* =========================================================
   CURRENT ROLE
========================================================= */

let currentRole = "admin";


/* =========================================================
   ROLE SWITCH
========================================================= */

function switchRole(role){

    currentRole = role;

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.role === role
            );

        });


    clearMessage();


    const staffLogin =
        document.getElementById("staffLogin");

    const guardianLogin =
        document.getElementById("guardianLogin");

    const heading =
        document.getElementById("loginHeading");

    const subheading =
        document.getElementById("loginSubheading");

    const biometricBtn =
        document.getElementById("biometricBtn");


    if(role === "admin"){

        staffLogin.classList.remove("hidden");
        guardianLogin.classList.add("hidden");

        heading.textContent =
            "অ্যাডমিন লগইন";

        subheading.textContent =
            "মাদরাসার প্রশাসনিক প্যানেলে প্রবেশ করুন";

        biometricBtn.classList.toggle(
            "hidden",
            settings.biometricAdmin === false ||
            settings.adminBiometric === false
        );

    }


    else if(role === "teacher"){

        staffLogin.classList.remove("hidden");
        guardianLogin.classList.add("hidden");

        heading.textContent =
            "শিক্ষক লগইন";

        subheading.textContent =
            "শিক্ষক প্যানেলে প্রবেশ করুন";

        biometricBtn.classList.toggle(
            "hidden",
            settings.biometricTeacher === false ||
            settings.teacherBiometric === false
        );

    }


    else{

        staffLogin.classList.add("hidden");
        guardianLogin.classList.remove("hidden");

        heading.textContent =
            "অভিভাবক / শিক্ষার্থী লগইন";

        subheading.textContent =
            "Student ID ও Roll Number দিয়ে প্রবেশ করুন";

    }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type="error"){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.innerHTML = text;

}


function clearMessage(){

    const box =
        document.getElementById("message");

    box.className =
        "message";

    box.innerHTML = "";

}


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

function togglePassword(){

    const input =
        document.getElementById("password");

    const icon =
        document.getElementById("passwordIcon");


    if(input.type === "password"){

        input.type = "text";

        icon.className =
            "fa-solid fa-eye-slash";

    }else{

        input.type = "password";

        icon.className =
            "fa-solid fa-eye";

    }

}


/* =========================================================
   STAFF LOGIN
========================================================= */

async function staffLogin(){

    clearMessage();


    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if(!email){

        showMessage(
            "ইমেইল লিখুন।"
        );

        return;

    }


    if(!password){

        showMessage(
            "পাসওয়ার্ড লিখুন।"
        );

        return;

    }


    const loginBtn =
        document.getElementById("loginBtn");

    const btnText =
        document.getElementById("loginBtnText");


    loginBtn.disabled = true;

    btnText.innerHTML =
        `<span class="loading">
            <span class="spinner"></span>
            লগইন হচ্ছে...
        </span>`;


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });


        if(error)
            throw error;


        if(!data.session){

            throw new Error(
                "Login session পাওয়া যায়নি।"
            );

        }


        const user =
            data.user;


        /* -----------------------------------------
           TEACHER ROLE CHECK
        ----------------------------------------- */

        if(currentRole === "teacher"){

            const role =
                user?.app_metadata?.role ||
                user?.user_metadata?.role ||
                "";


            if(
                role &&
                role.toLowerCase() !== "teacher"
            ){

                await supabaseClient.auth.signOut();

                throw new Error(
                    "এই অ্যাকাউন্টের শিক্ষক প্যানেলে প্রবেশের অনুমতি নেই।"
                );

            }

        }


        /* -----------------------------------------
           ADMIN ROLE CHECK
        ----------------------------------------- */

        if(currentRole === "admin"){

            const role =
                user?.app_metadata?.role ||
                user?.user_metadata?.role ||
                "";


            if(
                role &&
                role.toLowerCase() === "teacher"
            ){

                await supabaseClient.auth.signOut();

                throw new Error(
                    "শিক্ষক অ্যাকাউন্ট দিয়ে অ্যাডমিন প্যানেলে প্রবেশ করা যাবে না।"
                );

            }

        }


        showMessage(
            "লগইন সফল হয়েছে। Dashboard-এ নেওয়া হচ্ছে...",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        },500);


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "লগইন ব্যর্থ হয়েছে। ইমেইল ও পাসওয়ার্ড যাচাই করুন।"
        );


        loginBtn.disabled = false;

        btnText.innerHTML =
            `<i class="fa-solid fa-right-to-bracket"></i>
             লগইন করুন`;

    }

}


/* =========================================================
   STUDENT / GUARDIAN LOGIN
========================================================= */

async function studentLogin(){

    clearMessage();


    const studentId =
        document
            .getElementById("studentId")
            .value
            .trim();

    const rollNumber =
        document
            .getElementById("rollNumber")
            .value
            .trim();


    if(!studentId){

        showMessage(
            "Student ID লিখুন।"
        );

        return;

    }


    if(!rollNumber){

        showMessage(
            "Roll Number লিখুন।"
        );

        return;

    }


    const btn =
        document.getElementById(
            "studentLoginBtn"
        );

    const btnText =
        document.getElementById(
            "studentLoginBtnText"
        );


    btn.disabled = true;

    btnText.innerHTML =
        `<span class="loading">
            <span class="spinner"></span>
            যাচাই হচ্ছে...
        </span>`;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("students")
            .select(`
                id,
                student_id,
                roll_number,
                name,
                class_id,
                session
            `)
            .eq("student_id",studentId)
            .eq("roll_number",rollNumber)
            .maybeSingle();


        if(error)
            throw error;


        if(!data){

            throw new Error(
                "Student ID অথবা Roll Number সঠিক নয়।"
            );

        }


        /*
         * Student information temporarily saved
         * for the student dashboard.
         */

        sessionStorage.setItem(
            "student_login",
            "true"
        );


        sessionStorage.setItem(
            "student_data",
            JSON.stringify(data)
        );


        showMessage(
            `স্বাগতম ${data.name || "Student"}। Dashboard-এ নেওয়া হচ্ছে...`,
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "students-login.html";

        },500);


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Student login ব্যর্থ হয়েছে।"
        );


        btn.disabled = false;

        btnText.innerHTML =
            `<i class="fa-solid fa-right-to-bracket"></i>
             লগইন করুন`;

    }

}


/* =========================================================
   BIOMETRIC / PASSKEY LOGIN
========================================================= */

async function biometricLogin(){

    clearMessage();


    if(
        currentRole !== "admin" &&
        currentRole !== "teacher"
    ){

        return;

    }


    if(
        !window.PublicKeyCredential
    ){

        showMessage(
            "এই ডিভাইস বা ব্রাউজারে Fingerprint / Passkey support নেই।"
        );

        return;

    }


    try{

        showMessage(
            "Fingerprint / Passkey যাচাই করা হচ্ছে...",
            "success"
        );


        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPasskey();


        if(error)
            throw error;


        if(!data){

            throw new Error(
                "Passkey login সম্পন্ন হয়নি।"
            );

        }


        const user =
            data.user;


        /* Teacher role verification */

        if(currentRole === "teacher"){

            const role =
                user?.app_metadata?.role ||
                user?.user_metadata?.role ||
                "";


            if(
                role &&
                role.toLowerCase() !== "teacher"
            ){

                await supabaseClient.auth.signOut();

                throw new Error(
                    "এই Passkey-এর শিক্ষক প্যানেলে প্রবেশের অনুমতি নেই।"
                );

            }

        }


        /* Admin role verification */

        if(currentRole === "admin"){

            const role =
                user?.app_metadata?.role ||
                user?.user_metadata?.role ||
                "";


            if(
                role &&
                role.toLowerCase() === "teacher"
            ){

                await supabaseClient.auth.signOut();

                throw new Error(
                    "Teacher Passkey দিয়ে Admin Panel-এ প্রবেশ করা যাবে না।"
                );

            }

        }


        showMessage(
            "Fingerprint / Passkey Login সফল হয়েছে।",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        },500);


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Fingerprint / Passkey login ব্যর্থ হয়েছে।"
        );

    }

}


/* =========================================================
   EXISTING SESSION CHECK
========================================================= */

async function checkExistingSession(){

    try{

        const {
            data
        } =
        await supabaseClient.auth.getSession();


        const session =
            data?.session;


        if(!session)
            return;


        const user =
            session.user;


        const role =
            user?.app_metadata?.role ||
            user?.user_metadata?.role ||
            "";


        /*
         * Existing admin/teacher session
         */

        if(role.toLowerCase() === "teacher"){

            currentRole = "teacher";

            window.location.href =
                "dashboard.html";

            return;

        }


        window.location.href =
            "dashboard.html";


    }catch(error){

        console.error(
            "Session check error:",
            error
        );

    }

}


/* =========================================================
   ENTER KEY LOGIN
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key !== "Enter")
            return;


        if(currentRole === "guardian"){

            studentLogin();

        }else{

            staffLogin();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

switchRole("admin");

checkExistingSession();

</script>

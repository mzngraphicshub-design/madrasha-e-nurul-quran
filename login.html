<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | মাদরাসায়ে নূরুল কুরআন</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>

<style>
@font-face{
    font-family:'Bornomala';
    src:url('./fonts/Bornomala-Regular.ttf') format('truetype');
    font-display:swap;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#020d1d;
    --bg2:#061a32;
    --card:rgba(255,255,255,.075);
    --border:rgba(255,255,255,.14);
    --primary:#0875df;
    --primary2:#2098ff;
    --text:#fff;
    --muted:#a9b8ca;
}

body{
    min-height:100vh;
    font-family:'Bornomala',sans-serif;
    background:
        radial-gradient(circle at 20% 20%,rgba(8,117,223,.18),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(0,196,255,.12),transparent 35%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:25px;
}

body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(8,117,223,.10);
    filter:blur(90px);
    top:-180px;
    left:-160px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    background:rgba(0,180,255,.08);
    filter:blur(100px);
    right:-160px;
    bottom:-180px;
    pointer-events:none;
}

.login-wrapper{
    width:100%;
    max-width:470px;
    position:relative;
    z-index:2;
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.logo-box{
    width:92px;
    height:92px;
    margin:0 auto 15px;
    border-radius:25px;
    padding:8px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(18px);
    box-shadow:
        0 20px 50px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.12);
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:18px;
}

.brand h1{
    font-size:27px;
    font-weight:700;
    line-height:1.4;
}

.brand p{
    color:var(--muted);
    font-size:14px;
    margin-top:5px;
}

.login-card{
    background:rgba(255,255,255,.075);
    border:1px solid var(--border);
    border-radius:28px;
    padding:28px;
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:
        0 30px 80px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.10);
}

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    padding:6px;
    background:rgba(0,0,0,.22);
    border-radius:15px;
    margin-bottom:25px;
}

.tab{
    border:0;
    background:transparent;
    color:#aebdce;
    padding:12px 6px;
    border-radius:11px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    transition:.25s;
}

.tab.active{
    color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    box-shadow:0 8px 22px rgba(8,117,223,.28);
}

.login-title{
    text-align:center;
    margin-bottom:22px;
}

.login-title h2{
    font-size:23px;
    margin-bottom:4px;
}

.login-title p{
    color:var(--muted);
    font-size:13px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-size:14px;
    margin-bottom:8px;
    color:#d9e4ef;
}

.input-wrap{
    position:relative;
}

.input-wrap i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#8fa4bb;
    font-size:15px;
}

.input-wrap input{
    width:100%;
    height:52px;
    padding:0 45px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.13);
    outline:none;
    background:rgba(0,0,0,.22);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    transition:.25s;
}

.input-wrap input::placeholder{
    color:#73869a;
}

.input-wrap input:focus{
    border-color:rgba(32,152,255,.75);
    box-shadow:0 0 0 3px rgba(32,152,255,.10);
}

.password-toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#8095aa;
}

.login-btn{
    width:100%;
    height:53px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 12px 30px rgba(8,117,223,.27);
    transition:.25s;
    margin-top:5px;
}

.login-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 16px 35px rgba(8,117,223,.35);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.biometric-btn{
    width:100%;
    height:50px;
    margin-top:11px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:14px;
    background:rgba(255,255,255,.055);
    color:#dce8f4;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    transition:.25s;
}

.biometric-btn:hover{
    background:rgba(255,255,255,.10);
    border-color:rgba(32,152,255,.45);
}

.biometric-btn i{
    margin-right:7px;
    color:#49b3ff;
}

.message{
    display:none;
    margin-bottom:17px;
    padding:12px 14px;
    border-radius:12px;
    font-size:13px;
    line-height:1.6;
}

.message.error{
    display:block;
    background:rgba(255,70,70,.10);
    border:1px solid rgba(255,90,90,.25);
    color:#ffb5b5;
}

.message.success{
    display:block;
    background:rgba(40,200,120,.10);
    border:1px solid rgba(40,200,120,.25);
    color:#9ff0c8;
}

.mini-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.mini-btn{
    flex:1;
    height:38px;
    border-radius:10px;
    border:0;
    cursor:pointer;
    font-family:inherit;
    font-size:12.5px;
}

.mini-btn.primary{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
}

.mini-btn.ghost{
    background:rgba(255,255,255,.10);
    color:#dce8f4;
    border:1px solid rgba(255,255,255,.18);
}

.info{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,.09);
    text-align:center;
    color:#8195a9;
    font-size:12px;
    line-height:1.8;
}

.footer{
    text-align:center;
    color:#63778c;
    font-size:11px;
    margin-top:20px;
}

.hidden{
    display:none!important;
}

.loading{
    display:inline-flex;
    align-items:center;
    gap:8px;
}

.spinner{
    width:15px;
    height:15px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:520px){

    body{
        padding:15px;
    }

    .login-card{
        padding:21px 17px;
        border-radius:23px;
    }

    .brand h1{
        font-size:23px;
    }

    .logo-box{
        width:78px;
        height:78px;
        border-radius:21px;
    }

    .tab{
        font-size:12px;
        padding:11px 3px;
    }
}
</style>
</head>

<body>

<div class="login-wrapper">

    <div class="brand">

        <div class="logo-box">
            <img src="img/logo.png" alt="Madrasa Logo">
        </div>

        <h1>মাদরাসায়ে নূরুল কুরআন</h1>

        <p>Madrasa-e Nurul Quran</p>

    </div>


    <div class="login-card">

        <div class="tabs">

            <button
                class="tab active"
                data-role="admin"
                onclick="switchRole('admin')">

                <i class="fa-solid fa-user-shield"></i>
                অ্যাডমিন

            </button>


            <button
                class="tab"
                data-role="teacher"
                onclick="switchRole('teacher')">

                <i class="fa-solid fa-chalkboard-user"></i>
                শিক্ষক

            </button>


            <button
                class="tab"
                data-role="guardian"
                onclick="switchRole('guardian')">

                <i class="fa-solid fa-user-group"></i>
                অভিভাবক

            </button>

        </div>


        <div class="login-title">

            <h2 id="loginHeading">
                অ্যাডমিন লগইন
            </h2>

            <p id="loginSubheading">
                মাদরাসার প্রশাসনিক প্যানেলে প্রবেশ করুন
            </p>

        </div>


        <div id="message" class="message"></div>


        <!-- STAFF LOGIN -->

        <div id="staffLogin">

            <div class="form-group">

                <label id="identityLabel">
                    ইমেইল
                </label>

                <div class="input-wrap">

                    <i
                        id="identityIcon"
                        class="fa-solid fa-envelope">
                    </i>

                    <input
                        type="email"
                        id="identity"
                        placeholder="আপনার ইমেইল লিখুন"
                        autocomplete="username">

                </div>

            </div>


            <div class="form-group">

                <label>
                    পাসওয়ার্ড
                </label>

                <div class="input-wrap">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="পাসওয়ার্ড লিখুন"
                        autocomplete="current-password">

                    <span
                        class="password-toggle"
                        onclick="togglePassword()">

                        <i
                            id="passwordIcon"
                            class="fa-solid fa-eye">
                        </i>

                    </span>

                </div>

            </div>


            <button
                class="login-btn"
                id="loginBtn"
                onclick="staffLogin()">

                <span id="loginBtnText">

                    <i class="fa-solid fa-right-to-bracket"></i>
                    লগইন করুন

                </span>

            </button>


            <button
                class="biometric-btn hidden"
                id="biometricBtn"
                onclick="biometricLogin()">

                <i class="fa-solid fa-fingerprint"></i>

                Fingerprint / Face দিয়ে লগইন

            </button>

        </div>


        <!-- STUDENT / GUARDIAN LOGIN -->

        <div
            id="guardianLogin"
            class="hidden">

            <div class="form-group">

                <label>
                    Student ID
                </label>

                <div class="input-wrap">

                    <i class="fa-solid fa-id-card"></i>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Student ID লিখুন"
                        autocomplete="off">

                </div>

            </div>


            <div class="form-group">

                <label>
                    Roll Number
                </label>

                <div class="input-wrap">

                    <i class="fa-solid fa-hashtag"></i>

                    <input
                        type="text"
                        id="rollNumber"
                        placeholder="Roll Number লিখুন"
                        autocomplete="off">

                </div>

            </div>


            <button
                class="login-btn"
                id="studentLoginBtn"
                onclick="studentLogin()">

                <span id="studentLoginBtnText">

                    <i class="fa-solid fa-right-to-bracket"></i>
                    লগইন করুন

                </span>

            </button>

        </div>


        <div
            class="info"
            id="infoText">

            আপনার অ্যাকাউন্টের তথ্য ব্যবহার করে লগইন করুন।

            <br>

            Student/Guardian Login-এর জন্য Student ID ও Roll Number প্রয়োজন।

        </div>

    </div>


    <div class="footer">

        © 2026 Madrasa-e Nurul Quran. All Rights Reserved.

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   SETTINGS
========================================================= */

let settings = {};

try{

    settings =
        JSON.parse(
            localStorage.getItem(
                "madrasa_system_settings_v1"
            ) || "{}"
        );

}catch(error){

    settings = {};

}


/* =========================================================
   CURRENT ROLE
========================================================= */

let currentRole = "admin";


/* =========================================================
   ROLE SWITCH
========================================================= */

function switchRole(role){

    currentRole = role;

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.role === role
            );

        });


    clearMessage();


    const staffLogin =
        document.getElementById("staffLogin");

    const guardianLogin =
        document.getElementById("guardianLogin");

    const heading =
        document.getElementById("loginHeading");

    const subheading =
        document.getElementById("loginSubheading");

    const biometricBtn =
        document.getElementById("biometricBtn");

    const identityInput =
        document.getElementById("identity");

    const identityLabel =
        document.getElementById("identityLabel");

    const identityIcon =
        document.getElementById("identityIcon");


    if(role === "admin"){

        staffLogin.classList.remove("hidden");
        guardianLogin.classList.add("hidden");

        heading.textContent =
            "অ্যাডমিন লগইন";

        subheading.textContent =
            "মাদরাসার প্রশাসনিক প্যানেলে প্রবেশ করুন";

        identityLabel.textContent =
            "ইমেইল";

        identityInput.type =
            "email";

        identityInput.placeholder =
            "আপনার ইমেইল লিখুন";

        identityInput.autocomplete =
            "username";

        identityIcon.className =
            "fa-solid fa-envelope";


        biometricBtn.classList.toggle(
            "hidden",
            settings.biometricAdmin === false
        );

    }


    else if(role === "teacher"){

        staffLogin.classList.remove("hidden");
        guardianLogin.classList.add("hidden");

        heading.textContent =
            "শিক্ষক লগইন";

        subheading.textContent =
            "মোবাইল নম্বর ও পাসওয়ার্ড দিয়ে প্রবেশ করুন";

        identityLabel.textContent =
            "মোবাইল নম্বর";

        identityInput.type =
            "tel";

        identityInput.placeholder =
            "আপনার মোবাইল নম্বর লিখুন";

        identityInput.autocomplete =
            "tel";

        identityIcon.className =
            "fa-solid fa-mobile-screen-button";


        biometricBtn.classList.toggle(
            "hidden",
            settings.biometricTeacher === false
        );

    }


    else{

        staffLogin.classList.add("hidden");
        guardianLogin.classList.remove("hidden");

        heading.textContent =
            "অভিভাবক / শিক্ষার্থী লগইন";

        subheading.textContent =
            "Student ID ও Roll Number দিয়ে প্রবেশ করুন";

    }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type="error"){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.innerHTML =
        text;

}


function clearMessage(){

    const box =
        document.getElementById("message");

    box.className =
        "message";

    box.innerHTML =
        "";

}


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

function togglePassword(){

    const input =
        document.getElementById("password");

    const icon =
        document.getElementById("passwordIcon");


    if(input.type === "password"){

        input.type =
            "text";

        icon.className =
            "fa-solid fa-eye-slash";

    }

    else{

        input.type =
            "password";

        icon.className =
            "fa-solid fa-eye";

    }

}


/* =========================================================
   NORMALIZE MOBILE
========================================================= */

function normalizeMobile(value){

    let mobile =
        String(value || "")
        .trim()
        .replace(/[\s\-().]/g,"");


    if(mobile.startsWith("+880")){

        mobile =
            "0" + mobile.substring(4);

    }

    else if(mobile.startsWith("880")){

        mobile =
            "0" + mobile.substring(3);

    }


    return mobile;

}


/* =========================================================
   TEACHER LOGIN
   Mobile Number + Password
========================================================= */

async function verifyTeacherLogin(
    mobile,
    password
){

    const normalizedMobile =
        normalizeMobile(mobile);


    const { data, error } =
        await supabaseClient.rpc(
            "verify_teacher_login",
            {
                p_mobile: normalizedMobile,
                p_password: password
            }
        );


    if(error){

        console.error(
            "Teacher Login RPC Error:",
            error
        );

        throw error;

    }


    if(!data){

        return null;

    }


    /*
     * RPC may return either:
     * 1. one object
     * 2. an array with one object
     */

    if(Array.isArray(data)){

        if(data.length === 0)
            return null;

        return data[0];

    }


    return data;

}


/* =========================================================
   START TEACHER SESSION
========================================================= */

function startTeacherSession(teacher){

    sessionStorage.setItem(
        "teacher_login",
        "true"
    );


    sessionStorage.setItem(
        "madrasa_login_role",
        "teacher"
    );


    sessionStorage.setItem(
        "madrasa_teacher_id",
        String(
            teacher.teacher_id ||
            teacher.id ||
            ""
        )
    );


    sessionStorage.setItem(
        "madrasa_teacher_name",
        teacher.name || ""
    );


    sessionStorage.setItem(
        "teacher_data",
        JSON.stringify(teacher)
    );


    /*
     * Permission data returned by RPC.
     * Supports both "pages" and "permissions".
     */

    const pages =
        teacher.pages ||
        teacher.permissions ||
        [];


    sessionStorage.setItem(
        "madrasa_teacher_permissions",
        JSON.stringify(pages)
    );


    /*
     * Keep a compatibility copy.
     */

    sessionStorage.setItem(
        "teacher_permissions",
        JSON.stringify(pages)
    );

}


/* =========================================================
   ADMIN SESSION MARKER
========================================================= */

async function startAdminSession(user){

    sessionStorage.setItem(
        "madrasa_login_role",
        "admin"
    );


    sessionStorage.setItem(
        "madrasa_auth_user",
        JSON.stringify({
            id:user?.id || "",
            email:user?.email || "",
            role:"admin"
        })
    );


    /*
     * Remove old teacher session
     */

    sessionStorage.removeItem(
        "teacher_login"
    );

    sessionStorage.removeItem(
        "teacher_data"
    );

    sessionStorage.removeItem(
        "madrasa_teacher_id"
    );

    sessionStorage.removeItem(
        "madrasa_teacher_name"
    );

    sessionStorage.removeItem(
        "madrasa_teacher_permissions"
    );

}


/* =========================================================
   STAFF LOGIN
========================================================= */

async function staffLogin(){

    clearMessage();


    const identity =
        document
            .getElementById("identity")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    if(!identity){

        showMessage(
            currentRole === "teacher"
                ? "মোবাইল নম্বর লিখুন।"
                : "ইমেইল লিখুন।"
        );

        return;

    }


    if(!password){

        showMessage(
            "পাসওয়ার্ড লিখুন।"
        );

        return;

    }


    const loginBtn =
        document.getElementById("loginBtn");

    const btnText =
        document.getElementById("loginBtnText");


    loginBtn.disabled =
        true;


    btnText.innerHTML =
        `<span class="loading">
            <span class="spinner"></span>
            লগইন হচ্ছে...
        </span>`;


    try{

        /* =================================================
           TEACHER
        ================================================= */

        if(currentRole === "teacher"){

            const teacher =
                await verifyTeacherLogin(
                    identity,
                    password
                );


            if(!teacher){

                throw new Error(
                    "মোবাইল নম্বর অথবা পাসওয়ার্ড সঠিক নয়।"
                );

            }


            startTeacherSession(
                teacher
            );


            showMessage(
                `স্বাগতম ${teacher.name || "শিক্ষক"}। Dashboard-এ নেওয়া হচ্ছে...`,
                "success"
            );


            await maybeOfferBiometric(
                "teacher",
                normalizeMobile(identity),
                password
            );


            return;

        }


        /* =================================================
           ADMIN
        ================================================= */

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email:identity,

            password:password

        });


        if(error)
            throw error;


        if(!data.session){

            throw new Error(
                "Login session পাওয়া যায়নি।"
            );

        }


        const user =
            data.user;


        const role =
            user?.app_metadata?.role ||
            user?.user_metadata?.role ||
            "";


        if(
            role &&
            role.toLowerCase() === "teacher"
        ){

            await supabaseClient.auth.signOut();

            throw new Error(
                "শিক্ষক অ্যাকাউন্ট দিয়ে Admin Panel-এ প্রবেশ করা যাবে না।"
            );

        }


        await startAdminSession(
            user
        );


        showMessage(
            "লগইন সফল হয়েছে। Dashboard-এ নেওয়া হচ্ছে...",
            "success"
        );


        await maybeOfferBiometric(
            "admin",
            identity,
            data.session.refresh_token
        );


    }

    catch(error){

        console.error(
            "Login Error:",
            error
        );


        showMessage(
            error.message ||
            "লগইন ব্যর্থ হয়েছে।"
        );


        loginBtn.disabled =
            false;


        btnText.innerHTML =
            `<i class="fa-solid fa-right-to-bracket"></i>
             লগইন করুন`;

    }

}

/* =========================================================
   BIOMETRIC
========================================================= */

const BIOMETRIC_KEY =
    "madrasa_biometric_v1";


function getBiometricStore(){

    try{

        return JSON.parse(
            localStorage.getItem(
                BIOMETRIC_KEY
            ) || "{}"
        );

    }

    catch(error){

        return {};

    }

}


function setBiometricStore(store){

    localStorage.setItem(
        BIOMETRIC_KEY,
        JSON.stringify(store)
    );

}


function clearBiometricEntry(role){

    const store =
        getBiometricStore();

    delete store[role];

    setBiometricStore(
        store
    );

}


function bufferToBase64(buf){

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(buf)
        )
    );

}


function base64ToBuffer(b64){

    const bin =
        atob(b64);

    const bytes =
        new Uint8Array(
            bin.length
        );


    for(
        let i=0;
        i<bin.length;
        i++
    ){

        bytes[i] =
            bin.charCodeAt(i);

    }


    return bytes.buffer;

}


function randomChallenge(){

    const arr =
        new Uint8Array(32);

    crypto.getRandomValues(
        arr
    );

    return arr;

}


function encodeSecret(text){

    return btoa(
        unescape(
            encodeURIComponent(text)
        )
    );

}


function decodeSecret(text){

    return decodeURIComponent(
        escape(
            atob(text)
        )
    );

}


async function isBiometricAvailable(){

    if(!window.PublicKeyCredential){

        return false;

    }


    try{

        return await
            PublicKeyCredential
            .isUserVerifyingPlatformAuthenticatorAvailable();

    }

    catch(error){

        return false;

    }

}


/* =========================================================
   ENROLL
========================================================= */

async function enrollDeviceBiometric(
    role,
    identity,
    secret
){

    try{

        const credential =
            await navigator.credentials.create({

                publicKey:{

                    challenge:
                        randomChallenge(),

                    rp:{

                        name:
                            "মাদরাসায়ে নূরুল কুরআন",

                        id:
                            location.hostname

                    },

                    user:{

                        id:
                            new TextEncoder()
                            .encode(
                                role +
                                ":" +
                                identity
                            ),

                        name:
                            identity,

                        displayName:
                            identity

                    },

                    pubKeyCredParams:[

                        {
                            type:"public-key",
                            alg:-7
                        },

                        {
                            type:"public-key",
                            alg:-257
                        }

                    ],

                    authenticatorSelection:{

                        authenticatorAttachment:
                            "platform",

                        userVerification:
                            "required"

                    },

                    timeout:60000

                }

            });


        if(!credential){

            throw new Error(
                "Credential তৈরি করা যায়নি।"
            );

        }


        const store =
            getBiometricStore();


        store[role] = {

            identity:
                identity,

            credentialId:
                bufferToBase64(
                    credential.rawId
                ),

            secret:
                encodeSecret(secret)

        };


        setBiometricStore(
            store
        );


        return true;

    }

    catch(error){

        console.error(error);

        return false;

    }

}


/* =========================================================
   OFFER BIOMETRIC
========================================================= */

async function maybeOfferBiometric(
    role,
    identity,
    secret
){

    const roleEnabled =
        role === "admin"
            ? settings.biometricAdmin !== false
            : settings.biometricTeacher !== false;


    const alreadyEnrolled =
        !!getBiometricStore()[role];


    const available =
        await isBiometricAvailable();


    if(
        roleEnabled &&
        available &&
        !alreadyEnrolled
    ){

        offerBiometricEnroll(
            role,
            identity,
            secret
        );

    }

    else{

        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        },500);

    }

}


/* =========================================================
   BIOMETRIC OFFER
========================================================= */

function offerBiometricEnroll(
    role,
    identity,
    secret
){

    window.__pendingBiometric = {

        role,
        identity,
        secret

    };


    const box =
        document.getElementById(
            "message"
        );


    box.className =
        "message success";


    box.innerHTML =
        `লগইন সফল হয়েছে। এই ডিভাইসে Fingerprint / Face দিয়ে পরবর্তীতে লগইন চালু করবেন?

        <div class="mini-actions">

            <button
                type="button"
                class="mini-btn primary"
                onclick="confirmBiometricEnroll()">

                হ্যাঁ, চালু করুন

            </button>

            <button
                type="button"
                class="mini-btn ghost"
                onclick="goDashboard()">

                এখন না

            </button>

        </div>`;

}


/* =========================================================
   DASHBOARD
========================================================= */

function goDashboard(){

    window.location.href =
        "dashboard.html";

}


/* =========================================================
   CONFIRM BIOMETRIC
========================================================= */

async function confirmBiometricEnroll(){

    const pending =
        window.__pendingBiometric;


    if(!pending){

        goDashboard();

        return;

    }


    const ok =
        await enrollDeviceBiometric(
            pending.role,
            pending.identity,
            pending.secret
        );


    showMessage(
        ok
            ? "বায়োমেট্রিক লগইন এই ডিভাইসে চালু হয়েছে। Dashboard-এ নেওয়া হচ্ছে..."
            : "বায়োমেট্রিক চালু করা যায়নি। Dashboard-এ নেওয়া হচ্ছে...",
        "success"
    );


    setTimeout(
        goDashboard,
        700
    );

}


/* =========================================================
   BIOMETRIC LOGIN
========================================================= */

async function biometricLogin(){

    clearMessage();


    if(
        currentRole !== "admin" &&
        currentRole !== "teacher"
    ){

        return;

    }


    if(!window.PublicKeyCredential){

        showMessage(
            "এই ডিভাইস বা ব্রাউজারে Fingerprint / Face support নেই।"
        );

        return;

    }


    const store =
        getBiometricStore();


    const entry =
        store[currentRole];


    if(!entry){

        showMessage(

            currentRole === "admin"

                ? "এই ডিভাইসে এখনো বায়োমেট্রিক সেটআপ করা হয়নি। প্রথমে Email ও Password দিয়ে লগইন করুন।"

                : "এই ডিভাইসে এখনো বায়োমেট্রিক সেটআপ করা হয়নি। প্রথমে Mobile Number ও Password দিয়ে লগইন করুন।"

        );

        return;

    }


    try{

        showMessage(
            "Fingerprint / Face যাচাই করা হচ্ছে...",
            "success"
        );


        const assertion =
            await navigator.credentials.get({

                publicKey:{

                    challenge:
                        randomChallenge(),

                    allowCredentials:[{

                        id:
                            base64ToBuffer(
                                entry.credentialId
                            ),

                        type:
                            "public-key"

                    }],

                    userVerification:
                        "required",

                    timeout:
                        60000

                }

            });


        if(!assertion){

            throw new Error(
                "যাচাই ব্যর্থ হয়েছে।"
            );

        }


        const secret =
            decodeSecret(
                entry.secret
            );


        /* ADMIN */

        if(currentRole === "admin"){

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .refreshSession({

                    refresh_token:
                        secret

                });


            if(
                error ||
                !data.session
            ){

                clearBiometricEntry(
                    "admin"
                );

                throw new Error(
                    "সংরক্ষিত Admin session-এর মেয়াদ শেষ হয়েছে। আবার Password দিয়ে লগইন করুন।"
                );

            }


            await startAdminSession(
                data.user
            );


            showMessage(
                "বায়োমেট্রিক লগইন সফল হয়েছে। Dashboard-এ নেওয়া হচ্ছে...",
                "success"
            );


            setTimeout(
                goDashboard,
                400
            );

        }


        /* TEACHER */

        else{

            const teacher =
                await verifyTeacherLogin(
                    entry.identity,
                    secret
                );


            if(!teacher){

                clearBiometricEntry(
                    "teacher"
                );

                throw new Error(
                    "সংরক্ষিত Teacher তথ্য দিয়ে লগইন করা যায়নি। Mobile Number ও Password দিয়ে আবার লগইন করুন।"
                );

            }


            startTeacherSession(
                teacher
            );


            showMessage(
                `বায়োমেট্রিক লগইন সফল হয়েছে। স্বাগতম ${teacher.name || "Teacher"}।`,
                "success"
            );


            setTimeout(
                goDashboard,
                400
            );

        }

    }

    catch(error){

        console.error(error);


        showMessage(
            error.message ||
            "Fingerprint / Face login ব্যর্থ হয়েছে।"
        );

    }

}

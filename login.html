<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | মাদরাসায়ে নূরুল কুরআন</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@font-face{
    font-family:Bornomala;
    src:url("./fonts/Bornomala-Regular.ttf") format("truetype");
    font-display:swap;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Bornomala,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 15% 20%,rgba(21,143,255,.25),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(255,211,66,.16),transparent 28%),
        linear-gradient(135deg,#02152c,#064985,#087de5);
    overflow:hidden;
}

body:before,
body:after{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(70px);
    background:rgba(255,255,255,.08);
    animation:float 10s ease-in-out infinite alternate;
}

body:before{left:-120px;top:-100px}
body:after{right:-120px;bottom:-100px;animation-delay:2s}

@keyframes float{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(100px,80px) scale(1.3)}
}

.login-card{
    width:min(450px,100%);
    padding:38px;
    border-radius:30px;
    color:#fff;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:0 30px 90px rgba(0,0,0,.25);
    position:relative;
    overflow:hidden;
}

.login-card:after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    filter:blur(35px);
    left:-100px;
    top:-100px;
    animation:water 7s ease-in-out infinite alternate;
}

@keyframes water{
    to{transform:translate(280px,200px) scale(1.3)}
}

.content{
    position:relative;
    z-index:2;
}

.logo{
    width:82px;
    height:82px;
    display:block;
    margin:0 auto 18px;
    object-fit:contain;
    border-radius:50%;
    background:#fff;
}

h1{
    text-align:center;
    font-size:29px;
}

.subtitle{
    text-align:center;
    color:#d8ecff;
    margin:6px 0 28px;
}

label{
    display:block;
    margin:13px 0 7px;
}

input{
    width:100%;
    padding:14px 15px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:12px;
    outline:none;
    background:rgba(255,255,255,.10);
    color:#fff;
    font-family:inherit;
    font-size:15px;
}

input::placeholder{color:#c4d5e6}

input:focus{
    border-color:#ffd447;
    box-shadow:0 0 0 3px rgba(255,212,71,.12);
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#ffd447;
    color:#102945;
    font-family:inherit;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,0,0,.18);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.error{
    min-height:25px;
    color:#ffd0d0;
    text-align:center;
    margin-top:14px;
}

.back{
    display:block;
    text-align:center;
    color:#d9edff;
    margin-top:20px;
}

.back:hover{color:#ffd447}
</style>
</head>

<body>

<div class="login-card">

<div class="content">

<img src="images/logo.png" class="logo" alt="Logo">

<h1>অ্যাডমিন পোর্টাল</h1>

<p class="subtitle">
মাদরাসায়ে নূরুল কুরআন
</p>

<form id="loginForm">

<label for="email">ই-মেইল</label>

<input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="Admin Email"
    required>

<label for="password">পাসওয়ার্ড</label>

<input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Password"
    required>

<button id="loginBtn" type="submit">
🔐 লগইন করুন
</button>

<div class="error" id="error"></div>

</form>

<a href="index.html" class="back">
← হোম পেজে ফিরে যান
</a>

</div>

</div>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form =
document.getElementById("loginForm");

const errorBox =
document.getElementById("error");

const loginBtn =
document.getElementById("loginBtn");


form.addEventListener("submit",async function(e){

    e.preventDefault();

    errorBox.textContent="";
    loginBtn.disabled=true;
    loginBtn.textContent="লগইন হচ্ছে...";

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    const {data,error} =
        await db.auth.signInWithPassword({
            email,
            password
        });


    if(error){

        errorBox.textContent =
            "লগইন ব্যর্থ: " + error.message;

        loginBtn.disabled=false;
        loginBtn.textContent="🔐 লগইন করুন";

        return;
    }


    if(data.session){

        window.location.replace("dashboard.html");

    }

});


// Already logged in হলে dashboard
(async()=>{

    const {data} =
        await db.auth.getSession();

    if(data.session){

        window.location.replace("dashboard.html");

    }

})();

</script>

</body>
</html>

/* =====================================================
START
===================================================== */

const {
data:{session},
error

alert(error.message);

return;

if(!session){

location.href="admin.html";

LOAD CLASSES
===================================================== */

data,
error
}=await db

.from("classes")

.select("*")

.order("id");

classes=[];

return;

}


classes=data || [];

document.getElementById("classId");


select.innerHTML=
`<option value="">সব Class</option>`;

/* =====================================================
STUDENT ATTENDANCE
===================================================== */

async function loadStudentAttendance(date){

let query=db

.from("student_attendance")

.select("*")

.eq(
"attendance_date",
date
)

.order(
"id",
{ascending:false}
);


const classId=
document.getElementById("classId").value;


if(classId){

query=query.eq(
"student_id",
students
.filter(s=>
String(s.class_id)===String(classId)
)
.map(s=>s.id)
);

}


const {
data,
error
}=await query;


if(error){

showMessage(
"❌ "+error.message,
"error"
);

return;

}


attendanceRecords=data || [];


renderStudentAttendance();

}

TEACHER ATTENDANCE

===================================================== */

let present=0;
let absent=0;


attendanceRecords.forEach(r=>{

total++;

if(r.status==="present"){

present++;

}else{

absent++;

}

});


updateSummary(
total,
present,
absent
);


const tbody=
document.getElementById(
"attendanceList"
);


if(!attendanceRecords.length){

tbody.innerHTML=`

<tr>

<td colspan="7"
style="text-align:center">

এই তারিখে কোনো Attendance record নেই।

</td>

</tr>

`;

return;

}


tbody.innerHTML=
attendanceRecords.map(
(r,i)=>{


const student=
students.find(s=>
String(s.id)===
String(r.student_id)
);


const name=
student?.name || "Unknown";


const studentId=
student?.student_id || r.student_id || "-";


const className=
student?.classes?.name || "-";


const status=
r.status==="present"
?
"উপস্থিত"
:
"অনুপস্থিত";


const statusClass=
r.status==="present"
?
"present"
:
"absent";


return `

<tr>

<td>${i+1}</td>

<td>
${escapeHtml(studentId)}
</td>

<td>
${escapeHtml(name)}
</td>

<td>
${escapeHtml(className)}
</td>

<td>
${escapeHtml(r.attendance_date || "-")}
</td>

<td class="${statusClass}">
${r.status==="present"?"✅":"❌"}
${status}
</td>

<td class="action">

<button
class="edit"
onclick="editAttendance('${escapeHtml(String(r.id))}')">

Edit

</button>

<button
class="delete"
onclick="deleteAttendance('${escapeHtml(String(r.id))}')">

Delete

}).join("");

/* =====================================================
SUMMARY
===================================================== */

function updateSummary(
total,
present,
absent
){

"total"
).textContent=total;

document.getElementById(
"present"
).textContent=present;

document.getElementById(
"absent"
).textContent=absent;

/* =====================================================
EDIT ATTENDANCE
===================================================== */

function editAttendance(id){

if(
id===null ||
id===undefined ||
String(id).trim()==="" ||
String(id)==="null" ||
String(id)==="undefined"
){

alert("❌ Invalid Attendance ID");

return;

}


const record=
attendanceRecords.find(r=>
String(r.id)===String(id)
);


if(!record){

alert(
"❌ Attendance record পাওয়া যায়নি।"
);

return;

}


editingId=
String(record.id);


document.getElementById(
"date"
).value=
record.attendance_date || "";


if(mode==="student"){

const student=
students.find(s=>
String(s.id)===
String(record.student_id)
);


if(!student){

alert(
"❌ Student পাওয়া যায়নি।"
);

return;

}


document.getElementById(
"classId"
).value=
student.class_id || "";


loadPersonDropdown();


document.getElementById(
"personId"
).value=
String(record.student_id);


}else if(mode==="teacher"){

loadPersonDropdown();

document.getElementById(
"personId"
).value=
String(record.teacher_id);


}else{

loadPersonDropdown();

document.getElementById(
"personId"
).value=
String(record.employee_id);

}


document.getElementById(
"status"
).value=
record.status || "present";


document.getElementById(
"saveBtn"
).textContent=
"💾 Update Attendance";


document.getElementById(
"cancelBtn"
).style.display=
"inline-block";


document.getElementById(
"formTitle"
).textContent=
"✏️ Edit Attendance";


window.scrollTo({
top:0,
behavior:"smooth"
});

}



/* =====================================================
SAVE / UPDATE
===================================================== */

async function saveAttendance(){

const personId=
document.getElementById(
"personId"
).value;


const date=
document.getElementById(
"date"
).value;


const status=
document.getElementById(
"status"
).value;


if(!personId){

alert(
"❌ Person নির্বাচন করুন"
);

return;

}


if(!date){

alert(
"❌ Date নির্বাচন করুন"
);

return;

}


const table=
mode==="student"
?
"student_attendance"
:
mode==="teacher"
?
"teacher_attendance"
:
"employee_attendance";


const record={

attendance_date:date,

status:status

};


if(mode==="student"){

record.student_id=
Number(personId);

}

else if(mode==="teacher"){

record.teacher_id=
Number(personId);

}

else{

record.employee_id=
Number(personId);

}


const saveBtn=
document.getElementById(
"saveBtn"
);


saveBtn.disabled=true;


try{

let result;


if(editingId){

result=
await db

.from(table)

.update(record)

.eq(
"id",
editingId
);

}else{

result=
await db

.from(table)

.upsert(
record,
{
onConflict:
mode==="student"
?
"student_id,attendance_date"
:
mode==="teacher"
?
"teacher_id,attendance_date"
:
"employee_id,attendance_date"
}
);

}


if(result.error){

alert(
"❌ "+result.error.message
);

return;

}


showMessage(
editingId
?
"✅ Attendance updated successfully"
:
"✅ Attendance saved successfully",
"success"
);


cancelEdit();


await loadPeople();


}catch(error){

alert(
"❌ "+error.message
);

}finally{

saveBtn.disabled=false;

}

}



/* =====================================================
DELETE ATTENDANCE
===================================================== */

async function deleteAttendance(id){

if(
id===null ||
id===undefined ||
String(id).trim()==="" ||
String(id)==="null" ||
String(id)==="undefined"
){

alert(
"❌ Invalid Attendance ID"
);

return;

}


if(!confirm(
"এই Attendance record Delete করতে চান?"
)){

return;

}


const table=
mode==="student"
?
"student_attendance"
:
mode==="teacher"
?
"teacher_attendance"
:
"employee_attendance";


const numericId=
Number(id);


if(!Number.isInteger(numericId)){

alert(
"❌ Invalid Attendance ID: "+id
);

return;

}


const {
data,
error
}=await db

.from(table)

.delete()

.eq(
"id",
numericId
)

.select("id");


if(error){

console.error(error);

alert(
"❌ Delete failed:\n"+
error.message
);

return;

}


if(!data || data.length===0){

alert(
"❌ Record পাওয়া যায়নি অথবা Delete permission নেই।"
);

return;

}


showMessage(
"✅ Attendance deleted successfully",
"success"
);


await loadPeople();

}

${escapeHtml(s.student_id || "")}
 - 
${escapeHtml(s.name || "Unknown")}

`;

});

}


else if(mode==="teacher"){

select.innerHTML=
`<option value="">
Teacher নির্বাচন করুন
</option>`;


teachers.forEach(t=>{

select.innerHTML+=`

<option value="${escapeHtml(t.id)}">

${escapeHtml(t.name || "Unknown")}

${t.phone
?
" - "+escapeHtml(t.phone)
:
""}

</option>

`;

});

}


else{

select.innerHTML=
`<option value="">
Employee নির্বাচন করুন
</option>`;


employees.forEach(e=>{

select.innerHTML+=`

<option value="${escapeHtml(e.id)}">

${escapeHtml(
e.employee_id || ""
)}

${e.employee_id?" - ":""}

${escapeHtml(
e.name || "Unknown"
)}

</option>

`;

});

}

}

/* =====================================================
ACTIVATE TAB
===================================================== */

function activateTab(id){

document
.querySelectorAll(".tab")
.forEach(btn=>
btn.classList.remove("active")
);


document
.getElementById(id)
.classList.add("active");

}

}else{

document.getElementById(
"formTitle"
).textContent=
"📋 Employee Attendance";

}

}



/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

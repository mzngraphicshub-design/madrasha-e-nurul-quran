<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Student Attendance | মাদরাসায়ে নূরুল কুরআন</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f4f7f6;
color:#222;
}


/* TOP BAR */

.topbar{
height:42px;
background:#075c43;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-size:13px;
}

.topbar a{
color:#fff;
text-decoration:none;
}


/* CONTENT */

.container{
padding:16px;
max-width:1100px;
margin:auto;
}


/* CARD */

.card{
background:#fff;
border-radius:12px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 10px #0000000d;
}

.card h3{
color:#075c43;
margin-bottom:18px;
font-size:16px;
}


/* FILTER */

.filters{
display:grid;
grid-template-columns:1fr 1fr auto;
gap:12px;
align-items:end;
}

label{
font-size:12px;
display:block;
margin-bottom:6px;
}

input,
select{
width:100%;
height:38px;
border:1px solid #ddd;
border-radius:6px;
padding:0 10px;
background:#f7f7f7;
}

button{
border:0;
background:#087f5b;
color:#fff;
border-radius:6px;
padding:10px 16px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#075c43;
}


/* TABLE */

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:850px;
}

th{
background:#075c43;
color:#fff;
font-size:12px;
padding:10px 8px;
text-align:left;
}

td{
padding:9px 8px;
border-bottom:1px solid #eee;
font-size:12px;
}

.status{
height:34px;
padding:0 8px;
}


/* ACTION */

.action{
white-space:nowrap;
}

.action button{
padding:7px 10px;
font-size:11px;
margin-right:4px;
}

.edit{
background:#1565c0;
}

.delete{
background:#c62828;
}


/* SAVE */

.save-box{
text-align:right;
margin-top:15px;
}


/* MESSAGE */

.message{
text-align:center;
padding:25px;
color:#777;
font-size:13px;
}

#msg{
margin-top:12px;
font-weight:bold;
text-align:center;
}


/* MOBILE */

@media(max-width:600px){

.container{
padding:10px;
}

.filters{
grid-template-columns:1fr;
}

button{
width:100%;
}

.topbar{
font-size:12px;
}

}

</style>

</head>


<body>


<!-- ================= TOP ================= -->

<div class="topbar">

<strong>
📋 Student Attendance
</strong>

<a href="dashboard.html">
← Dashboard
</a>

</div>


<div class="container">


<!-- ================= FILTER ================= -->

<div class="card">

<h3>
📋 Attendance নেওয়া
</h3>


<div class="filters">


<div>

<label>
Date
</label>

<input
type="date"
id="attendanceDate"
>

</div>


<div>

<label>
Class
</label>

<select
id="classSelect"
>

<option value="">
সকল Class
</option>

</select>

</div>


<div>

<button
id="loadStudents"
type="button"
>

Load Students

</button>

</div>


</div>

</div>



<!-- ================= STUDENT LIST ================= -->

<div class="card">

<h3>
👨‍🎓 Student List
</h3>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
ক্রমিক
</th>

<th>
Student ID
</th>

<th>
Student Name
</th>

<th>
Class
</th>

<th>
Attendance
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody id="studentTable">

<tr>

<td
colspan="6"
class="message"
>

Date এবং Class নির্বাচন করে Load Students করুন

</td>

</tr>

</tbody>

</table>

</div>


<div class="save-box">

<button
id="saveAttendance"
type="button"
>

💾 Save Attendance

</button>

</div>


<div id="msg"></div>

</div>


</div>



<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";


const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



/* =====================================================
VARIABLES
===================================================== */

let students = [];



/* =====================================================
DATE
===================================================== */

const dateInput =
document.getElementById(
"attendanceDate"
);


const today =
new Date();


const yyyy =
today.getFullYear();


const mm =
String(today.getMonth()+1)
.padStart(2,"0");


const dd =
String(today.getDate())
.padStart(2,"0");


dateInput.value =
`${yyyy}-${mm}-${dd}`;



/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}



/* =====================================================
MESSAGE
===================================================== */

function showMessage(
text,
type=""
){

const msg =
document.getElementById("msg");

msg.textContent =
text;

msg.style.color =
type==="error"
?
"#c62828"
:
"#087f5b";

}



/* =====================================================
LOGIN
===================================================== */

async function checkLogin(){

const {
data:{
session
}
} =
await db.auth.getSession();


if(!session){

location.href =
"admin.html";

return false;

}


return true;

}



/* =====================================================
LOAD CLASSES
===================================================== */

async function loadClasses(){

const select =
document.getElementById(
"classSelect"
);


const {
data,
error
} =
await db

.from("classes")

.select("*")

.order(
"id",
{
ascending:true
}
);


if(error){

console.error(error);

return;

}


select.innerHTML =
`
<option value="">
সকল Class
</option>
`;


if(
!data ||
data.length===0
){

const defaultClasses = [

"নূরানী",
"১ম শ্রেণি",
"২য় শ্রেণি",
"৩য় শ্রেণি",
"৪র্থ শ্রেণি",
"৫ম শ্রেণি",
"নাজেরা",
"হিফজ"

];


defaultClasses.forEach(
function(name){

const option =
document.createElement(
"option"
);

option.value =
name;

option.textContent =
name;

select.appendChild(
option
);

});

return;

}


data.forEach(
function(item){

const classId =
item.id ?? "";


const className =
item.name ||
item.class_name ||
item.title ||
"";


if(!className){
return;
}


const option =
document.createElement(
"option"
);


option.value =
classId;


option.textContent =
className;


select.appendChild(
option
);

});

}



/* =====================================================
LOAD STUDENTS
===================================================== */

async function loadStudents(){

const date =
dateInput.value;


const classId =
document.getElementById(
"classSelect"
).value;


const tbody =
document.getElementById(
"studentTable"
);


if(!date){

alert(
"তারিখ নির্বাচন করুন।"
);

return;

}


tbody.innerHTML =
`
<tr>
<td
colspan="6"
class="message"
>
Students লোড হচ্ছে...
</td>
</tr>
`;


let query =
db

.from("students")

.select(
"id,student_id,name,class_id,classes(name)"
)

.order(
"name",
{
ascending:true
}
);


/*
Class নির্বাচন করলে
class_id দিয়ে filter হবে।
*/

if(classId){

query =
query.eq(
"class_id",
classId
);

}


const {
data,
error
} =
await query;


if(error){

console.error(
"STUDENT LOAD ERROR:",
error
);


tbody.innerHTML =
`
<tr>
<td
colspan="6"
class="message"
>
❌ Student data load করা যায়নি।
<br>
${escapeHtml(
error.message
)}
</td>
</tr>
`;

return;

}


students =
data || [];


if(!students.length){

tbody.innerHTML =
`
<tr>
<td
colspan="6"
class="message"
>
এই Class-এ কোনো Student পাওয়া যায়নি।
</td>
</tr>
`;

return;

}


/* =====================================================
LOAD EXISTING ATTENDANCE
===================================================== */

const {
data:attendanceData,
error:attendanceError
} =
await db

.from(
"student_attendance"
)

.select(
"id,student_id,status,attendance_date"
)

.eq(
"attendance_date",
date
);


if(attendanceError){

console.error(
"ATTENDANCE LOAD ERROR:",
attendanceError
);

showMessage(
"❌ "+attendanceError.message,
"error"
);

return;

}


const attendanceMap = {};


(
attendanceData || []
).forEach(
function(record){

attendanceMap[
String(record.student_id)
] = record;

});


/* =====================================================
BUILD TABLE
===================================================== */

tbody.innerHTML = "";


students.forEach(
function(student,index){

const studentDbId =
student.id;


const studentId =
student.student_id ||
student.id ||
"";


const name =
student.name ||
"";


const className =
student.classes?.name ||
"-";


const record =
attendanceMap[
String(studentDbId)
];


const status =
record?.status ||
"present";


const tr =
document.createElement(
"tr"
);


tr.dataset.studentId =
studentDbId;


tr.dataset.attendanceId =
record?.id ||
"";


tr.innerHTML =
`

<td>
${index+1}
</td>


<td>
${escapeHtml(studentId)}
</td>


<td>
${escapeHtml(name)}
</td>


<td>
${escapeHtml(className)}
</td>


<td>

<select
class="status"
data-student-id="${escapeHtml(studentDbId)}"
>

<option
value="present"
${status==="present"?"selected":""}
>
উপস্থিত
</option>


<option
value="absent"
${status==="absent"?"selected":""}
>
অনুপস্থিত
</option>


<option
value="late"
${status==="late"?"selected":""}
>
বিলম্ব
</option>


<option
value="leave"
${status==="leave"?"selected":""}
>
ছুটি
</option>

</select>

</td>


<td
class="action"
>

${
record
?
`

<button
type="button"
class="edit"
onclick="editAttendance('${escapeHtml(record.id)}')"
>
✏️ Edit
</button>


<button
type="button"
class="delete"
onclick="deleteAttendance('${escapeHtml(record.id)}')"
>
🗑️ Delete
</button>

`
:
`
<span style="color:#999">
Not saved
</span>
`
}

</td>

`;


tbody.appendChild(
tr
);

});

}



/* =====================================================
SAVE ATTENDANCE
===================================================== */

async function saveAttendance(){

const date =
dateInput.value;


if(!date){

alert(
"তারিখ নির্বাচন করুন।"
);

return;

}


const rows =
document.querySelectorAll(
"#studentTable tr[data-student-id]"
);


if(rows.length===0){

alert(
"প্রথমে Student Load করুন।"
);

return;

}


const records = [];


rows.forEach(
function(row){

const studentId =
row.dataset.studentId;


const status =
row.querySelector(
".status"
).value;


records.push({

student_id:
Number(studentId),

attendance_date:
date,

status:
status

});

});


const {
error
} =
await db

.from(
"student_attendance"
)

.upsert(
records,
{
onConflict:
"student_id,attendance_date"
}
);


if(error){

console.error(
"SAVE ERROR:",
error
);

showMessage(
"❌ "+error.message,
"error"
);

return;

}


showMessage(
"✅ Student Attendance সফলভাবে Save হয়েছে।"
);


await loadStudents();

}



/* =====================================================
EDIT ATTENDANCE
===================================================== */

async function editAttendance(
id
){

if(
!id ||
String(id)==="null" ||
String(id)==="undefined"
){

alert(
"❌ Invalid Attendance ID"
);

return;

}


const {
data,
error
} =
await db

.from(
"student_attendance"
)

.select("*")

.eq(
"id",
id
)

.maybeSingle();


if(error){

alert(
"❌ "+error.message
);

return;

}


if(!data){

alert(
"❌ Attendance record পাওয়া যায়নি।"
);

return;

}


const currentStatus =
data.status ||
"present";


const newStatus =
currentStatus === "present"
?
"absent"
:
"present";


const confirmEdit =
confirm(

"বর্তমান Status: "+
(
currentStatus==="present"
?
"উপস্থিত"
:
currentStatus==="absent"
?
"অনুপস্থিত"
:
currentStatus
)+

"\n\nনতুন Status হবে: "+
(
newStatus==="present"
?
"উপস্থিত"
:
"অনুপস্থিত"
)+

"\n\nUpdate করতে চান?"

);


if(!confirmEdit){

return;

}


const {
error:updateError
} =
await db

.from(
"student_attendance"
)

.update({

status:
newStatus

})

.eq(
"id",
id
);


if(updateError){

alert(
"❌ Edit failed:\n"+
updateError.message
);

return;

}


alert(
"✅ Attendance updated successfully"
);


await loadStudents();

}



/* =====================================================
DELETE ATTENDANCE
===================================================== */

async function deleteAttendance(
id
){

if(
!id ||
String(id)==="null" ||
String(id)==="undefined"
){

alert(
"❌ Invalid Attendance ID"
);

return;

}


const confirmDelete =
confirm(

"এই Student Attendance record Delete করতে চান?"

);


if(!confirmDelete){

return;

}


/*
IMPORTANT:
Database-এর attendance record-এর
নিজস্ব ID দিয়ে delete হচ্ছে।
*/

const {
data,
error
} =
await db

.from(
"student_attendance"
)

.delete()

.eq(
"id",
id
)

.select(
"id"
);


if(error){

console.error(
"DELETE ERROR:",
error
);


alert(
"❌ Delete failed:\n"+
error.message
);

return;

}


/*
যদি data empty হয়,
তাহলে RLS policy delete আটকাচ্ছে।
*/

if(
!data ||
data.length===0
){

alert(
"❌ Record Delete হয়নি।\n\nSupabase RLS DELETE permission check করুন।"
);

return;

}


alert(
"✅ Student Attendance deleted successfully"
);


/*
Database থেকে সত্যিই delete হওয়ার পর
আবার list load করা হচ্ছে।
*/

await loadStudents();

}



/* =====================================================
BUTTON EVENTS
===================================================== */

document

.getElementById(
"loadStudents"
)

.addEventListener(
"click",
loadStudents
);


document

.getElementById(
"saveAttendance"
)

.addEventListener(
"click",
saveAttendance
);



/* =====================================================
DATE CHANGE
===================================================== */

dateInput

.addEventListener(
"change",
function(){

loadStudents();

});



/* =====================================================
CLASS CHANGE
===================================================== */

document

.getElementById(
"classSelect"
)

.addEventListener(
"change",
function(){

loadStudents();

});



/* =====================================================
START
===================================================== */

async function start(){

const logged =
await checkLogin();


if(!logged){
return;
}


await loadClasses();


/*
Page open হলে
আজকের date-এর student list load করবে।
*/

await loadStudents();

}


start();

</script>

</body>
</html>

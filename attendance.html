<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Attendance</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f6}
.top{background:#075c43;color:#fff;padding:17px 22px;display:flex;justify-content:space-between}
.top a{color:#fff;text-decoration:none}.container{max-width:1100px;margin:25px auto;padding:0 15px}
.box{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}label{font-weight:bold;font-size:14px}
input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #ddd;border-radius:7px}
button{border:0;padding:11px 17px;border-radius:7px;background:#087f5b;color:#fff;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:10px;border-bottom:1px solid #ddd}
th{background:#075c43;color:#fff;text-align:left}
.present{color:#087f5b;font-weight:bold}.absent{color:#c62828;font-weight:bold}
.table-wrap{overflow:auto}
@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>

<header class="top">
<h2>📋 Student Attendance</h2>
<a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

<div class="box">
<h3>Attendance নেওয়া</h3>

<div class="form">
<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Class</label>
<select id="classId">
<option value="">সব Class</option>
</select>
</div>

<div class="full">
<button onclick="loadStudents()">Load Students</button>
</div>
</div>
</div>

<div class="box">
<h3>👨‍🎓 Student List</h3>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>ID</th>
<th>Student Name</th>
<th>Class</th>
<th>Attendance</th>
</tr>
</thead>
<tbody id="studentList">
<tr><td colspan="4">আগে Date ও Class নির্বাচন করুন</td></tr>
</tbody>
</table>
</div>

<br>
<button onclick="saveAttendance()">💾 Save Attendance</button>
<div id="msg"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qavublwhqiqsgpcmfyft.supabase.co";
const SUPABASE_KEY="sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let students=[];

document.getElementById("date").value=
new Date().toISOString().split("T")[0];

async function start(){

const {data:{session}}=await db.auth.getSession();

if(!session){
location.href="admin.html";
return;
}

const {data,error}=await db.from("classes").select("*").order("id");

if(error){alert(error.message);return}

const select=document.getElementById("classId");

(data||[]).forEach(c=>{
select.innerHTML+=
`<option value="${c.id}">${c.name}</option>`;
});
}

async function loadStudents(){

const classId=document.getElementById("classId").value;

let query=db
.from("students")
.select("id,student_id,name,class_id,classes(name)")
.order("name");

if(classId) query=query.eq("class_id",classId);

const {data,error}=await query;

if(error){
alert(error.message);
return;
}

students=data||[];

const tbody=document.getElementById("studentList");

if(!students.length){
tbody.innerHTML='<tr><td colspan="4">কোনো Student নেই</td></tr>';
return;
}

tbody.innerHTML=students.map((s,i)=>`
<tr>
<td>${s.student_id}</td>
<td>${s.name}</td>
<td>${s.classes?.name||"-"}</td>
<td>
<select id="status_${i}">
<option value="present">উপস্থিত</option>
<option value="absent">অনুপস্থিত</option>
</select>
</td>
</tr>
`).join("");
}

async function saveAttendance(){

if(!students.length){
alert("আগে Student Load করুন");
return;
}

const date=document.getElementById("date").value;

const rows=students.map((s,i)=>({
student_id:s.id,
attendance_date:date,
status:document.getElementById("status_"+i).value
}));

const {error}=await db
.from("student_attendance")
.upsert(rows,{onConflict:"student_id,attendance_date"});

if(error){
document.getElementById("msg").textContent="❌ "+error.message;
return;
}

document.getElementById("msg").textContent=
"✅ Attendance saved successfully";
}

start();
</script>
</body>
</html>

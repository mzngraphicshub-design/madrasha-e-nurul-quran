<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Student Attendance | মাদরাসায়ে নূরুল কুরআন</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f4f7f6;
color:#222;
}

/* TOP BAR */

.topbar{
height:42px;
background:#075c43;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-size:13px;
}

.topbar a{
color:#fff;
text-decoration:none;
}


/* CONTENT */

.container{
padding:16px;
max-width:1100px;
margin:auto;
}


/* CARD */

.card{
background:#fff;
border-radius:12px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 10px #0000000d;
}

.card h3{
color:#075c43;
margin-bottom:18px;
font-size:16px;
}


/* FILTER */

.filters{
display:grid;
grid-template-columns:1fr 1fr auto;
gap:12px;
align-items:end;
}

label{
font-size:12px;
display:block;
margin-bottom:6px;
}

input,
select{
width:100%;
height:38px;
border:1px solid #ddd;
border-radius:6px;
padding:0 10px;
background:#f7f7f7;
}

button{
border:0;
background:#087f5b;
color:#fff;
border-radius:6px;
padding:10px 16px;
cursor:pointer;
}

button:hover{
background:#075c43;
}


/* TABLE */

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:650px;
}

th{
background:#075c43;
color:#fff;
font-size:12px;
padding:10px 8px;
text-align:left;
}

td{
padding:9px 8px;
border-bottom:1px solid #eee;
font-size:12px;
}

.status{
height:34px;
padding:0 8px;
}


/* SAVE */

.save-box{
text-align:right;
margin-top:15px;
}


/* MESSAGE */

.message{
text-align:center;
padding:25px;
color:#777;
font-size:13px;
}


/* MOBILE */

@media(max-width:600px){

.container{
padding:10px;
}

.filters{
grid-template-columns:1fr;
}

button{
width:100%;
}

.topbar{
font-size:12px;
}

}

</style>

</head>


<body>


<!-- ================= TOP ================= -->

<div class="topbar">

<strong>
📋 Student Attendance
</strong>

<a href="dashboard.html">
← Dashboard
</a>

</div>


<div class="container">


<!-- ================= FILTER ================= -->

<div class="card">

<h3>📋 Attendance নেওয়া</h3>


<div class="filters">

<div>

<label>Date</label>

<input
type="date"
id="attendanceDate"
>

</div>


<div>

<label>Class</label>

<select id="classSelect">

<option value="">
সকল Class
</option>

</select>

</div>


<div>

<button
id="loadStudents"
type="button"
>
Load Students
</button>

</div>

</div>

</div>


<!-- ================= STUDENT LIST ================= -->

<div class="card">

<h3>👨‍🎓 Student List</h3>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>ক্রমিক</th>

<th>Student ID</th>

<th>Student Name</th>

<th>Class</th>

<th>Attendance</th>

</tr>

</thead>


<tbody id="studentTable">

<tr>

<td
colspan="5"
class="message"
>
Date এবং Class নির্বাচন করে Load Students করুন
</td>

</tr>

</tbody>

</table>

</div>


<div class="save-box">

<button
id="saveAttendance"
type="button"
>
💾 Save Attendance
</button>

</div>

</div>


</div>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ================= DATE ================= */

const dateInput =
document.getElementById("attendanceDate");

const today =
new Date();

const yyyy =
today.getFullYear();

const mm =
String(today.getMonth()+1)
.padStart(2,"0");

const dd =
String(today.getDate())
.padStart(2,"0");

dateInput.value =
`${yyyy}-${mm}-${dd}`;


/* ================= SESSION ================= */

async function checkLogin(){

const {
data:{session}
}=await db.auth.getSession();

if(!session){

location.href="admin.html";
return false;

}

return true;

}


/* ================= LOAD CLASSES ================= */

async function loadClasses(){

const select =
document.getElementById("classSelect");


const {data,error} =
await db
.from("classes")
.select("*")
.order("id",{ascending:true});


if(error){

console.log(error);

return;

}


if(!data || data.length===0){

/*
যদি classes table-এ data না থাকে,
তাহলে default class দেখাবে।
*/

const defaultClasses=[
"নূরানী",
"১ম শ্রেণি",
"২য় শ্রেণি",
"৩য় শ্রেণি",
"৪র্থ শ্রেণি",
"৫ম শ্রেণি",
"নাজেরা",
"হিফজ"
];


defaultClasses.forEach(function(name){

const option =
document.createElement("option");

option.value=name;
option.textContent=name;

select.appendChild(option);

});

return;

}


data.forEach(function(item){

const option =
document.createElement("option");

option.value =
item.name ||
item.class_name ||
item.title ||
"";

option.textContent =
item.name ||
item.class_name ||
item.title ||
"";

if(option.value){

select.appendChild(option);

}

});

}


/* ================= LOAD STUDENTS ================= */

async function loadStudents(){

const date =
dateInput.value;

const className =
document.getElementById("classSelect").value;

const tbody =
document.getElementById("studentTable");


if(!date){

alert("তারিখ নির্বাচন করুন।");
return;

}


tbody.innerHTML=
`
<tr>
<td colspan="5" class="message">
Students লোড হচ্ছে...
</td>
</tr>
`;


let query =
db
.from("students")
.select("*");


/*
Class select করলে
শুধু সেই class-এর students দেখাবে।
*/

if(className){

query =
query.eq("class",className);

}


const {data,error} =
await query;


if(error){

console.log(error);

tbody.innerHTML=
`
<tr>
<td colspan="5" class="message">
Student data load করা যায়নি।
</td>
</tr>
`;

return;

}


if(!data || data.length===0){

tbody.innerHTML=
`
<tr>
<td colspan="5" class="message">
এই Class-এ কোনো Student পাওয়া যায়নি।
</td>
</tr>
`;

return;

}


tbody.innerHTML="";


data.forEach(function(student,index){

const id =
student.id ||
student.student_id ||
"";

const studentId =
student.student_id ||
student.roll ||
student.id ||
"";

const name =
student.name ||
student.student_name ||
"";

const cls =
student.class ||
student.class_name ||
"";


const tr =
document.createElement("tr");


tr.dataset.studentId=id;


tr.innerHTML=
`
<td>${index+1}</td>

<td>${studentId}</td>

<td>${name}</td>

<td>${cls}</td>

<td>

<select class="status">

<option value="present">
উপস্থিত
</option>

<option value="absent">
অনুপস্থিত
</option>

<option value="late">
বিলম্ব
</option>

<option value="leave">
ছুটি
</option>

</select>

</td>
`;


tbody.appendChild(tr);

});

}


/* ================= SAVE ATTENDANCE ================= */

async function saveAttendance(){

const date =
dateInput.value;

if(!date){

alert("তারিখ নির্বাচন করুন।");
return;

}


const rows =
document.querySelectorAll(
"#studentTable tr[data-student-id]"
);


if(rows.length===0){

alert("প্রথমে Student Load করুন।");
return;

}


const records=[];


rows.forEach(function(row){

const studentId =
row.dataset.studentId;

const status =
row.querySelector(".status").value;


records.push({

student_id:studentId,

attendance_date:date,

status:status

});

});


/*
আগের attendance থাকলে
update করার চেষ্টা করবে।
*/

const {error} =
await db
.from("student_attendance")
.upsert(
records,
{
onConflict:
"student_id,attendance_date"
}
);


if(error){

console.log(error);

alert(
"Attendance save হয়নি। Supabase table/column name check করুন।"
);

return;

}


alert(
"✅ Student Attendance সফলভাবে Save হয়েছে।"
);

}


/* ================= BUTTONS ================= */

document
.getElementById("loadStudents")
.addEventListener(
"click",
loadStudents
);


document
.getElementById("saveAttendance")
.addEventListener(
"click",
saveAttendance
);


/* ================= START ================= */

async function start(){

const logged =
await checkLogin();

if(!logged)return;

await loadClasses();

}

start();

</script>

</body>

</html>

<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";


const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY

/* =====================================================
VARIABLES
===================================================== */

let mode = "student";

/* =====================================================
TODAY
===================================================== */

function today(){

return new Date()
.toISOString()
.split("T")[0];

}



/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}



/* =====================================================
MESSAGE
===================================================== */

function showMessage(text,type=""){

const msg =
document.getElementById("msg");

msg.textContent = text;

msg.className = type;

}



/* =====================================================
START
===================================================== */

async function start(){

const {
data:{session},
error
} =
await db.auth.getSession();


if(error){

alert(
"Session error: "+
error.message
);

return;

}


if(!session){

location.href="admin.html";

return;

}


document.getElementById("date").value =
today();


await loadClasses();

await loadPeople();

await loadReport();

}



/* =====================================================
LOAD CLASSES
===================================================== */

async function loadClasses(){

const {
data,
error
} =
await db

.from("classes")

.select("*")

.order("id");


if(error){

console.error(error);

return;

}


classes = data || [];


const select =
document.getElementById("classId");


select.innerHTML =
'<option value="">সব Class</option>';


classes.forEach(c=>{

select.innerHTML += `

<option value="${escapeHtml(c.id)}">

${escapeHtml(c.name)}

</option>

`;

});

}



/* =====================================================
LOAD PEOPLE
===================================================== */

async function loadPeople(){

const teacherResult =
await db

.from("teachers")

.select("id,name,phone,designation")

.order("name");


if(teacherResult.error){

console.error(
"Teacher load:",
teacherResult.error
);

}else{

teachers =
teacherResult.data || [];

}


const employeeResult =
await db

.from("employees")

.select("id,employee_id,name,phone,designation")

.order("name");


if(employeeResult.error){

console.error(
"Employee load:",
employeeResult.error
);

}else{

employees =
employeeResult.data || [];

}


const studentResult =
await db

.from("students")

.select(
"id,student_id,name,class_id,classes(name)"
)

.order("name");


if(studentResult.error){

console.error(
"Student load:",
studentResult.error
);

}else{

students =
studentResult.data || [];

}


loadPersonFilter();

}

PERSON FILTER
===================================================== */

document.getElementById("personFilter");

'<option value="">সব Student</option>';

'<option value="">সব Teacher</option>';

/* =====================================================
LOAD REPORT
===================================================== */

async function loadReport(){

const date =
document.getElementById("date").value;


if(!date){

alert("Date নির্বাচন করুন");

return;

}


const personId =
document.getElementById(
"personFilter"
).value;


const classId =
document.getElementById(
"classId"
).value;


const tbody =
document.getElementById(
"reportList"
);


tbody.innerHTML = `

<tr>

<td
colspan="5"
class="loading">

Loading...

</td>

</tr>

`;


let table = "";

let personColumn = "";


if(mode==="student"){

table =
"student_attendance";

personColumn =
"student_id";

}


if(mode==="teacher"){

table =
"teacher_attendance";

personColumn =
"teacher_id";

}


if(mode==="employee"){

table =
"employee_attendance";

personColumn =
"employee_id";

}


let query =
db

.from(table)

.select("*")

.eq(
"attendance_date",
date
);


if(personId){

query =
query.eq(
personColumn,
Number(personId)
);

}


const {
data,
error
} =
await query;


if(error){

tbody.innerHTML = `

<tr>

<td
colspan="5"
class="error">

❌ ${escapeHtml(error.message)}

</td>

</tr>

`;

return;

}


let records =
data || [];


if(mode==="student" && classId){

records =
records.filter(r=>{

const student =
students.find(s=>
String(s.id) ===
String(r.student_id)
);

return String(
student?.class_id
) === String(classId);

});

}


currentReport =
records;


renderReport(records);

}



/* =====================================================
RENDER REPORT
===================================================== */

function renderReport(records){

const tbody =
document.getElementById(
"reportList"
);


let presentCount = 0;
let absentCount = 0;


records.forEach(r=>{

if(r.status==="present"){
presentCount++;
}

if(r.status==="absent"){
absentCount++;
}

});


document.getElementById(
"total"
).textContent =
records.length;


document.getElementById(
"present"
).textContent =
presentCount;


document.getElementById(
"absent"
).textContent =
absentCount;


if(!records.length){

tbody.innerHTML = `

<tr>

<td
colspan="5"
class="empty">

এই তারিখে কোনো Attendance record নেই।

</td>

</tr>

`;

return;

}


tbody.innerHTML =
records.map((r,index)=>{

let name = "Unknown";
let id = "—";
let extra = "—";


if(mode==="student"){

const s =
students.find(x=>
String(x.id) ===
String(r.student_id)
);


name =
s?.name || "Unknown";

id =
s?.student_id || s?.id || "—";

extra =
s?.classes?.name || "—";

}


if(mode==="teacher"){

const t =
teachers.find(x=>
String(x.id) ===
String(r.teacher_id)
);


name =
t?.name || "Unknown";

id =
t?.id || "—";

extra =
t?.designation || "—";

}


if(mode==="employee"){

const e =
employees.find(x=>
String(x.id) ===
String(r.employee_id)
);


name =
e?.name || "Unknown";

id =
e?.employee_id || e?.id || "—";

extra =
e?.designation || "—";

}


const status =
r.status || "absent";


const statusText =
status==="present"
?
"✅ উপস্থিত"
:
"❌ অনুপস্থিত";


return `

<tr>

<td>
${index+1}
</td>

<td>

<strong>
${escapeHtml(name)}
</strong>

</td>

<td>

${escapeHtml(
String(extra)
)}

</td>

<td class="${
status==="present"
?
"present"
:
"absent"
}">

${statusText}

</td>

<td class="action">

<button
class="edit"
onclick="editAttendance('${escapeHtml(r.id)}')">

✏️ Edit

</button>


<button
class="delete"
onclick="deleteAttendance('${escapeHtml(r.id)}')">

🗑️ Delete

</button>

</td>

</tr>

`;

}).join("");

}

LOAD ENTRY LIST

STUDENT ENTRY

async function loadStudentEntry(){

let list =
[...students];


const classId =
document.getElementById(
"classId"
).value;


if(classId){

list =
list.filter(s=>
String(s.class_id) ===

document.getElementById("date").value;

} =

/* =====================================================
SAVE ATTENDANCE
===================================================== */

async function saveAttendance(){

if(!window.entryPeople ||
!window.entryPeople.length){

alert(
"আগে Attendance list Load করুন"
);

return;

}


const date =
document.getElementById("date").value;


if(!date){

alert("Date নির্বাচন করুন");

return;

}


let table = "";
let personColumn = "";


if(mode==="student"){

table =
"student_attendance";

personColumn =
"student_id";

}


if(mode==="teacher"){

table =
"teacher_attendance";

personColumn =
"teacher_id";

}


if(mode==="employee"){

table =
"employee_attendance";

personColumn =
"employee_id";

}


const rows =
window.entryPeople.map((person,i)=>({

[personColumn]:
Number(person.id),

attendance_date:
date,

status:
document.getElementById(
"entry_"+i
).value

}));


const saveBtn =
document.getElementById(
"saveBtn"
);


saveBtn.disabled = true;


showMessage(
"Saving..."
);


const {
error
} =
await db

.from(table)

.upsert(
rows,
{
onConflict:
`${personColumn},attendance_date`
}
);


saveBtn.disabled = false;


if(error){

showMessage(
"❌ "+error.message,
"error"
);

return;

}


showMessage(
"✅ Attendance saved successfully",
"success"
);


await loadReport();

}



/* =====================================================
EDIT ATTENDANCE
===================================================== */

async function editAttendance(id){

if(
id===null ||
id===undefined ||
String(id).trim()==="" ||
String(id)==="null" ||
String(id)==="undefined"
){

alert(
"❌ Invalid attendance ID"
);

return;

}


const numericId =
Number(id);


if(!Number.isInteger(numericId)){

alert(
"❌ Invalid attendance ID: "+
id
);

return;

}


let table = "";


if(mode==="student"){

table =
"student_attendance";

}


if(mode==="teacher"){

table =
"teacher_attendance";

}


if(mode==="employee"){

table =
"employee_attendance";

}


const {
data,
error
} =
await db

.from(table)

.select("*")

.eq("id",numericId)

.maybeSingle();


if(error){

alert(
"❌ "+error.message
);

return;

}


if(!data){

alert(
"❌ Attendance record পাওয়া যায়নি।"
);

return;

}


const newStatus =
data.status === "present"
?
"absent"
:
"present";


const confirmEdit =
confirm(

"বর্তমান Status: "+
(data.status==="present"
?
"উপস্থিত"
:
"অনুপস্থিত"
)+

"\n\nনতুন Status হবে: "+
(newStatus==="present"
?
"উপস্থিত"
:
"অনুপস্থিত"
)+

"\n\nUpdate করতে চান?"

);


if(!confirmEdit){

return;

}


const {
error:updateError
} =
await db

.from(table)

.update({
status:newStatus
})

.eq(
"id",
numericId
);


if(updateError){

alert(
"❌ Update failed:\n"+
updateError.message
);

return;

}


alert(
"✅ Attendance updated successfully"
);


await loadReport();

}



/* =====================================================
DELETE ATTENDANCE
===================================================== */

async function deleteAttendance(id){

if(
id===null ||
id===undefined ||
String(id).trim()==="" ||
String(id)==="null" ||
String(id)==="undefined"
){

alert(
"❌ Invalid attendance ID"
);

return;

}


const numericId =
Number(id);


if(!Number.isInteger(numericId)){

alert(
"❌ Invalid attendance ID: "+
id
);

return;

}


let table = "";


if(mode==="student"){

table =
"student_attendance";

}


if(mode==="teacher"){

table =
"teacher_attendance";

}


if(mode==="employee"){

table =
"employee_attendance";

}


const confirmDelete =
confirm(
"এই Attendance record Delete করতে চান?"
);


if(!confirmDelete){

return;

}


const {
data,
error
} =
await db

.from(table)

.delete()

.eq(
"id",
numericId
)

.select("id");


if(error){

console.error(
"DELETE ERROR:",
error
);

alert(
"❌ Delete failed:\n"+
error.message
);

return;

}


if(!data || data.length===0){

alert(
"❌ Record পাওয়া যায়নি অথবা Delete করার permission নেই।"
);

return;

}


alert(
"✅ Attendance deleted successfully"
);


await loadReport();

}

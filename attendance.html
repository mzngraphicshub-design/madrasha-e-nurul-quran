<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPQ";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



/* =====================================================
VARIABLES
===================================================== */

let mode = "student";

let students = [];
let teachers = [];
let employees = [];
let classes = [];

let entryPeople = [];



/* =====================================================
TODAY
===================================================== */

function today(){

return new Date()
.toISOString()
.split("T")[0];

}



/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}



/* =====================================================
MESSAGE
===================================================== */

function showMessage(text,type=""){

const msg =
document.getElementById("msg");

msg.textContent = text;

msg.className = type;

}



/* =====================================================
START
===================================================== */

async function start(){

const {
data:{session},
error
} =
await db.auth.getSession();


if(error){

alert(
"Session error: "+
error.message
);

return;

}


if(!session){

location.href="admin.html";

return;

}


document.getElementById("date").value =
today();

document.getElementById("entryDate").value =
today();


await loadClasses();

await loadPeople();

setModeUI();

await loadReport();

}



/* =====================================================
LOAD CLASSES
===================================================== */

async function loadClasses(){

const {
data,
error
} =
await db

.from("classes")

.select("*")

.order("id");


if(error){

console.error(
"Class load error:",
error
);

return;

}


classes = data || [];


const classSelect =
document.getElementById("classId");

const entryClassSelect =
document.getElementById("entryClassId");


classSelect.innerHTML =
'<option value="">সব Class</option>';

entryClassSelect.innerHTML =
'<option value="">সব Class</option>';


classes.forEach(c=>{

classSelect.innerHTML += `

<option value="${escapeHtml(c.id)}">

${escapeHtml(c.name)}

</option>

`;


entryClassSelect.innerHTML += `

<option value="${escapeHtml(c.id)}">

${escapeHtml(c.name)}

</option>

`;

});

}



/* =====================================================
LOAD PEOPLE
===================================================== */

async function loadPeople(){

const teacherResult =
await db

.from("teachers")

.select("id,name,phone,designation")

.order("name");


if(teacherResult.error){

console.error(
"Teacher load:",
teacherResult.error
);

}else{

teachers =
teacherResult.data || [];

}


const employeeResult =
await db

.from("employees")

.select(
"id,employee_id,name,phone,designation"
)

.order("name");


if(employeeResult.error){

console.error(
"Employee load:",
employeeResult.error
);

}else{

employees =
employeeResult.data || [];

}


const studentResult =
await db

.from("students")

.select(
"id,student_id,name,class_id,classes(name)"
)

.order("name");


if(studentResult.error){

console.error(
"Student load:",
studentResult.error
);

}else{

students =
studentResult.data || [];

}

}



/* =====================================================
SET MODE UI
===================================================== */

function setModeUI(){

const classBox =
document.getElementById("classBox");

const entryClassBox =
document.getElementById("entryClassBox");

const reportTitle =
document.getElementById("reportTitle");

const entryTitle =
document.getElementById("entryTitle");

const personLabel =
document.getElementById("personFilterLabel");


if(mode==="student"){

classBox.style.display =
"block";

entryClassBox.style.display =
"block";

reportTitle.textContent =
"👨‍🎓 Student Attendance Report";

entryTitle.textContent =
"📋 Student Attendance নেওয়া";

personLabel.textContent =
"Student";

}


if(mode==="teacher"){

classBox.style.display =
"none";

entryClassBox.style.display =
"none";

reportTitle.textContent =
"👨‍🏫 Teacher Attendance Report";

entryTitle.textContent =
"📋 Teacher Attendance নেওয়া";

personLabel.textContent =
"Teacher";

}


if(mode==="employee"){

classBox.style.display =
"none";

entryClassBox.style.display =
"none";

reportTitle.textContent =
"👨‍💼 Employee Attendance Report";

entryTitle.textContent =
"📋 Employee Attendance নেওয়া";

personLabel.textContent =
"Employee";

}


loadPersonFilter();

}



/* =====================================================
PERSON FILTER
===================================================== */

function loadPersonFilter(){

const select =
document.getElementById("personFilter");

select.innerHTML = "";


if(mode==="student"){

select.innerHTML =
'<option value="">সব Student</option>';

students.forEach(s=>{

select.innerHTML += `

<option value="${escapeHtml(s.id)}">

${escapeHtml(
s.student_id || s.id
)}
-
${escapeHtml(s.name)}

</option>

`;

});

}


if(mode==="teacher"){

select.innerHTML =
'<option value="">সব Teacher</option>';

teachers.forEach(t=>{

select.innerHTML += `

<option value="${escapeHtml(t.id)}">

${escapeHtml(t.name)}

</option>

`;

});

}


if(mode==="employee"){

select.innerHTML =
'<option value="">সব Employee</option>';

employees.forEach(e=>{

select.innerHTML += `

<option value="${escapeHtml(e.id)}">

${escapeHtml(
e.employee_id || e.id
)}
-
${escapeHtml(e.name)}

</option>

`;

});

}

}



/* =====================================================
GET TABLE INFO
===================================================== */

function getAttendanceInfo(){

if(mode==="student"){

return {
table:"student_attendance",
personColumn:"student_id"
};

}


if(mode==="teacher"){

return {
table:"teacher_attendance",
personColumn:"teacher_id"
};

}


return {
table:"employee_attendance",
personColumn:"employee_id"
};

}



/* =====================================================
LOAD REPORT
===================================================== */

async function loadReport(){

const date =
document.getElementById("date").value;


if(!date){

return;

}


const classId =
document.getElementById("classId").value;


const personId =
document.getElementById("personFilter").value;


const tbody =
document.getElementById("reportList");


tbody.innerHTML = `

<tr>

<td colspan="7" class="loading">

Loading...

</td>

</tr>

`;


const info =
getAttendanceInfo();


let query =
db

.from(info.table)

.select("*")

.eq(
"attendance_date",
date
);


if(personId){

query =
query.eq(
info.personColumn,
Number(personId)
);

}


const {
data,
error
} =
await query;


if(error){

console.error(
"Report error:",
error
);


tbody.innerHTML = `

<tr>

<td colspan="7" class="error">

❌ ${escapeHtml(error.message)}

</td>

</tr>

`;

return;

}


let records =
data || [];


/* Student class filter */

if(
mode==="student" &&
classId
){

records =
records.filter(r=>{

const student =
students.find(s=>
String(s.id) ===
String(r.student_id)
);

return String(
student?.class_id
) ===
String(classId);

});

}


renderReport(records);

}



/* =====================================================
RENDER REPORT
===================================================== */

function renderReport(records){

const tbody =
document.getElementById("reportList");


let presentCount = 0;
let absentCount = 0;


records.forEach(r=>{

if(r.status==="present"){

presentCount++;

}else{

absentCount++;

}

});


document.getElementById("total")
.textContent =
records.length;


document.getElementById("present")
.textContent =
presentCount;


document.getElementById("absent")
.textContent =
absentCount;


if(!records.length){

tbody.innerHTML = `

<tr>

<td colspan="7" class="empty">

এই তারিখে কোনো Attendance record নেই।

</td>

</tr>

`;

return;

}


tbody.innerHTML =
records.map((r,index)=>{

let person = null;

let personId = "—";

let name = "Unknown";

let extra = "—";


if(mode==="student"){

person =
students.find(s=>
String(s.id) ===
String(r.student_id)
);

personId =
person?.student_id ||
person?.id ||
"—";

name =
person?.name ||
"Unknown";

extra =
person?.classes?.name ||
"—";

}


if(mode==="teacher"){

person =
teachers.find(t=>
String(t.id) ===
String(r.teacher_id)
);

personId =
person?.id ||
"—";

name =
person?.name ||
"Unknown";

extra =
person?.designation ||
"—";

}


if(mode==="employee"){

person =
employees.find(e=>
String(e.id) ===
String(r.employee_id)
);

personId =
person?.employee_id ||
person?.id ||
"—";

name =
person?.name ||
"Unknown";

extra =
person?.designation ||
"—";

}


const isPresent =
r.status === "present";


return `

<tr>

<td>
${index+1}
</td>

<td>
${escapeHtml(personId)}
</td>

<td>

<strong>
${escapeHtml(name)}
</strong>

</td>

<td>
${escapeHtml(extra)}
</td>

<td>
${escapeHtml(r.attendance_date || "")}
</td>

<td class="${
isPresent
?
"present"
:
"absent"
}">

${
isPresent
?
"✅ উপস্থিত"
:
"❌ অনুপস্থিত"
}

</td>

<td class="action">

<button
class="edit"
onclick="editAttendance('${escapeHtml(r.id)}')">

✏️ Edit

</button>


<button
class="delete"
onclick="deleteAttendance('${escapeHtml(r.id)}')">

🗑️ Delete

</button>

</td>

</tr>

`;

}).join("");

}



/* =====================================================
LOAD ENTRY LIST
===================================================== */

async function loadEntryList(){

const date =
document.getElementById("entryDate").value;


if(!date){

alert(
"Attendance Date নির্বাচন করুন"
);

return;

}


if(mode==="student"){

await loadStudentEntry(date);

}


if(mode==="teacher"){

await loadTeacherEntry(date);

}


if(mode==="employee"){

await loadEmployeeEntry(date);

}

}



/* =====================================================
STUDENT ENTRY
===================================================== */

async function loadStudentEntry(date){

let list =
[...students];


const classId =
document.getElementById(
"entryClassId"
).value;


if(classId){

list =
list.filter(s=>
String(s.class_id) ===
String(classId)
);

}


if(!list.length){

document.getElementById(
"entryList"
).innerHTML = `

<tr>

<td colspan="4" class="empty">

কোনো Student পাওয়া যায়নি।

</td>

</tr>

`;

entryPeople = [];

return;

}


const {
data,
error
} =
await db

.from("student_attendance")

.select("*")

.eq(
"attendance_date",
date
);


if(error){

alert(error.message);

return;

}


const existing =
data || [];


document.getElementById(
"entryList"
).innerHTML =

list.map((s,i)=>{

const record =
existing.find(r=>
String(r.student_id) ===
String(s.id)
);


const status =
record?.status ||
"present";


return `

<tr>

<td>

${escapeHtml(
s.student_id || s.id
)}

</td>

<td>

${escapeHtml(s.name)}

</td>

<td>

${escapeHtml(
s.classes?.name || "-"
)}

</td>

<td>

<select
class="status-select"
id="entry_${i}">

<option
value="present"
${status==="present"?"selected":""}>

উপস্থিত

</option>

<option
value="absent"
${status==="absent"?"selected":""}>

অনুপস্থিত

</option>

</select>

</td>

</tr>

`;

}).join("");


entryPeople = list;

}

/* =====================================================
SAVE ATTENDANCE
===================================================== */

async function saveAttendance(){

if(!entryPeople.length){

alert(
"আগে Attendance list Load করুন"
);

return;

}


const date =
document.getElementById(
"entryDate"
).value;


if(!date){

alert(
"Attendance Date নির্বাচন করুন"
);

return;

}


const info =
getAttendanceInfo();


const rows =
entryPeople.map((person,i)=>{

const row = {

attendance_date:
date,

status:
document.getElementById(
"entry_"+i
).value

};


row[info.personColumn] =
Number(person.id);


return row;

});


const saveBtn =
document.getElementById(
"saveBtn"
);


saveBtn.disabled = true;


showMessage(
"Saving..."
);


const {
error
} =
await db

.from(info.table)

.upsert(
rows,
{
onConflict:
`${info.personColumn},attendance_date`
}
);


saveBtn.disabled = false;


if(error){

console.error(
"Save attendance error:",
error
);

showMessage(
"❌ "+error.message,
"error"
);

return;

}


showMessage(
"✅ Attendance saved successfully",
"success"
);


/* Report date automatically same as entry date */

document.getElementById("date").value =
date;


/* Reload report */

await loadReport();

}



/* =====================================================
EDIT ATTENDANCE
===================================================== */

async function editAttendance(id){

if(
id === null ||
id === undefined ||
String(id).trim()==="" ||
String(id)==="null" ||
String(id)==="undefined"
){

alert(
"❌ Invalid attendance ID"
);

return;

}


const numericId =
Number(id);


if(!Number.isInteger(numericId)){

alert(
"❌ Invalid attendance ID: "+
id
);

return;

}


const info =
getAttendanceInfo();


/* Get record */

const {
data,
error
} =
await db

.from(info.table)

.select("*")

.eq(
"id",
numericId
)

.maybeSingle();


if(error){

console.error(
"Edit load error:",
error
);

alert(
"❌ "+error.message
);

return;

}


if(!data){

alert(
"❌ Attendance record পাওয়া যায়নি।"
);

return;

}


const current =
data.status === "present"
?
"উপস্থিত"
:
"অনুপস্থিত";


const newStatus =
data.status === "present"
?
"absent"
:
"present";


const newText =
newStatus === "present"
?
"উপস্থিত"
:
"অনুপস্থিত";


const ok =
confirm(

"বর্তমান Status: "+
current+

"\n\nনতুন Status: "+
newText+

"\n\nStatus পরিবর্তন করতে চান?"

);


if(!ok){

return;

}


const {
error:updateError
} =
await db

.from(info.table)

.update({
status:newStatus
})

.eq(
"id",
numericId
);


if(updateError){

console.error(
"Update error:",
updateError
);

alert(
"❌ Update failed:\n"+
updateError.message
);

return;

}


alert(
"✅ Attendance updated successfully"
);


await loadReport();

}

){

);

} =

<!-- PART 1 -->

<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Notice Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7f6;
}

header{
background:#075c43;
color:#fff;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
color:#fff;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.full{
grid-column:1/-1;
}

label{
font-weight:bold;
font-size:14px;
display:block;
margin-bottom:5px;
}

input,
textarea,
select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
}

textarea{
height:150px;
resize:none;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
color:#fff;
font-weight:bold;
}

.save{
background:#087f5b;
}

.cancel{
background:#666;
}

.edit{
background:#1565c0;
}

.delete{
background:#d32f2f;
}

.view{
background:#00897b;
}

.download{
background:#6a1b9a;
}

.print{
background:#424242;
}

.search{
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#075c43;
color:#fff;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

.upload{
border:2px dashed #0b8b63;
padding:20px;
text-align:center;
border-radius:10px;
}

@media(max-width:768px){

.grid{
grid-template-columns:1fr;
}

table{
min-width:1100px;
}

}

</style>

</head>

<body>

<header>

<h2>

📢 Notice Management

</h2>

<a href="dashboard.html">

← Dashboard

</a>

</header>

<div class="container">

<div class="card">

<h3 id="formTitle">

➕ Add Notice

</h3>

<form id="noticeForm">

<input
type="hidden"
id="editId">

<div class="grid">

<div>

<label>

Title

</label>

<input
id="title"
required>

</div>

<div>

<label>

Publish Date

</label>

<input
type="date"
id="publish_date">

</div>

<div class="full">

<label>

Notice

</label>

<textarea
id="notice"
required></textarea>

</div>

<div>

<label>

Status

</label>

<select id="status">

<option value="Active">

Active

</option>

<option value="Inactive">

Inactive

</option>

</select>

</div>

<div>

<label>

PDF

</label>

<div class="upload">

<input
type="file"
id="pdfFile"
accept=".pdf">

<p id="fileName">

No PDF

</p>

</div>

</div>

<div class="full">

<button
class="save"
type="submit">

Save Notice

</button>

<button
type="button"
id="cancelBtn"
class="cancel"
style="display:none">

Cancel

</button>

</div>

</div>

</form>

</div>

<div class="card">

<h3>

Notice List

</h3>

<input
class="search"
id="search"
placeholder="Search Notice">

<table>

<thead>

<tr>

<th>Title</th>

<th>Date</th>

<th>Status</th>

<th>PDF</th>

<th>Action</th>

</tr>

</thead>

<tbody id="noticeList">

<tr>

<td colspan="5">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

<script>

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let notices = [];
let editId = null;
let uploadedPdf = "";

// PART 2

async function start(){

const {data:{session}}=
await db.auth.getSession();

if(!session){

location.href="admin.html";
return;

}

document.getElementById("publish_date").value=
new Date().toISOString().split("T")[0];

loadNotices();

}

document.getElementById("pdfFile").addEventListener("change",function(){

if(this.files.length){

document.getElementById("fileName").innerHTML=this.files[0].name;

}

});

async function uploadPDF(){

const file=document.getElementById("pdfFile").files[0];

if(!file){

return uploadedPdf;

}

const fileName=Date.now()+"_"+file.name;

const {error}=await db.storage
.from("notice-pdf")
.upload(fileName,file);

if(error){

alert(error.message);

return "";

}

const {data}=db.storage
.from("notice-pdf")
.getPublicUrl(fileName);

uploadedPdf=data.publicUrl;

return uploadedPdf;

}

async function loadNotices(){

const {data,error}=await db
.from("notices")
.select("*")
.order("id",{ascending:false});

if(error){

alert(error.message);
return;

}

notices=data||[];

renderTable();

}

function renderTable(list=notices){

const tbody=document.getElementById("noticeList");

if(!list.length){

tbody.innerHTML="<tr><td colspan='5'>No Notice Found</td></tr>";

return;

}

tbody.innerHTML=list.map(n=>`

<tr>

<td>${n.title}</td>

<td>${n.publish_date||""}</td>

<td>${n.status}</td>

<td>

${n.pdf_url?

`<button class="view" onclick="window.open('${n.pdf_url}','_blank')">View</button>

<button class="download" onclick="window.open('${n.pdf_url}','_blank')">Download</button>`

:"No PDF"}

</td>

<td>

<button class="edit" onclick="editNotice(${n.id})">Edit</button>

<button class="delete" onclick="deleteNotice(${n.id})">Delete</button>

<button class="print" onclick="printNotice(${n.id})">Print</button>

</td>

</tr>

`).join("");

} 
// PART 3

document.getElementById("noticeForm").addEventListener("submit",async function(e){

e.preventDefault();

const pdf=await uploadPDF();

const notice={

title:document.getElementById("title").value,

notice:document.getElementById("notice").value,

publish_date:document.getElementById("publish_date").value,

status:document.getElementById("status").value,

pdf_url:pdf||uploadedPdf||""

};

let result;

if(editId){

result=await db
.from("notices")
.update(notice)
.eq("id",editId);

}else{

result=await db
.from("notices")
.insert([notice]);

}

if(result.error){

alert(result.error.message);

return;

}

alert("Notice Saved Successfully");

resetForm();

loadNotices();

});

function editNotice(id){

const n=notices.find(x=>x.id==id);

if(!n)return;

editId=id;

uploadedPdf=n.pdf_url||"";

document.getElementById("title").value=n.title;

document.getElementById("notice").value=n.notice;

document.getElementById("publish_date").value=n.publish_date||"";

document.getElementById("status").value=n.status;

document.getElementById("formTitle").innerHTML="✏️ Edit Notice";

document.getElementById("cancelBtn").style.display="inline-block";

window.scrollTo({

top:0,

behavior:"smooth"

});

}

async function deleteNotice(id){

if(!confirm("Delete this notice?"))return;

const {error}=await db
.from("notices")
.delete()
.eq("id",id);

if(error){

alert(error.message);

return;

}

loadNotices();

}
// PART 4

function printNotice(id){

const n=notices.find(x=>x.id==id);

if(!n)return;

const w=window.open("","_blank");

w.document.write(`

<html>

<head>

<title>${n.title}</title>

<style>

body{

font-family:Arial;

padding:40px;

line-height:1.8;

}

h2{

text-align:center;

color:#075c43;

}

hr{

margin:15px 0;

}

</style>

</head>

<body>

<h2>

মাদরাসায়ে নূরুল কুরআন

</h2>

<hr>

<h3>${n.title}</h3>

<p>

<b>Publish Date:</b>

${n.publish_date||""}

</p>

<p>

<b>Status:</b>

${n.status}

</p>

<hr>

<div>

${String(n.notice).replace(/\n/g,"<br>")}

</div>

</body>

</html>

`);

w.document.close();

w.print();

}

function resetForm(){

editId=null;

uploadedPdf="";

document.getElementById("noticeForm").reset();

document.getElementById("fileName").innerHTML="No PDF";

document.getElementById("cancelBtn").style.display="none";

document.getElementById("formTitle").innerHTML="➕ Add Notice";

document.getElementById("publish_date").value=

new Date().toISOString().split("T")[0];

}

document.getElementById("cancelBtn").onclick=function(){

resetForm();

};

document.getElementById("search").addEventListener("input",function(){

const q=this.value.toLowerCase();

const list=notices.filter(n=>

(n.title||"").toLowerCase().includes(q)||

(n.notice||"").toLowerCase().includes(q)||

(n.status||"").toLowerCase().includes(q)

);

renderTable(list);

});

start();

</script>

</body>

</html>

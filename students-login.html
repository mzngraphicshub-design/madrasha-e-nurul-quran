<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Student Portal | মাদরাসায়ে নূরুল কুরআন</title>

<link
href="https://banglawebfonts.pages.dev/css/bornomala.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --primary:#0d47a1;
    --primary2:#1976d2;
    --dark:#06264d;
    --dark2:#031a36;

    --gold:#ffd54f;

    --white:#ffffff;

    --text:#172033;
    --muted:#718096;

    --danger:#d93636;
    --success:#16834b;

}

body{

    min-height:100vh;

    font-family:"Bornomala",sans-serif;

    background:

    radial-gradient(
        circle at 15% 15%,
        rgba(25,118,210,.16),
        transparent 28%
    ),

    radial-gradient(
        circle at 85% 85%,
        rgba(13,71,161,.16),
        transparent 30%
    ),

    linear-gradient(
        135deg,
        #eef6ff,
        #f8fbff
    );

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

    color:var(--text);

}

.loading-box{

    width:100%;

    max-width:430px;

    background:#fff;

    border-radius:25px;

    padding:45px 30px;

    text-align:center;

    box-shadow:
    0 25px 70px rgba(6,38,77,.15);

}

.loading-icon{

    width:75px;

    height:75px;

    border-radius:22px;

    margin:0 auto 20px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#eaf3ff;

    color:var(--primary);

    font-size:30px;

}

.loading-box h1{

    color:#0a2545;

    font-size:27px;

    margin-bottom:8px;

}

.loading-box p{

    color:#718096;

    font-size:14px;

    line-height:1.7;

}

.spinner{

    margin:25px auto 0;

    width:35px;

    height:35px;

    border:4px solid #dcecff;

    border-top-color:#1976d2;

    border-radius:50%;

    animation:
    spin .8s linear infinite;

}

.error-box{

    display:none;

}

.error-box h2{

    color:#d93636;

    font-size:23px;

    margin-bottom:10px;

}

.error-box p{

    color:#718096;

    font-size:14px;

    line-height:1.7;

}

.login-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin-top:22px;

    padding:13px 25px;

    border-radius:12px;

    background:
    linear-gradient(
        135deg,
        #0d47a1,
        #1976d2
    );

    color:#fff;

    text-decoration:none;

    font-size:15px;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

</style>

</head>

<body>

<div class="loading-box"
     id="loadingBox">

    <div class="loading-icon">

        <i class="fa-solid fa-user-graduate"></i>

    </div>

    <h1>
        Student Portal
    </h1>

    <p id="loadingText">

        আপনার Student Dashboard প্রস্তুত করা হচ্ছে...

    </p>

    <div class="spinner"></div>

</div>


<div class="loading-box error-box"
     id="errorBox">

    <div class="loading-icon">

        <i class="fa-solid fa-lock"></i>

    </div>

    <h2>
        Login প্রয়োজন
    </h2>

    <p id="errorText">

        Student Dashboard দেখতে আগে Login করুন।

    </p>

    <a
        href="login.html"
        class="login-btn">

        <i class="fa-solid fa-right-to-bracket"></i>

        Login করুন

    </a>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://qavublwhqiqsgpcmfyft.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AKYAjFdlgz7r2IyjKk9GWA_-QDuDPKQ";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const loadingBox =
document.getElementById(
    "loadingBox"
);

const errorBox =
document.getElementById(
    "errorBox"
);

const loadingText =
document.getElementById(
    "loadingText"
);

const errorText =
document.getElementById(
    "errorText"
);


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(text){

    loadingBox.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorText.textContent =
        text;

}


/* =====================================================
   GET SAVED STUDENT LOGIN
===================================================== */

function getStudentLogin(){

    /*
      প্রথমে sessionStorage
    */

    let saved =
        sessionStorage.getItem(
            "madrasa_student_login"
        );

    /*
      sessionStorage না থাকলে
      localStorage থেকে নেওয়া হবে।
    */

    if(!saved){

        saved =
            localStorage.getItem(
                "madrasa_student_login"
            );

    }

    if(!saved){

        return null;

    }

    try{

        return JSON.parse(saved);

    }catch(error){

        console.error(
            "Student session parse error:",
            error
        );

        return null;

    }

}


/* =====================================================
   MAIN
===================================================== */

async function openStudentDashboard(){

    try{

        const loginData =
            getStudentLogin();

        /*
          Login data না থাকলে
          Login page-এ পাঠানো হবে।
        */

        if(
            !loginData ||
            !loginData.student_id
        ){

            showError(
                "Student Dashboard দেখতে আগে Student ID ও Mobile Number দিয়ে Login করুন।"
            );

            return;

        }


        loadingText.textContent =
            "Student তথ্য যাচাই করা হচ্ছে...";


        /*
          Database থেকে Student record
          আবার verify করা হচ্ছে।

          Mobile column আগে check হবে।
        */

        let student = null;

        let error = null;


        const result =
            await db
              .from("students")
              .select("*")
              .eq(
                  "student_id",
                  loginData.student_id
              )
              .maybeSingle();


        student =
            result.data;

        error =
            result.error;


        /*
          Student পাওয়া না গেলে error.
        */

        if(error){

            console.error(
                "Student verification error:",
                error
            );

            /*
              RLS / network issue হলে
              saved login থাকলে dashboard
              block না করে dashboard-এ পাঠানো হবে।
            */

            if(loginData.student_id){

                loadingText.textContent =
                    "Dashboard খোলা হচ্ছে...";

                setTimeout(()=>{

                    window.location.href =
                        "student-dashboard.html";

                },300);

                return;

            }

            throw error;

        }


        if(!student){

            /*
              Student record deleted / ID ভুল হলে
              session clear করা হবে।
            */

            sessionStorage.removeItem(
                "madrasa_student_login"
            );

            localStorage.removeItem(
                "madrasa_student_login"
            );

            showError(
                "এই Student ID-এর কোনো তথ্য পাওয়া যায়নি। আবার Login করুন।"
            );

            return;

        }


        /*
          Mobile verification.

          loginData.mobile যদি থাকে,
          database-এর mobile/phone/
          guardian_mobile-এর সঙ্গে মিলানো হবে।
        */

        const savedMobile =
            String(
                loginData.mobile || ""
            ).trim();


        if(savedMobile){

            const dbMobile =
                String(
                    student.mobile ||
                    student.phone ||
                    student.guardian_mobile ||
                    ""
                ).trim();


            /*
              যদি database-এ mobile value পাওয়া যায়
              এবং saved mobile-এর সঙ্গে না মিলে,
              তাহলে login invalid।
            */

            if(
                dbMobile &&
                dbMobile !== savedMobile
            ){

                sessionStorage.removeItem(
                    "madrasa_student_login"
                );

                localStorage.removeItem(
                    "madrasa_student_login"
                );

                showError(
                    "Student Mobile Number পরিবর্তন হয়েছে। আবার Login করুন।"
                );

                return;

            }

        }


        /*
          সর্বশেষ Student information
          session-এ update করা হচ্ছে।
        */

        const updatedLogin = {

            id:
                student.id ||
                loginData.id ||
                "",

            student_id:
                student.student_id ||
                loginData.student_id,

            mobile:
                student.mobile ||
                student.phone ||
                student.guardian_mobile ||
                loginData.mobile ||
                "",

            name:
                student.name ||
                loginData.name ||
                "",

            class_id:
                student.class_id ||
                loginData.class_id ||
                "",

            session:
                student.session ||
                loginData.session ||
                "",

            login_time:
                loginData.login_time ||
                Date.now()

        };


        sessionStorage.setItem(
            "madrasa_student_login",
            JSON.stringify(updatedLogin)
        );


        localStorage.setItem(
            "madrasa_student_login",
            JSON.stringify(updatedLogin)
        );


        /*
          Dashboard redirect
        */

        loadingText.textContent =
            "Login সফল হয়েছে। Dashboard খোলা হচ্ছে...";


        setTimeout(()=>{

            window.location.href =
                "student-dashboard.html";

        },300);


    }catch(error){

        console.error(
            "Student Portal Error:",
            error
        );

        showError(
            "Student Dashboard খুলতে সমস্যা হয়েছে। আবার Login করুন।"
        );

    }

}


/* =====================================================
   START
===================================================== */

openStudentDashboard();

</script>

</body>
</html>
